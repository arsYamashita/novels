t": "p", "v": "「……私も行きます」"}, {"t": "p", "v": "　直人は顔を上げた。"}, {"t": "p", "v": "「書陵部の学芸員として、ではありません。個人として。休暇を取ります。巻物の断片も、現地で読むのでしょう。崩し字の読解で、お役に立てます」"}, {"t": "p", "v": "「宮内庁に報告が上がるようなことは」"}, {"t": "p", "v": "「しません。これは、私の好奇心です」"}, {"t": "p", "v": "　好奇心。その一語に祖父が重なって、直人は頷いてしまった。"}, {"t": "p", "v": "「ではその前に、断片の鑑定を」真琴は白手袋のまま手を出した。「紙質と墨の年代を見ます」"}, {"t": "p", "v": "　断片を光に透かした真琴が、ふと、目を細めた。"}, {"t": "p", "v": "「……裏に、もう一層あります。透かしてやっと見える薄墨。文字というより、符牒。<strong>星の形に、七つの点</strong>」"}, {"t": "p", "v": "「星霜組の、判子のようなものか」"}, {"t": "p", "v": "「でしょうね。それと――鷺宮さん」"}, {"t": "p", "v": "　真琴は断片を返しながら、こともなげに聞いた。"}, {"t": "p", "v": "「御料車の引き出しには、この断片の他に、何が？　<strong>金属の遺物などは、ありましたか</strong>」"}, {"t": "p", "v": "「……レンズが一つ。真鍮の」"}, {"t": "p", "v": "「なるほど。承知しました」"}, {"t": "p", "v": "　真琴は手帳に短く書き付けた。<br>　直人が違和感に気づいたのは、書陵部を出て、堀端を半分歩いた頃だった。"}, {"t": "p", "v": "　――俺は、御料車の「引き出し」の話を、彼女にしたか？"}, {"t": "p", "v": "　閲覧申請の書類にも、今日の会話にも、御料車の名は出していない。出したのは「巻物の断片」だけだ。<br>　なのに彼女は、引き出し、と言った。金属の遺物、と聞いた。"}, {"t": "p", "v": "　考えられる筋は二つ。彼女が独自に調べているか。……誰かから、聞いているか。"}, {"t": "br"}, {"t": "p", "v": "　出発の前夜、シェアオフィスに戻ると、空気が違った。"}, {"t": "p", "v": "　物は、ほとんど動いていない。だが直人の修復台の道具の並びが、ミリ単位で崩れていた。ヘラの向き。糊刷毛の重ね。毎日同じ手順で置く者にしか分からない、ミリの乱れ。"}, {"t": "p", "v": "「早川。入られてる」"}, {"t": "p", "v": "「え！？　――あ、でも、データは無事っす。HDDもノートも全部持ち歩いてるんで。ここには何も」"}, {"t": "p", "v": "「向こうもそれを確認しに来たんだ。……紙も、無事だ。拓本は俺の懐にある」"}, {"t": "p", "v": "　荒らされた形跡を残さない、丁寧な家探し。氷室の仕事だろう。<br>　つまり向こうは、筒の「外側」の情報がこちらにあると、正しく見抜いている。中身の紙だけでは、読む日時が分からないのだ。"}, {"t": "p", "v": "「……鷺宮さん。これ、二十二日の厳島、確実に鉢合わせっすよね」"}, {"t": "p", "v": "「あぁ。向こうは場所を持ってて、日時が要る。こっちは日時を持ってて、場所の詳細が要る。<strong>同じ潮を、両方が待ってる</strong>」"}, {"t": "p", "v": "　直人は、修復台の道具を、いつもの並びに直した。<br>　一本ずつ、指の記憶の通りに。乱された分だけ、静かに、腹の底が固くなった。"}, {"t": "p", "v": "　二十二日。十七時。潮位百五以下。<br>　水鏡の上で、全部の持ち札が開く。"}], "chars": 2619}, {"title": "第九話　水鏡", "paras": [{"t": "p", "v": "二十二日。宮島口からのフェリーの甲板で、三人は大鳥居を見ていた。"}, {"t": "p", "v": "　海の上の朱。高さ十六メートル。六本の柱は海底に杭を打たず、屋根に積んだ石の重みと自重だけで立っている。"}, {"t": "p", "v": "「今のあの鳥居はね、明治八年の再建です。八代目」真琴が言った。スーツではなく紺のカーディガンにスニーカー。格好は別人だが、背筋と声は書陵部のままだ。「初代は平安まで遡りますが、代替わりのたびに、建て直されてきました」"}, {"t": "p", "v": "「明治八年」直人は繰り返した。「……星霜組が、動いていた時代だ」"}, {"t": "p", "v": "「ええ。<strong>建て直しほど、仕込みに向いた工事はありません</strong>」"}, {"t": "p", "v": "　直人の手にあるのは、刻限と高さだけだった。拓本の目盛りが告げた数字――潮位百五。常の満潮線から三尺下、その高さに紋がある。だが、六本のうちどの柱か、までは書かれていない。柱を名指す手がかりは、氷室に奪われた筒の中身の側にあったからだ。<br>　満潮線の三尺下は、ふだんは海の中だ。露出するのは、大潮の干潮の前後、二時間足らず。あの線を水が切るあいだだけ、紋は空気に触れる。"}, {"t": "p", "v": "　今日の干潮は十七時六分、潮位三十八。<br>　条件の窓は、夕方に開く。"}, {"t": "br"}, {"t": "p", "v": "　十六時半、砂浜が現れ始めた。"}, {"t": "p", "v": "　観光客が引き潮を追って鳥居へ歩いていく。三人はその流れに紛れ――そして、直人の足が止まった。"}, {"t": "p", "v": "　西の柱の根元に、先客がいた。"}, {"t": "p", "v": "　グレーのジャケットは着ていない。作業員の合羽に、道具袋。だが立ち方で分かった。氷室だ。傍らにもう一人、若い男が金属のヘラで柱の根元の貝殻を――<strong>手当たり次第に、剥がしていた</strong>。"}, {"t": "p", "v": "「……っ、やめさせろ」"}, {"t": "p", "v": "　直人は駆け出していた。早川の制止より速く。"}, {"t": "p", "v": "「やめろ！　削るな！」"}, {"t": "p", "v": "　若い男が振り返り、氷室が半歩、間に入る。直人は構わず、氷室の目だけを見て言った。"}, {"t": "p", "v": "「そこの貝の下に、彫りがある。浅い彫りだ。ヘラで雑に剥がせば、彫りごと持っていかれる。<strong>壊したら終わりだぞ。あんたの依頼品も、俺の探し物も、全部だ</strong>」"}, {"t": "p", "v": "　氷室は三秒、直人を見た。<br>　それから若い男に、顎で「離れろ」と指示した。"}, {"t": "p", "v": "「……ご忠告、痛み入ります。実のところ、困っていました。<strong>場所は分かっているのに、高さが分からない</strong>」"}, {"t": "p", "v": "「だろうな。高さは、筒の外側に書いてあった」"}, {"t": "p", "v": "「なるほど。あの唐草ですか」氷室は本気で感心した顔をした。「中身だけ頂いたのは、手落ちでしたね」"}, {"t": "p", "v": "「取引だ」直人は言った。「俺が紋を出す。読むのも俺だ。あんたは触るな。写真は好きに撮れ。……それが、<strong>壊さずに済む唯一の段取りだ</strong>」"}, {"t": "p", "v": "「乱暴は好みません、と申し上げたはずです」氷室は一歩引いた。「どうぞ、先生」"}, {"t": "p", "v": "　先生、と来たか。<br>　直人は舌打ちを飲み込んで、しゃがんだ。"}, {"t": "br"}, {"t": "p", "v": "　潮位百五の線は、貝と海藻の帯の中にあった。"}, {"t": "p", "v": "　直人はヘラを使わなかった。指の腹と、竹の篦と、水。貝を一枚ずつ、殻の合わせ目から浮かせて外す。修復の手順だ。時間はかかるが、下の木肌は無傷で残る。"}, {"t": "p", "v": "　黒ずんだ檜の肌に、それは現れた。"}, {"t": "p", "v": "　円。直径十センチ。円の中に、菊。"}, {"t": "p", "v": "「花弁は――十六」隣にしゃがんだ真琴が数えた。「正式な御紋です。鎌倉は十四だったのに」"}, {"t": "p", "v": "「あぁ。……だが」"}, {"t": "p", "v": "　直人の指は、もう気づいていた。<br>　十六枚のうち、二枚だけ、彫りが深い。倍近く深い。位置は――二時と、八時。"}, {"t": "p", "v": "　鎌倉で「欠けていた」二枚と、同じ位置だ。欠けと、深さ。組の文法で、同じ意味を二度、違う書き方で書いてある。"}, {"t": "p", "v": "　直人は口には出さなかった。指の中だけに、留めた。"}, {"t": "p", "v": "「巻物を」"}, {"t": "p", "v": "　真琴が油紙から断片を出す。夕方の凪で、石灯籠の陰の潮だまりは、鏡のように平らだった。<br>　文字の面を伏せて、水面にかざす。揺れる反射に、真鍮のレンズを当てる。"}, {"t": "p", "v": "　揺れが、止まった。"}, {"t": "p", "v": "　透かし見の玉。水の揺れに合わせて磨かれた焦点が、映った鏡文字を静止させ、正しい向きに立てる。"}, {"t": "p", "v": "「――読める」"}, {"t": "p", "v": "　裏面の隙間に、表を避けて書かれた薄墨。直人は一字ずつ、声にした。"}, {"t": "p", "v": "「『紋ハ道ヲ示ス。深キ二弁、線ヲ引ケ。北ノ線、<strong>都ノ月影</strong>ニ継グ。――鏡ヲ持ツ者ヨ、汝ハ正シキ者ナリ』」"}, {"t": "p", "v": "「都の、月影」真琴が復唱した。「都は京都。月影は――場所か、時刻か、装置か」"}, {"t": "p", "v": "　背後で、シャッターの音がした。<br>　氷室が、紋と、巻物と、潮だまりを撮っている。"}, {"t": "p", "v": "「『深き二弁』とは、どの二枚です？」"}, {"t": "p", "v": "「さあな。写真に撮れてるだろう」"}, {"t": "p", "v": "「……写真に、彫りの深さは写らない」"}, {"t": "p", "v": "「気の毒に」"}, {"t": "p", "v": "　直人は立ち上がった。氷室は少しの間、無言で紋を見下ろし――それから、笑った。今日はじめての、商売気のない笑いに見えた。"}, {"t": "p", "v": "「鷺宮さん。雇い主に、あなたの引き抜きを進言しておきます」"}, {"t": "p", "v": "「断る。俺は、<strong>預かり物の側</strong>の人間なんでね」"}, {"t": "p", "v": "　氷室たちは、満ち始めた海を背に引き上げていった。<br>　残された時間で、真琴が簡易の拓本を取る。和紙とクレヨン。水が足首から脛へ上がってくる。"}, {"t": "p", "v": "「取れました――」"}, {"t": "p", "v": "「戻るぞ。潮が変わった」"}, {"t": "br"}, {"t": "p", "v": "　瀬戸内の潮は、満ちに転じると加速する。<br>　さっきまで砂浜だった場所が、もう浅い海に戻り始めていた。三人は列になって岸を目指した。"}, {"t": "p", "v": "　波が来た。小さな波。だが膝まで浸かった体には十分だった。泳げない直人にとって、腰から上の水は、切り立った崖のふちに立つのと同じだった。"}, {"t": "p", "v": "　真琴の足が、砂に取られて滑った。"}, {"t": "p", "v": "　直人の手が、倒れる腕を掴んだ。引き寄せる。濡れた服越しに、相手の心臓の音だか自分のだか分からない鼓動が伝わった。"}, {"t": "p", "v": "「――手を離すな。岸まで一緒に行く」"}, {"t": "p", "v": "　真琴は頷いた。眼鏡に水滴、額に貼りついた髪。書陵部の「規定の顔」が剥がれて、怯えと、それとは別の何かが混ざった顔が、そこにあった。"}, {"t": "p", "v": "　岸に上がると、三人とも腰から下がずぶ濡れだった。<br>　直人はジャケットを脱いで真琴に被せた。"}, {"t": "p", "v": "「鷺宮さんが冷えます」"}, {"t": "p", "v": "「俺は平気だ」"}, {"t": "p", "v": "　嘘だった。九月でも、濡れて風に当たれば体は冷える。だが、ジャケットの裏地が体温で温かいことに気づいた瞬間、真琴の表情が一拍だけ緩んだのを見て、この嘘はついた甲斐があった、と思った。"}, {"t": "p", "v": "　早川が自販機の熱い茶を三本抱えて戻ってきた。"}, {"t": "p", "v": "「はい。……で、収支報告いいすか。<strong>うち、勝ってます？　負けてます？</strong>」"}, {"t": "p", "v": "「引き分けに見せかけた、こっちの勝ちだ」直人は指を折った。「向こうが得たのは、紋の存在と、巻物の全文。こっちはそれに加えて、<strong>どの二弁が深いか</strong>を知ってる。線の向きを知ってるのは、うちだけだ」"}, {"t": "p", "v": "「都の月影、っすね。次は京都」"}, {"t": "p", "v": "　真琴は茶を両手で包んで、ぽつりと言った。"}, {"t": "p", "v": "「……この仕掛け、段階ごとに人を試していますね。札を見つける目。囮を見抜く指。壊さずに開ける手。水鏡を読む道具と、使い方。――<strong>金目当ての人間は、どこかで必ず、壊すか、諦める</strong>」"}, {"t": "p", "v": "「守れる者だけを、奥へ通す設計か」"}, {"t": "p", "v": "「ええ。そして」真琴は、濡れた眼鏡を拭きながら、言った。「氷室という人は、たぶん途中で落第します。あの人は、開ける手を持っていない。<strong>開ける手を持つ人を、雇うしかない</strong>」"}, {"t": "p", "v": "　その言葉の意味を、直人が本当に理解するのは、もう少し先のことになる。"}, {"t": "p", "v": "　夕闇の海で、大鳥居が黒い影になっていく。満ちた潮が、菊紋を静かに沈めていった。<br>　次に紋が空気に触れるのは、半月後だ。<br>　その頃にはもう、勝負は京都に移っている。"}], "chars": 3035}, {"title": "第十話　五つの蔵", "paras": [{"t": "p", "v": "厳島から戻った翌日、真琴に呼ばれて書陵部へ行った。"}, {"t": "p", "v": "「業務外で、三点見つけました」"}, {"t": "p", "v": "　閲覧室の机に、幕末の文書が三通、並んでいた。"}, {"t": "p", "v": "「一点目。慶応四年二月。江戸城の宝物目録の写し――正確には、目録から<strong>消された品目</strong>の控えです。墨で塗り潰してありますが、透かすと読めます」"}, {"t": "p", "v": "　真琴が窓の光に紙を立てた。塗り潰しの下に、うっすらと文字が浮かぶ。"}, {"t": "p", "v": "「『南蛮渡来ノ望遠鏡一式』『利休所持ト伝ワル茶碗　曜変天目』『運慶作ト伝ワル金剛力士像　小軀』『正宗ノ太刀　銘不明』――」"}, {"t": "p", "v": "「曜変天目……」直人は息を呑んだ。「現存する曜変天目の茶碗は、世界に三つ。全部国宝だ。四つ目が実在するなら、それだけで歴史が動く」"}, {"t": "p", "v": "「二点目。同年三月、搬出の実行記録。五カ所の振り分けです」"}, {"t": "p", "v": "　――日光、御遺訓ノ原本並ビニ望遠鏡。<br>　――鎌倉、仏具類。<br>　――姫路、工芸、茶器類。<br>　――厳島、書画、典籍類。<br>　――京都、勅令ノ原本。"}, {"t": "p", "v": "「日光に、家康の遺訓の原本」真琴が指でなぞった。「徳川の正統性の核です。家の聖地に、家の魂を隠した。京都の勅令原本は――天皇の膝元に、天皇の言葉を隠した。<strong>もっとも安全で、もっとも大胆</strong>」"}, {"t": "p", "v": "「姫路が茶器なら、曜変天目は姫路の蔵か。……で、三点目は」"}, {"t": "p", "v": "「これは、文書というより」真琴の声が慎重になった。「地図です」"}, {"t": "p", "v": "　日本列島の簡略図。五つの朱点。日光、鎌倉、姫路、厳島、京都。<br>　そして各点から細い線が引かれ、五本の線は一点で交わっていた。"}, {"t": "p", "v": "「……交点は、駿河。<strong>駿府城跡の付近</strong>です」"}, {"t": "p", "v": "「家康が大御所政治をやった城だ」"}, {"t": "p", "v": "「ええ。ただ、五点を結べば線はどこかで交わります。偶然の可能性を消せません。それに――この線、五つの蔵の配置とは筆が違う。<strong>後から誰かが引いた線</strong>です。墨の年代も、少し新しい」"}, {"t": "p", "v": "「組の誰かが、あるいは祖父の師匠の代の誰かが、何かに気づいて引いた線か。……頭の隅に置いておこう。今は、目の前の鎖を辿る方が先だ」"}, {"t": "p", "v": "　鎖は、こうなっている。<br>　札が三点を指し、大仏の欠けが方位を教え、駅と楼門が道具の目録をくれ、御料車がレンズと巻物と石をくれ、姫路の石垣が筒を寄こし、厳島の紋が「都の月影」と言った。<br>　一本道だ。五つの蔵は並列ではなく、<strong>順路</strong>として設計されている。そして順路の先頭は今、京都を向いている。"}, {"t": "p", "v": "「星霜蔵、という名前も見つけました」真琴が写しを出した。「明治の華族の書簡に一度だけ。『星霜組ノ守レル蔵、俗ニ星霜蔵ト呼ブ。星と霜が幾百年降リ積モルトモ消エヌ蔵ナリ』――お祖父様のノートにも？」"}, {"t": "p", "v": "「ある。二冊目の後半だ。祖父は名前まで辿り着いてた。……場所だけが、なかった」"}, {"t": "br"}, {"t": "p", "v": "「一つ、聞いていいか」"}, {"t": "p", "v": "　直人は文書から目を上げた。"}, {"t": "p", "v": "「なぜ、ここまでやってくれる。業務外で、休暇まで使って。門前払いの日のあんたと、同じ人間とは思えない」"}, {"t": "p", "v": "　真琴は少し黙った。閲覧室の空調だけが低く鳴っていた。"}, {"t": "p", "v": "「……鷺宮清一郎さんが退職されたのは、私が学生アルバイトでここに居た年です。直接は、ほとんど話していません。ただ、先輩方が皆、言っていました。あれほどの腕の人が、埋蔵金に取り憑かれて消えていった。<strong>惜しい人を、笑い話にしてしまった</strong>、と」"}, {"t": "p", "v": "「よく聞く話だ」"}, {"t": "p", "v": "「私は、その笑い話が、ずっと引っかかっていました。三十年の研究を、誰も検証せずに『妄想』で済ませていいのか。――文書を扱う人間として、それは一番やってはいけない態度ではないのか」"}, {"t": "p", "v": "　真琴の目が、まっすぐこちらを見た。"}, {"t": "p", "v": "「あなたはお祖父様の名誉のために動いている。私は、<strong>検証もせずに人を笑った側の、後始末</strong>のために動いています。動機は違いますが、行き先は同じです」"}, {"t": "p", "v": "　直人は頷いた。それ以上の言葉は、要らない気がした。<br>　――御料車の「引き出し」を彼女が知っていた件は、まだ胸の抽斗に入れたままだ。聞くなら、確かめてからだ。"}, {"t": "p", "v": "　その時、閲覧室の戸が叩かれた。職員が顔を出す。"}, {"t": "p", "v": "「九条さん。お客様が。……黒田総一郎さんが、閲覧のご予約とのことで」"}, {"t": "p", "v": "　直人と真琴の目が合った。"}, {"t": "p", "v": "「黒田さんの予約は来週のはずです」真琴が小声で言った。"}, {"t": "p", "v": "「繰り上げたんだろう。……こっちの動きに合わせて」"}, {"t": "p", "v": "　文書を手早く片付けた。真琴が裏口を示しかけた、そのときだった。"}, {"t": "p", "v": "「――逃げなくて結構ですよ、鷺宮さん」"}, {"t": "p", "v": "　戸口に、黒田が立っていた。息が少し上がっている。急いで来たのだ。"}, {"t": "p", "v": "「今日は、あなたを追ってきたのではない。<strong>忠告に来た</strong>」"}, {"t": "p", "v": "「忠告？」"}, {"t": "p", "v": "　黒田は閲覧室に入り、後ろ手に戸を閉めた。学者の顔から、何かが剥がれかけていた。"}, {"t": "p", "v": "「鷹峰の――私の出資者の事務所で、競売の下見資料を見た。十二月の目玉出品。『日本近代史における最大の未発見資産の、完全な位置情報』。……その資料に、<strong>写真が三枚、添付されていた</strong>」"}, {"t": "p", "v": "「写真」"}, {"t": "p", "v": "「姫路の石垣の刻印。真鍮の筒。それから――厳島の、菊の紋」"}, {"t": "p", "v": "　閲覧室の空気が、一度に冷えた。"}, {"t": "p", "v": "「氷室が納品した情報が、もう商品に組まれている。連中は五つ揃うのを待たない。<strong>揃った分から、切り売りする</strong>気だ。座標が半端でも、『未発見の埋蔵金』の看板が付けば、買う人間は世界中にいる」"}, {"t": "p", "v": "「……あんたは、それでいいのか。黒田さん」"}, {"t": "p", "v": "　黒田は、すぐには答えなかった。<br>　答える代わりに、机の上の幕末の文書を――「後世ノ者ヨ、此ノ国ノ宝ヲ守レ」の一文を、長いこと見下ろしていた。"}, {"t": "p", "v": "「私は、学界に戻りたかっただけだ。金主が要り、鷹峰が来た。研究費と機材と、失った二十年への同情。……署名した時は、文化財の記録保存の投資だと思っていた」"}, {"t": "p", "v": "「今は」"}, {"t": "p", "v": "「今は――<strong>思っていた、ということにしたい自分</strong>と、毎晩会議をしている」"}, {"t": "p", "v": "　黒田は戸口へ戻り、最後に振り返った。"}, {"t": "p", "v": "「京都へ行くのでしょう。急ぎなさい。氷室は優秀だ。そして鷹峰は、優秀な人間に、期限を切る男だ」"}, {"t": "p", "v": "　足音が遠ざかっていく。<br>　ずっと隅で気配を消していた早川が、長い息を吐いた。"}, {"t": "p", "v": "「……あの人、敵なんすか、味方なんすか」"}, {"t": "p", "v": "「まだ、どっちでもない」直人は文書をカバンに納めた。「<strong>壊れかけてる側</strong>だ。どっちに倒れるかは、これからの話で決まる」"}, {"t": "p", "v": "　都の月影。次の謎は、千年の都で待っている。<br>　砂時計は三つとも、まだ落ち続けている。"}], "chars": 2731}, {"title": "第十一話　右近の橘", "paras": [{"t": "p", "v": "京都御所は通年公開されているが、開いているのは夕方まで。<br>　直人が要るのは、日没の光だった。"}, {"t": "p", "v": "　祖父のノートの京都の項は一行だけだ。「紫宸殿。日没時ノ影。秋分ガ理想」。<br>　秋分は過ぎた。次の春分まで、半年も待てない。"}, {"t": "p", "v": "「秋分じゃなくても、計算で補正できます」と早川。「日没の方位角の差だけ、影の位置をずらせばいい。問題は――閉館後に、前庭にいる方法っす」"}, {"t": "p", "v": "「隠れて残る」"}, {"t": "p", "v": "「それは不法侵入です」真琴の声が、書陵部の温度に戻った。「御所は宮内庁の管理です。私は、見て見ぬふりはできません。……代わりに、正規の道を作ります」"}, {"t": "p", "v": "　真琴は三日で、道を作った。<br>　名目は「紫宸殿の木工装飾の保存状態調査」。書陵部学芸員と外部協力の修復士の、計二名。閉館後、日没前後の一時間。条件は、京都事務所の職員一名の同行。"}, {"t": "br"}, {"t": "p", "v": "　十月の御所は、観光客が去ると、砂利の音だけの世界になった。"}, {"t": "p", "v": "　同行の職員は山本と名乗った。四十代、穏やかで、目は怠けていない。<br>　白砂の前庭。左近の桜、右近の橘。紫宸殿の奥に、高御座の黒漆が沈んでいる。"}, {"t": "p", "v": "　真琴が山本を装飾談義に引き込んでいる間に、直人は影を測った。<br>　日が落ちる。屋根の棟の影が、白砂の上を這って伸びていく。早川が外から送ってくる補正値――今日の日没方位角と真西の差、七度。"}, {"t": "p", "v": "　棟の影の先端を、七度分、戻す。"}, {"t": "p", "v": "　秋分の日没の影は――<strong>右近の橘の根元</strong>を指した。"}, {"t": "p", "v": "　橘は古木だった。張り出した根の一本が、砂の下の何かを乗り越えるように波打っている。<br>　しゃがんで、根の際の砂を指で探る。三十センチ四方の、加工された平石の輪郭。"}, {"t": "p", "v": "「どうかされましたか」と、山本。"}, {"t": "p", "v": "「いえ。根が石造物に触れているようなので、状態を。……庭園管理の観点でも、一度見た方がいいかもしれません」"}, {"t": "p", "v": "「ああ、実は来月、前庭の排水工事が入るんですよ。白砂を上げて暗渠を点検する。その石も、支障物なら調査対象になるかと」"}, {"t": "p", "v": "　来月。工事。<br>　欲しかった扉が、向こうから開いた音がした。"}, {"t": "br"}, {"t": "p", "v": "　東京に戻った翌日、非通知の着信が鳴った。"}, {"t": "p", "v": "「――右近の橘。良い読みです」"}, {"t": "p", "v": "　氷室の声だった。"}, {"t": "p", "v": "　直人は、返事をする前に、頭の中で名簿を作った。影の先を知っている人間。俺。早川。真琴。同行の山本。以上、四人。"}, {"t": "p", "v": "「今のは、依頼主への務めで掛けています。<strong>次の工事の夜、私も伺います</strong>。互いに、段取りの良い夜にしましょう」"}, {"t": "p", "v": "　電話は切れた。<br>　直人は、しばらく動けなかった。恐怖より先に、計算が回った。早川はあり得ない。山本が漏らすなら「橘」という言葉は使わない――あの場で「橘の根元」を意識していたのは、影を測った俺と、もう一人。"}, {"t": "p", "v": "　その夜、直人は真琴を呼び出した。<br>　池袋の、シェアオフィス近くの公園。街灯の下。"}, {"t": "p", "v": "「氷室が、橘の根元を知っていた」"}, {"t": "p", "v": "　真琴の顔から、順番に色が引いていくのが分かった。"}, {"t": "p", "v": "「……私では、ありません」"}, {"t": "p", "v": "「あんたが氷室に流したとは思っていない。<strong>だが、あんたから上には流れたんじゃないか</strong>」"}, {"t": "p", "v": "　長い沈黙だった。<br>　やがて真琴は、カバンから一冊の手帳を出した。以前、ちらりと見えた、公文書の様式が挟まったままの手帳を。"}, {"t": "p", "v": "「――申し訳、ありませんでした」"}, {"t": "p", "v": "　深い、腰からの礼だった。"}, {"t": "p", "v": "「書陵部に、あなたの申請が来た時。上から指示がありました。<strong>接触して、動向を報告せよ</strong>。名目は、皇室財産に関わる可能性のある調査の把握。……門前払いの翌週から、私は、報告書を上げていました。厳島も。御料車の件も。京都も」"}, {"t": "p", "v": "「……御料車の引き出しを、あんたが知ってた理由が、それか」"}, {"t": "p", "v": "「報告の過程で、上が独自に照会したようです。博物館の入館記録と、修復点検の申請。私は、それを読んで――あなたに、確かめるようなことを聞きました」"}, {"t": "p", "v": "　真琴は頭を上げなかった。"}, {"t": "p", "v": "「言い訳をします。一つだけ。報告書には、毎回、最後にこう書いてきました。『<strong>本調査に違法性なし。故・鷺宮清一郎氏の研究には学術的価値が認められる可能性が高い</strong>』。……あなたたちを守る文面のつもりでした。つもりでした、が」"}, {"t": "p", "v": "「その報告が、上の誰かから、鷹峰に売られてる」"}, {"t": "p", "v": "「……昨日から、私も同じ結論です。報告の宛先は三人。そのうちの誰かが、外に繋がっている。<strong>私は、敵の目になっていました</strong>」"}, {"t": "p", "v": "　街灯の下で、真琴の声が初めて割れた。"}, {"t": "p", "v": "「規則を守れば正しいと思っていました。手続きの中にいれば、誰も傷つけないと。……その手続きが、丸ごと、盗聴器でした」"}, {"t": "p", "v": "　直人は、夜の橘の影を思い出していた。<br>　怒りはあった。だが、この人は俺を売ったのではない。<strong>書類を信じて、書類に裏切られた</strong>のだ。それは、紙を信じて生きてきた人間にとって、どういう痛みか。紙を直して生きてきた俺には、少しだけ分かる。"}, {"t": "p", "v": "「――真琴さん。報告は、これからも上げてくれ」"}, {"t": "p", "v": "「え」"}, {"t": "p", "v": "「ただし、俺が書いた文面をな。<strong>偽の行き先を流す</strong>。盗聴器が生きてるなら、逆に使う。……それと、本当の報告を一通だけ書いてくれ。宛先は上司じゃない。<strong>あんた自身の名前で、発見届を出す準備だ</strong>」"}, {"t": "p", "v": "　真琴が、ゆっくりと顔を上げた。"}, {"t": "p", "v": "「工事の夜。石の下に何があっても、俺たちは持ち出さない。<strong>その場で発見届を書いて、書陵部の正規収蔵に乗せる</strong>。国の宝は、国の台帳に。それが、後世ノ者ヨ守レ、の一番まっとうな読み方だろう」"}, {"t": "p", "v": "「……処分は、免れません。無断の内偵協力と、無断の調査と。停職では、済まないかも」"}, {"t": "p", "v": "「祖父は三十年、笑われても続けた。……あんたはどうする」"}, {"t": "p", "v": "　真琴は、手帳の公文書様式を――内偵の報告用紙を、その場で二つに裂いた。"}, {"t": "p", "v": "「書きます。<strong>自分の名前で</strong>」"}, {"t": "br"}, {"t": "p", "v": "　工事の夜は、雨だった。"}, {"t": "p", "v": "　前庭の白砂が上げられ、ブルーシートと投光器の下で、暗渠の点検が進む。真琴は「文化財保護の立ち会い」として、直人は「石造物の状態評価の外部専門家」として、正規の腕章を付けて、そこにいた。"}, {"t": "p", "v": "　偽の行き先――「日光の調査を先行する」という報告文――は三日前に上げてある。<br>　それでも、直人は工事業者の顔を、一人ずつ確かめた。"}, {"t": "p", "v": "　いた。<br>　合羽のフードの下。作業員の列の中に、あの立ち方。"}, {"t": "p", "v": "　氷室と、目が合った。<br>　氷室は、周囲を見た。宮内庁の職員。警備。監督官。投光器。記録カメラ。――<strong>手の出しようのない夜</strong>であることを、双方が同時に確認した。"}, {"t": "p", "v": "　橘の根元の石が、吊り具で静かに上がった。"}, {"t": "p", "v": "　下には、漆喰で固めた小さな石室。中に、油紙と漆の箱。<br>　直人は手袋の手で、蓋だけを開けた。"}, {"t": "p", "v": "　勅書の料紙。菊の紋の封。そして、箱の蓋裏に嵌め込まれた、薄い銅の板――星形に七つの点の刻印と、線刻の図。"}, {"t": "p", "v": "「――発見物、確認。九条学芸員、記録を」"}, {"t": "p", "v": "「はい。<strong>発見届、起案します</strong>」"}, {"t": "p", "v": "　真琴の声は、雨の中で、まっすぐだった。<br>　箱は、その夜のうちに、京都事務所の金庫に正規収蔵された。台帳に、発見者として二人の名前が載った。<br>　銅の板は、箱と共に正規収蔵された。国の物は、国の台帳に。<br>　ただし真琴は、その夜のうちに写真と三次元計測を済ませ、後日、<strong>精密複製の製作</strong>を正規の調査項目として通した。原物は金庫に、寸分違わぬ写しが調査資料として直人の手元に。手続きの中に、それだけの隙間を、彼女は正確に作った。"}, {"t": "p", "v": "　撤収の間際、合羽の氷室が、すれ違いざまに小さく言った。"}, {"t": "p", "v": "「……見事です。今夜は、段取り負けだ」"}, {"t": "p", "v": "「次も負けろ」"}, {"t": "p", "v": "「次は」氷室はフードの下で、笑った気配がした。「<strong>場所を選べない所で、お会いしましょう</strong>」"}, {"t": "p", "v": "　雨の御所を出る時、真琴が空を見上げて、言った。"}, {"t": "p", "v": "「処分、来ると思います。早ければ今週」"}, {"t": "p", "v": "「後悔してるか」"}, {"t": "p", "v": "「いいえ」即答だった。「生まれて初めて、<strong>書類が誇らしい</strong>です」"}], "chars": 3393}, {"title": "第十二話　取引", "paras": [{"t": "p", "v": "真琴が宮内庁の聴聞に呼ばれた日、直人は一人で鎌倉にいた。"}, {"t": "p", "v": "　二度目の胎内。目的は、菊紋の「裏」だ。紋のある壁の反対面――大仏の背中の外側に、組の文法なら、何かがある。"}, {"t": "p", "v": "　背面の二つの窓の間。青銅の曲面を、修復士の指でなぞっていく。<br>　あった。壁の厚みが、一箇所だけ違う。内側に、空洞。"}, {"t": "p", "v": "　開け口は、窓枠だった。明治の修復で入った青銅の補強板。その一枚だけ、縁の摩耗が他と違う。<strong>回された痕</strong>だ。"}, {"t": "p", "v": "　押さない。引かない。時計回りに、十五度。"}, {"t": "p", "v": "　鈍い手応えとともに、壁の一部が一センチ迫り出した。隙間から出てきたのは、薄い銅の板。星形に七つの点の刻印と、線刻の図の断片。"}, {"t": "p", "v": "　京都の箱の蓋裏にあった物と、同型だった。<br>　組の付属品。<strong>各蔵に一枚ずつ仕込まれた、重ね図の断片</strong>。京都の分と、この鎌倉の分で、手元に二枚。姫路の分は、氷室の懐だ。"}, {"t": "p", "v": "　補強板を戻し、胎内を出た。<br>　スマートフォンには、早川からの着信が――十七件、並んでいた。"}, {"t": "br"}, {"t": "p", "v": "「真琴さんが、消えたっす」"}, {"t": "p", "v": "　早川は、声の上ずりを無理に抑えていた。"}, {"t": "p", "v": "「聴聞が終わって、庁舎を出たのが十五時十分。位置共有は、桜田通りで止まってます。京都の後、三人で決めた共有です。切れたんじゃない。<strong>端末ごと、切られてる</strong>」"}, {"t": "p", "v": "「警察には」"}, {"t": "p", "v": "「まだ。……あの、鷺宮さん。三分前に、変なメールが。差出人不明で、件名だけ。『<strong>お電話します</strong>』って」"}, {"t": "p", "v": "　電話は、その十秒後に鳴った。"}, {"t": "p", "v": "「――鷺宮直人様。初めまして」"}, {"t": "p", "v": "　氷室ではなかった。黒田でもなかった。<br>　柔らかい、輪郭のない声だった。画廊で絵の由来を語るような声。"}, {"t": "p", "v": "「鷹峰と申します。美術品の、仲介を」"}, {"t": "p", "v": "「……真琴さんを、どうした」"}, {"t": "p", "v": "「お預かりしています。丁重に。<strong>傷は、値打ちを下げますので</strong>」"}, {"t": "p", "v": "　人間を、在庫の言葉で語る声だった。氷室の「依頼品」よりも、ずっと底が冷たい。"}, {"t": "p", "v": "「取引を。あなたのお手元の――銅の板が二枚。真鍮のレンズ。それから、清一郎先生のノートの原本二冊。以上と、九条様の身柄を交換いたします」"}, {"t": "p", "v": "「板が二枚だと、なぜ知っている」"}, {"t": "p", "v": "「存じませんでした。<strong>今、教えていただきました</strong>」"}, {"t": "p", "v": "　直人は、奥歯を噛んだ。かまをかけられた。一枚か二枚か、向こうは知らなかったのだ。"}, {"t": "p", "v": "「明後日の夜、二十時。場所は追ってご連絡します。お一人で。……ああ、それから鷺宮様。お仲間の技術者の方に、お伝えください」"}, {"t": "p", "v": "　声が、初めて事務の温度になった。"}, {"t": "p", "v": "「<strong>バックアップは、基本だそうですね</strong>。三十秒前から、うちの技術者もそう思っています」"}, {"t": "p", "v": "　電話が切れた瞬間、通話口の向こうで早川が叫んだ。"}, {"t": "p", "v": "「――NASがやられてる！　リモートで消しに来てる、切る、電源引っこ抜く――！」"}, {"t": "br"}, {"t": "p", "v": "　被害の集計は、夜までかかった。"}, {"t": "p", "v": "　シェアオフィスのNASは全滅。クラウドは最初から使っていない。生き残ったのは、早川が肌身離さず持ち歩いていた外付けHDD一台と、直人の懐の拓本、それに紙のメモ類。"}, {"t": "p", "v": "「……ノートの写真データ、一冊目は無事っす。二冊目が――後半、飛んでます。スキャンし直す前の、低解像度しか残ってない」"}, {"t": "p", "v": "「読めるか」"}, {"t": "p", "v": "「文字は、たぶん八割。……鷺宮さん、すいません。俺、基本とか言っときながら――」"}, {"t": "p", "v": "「三十年分の記録を守って、八割残した。<strong>上出来だ</strong>」"}, {"t": "p", "v": "　言いながら、直人は自分の手が震えているのに気づいていた。<br>　怒りではなかった。明後日、渡すのだ。銅板を。レンズを。そして、祖父のノートの原本を。"}, {"t": "p", "v": "　データは残る。情報は失わない。<br>　だが、あの二冊は情報ではない。祖父の三十年の筆圧も、染みも、糊の直しも、頁の膨らみも、<strong>手触りも</strong>、あの紙にしかない。"}, {"t": "p", "v": "　修復士は知っている。写しと原本の間にある、埋まらない距離を。"}, {"t": "br"}, {"t": "p", "v": "　指定された場所は、天王洲の倉庫街だった。改装された白い空間。壁に、値札のない絵が並んでいる。プライベート・ギャラリー――闇の競りの、下見会場だ。"}, {"t": "p", "v": "　真琴は、奥の椅子にいた。<br>　縛られてはいない。傷もない。ただ、両脇に男が立ち、テーブルには彼女の手帳と身分証が「展示」のように並べてあった。丁重な、完璧な脅しだった。"}, {"t": "p", "v": "「鷺宮さん――来ては、駄目……」"}, {"t": "p", "v": "「<strong>九条様。お静かに</strong>」"}, {"t": "p", "v": "　鷹峰は、声の印象のままの男だった。仕立ての良いスーツ。柔らかい所作。目だけが、来場者を値踏みする画商の目だった。<br>　その斜め後ろに、黒田がいた。顔色が、壁の白より白かった。"}, {"t": "p", "v": "「お持ちいただけましたか」"}, {"t": "p", "v": "　直人は、布包みを台に置いた。<br>　銅板が二枚。真鍮のレンズ。そして、ノートが二冊。<br>　――二枚のうち、京都の分は複製だ。原物は国の金庫にあり、俺に持ち出す権利はない。気づくかどうかは、向こうの目の問題だ。"}, {"t": "p", "v": "　鷹峰は白手袋で一つずつ検めた。銅板を光に透かし、レンズの縁の彫りを確かめ、ノートの頁を、値付けの速度でめくっていく。"}, {"t": "p", "v": "「結構。……九条様、どうぞ。お帰りはあちらです」"}, {"t": "p", "v": "　真琴が立ち上がり、直人の隣まで歩いてくる間、誰も動かなかった。彼女の指先が、直人の袖を一度だけ、強く掴んだ。"}, {"t": "p", "v": "「一つ、伺っても？」鷹峰が言った。「レンズの複製を、もう作られましたか」"}, {"t": "p", "v": "「……さあな」"}, {"t": "p", "v": "「作られたでしょうね。数値をお持ちだ。結構、結構。<strong>競りには、来歴の物語も付きますので</strong>。『発見者たちの攻防』は、良い章になります」"}, {"t": "p", "v": "　この男にとっては、直人たちの三ヶ月も、祖父の三十年も、慶応四年の遺言も、全部が<strong>カタログの文章</strong>なのだ。"}, {"t": "p", "v": "「最後に、鷹峰さん。一つだけ教えろ」直人は言った。「あんたは、蔵を開ける気はあるのか。それとも、座標を売って終わりか」"}, {"t": "p", "v": "「開けますよ、当然」鷹峰は微笑んだ。「<strong>中身を検品せずに、目録は書けません</strong>」"}, {"t": "br"}, {"t": "p", "v": "　ギャラリーを出て、夜の運河沿いを三人で歩いた。<br>　真琴は、途中から震えが来た。遅れてくる震えだ。直人と早川は、両側で黙って歩幅を合わせた。"}, {"t": "p", "v": "「……悔しい」震えの合間に、真琴は言った。「怖かったより、悔しいが勝ってます。私、人質でした。<strong>書類じゃなくて、荷物にされました</strong>」"}, {"t": "p", "v": "「あぁ。……全員で、取り返しに行こう。荷物にされた分ごと」"}, {"t": "p", "v": "　背後で、足音がした。<br>　振り返ると、黒田が追ってきていた。息を切らして、街灯の下で立ち止まる。"}, {"t": "p", "v": "「――ノートは」"}, {"t": "p", "v": "　黒田は、絞り出すように言った。"}, {"t": "p", "v": "「ノートの原本は、私が預かることにした。研究資料の鑑定名目だ。鷹峰は競りが済むまで、物の管理を私に任せている。……<strong>あの二冊だけは、競りには出させない</strong>。先生の三十年を、カタログの一行にはさせない」"}, {"t": "p", "v": "「……黒田さん」"}, {"t": "p", "v": "「勘違いするな。私はまだ、降りていない。降りられる場所が、もう、ないんだ」"}, {"t": "p", "v": "　黒田は背を向けて、ギャラリーの灯りの方へ戻っていった。<br>　その背中は、二十年前に道を間違えた男が、間違えた場所から一歩だけ、こちらに踏み出した背中に見えた。"}, {"t": "br"}, {"t": "p", "v": "　終電間際の山手線で、早川が指を折った。"}, {"t": "p", "v": "「整理するっす。向こうの手札――銅板三枚、レンズ原本、ノート原本、厳島の写真、たぶん巻物の写真も。うちの手札――全データのコピー八割、拓本、レンズの複製待ち、それと<strong>日時の情報</strong>。……あと」"}, {"t": "p", "v": "「あと？」"}, {"t": "p", "v": "「氷室が言ってたやつっす。『開ける手を持つ人を、雇うしかない』。――鷹峰は検品するって言いました。<strong>開ける手が要るんすよ、絶対</strong>。最後の蔵の前で、必ずうちに声が掛かるっす」"}, {"t": "p", "v": "　直人は、窓の暗さに映る自分の顔を見た。"}, {"t": "p", "v": "　次は日光。最後の蔵。<br>　大修理の着工まで、あと十九日。"}], "chars": 3300}, {"title": "第十三話　眠り猫の目", "paras": [{"t": "p", "v": "東武日光からのバスを降りると、朝の杉の匂いがした。"}, {"t": "p", "v": "　日光東照宮。家康の霊廟。「過剰」の建築だ。柱という柱、梁という梁に、五百を超える彫刻が隙間なく詰まっている。"}, {"t": "p", "v": "　そして参道の脇には、もう一つの光景があった。<br>　単管の足場。資材のパレット。「保存修理工事のお知らせ――奥宮周辺、着工まであと十六日」の看板。"}, {"t": "p", "v": "「あと十六日、っすね」早川が看板の日付を読んだ。「着工したら、奥宮は四年間、幕の中」"}, {"t": "p", "v": "「四年後じゃ、競りが終わってる。……今回で決める」"}, {"t": "br"}, {"t": "p", "v": "　陽明門の前で、直人は首を反らした。"}, {"t": "p", "v": "「五百の彫刻の中に、組の印がある。……修復士の目で探すなら、まず『<strong>逆さ</strong>』だ」"}, {"t": "p", "v": "「逆さ？」"}, {"t": "p", "v": "「完璧は魔を呼ぶ、って信仰で、この門には有名な逆柱がある。渦紋が一本だけ逆さの柱。……で、あまり知られてない逆さが、もう一つ」"}, {"t": "p", "v": "　門の裏に回る。裏面の狛犬の一対。"}, {"t": "p", "v": "「阿吽の位置が、左右逆なんだ。公式には魔除け。だが――台座を見ろ」"}, {"t": "p", "v": "　台座の側面に、指先ほどの刻印。丸に、菊。十六弁。<br>　ルーペで覗くと、二時と八時の弁だけ、彫りが深い。"}, {"t": "p", "v": "「……ここが、五番目の蔵だ」真琴が息を詰めた。"}, {"t": "p", "v": "　刻印の隣に、漢数字がひとつ。「七」。"}, {"t": "p", "v": "「姫路の石も『七』でした。段の七。ここでは――」"}, {"t": "p", "v": "「参道を、表門から奥へ。順路に建つ門と社殿だけを、順に数えるんです」真琴が指を折った。「表門、神厩舎、三神庫、陽明門、唐門、拝殿本殿――そして奥宮の宝塔。参拝の道をまっすぐ辿って、<strong>宝塔が七つ目</strong>です」"}, {"t": "p", "v": "「七つ目。家康の墓所か」"}, {"t": "br"}, {"t": "p", "v": "　奥宮へは、拝殿の裏から杉の石段を二百七段。<br>　登り口の坂下門の上に、有名な彫刻がある。"}, {"t": "p", "v": "　眠り猫。左甚五郎作と伝わる、牡丹に囲まれてうたた寝する猫。"}, {"t": "p", "v": "　祖父のノートの日光の項は、三行だった。<br>　「眠り猫、三猿、想像の象。この三つが鍵」「猫の目は閉じ切っていない。<strong>瞳の先を辿れ</strong>」――そこで途切れている。"}, {"t": "p", "v": "　直人は猫を見上げた。確かに、薄目だ。眠ったふりをして、何かを見ている。"}, {"t": "p", "v": "「早川。猫の頭の向きと目の開きから、視線の先を計算できるか」"}, {"t": "p", "v": "「三次元復元っすね。写真、何枚か角度変えて撮らせてください。……はい。視線ベクトル、石段方向。<strong>百二十三段目</strong>の辺りっす」"}, {"t": "p", "v": "　三人は段を数えて登った。百二十一、百二十二――百二十三。<br>　蹴込みの垂直面に、小さな刻印があった。丸に、横一。"}, {"t": "p", "v": "「姫路の石と、同じ印」"}, {"t": "p", "v": "　その横に、薄い彫りで、短い一文。"}, {"t": "p", "v": "『<strong>旅ヲ数ヘヨ</strong>』"}, {"t": "p", "v": "「旅を、数えよ……」"}, {"t": "p", "v": "　意味は、その場では解けなかった。だが直人には確信があった。これは、宝塔の前で要る言葉だ。"}, {"t": "br"}, {"t": "p", "v": "　奥宮の玉垣の外から、望遠レンズで宝塔の台座を撮った。"}, {"t": "p", "v": "　八角の基壇。正面の石に線刻――円と、線の図。四面を繋ぐと一枚になる、<strong>五枚目の重ね図</strong>だ。<br>　線刻の下に、小さな丸い穴。径は、あの真鍮レンズとぴったり同じに見える。"}, {"t": "p", "v": "　そして穴の脇に、石の円盤が三つ、埋め込まれていた。縁に漢数字。零から九。"}, {"t": "p", "v": "「回転式の、ダイヤル錠……」早川が液晶を拡大した。「三桁。何の数字すか」"}, {"t": "p", "v": "「『旅ヲ数ヘヨ』。……たぶん、答えは外にはない。<strong>ここまでの道の中にある</strong>」"}, {"t": "p", "v": "　直人は指を折った。"}, {"t": "p", "v": "「鎌倉の菊紋は、十四弁。欠けが<strong>二</strong>。東京駅の干支は八支。欠けが<strong>四</strong>。厳島の紋は十六弁で、深き弁が<strong>二</strong>。……欠けと深さは、組の文法で同じ意味だ。旅の順に並べれば――」"}, {"t": "p", "v": "「二、四、二」真琴が言った。「<strong>旅をした者にしか、数えられない番号</strong>」"}, {"t": "p", "v": "「外の知識は一つも要らない。歩いた者だけが開けられる。……組らしい錠だ」"}, {"t": "br"}, {"t": "p", "v": "　下りの道で、残りの二つの鍵を確かめた。"}, {"t": "p", "v": "　神厩舎の三猿。見ざる、言わざる、聞かざる。<br>　直人は彫刻の下端の框に、指先で印を見つけた。三つの小さな刻み。<strong>左、右、左</strong>。"}, {"t": "p", "v": "「猿の並びと、框の刻み。……ダイヤルの回し方だ。一つ目は左回し、二つ目は右、三つ目は左。順を守れ、という指示」"}, {"t": "p", "v": "「見ざる言わざる聞かざるの意味は」"}, {"t": "p", "v": "「開けた者への掟だろう。<strong>見ても、言うな</strong>。……三十年黙って死んだ、慶応の誰かと同じ作法だ」"}, {"t": "p", "v": "　上神庫の妻飾りには、想像の象がいた。実物を見たことのない彫師が、図面と伝聞だけで彫った象。耳も脚も、本物とは違う。"}, {"t": "p", "v": "「なんで象が鍵なんすか。可愛いけど」"}, {"t": "p", "v": "「警告だ」直人は象の歪んだ耳を見上げた。「実物合わせをせずに、図面だけで作った――<strong>蔵の錠も、同じだ</strong>という意味だと思う。現物合わせの『遊び』がない機構は、手順を一つ間違えると、噛む。噛んだら、二度と動かない」"}, {"t": "p", "v": "「……一発勝負、また来たっすか」"}, {"t": "p", "v": "「あの組は、最初から最後まで、そういう連中だ」"}, {"t": "br"}, {"t": "p", "v": "　帰京して、二つの手配をした。"}, {"t": "p", "v": "　一つは、レンズの複製。御徒町の光学職人に、計測値のままを発注した。曲率半径十八ミリ、焦点三十二ミリ、径二十八ミリ。三日で上がる。"}, {"t": "p", "v": "　もう一つは、封書だった。<br>　真琴が起案し、直人が連署した文書。宛先は文化庁と宮内庁。内容は――「日光東照宮奥宮周辺において、幕末期の埋蔵文化財が発見される可能性が高い。発見の際は直ちに届け出る」。調査記録の全部は封緘して弁護士に預け、電子データには時刻認証を付けた。文書自体は公証役場で確定日付を取った。日付が証明するのは中身の正しさではなく、<strong>その日にその意思があった</strong>ことだけだ。それでいい。要るのは、それだけだった。"}, {"t": "p", "v": "「盗掘者は、こんな紙を先に出しません」真琴が封蝋を押しながら言った。「これは、私たちが<strong>届け出る側</strong>だという、時刻の証拠です。……夜の玉垣を越える罪は、消えませんが」"}, {"t": "p", "v": "「消えなくていい。あとで、まとめて払う。……払って釣りが来る発見にする」"}, {"t": "p", "v": "　その夜、黒田から短いメールが来た。文面は二行だった。"}, {"t": "p", "v": "『鷹峰、氷室、明日日光入り。着工前倒しの噂あり』<br>『――<strong>月の条件は、三日後の晩だ。先生のノートの後半に、そうある</strong>』"}, {"t": "p", "v": "　月の条件。<br>　直人の手元の写真データ、二冊目の後半――飛んだ二割の、どこかにあった頁だ。<br>　黒田は原本を読んでいる。そして、それをこちらに寄越した。"}, {"t": "p", "v": "「……三日後の晩、っすね」早川が呟いた。「レンズの受け取りが三日後の昼。ぎりぎりっす」"}, {"t": "p", "v": "　窓の外、東京の夜空で、月が痩せていく。<br>　三日後。日光。夜。<br>　全部の線が、一点で交わろうとしていた。"}], "chars": 2794}, {"title": "第十四話　月光", "paras": [{"t": "p", "v": "三日後の夜。日光は、月明かりの底にあった。"}, {"t": "p", "v": "　黒田の伝えてきた「月の条件」――祖父のノート後半の記述は、こうだったという。<br>　『宝塔ノ錠、月ノ光ヲ以テ最後ノ検メト為ス。月齢十三ヨリ十五ノ間、月南中ノ刻、玉ノ穴ニ月光通ル』。"}, {"t": "p", "v": "　今夜の月齢は十四。南中は二十三時四十一分。着工まで、あと十三日。<br>　次に月の条件が揃う頃には、奥宮は工事の幕の中だ。今夜しかない。"}, {"t": "p", "v": "　裏山の杉林を、三人は無灯火で登った。<br>　罪の重さは、三人とも分かっていた。世界遺産の東照宮、その閉門後の、家康の墓所。見つかれば逮捕され、報道され、祖父の名前はもう一度「妄想の家系」として消費される。"}, {"t": "p", "v": "　それでも、と直人は思う。<br>　懐には、確定日付の入った封書の控えがある。届け出るための侵入。矛盾した理屈だ。矛盾したまま、行くと決めた。"}, {"t": "br"}, {"t": "p", "v": "　夜の東照宮は、昼と別の建物だった。"}, {"t": "p", "v": "　極彩色は闇に沈み、五百の彫刻は影の群れになる。杉の梢が揺れるたび、月光が石畳の上で明滅した。"}, {"t": "p", "v": "　坂下門の上で、眠り猫が寝ていた。<br>　薄目の猫の前を、三人は息を殺して通った。見張りの猫に、見逃してもらう気分だった。"}, {"t": "p", "v": "　二百七段。月明かりの石段は、一段ごとに山の冷気が濃くなる。<br>　百二十三段目の刻印に、直人は指で触れた。丸に横一。"}, {"t": "p", "v": "　――旅ヲ数ヘヨ。"}, {"t": "p", "v": "「数えてきたよ」と、小声で言った。誰にともなく。強いて言えば、百五十年前の誰かにだ。"}, {"t": "br"}, {"t": "p", "v": "　奥宮。<br>　玉垣を越える時、真琴が一瞬だけ足を止めて、拝殿に頭を下げた。それから、越えた。"}, {"t": "p", "v": "　宝塔の台座の前に、三人でしゃがむ。<br>　LEDは使わない。月で足りた。月齢十四の光は、思ったより白く、思ったより濃い。"}, {"t": "p", "v": "「ダイヤル、行くぞ。……三猿の順だ。左、右、左」"}, {"t": "p", "v": "　一つ目の円盤に指を掛ける。左回し。「二」。<br>　石が、低く、ごり、と鳴った。姫路の石と同じ、石臼の音。"}, {"t": "p", "v": "　二つ目。右回し。「四」。"}, {"t": "p", "v": "　三つ目に指を掛けて、直人は一度、手を止めた。<br>　象の警告が頭にある。遊びのない機構。ここで間違えれば、噛む。"}, {"t": "p", "v": "「……深呼吸、どうぞ」真琴が囁いた。「あなたの指は、間違えたことがありません」"}, {"t": "p", "v": "「あるさ。何度もある」直人は息を吐いた。「間違えた回数だけ、慎重になっただけだ」"}, {"t": "p", "v": "　左回し。「二」。"}, {"t": "p", "v": "　三つの円盤が、同じ深さで沈んだ。<br>　そして――何も起きなかった。"}, {"t": "p", "v": "「え……開かない？」早川の声が裏返りかけた。"}, {"t": "p", "v": "「まだだ。<strong>最後の検めが月</strong>だ。……レンズを」"}, {"t": "p", "v": "　複製の真鍮レンズ。御徒町の職人が三日で挽いた、計測値どおりの一枚。<br>　台座の丸い穴に、そっと差し込む。径は、あつらえたように収まった。"}, {"t": "p", "v": "　あとは、月を待つだけだった。"}, {"t": "p", "v": "　二十三時四十一分。<br>　月が、杉の梢の切れ目で南中した。"}, {"t": "p", "v": "　白い光が、斜めにレンズへ落ちる。<br>　レンズが光を折り、束ね、台座の線刻の一点――四面の重ね図の、中心の一点に、小さな光の粒を結んだ。"}, {"t": "p", "v": "　光の粒が、じり、と動いた。錠の中で、何かが温まるように、目を覚ますように。"}, {"t": "p", "v": "　――違う。温度じゃない。<strong>光の重さを計っている</strong>んだ。正しい焦点、正しい角度、正しい夜にだけ届く光を、最後の鍵として。"}, {"t": "p", "v": "　石の中で、順番に、閂の外れる音がした。一つ。二つ。三つ。"}, {"t": "p", "v": "　台座の正面の石が、静かに、内側へ沈んだ。"}, {"t": "p", "v": "　人ひとりが屈んで入れる、四角い口。<br>　中から、百五十年前の空気が流れ出てきた。冷たく、乾いて、石と、微かに――<strong>樟脳の匂い</strong>がした。"}, {"t": "p", "v": "「……防虫だ」直人は呟いた。声が掠れた。「中の物は、<strong>手入れされてる</strong>。放置された穴倉の匂いじゃない」"}, {"t": "p", "v": "「地下に、階段があるっす」早川がスマートフォンの薄明かりを向けた。「石の段。……下りてる」"}, {"t": "p", "v": "　星霜蔵。<br>　祖父が三十年呼び続けた名前の実体が、この階段の下にある。"}, {"t": "p", "v": "　直人が、最初の一段に足を掛けた――その時だった。"}, {"t": "br"}, {"t": "p", "v": "「――開けたか」"}, {"t": "p", "v": "　背後から、声がした。"}, {"t": "p", "v": "　三人が振り返る。<br>　玉垣の外、月明かりの石畳に、男が一人で立っていた。"}, {"t": "p", "v": "　黒田総一郎だった。<br>　鷹峰はいない。氷室もいない。ノートの原本を二冊、胸に抱えて、たった一人で。"}, {"t": "p", "v": "「黒田さん……どうやって、ここに」"}, {"t": "p", "v": "「先生のノートを読んだ。<strong>十二年、隣で読み方を教わった男だ</strong>。読めるさ、どこよりも正確に」"}, {"t": "p", "v": "　黒田は玉垣に手を掛け――越えなかった。<br>　境界線の前で、立ち止まった。"}, {"t": "p", "v": "「鷹峰たちは麓だ。着工前倒しの手続きに役人を抱き込んでいる。夜が明ければ、正面から、合法の顔をして入ってくる。……時間がないのは分かっている。分かっているが」"}, {"t": "p", "v": "　黒田は、ノートの表紙を、震える手で撫でた。"}, {"t": "p", "v": "「その階段を下りる前に――五分だけくれ。三十年前からの話だ。私と、先生の話だ。<strong>中に入ってから知るのと、入る前に知るのとでは、意味が変わる話</strong>なんだ」"}, {"t": "p", "v": "　月が、雲に入った。<br>　蔵の口から、百五十年前の冷気が、静かに流れ続けていた。"}], "chars": 2106}, {"title": "第十五話　一九九三年の二人", "paras": [{"t": "p", "v": "「一九九三年の五月に、書陵部の収蔵庫で、先生が一枚の文書を見つけた」"}, {"t": "p", "v": "　黒田は、玉垣の外の月明かりの中で、話し始めた。"}, {"t": "p", "v": "「その年の秋の学会で、私は先生に会った。私は二十四歳、助手になりたてで、幕末の財政史をやっていた。先生は――懇親会の隅で、誰にも相手にされない仮説を、一人で抱えていた」"}, {"t": "p", "v": "「埋蔵金の話を、ですか」"}, {"t": "p", "v": "「違う」黒田は首を振った。「先生が最初に私に見せたのは、宝の話じゃない。<strong>帳簿の話</strong>だ。慶応四年の江戸城の出納記録に、説明のつかない支出がある。人足代、船賃、石工と経師と指物師への手間賃。行き先の書かれていない、大量の職人への支払い。……私の専門ど真ん中だった。私はその夜、朝まで先生と帳簿の話をした」"}, {"t": "p", "v": "　黒田の声は、玉垣の内側の三人にではなく、もっと遠くに向けられていた。"}, {"t": "p", "v": "「それから十二年、私たちは二人で追った。表向きは無関係を装ってな。先生は物を追い、私は紙を追った。先生が鎌倉の光の交差を見つけた日、私に最初に電話をかけてきた。夜中の二時だ。『黒田君、光が交わった』と、子供みたいな声で」"}, {"t": "p", "v": "「……ノートに、その日付があります」真琴が静かに言った。「一九九五年、九月」"}, {"t": "p", "v": "「あの頃が、一番よかった」"}, {"t": "br"}, {"t": "p", "v": "「狂い始めたのは、私の方だ」"}, {"t": "p", "v": "　黒田は、抱えたノートに目を落とした。"}, {"t": "p", "v": "「二〇〇四年、私は大学で立場を失いかけていた。四十を過ぎて、論文らしい論文がない。後輩が先に准教授から上へ抜けていく。研究費が削られる。……妻が出ていった年に、先生に言ったんだ。『もう出しましょう。今あるだけの証拠で、世に問いましょう』と」"}, {"t": "p", "v": "「祖父は、断った」"}, {"t": "p", "v": "「烈火のように、な。私はあの時、先生の言葉を、老人の臆病だと思った。……一言一句、覚えている。先生はこう言った」"}, {"t": "p", "v": "　黒田は、目を閉じた。"}, {"t": "p", "v": "「『黒田君。証拠が足りないから駄目なんじゃない。<strong>発表すれば、世間に教えることになるからだ。百五十年、守ってきた者たちがいる、と。守られてきた蔵がある、と。その瞬間から、蔵は世界中の金庫破りの的になる</strong>。私たちは見つける側じゃない。見つけて、守る側に回るんだ。それができないなら、見つける資格もない』」"}, {"t": "p", "v": "　直人は、蔵の口から流れる冷気の中で、その言葉を聞いた。<br>　守り手は、表の職を持て。透かしの家の老人が語った、組の掟と同じ思想だった。祖父は、組の生き残りに会う前から――<strong>紙と帳簿だけから、組と同じ結論に辿り着いていた</strong>。"}, {"t": "p", "v": "「私は聞かなかった。翌年、単独で発表した。結果は知っての通りだ。証拠不十分。学界の笑い者。大学を追われ――そして、先生は私と縁を切った」"}, {"t": "p", "v": "「……ノートを分割したのは、その時ですね」"}, {"t": "p", "v": "「あぁ。長いこと、私はあれを、裏切り者への罰だと思っていた。半分は当たりだ。だが――」"}, {"t": "p", "v": "　黒田は、ノートの二冊目を開いた。最後の頁を、月に向ける。"}, {"t": "p", "v": "「先生が死んで、鷹峰の金で、私はこのノートを手に入れた。二十年ぶりに先生の字を読んで、気づいた。……この二冊には、<strong>私の名前で辿れる場所が、一つも書かれていない</strong>。共同調査の場所は全部、先生一人の名義の記録に書き換えてある。私の痕跡が、綺麗に消してあるんだ」"}, {"t": "p", "v": "「それは……」"}, {"t": "p", "v": "「罰なら、名前を残して晒せばいい。消したのは――<strong>守ったんだ</strong>。発表で的になった私に、これ以上、蔵の鍵を持たせないため。持っていなければ、狙われもしない。……先生は、絶縁したんじゃない。私を戦力外にして、火線の外に出したんだ」"}, {"t": "p", "v": "　黒田の声が、初めて、学者の声でなくなった。"}, {"t": "p", "v": "「先月、遺品の整理をした施設から、私宛の預かり物が届いた。葉書が一枚だ。日付は――二〇一八年の三月十二日」"}, {"t": "p", "v": "　手がかりは揃った、とノートに書いた、その日だ。"}, {"t": "p", "v": "　黒田は、葉書を胸ポケットから出した。読み上げる声は、ほとんど震えていた。"}, {"t": "p", "v": "「『黒田君。君に宝の<strong>見つけ方</strong>は教えたが、<strong>守り方</strong>を教えるのを忘れていた。私の失敗だ。いつか孫に会うことがあれば――それを、二人で学びなさい』」"}, {"t": "br"}, {"t": "p", "v": "　月が、雲を抜けた。"}, {"t": "p", "v": "　直人は、玉垣の内側から、手を差し出した。"}, {"t": "p", "v": "「黒田さん。二人で学べ、だそうです。……越えてください。<strong>うちの調査団の、文献担当が空いてる</strong>」"}, {"t": "p", "v": "　黒田は、しばらく動かなかった。<br>　それから、ノートを――清一郎の三十年を、まず先に、玉垣越しに直人へ手渡した。両手で。返納の作法だった。"}, {"t": "p", "v": "「……鷹峰との契約は、夜が明けたら破棄する。違約金で家が飛ぶが、まあ、一人暮らしだ」"}, {"t": "p", "v": "「その前に、稼ぎましょう。違約金くらい」早川が言った。「中に、四百年もののお宝があるらしいんで」"}, {"t": "p", "v": "「君は軽いな」"}, {"t": "p", "v": "「基本っす」"}, {"t": "p", "v": "　黒田が、玉垣を越えた。<br>　二十年、境界の外に立っていた男が、一歩で内側に入った。"}, {"t": "p", "v": "　四人になった。<br>　直人は先頭に立ち、百五十年前の階段に、あらためて足を掛けた。"}, {"t": "p", "v": "「行きましょう。――じいちゃんの見つけた場所だ」"}, {"t": "p", "v": "　石段は、二十段ほどで尽きた。<br>　早川のライトが、闇の底で、何かの列に反射した。"}, {"t": "p", "v": "　白木の箱。漆の箱。油紙の包み。<br>　整然と、棚に、<strong>並んでいた</strong>。"}, {"t": "p", "v": "　誰かが、つい最近まで手入れをしていたとしか思えない姿で。"}, {"t": "p", "v": "　そして棚の最奥、一段高い台の上に――違い葵の紋を打った、黒漆の文箱が一つ、月のない闇の中で待っていた。"}], "chars": 2275}, {"title": "第十六話　星霜蔵", "paras": [{"t": "p", "v": "地下は、思ったより広かった。"}, {"t": "p", "v": "　石積みの室が三つ、短い廊下で繋がっている。奥へ行くほど、床が一段ずつ低い。棚は桐と樟。床は漆喰。壁際に、素焼きの瓶が等間隔に並んでいた。"}, {"t": "p", "v": "「……誰かが、手入れしてる？」早川がライトを回した。「埃が、ないっすよ」"}, {"t": "p", "v": "「いや」直人は、壁と棚と瓶を、順に指で確かめた。「人じゃない。<strong>蔵が、自分で保存してる</strong>んだ」"}, {"t": "p", "v": "「蔵が？」"}, {"t": "p", "v": "「桐の棚は湿気を吸って吐く。樟は虫を寄せない。漆喰は湿度を均す。瓶の中は――石灰だ。湿気取りの。天井の隅に通気の道が切ってあって、外の杉林が温度を均している。……<strong>人が来なくても呼吸し続ける設計</strong>だ。明治の職人たちは、百五十年後まで計算して、この部屋を作ってる」"}, {"t": "p", "v": "　棚の上に、それらは静かに並んでいた。"}, {"t": "p", "v": "　油紙の包みを、一つだけ、黒田と二人で検めた。<br>　南蛮渡来の望遠鏡。真鍮の胴に、繊細な蔓草の彫り。レンズは曇りひとつない。<br>　隣の桐箱の中には、布に包まれた茶碗。覗き込んだ黒田の呼吸が、止まった。"}, {"t": "p", "v": "「……曜変だ。星が、入ってる」"}, {"t": "p", "v": "　碗の内側に、宇宙があった。藍の地に、虹の暈をまとった星紋が散っている。世界に三つしかないはずの曜変天目の、四つ目が、そこにあった。"}, {"t": "p", "v": "「触るな、とは言わん」直人は黒田に白手袋を渡した。「だが、拝むだけにしよう。ここの物は、一つも、まだ俺たちの物じゃない」"}, {"t": "p", "v": "　そして、最奥の台。<br>　違い葵の黒漆の文箱。"}, {"t": "p", "v": "　直人は蓋に手を掛けて、止めた。台の縁に、彫りがある。"}, {"t": "p", "v": "『宝ヲ独リ持チ出ス者ハ、水ニ問ヘ』"}, {"t": "p", "v": "「水に、問え……」"}, {"t": "p", "v": "　台の下を覗いた。台座は床に固定されておらず、<strong>天秤の構造</strong>で浮いている。台から箱を上げれば、天秤が傾く。傾いた先には、木の栓。栓の向こうから、微かに――水の音がした。"}, {"t": "p", "v": "「重量式の引き金だ。箱を上げると、栓が抜けて、どこかから水が来る」"}, {"t": "p", "v": "「罠っすか！？」"}, {"t": "p", "v": "「罠というより――<strong>試験だ</strong>。見ろ、栓は二つある。もう一つは、階段の上、入り口の脇だ。二つの栓を同時に押さえれば、水は来ない。つまり」"}, {"t": "p", "v": "「一人じゃ、持ち出せない」真琴が言った。「<strong>独りで持ち出す者は、水に問われる。二人なら、問われない</strong>」"}, {"t": "p", "v": "「最後の最後まで、資質の試験だ。この蔵を作った連中は――宝より、持ち出す人間の方を検品してる」"}, {"t": "p", "v": "　その時、階段の上から、複数の足音が降ってきた。"}, {"t": "br"}, {"t": "p", "v": "「――素晴らしい。<strong>実在しましたか</strong>」"}, {"t": "p", "v": "　鷹峰だった。氷室と、作業服の男が二人。夜明けを待たず、来た。"}, {"t": "p", "v": "「役人の同行はどうした」黒田が言った。「合法の顔で入るんじゃなかったのか」"}, {"t": "p", "v": "「黒田先生。契約者が現場にいるとは、驚きました」鷹峰は棚の列を、目で値付けしながら歩いてくる。「合法は、朝の便で参ります。<strong>その前に、目玉だけ検品を</strong>。競りは来週に繰り上げました。着工より、役人の口より、市場が先です」"}, {"t": "p", "v": "　鷹峰の視線が、最奥の文箱で止まった。"}, {"t": "p", "v": "「あれですね。……氷室さん」"}, {"t": "p", "v": "　氷室が動きかけ、直人が間に立った。"}, {"t": "p", "v": "「待て。台は天秤だ。箱を上げれば水が来る。栓を二人で――」"}, {"t": "p", "v": "「<strong>交渉は結構です</strong>」"}, {"t": "p", "v": "　鷹峰が初めて、画商の声を捨てた。<br>　作業服の二人が直人と黒田を押さえ、氷室が――一瞬だけ躊躇して――文箱に手を掛けた。"}, {"t": "p", "v": "「氷室さん！」"}, {"t": "p", "v": "　箱が、台を離れた。"}, {"t": "p", "v": "　天秤が鳴った。栓が抜ける、乾いた音。<br>　三つの石室の壁の下から、一斉に、水が走り込んできた。山の湧水路の栓が開いたのだ。上の沢と、この床の高低差の分だけ、水は素直に、低い方へ落ちてくる。"}, {"t": "p", "v": "「――出口へ！　棚の物には触るな！　この蔵は宝を守るために造られてる。水で棚を濡らす罠なんか組むはずがない――<strong>水は棚の下、人の背丈で止まる</strong>。そう賭けるぞ！」"}, {"t": "p", "v": "　水は膝まで、一気に来た。<br>　作業服の二人が我先に階段へ走る。鷹峰は――文箱を抱えた氷室に「寄越しなさい」と手を伸ばし、受け取り、一人で階段を目指した。"}, {"t": "p", "v": "　そして、滑った。"}, {"t": "p", "v": "　漆喰の床は、水を吸わない。濡れた漆喰は、氷のように滑る。<br>　鷹峰の腕から、黒漆の文箱が飛び、水面に落ちた。"}, {"t": "p", "v": "「――ッ！」"}, {"t": "p", "v": "　直人は、考えるより先に踏み出した。二歩目で、床が一段、消えた。<br>　一番奥の、一段低い石室――貯水槽のように掘り下げられ、もう水で満ちていた。足が底を離れ、水が顎に来て、そこで思い出した。<strong>俺は、泳げない</strong>。"}, {"t": "p", "v": "　沈みかけた直人の横を、水音が追い越した。<br>　真琴だった。躊躇のない、部活で仕込まれた型のクロール。彼女は流れていく黒漆の箱に追いつき、片腕で抱えて、立てる浅さまで戻ってきた。"}, {"t": "p", "v": "「学生時代、水泳部です……！　あなたは機構を！」"}, {"t": "p", "v": "　箱の蓋の合わせからは、もう水が入っていた。中の紙が濡れていく。家康の遺訓の原本が、水を吸っていく。"}, {"t": "p", "v": "「早川！　栓だ！　上の栓を全体重で押さえろ！　真琴さんは箱を――」"}, {"t": "p", "v": "　直人は壁伝いに台へ戻り、下の栓に取り付いた。水頭の差の分だけ、水は素直に高い方から低い方へ走り込んでくる。その素直な力のせいで、栓が押し戻せない。"}, {"t": "p", "v": "「黒田さん！　天秤に重りを！　箱と同じ重さを台に戻せば――」"}, {"t": "p", "v": "　黒田が、咄嗟に抱えていたものを台に載せた。<br>　ノート二冊と、自分のカバンと、上着と――足りない分は、自分の腕で台を押さえた。"}, {"t": "p", "v": "「先生との共同研究だ……！　<strong>こういう時の帳尻は、私が合わせる</strong>！」"}, {"t": "p", "v": "　天秤が戻り、上で早川が栓に体重を掛け、直人が下の栓を押し込んだ。<br>　水の走る音が、止まった。"}, {"t": "br"}, {"t": "p", "v": "　水は、脛の高さで引き始めた。床の隅の排水口へ、設計どおりに吸われていく。"}, {"t": "p", "v": "　その静けさの中で、荒い水音が一つだけ続いていた。<br>　階段の反対側、一番深い石室の縁で、氷室が水面を叩いていた。"}, {"t": "p", "v": "「……あんたもか。泳げない同士か、俺たち」"}, {"t": "p", "v": "　直人は棚の長板を一枚外し、早川と二人で端を押さえて、水面へ差し出した。<br>　氷室が板を掴む。二人がかりで、浅い方へ引き上げた。<br>　氷室は長いこと咳き込み、それから、壁に背を預けたまま、掠れた声で言った。"}, {"t": "p", "v": "「……仕事柄、海には、沈める側だったもので」"}, {"t": "p", "v": "「物騒な履歴書だな」"}, {"t": "p", "v": "「鷺宮さん。私の業界の作法を、一つだけ」氷室は咳の合間に、本当に可笑しそうに笑った。「<strong>依頼主より、命の貸し主が優先です</strong>。……以後、お見知り置きを」"}, {"t": "p", "v": "　階段の上から、複数の足音と、無線の声が降ってきた。<br>　鷹峰が凍りつく。直人は、濡れた懐から封書の控えを出した。"}, {"t": "p", "v": "「夜明けに、文化庁と県警が来る手筈だ。<strong>発見届の予告</strong>を、三日前に確定日付付きで出してある。……あんたの言う『合法の顔』と、どっちの顔が通るか、上で比べよう」"}, {"t": "p", "v": "　鷹峰は、水浸しのスーツのまま、それでも画商の姿勢を立て直した。"}, {"t": "p", "v": "「……私は美術品の仲介者です。ここへは、学術調査の視察に」"}, {"t": "p", "v": "「その台詞、録音されてますよ」早川が階段の上から言った。濡れたスマートフォンを振っている。「『市場が先です』のとこから、全部」"}, {"t": "br"}, {"t": "p", "v": "　夜が明けた。"}, {"t": "p", "v": "　杉の梢の間から、朝日が奥宮の玉垣に差した。<br>　県警と文化庁の職員が石段を上がってくるのを、直人は蔵の入り口に座って見ていた。膝の上には、水を吸った黒漆の文箱。"}, {"t": "p", "v": "「……中の紙、助かりますか」真琴が隣に座った。"}, {"t": "p", "v": "「濡れた和紙は、乾かし方を間違えなければ死なない。<strong>濡れたまま運んで、正しい台で乾かす</strong>。――うちの商売の、一番の得意分野だ」"}, {"t": "p", "v": "　直人は、蔵を振り返った。<br>　水の引いた石室で、棚の上の百五十年は、一つも損なわれずに並んでいた。設計どおりに。"}, {"t": "p", "v": "　見つける試験。開ける試験。守る試験。<br>　最後の水の問いに、俺たちは、五人で答えた。"}, {"t": "p", "v": "　――五人、だ。"}, {"t": "p", "v": "　直人は、台の上でずぶ濡れになったノート二冊と、それを絞っている黒田の背中を見て、静かに確信した。<br>　祖父の言った「二人で学べ」は、もう始まっている。"}], "chars": 3304}, {"title": "第十七話　清算", "paras": [{"t": "p", "v": "事情聴取は、三日続いた。"}, {"t": "p", "v": "　夜間の立ち入りは、事実として消えない。直人は全部、そのまま話した。何一つ隠さずに臨んだ取り調べは、思ったより淡々と進んだ。"}, {"t": "p", "v": "　潮目を変えたのは、紙だった。<br>　三日前に確定日付を取った、発見届の予告。封緘して供託した調査記録の全部。真琴が「手続きの人間」の意地で組み上げた、時刻の証拠の束。"}, {"t": "p", "v": "「……盗掘の計画者は、発見を届け出る予告状なんぞ書かん」"}, {"t": "p", "v": "　取調官は、書類を三度読み直して、そう言った。<br>　文化財の手続きの上では、発見はその朝のうちに届け出られ、現状変更は最小限で、出土品は一点残らず提出された。発見者として、二人の名前が記録に載った。<br>　刑法の上の建造物侵入は、それとは別に、きっちり問われた。問われた上で――届け出の意思の事前証明と、発見の公益と、東照宮側が処罰を望まなかったことが情状に乗り、起訴猶予に落ち着いた。紙が罪を消したのではない。<strong>罪は罪のまま、猶予された</strong>。"}, {"t": "p", "v": "「無罪じゃない。<strong>許された</strong>だけだ」と、直人は早川に言った。「忘れるなよ。うちの調査団は、前科一歩手前の集団だ」"}, {"t": "p", "v": "「肝に銘じるっす。……で、鷹峰の方は」"}, {"t": "p", "v": "　その前に、直人にはもう一件、自分で払う勘定があった。<br>　大宮の鉄道博物館だ。アポを取り、学芸員の前で頭を下げ、御料車の隠し引き出しの一部始終を話した。持ち出したレンズは鷹峰の押収品から博物館へ返還され、巻物の断片と石の欠片も、正式な台帳に載った。<br>　博物館は被害届を出さなかった。代わりに、御料車の隠し引き出しは「共同研究対象」になり、直人の名は出入り禁止名簿ではなく、外部研究員の名簿に載った。<br>「あの日、『言わなかった』のは、届けるまでの預かりのつもりでした。……つもりは、言い訳です」<br>「ええ」学芸員は苦笑した。「でも、修復士が修復点検で嘘をつかなかったのは、確かですから。……次からは、先に言ってください」"}, {"t": "p", "v": "　鷹峰は、逮捕された。<br>　容疑は建造物侵入ではない。九条真琴に対する逮捕監禁と、その教唆。文化財の不正な取引の準備。決め手は、早川の録音と――氷室の証言だった。"}, {"t": "p", "v": "　氷室は取調室で、依頼の経緯を洗いざらい述べたという。司法取引の制度はこの国では限られているが、彼は減刑のためというより、几帳面に<strong>帳簿を清算する</strong>ように喋ったらしい。"}, {"t": "p", "v": "　面会室のアクリル板越しに、氷室は直人に言った。"}, {"t": "p", "v": "「命の貸し借りは、利子が高いので。……ああ、それと。姫路でお預かりした筒は、押収品の中です。<strong>中身は開封していません</strong>。依頼は『回収』であって『検品』ではなかったので」"}, {"t": "p", "v": "「……あんた、本当に、変な職人だな」"}, {"t": "p", "v": "「職人と呼ばれたのは、初めてです」"}, {"t": "br"}, {"t": "p", "v": "　真琴の処分は、停職三ヶ月だった。"}, {"t": "p", "v": "　無断の調査協力。内偵報告の一方的な打ち切り。理由はいくらでも並んだ。彼女は弁明の席で一切争わず、ただ一つだけ、書面で申し立てた。<br>　――内偵報告の宛先三名のうち一名から、外部への情報漏洩の疑いがある。調査を求める。"}, {"t": "p", "v": "　その調査は、静かに、だが確実に進んだ。宮内庁のある課長級が依願退職し、鷹峰の会社の顧問名簿から、一つの名前が消えた。<br>　停職明けの真琴の異動先は、新設の部署だった。"}, {"t": "p", "v": "　「星霜蔵発見物 調査保存室」。<br>　国家プロジェクトの実務の中枢に、発見者の学芸員が座った。左遷の顔をした栄転、と早川は評した。"}, {"t": "br"}, {"t": "p", "v": "　濡れた文箱の中身は、直人の仕事場に運ばれた。"}, {"t": "p", "v": "　水を吸った和紙は、乾かし方を誤れば波打ち、貼り付き、墨ごと死ぬ。濡れたまま冷やして運び、一枚ずつ、吸取紙の間で気長に水を移していく。修復士が「水損」と呼ぶ、一番地味で、一番祈りに似た仕事だ。"}, {"t": "p", "v": "　十日目に、紙は生き返った。"}, {"t": "p", "v": "　家康の御遺訓の原本。流麗な右筆の字で、よく知られた文言が並ぶ。人の一生は重荷を負うて遠き道を行くがごとし――<br>　そして、末尾に、教科書のどの写本にもない一節があった。"}, {"t": "p", "v": "『宝ハ独リ占ムルコト勿レ。宝ハ、民ノ為ニ用ヒヨ。用ヒル日マデ、守リ手ヨ、静カニ守レ』"}, {"t": "p", "v": "　その紙に添えられていた一通の書状が、慶応四年の、あの筆跡だった。<br>　五ヶ所ニ分散完了、と書いた男の、最後の報告書。署名の位置には、確かに墨が置かれていたが――水と歳月で滲み、名は、もう読めなかった。"}, {"t": "p", "v": "「読めなくて、いいのかもしれません」真琴が言った。「この人は百五十年、名もなき人として守り切った。名前を暴くのは、私たちの仕事ではない気がします」"}, {"t": "p", "v": "「あぁ。……台帳には『星霜組頭領』とだけ載せよう。それが一番正確だ」"}, {"t": "br"}, {"t": "p", "v": "　公表の日、会見場には黒田もいた。"}, {"t": "p", "v": "　調査団の文献主任。真琴が推し、直人が連署し、審査会がひと悶着の末に認めた肩書きだ。二十年前に学界を追われた男の名が、国家プロジェクトの名簿に、正式に戻った。"}, {"t": "p", "v": "　会見で、記者の一人が意地の悪い質問をした。<br>　――黒田さんは以前、証拠不十分な発表で批判されましたが、今回の違いは。"}, {"t": "p", "v": "　黒田はマイクの前で、少しの間、黙った。"}, {"t": "p", "v": "「……二十年前の私は、見つけることが研究の終わりだと思っていました。今回学んだのは、<strong>見つけることは、守る仕事の始まりだ</strong>ということです。教えてくれたのは、亡くなった共同研究者と――その孫です」"}, {"t": "p", "v": "　会見場の照明の下で、直人は、隣の席の真琴が小さく頷くのを見た。"}, {"t": "p", "v": "　鷺宮清一郎の名は、発見者の筆頭に置かれた。<br>　三十年、狂人と呼ばれた男の名前が、その日、全国の紙面で「先駆的研究者」に書き換わった。"}, {"t": "p", "v": "　夕方、直人は一人で、練馬の墓地に行った。<br>　墓石に、会見資料を一部、供えた。"}, {"t": "p", "v": "「――じいちゃん。名誉回復、完了だ」"}, {"t": "p", "v": "　それだけ言って、長いこと、しゃがんでいた。<br>　風が、供えた紙の端を、頁をめくるように揺らしていった。"}], "chars": 2435}, {"title": "第十八話　継ぐ者", "paras": [{"t": "p", "v": "半年後の日光は、若葉だった。"}, {"t": "p", "v": "　奥宮の周辺は、結局、予定どおり大修理の幕が掛かった。ただし工事の名目は一つ増えた。「星霜蔵の恒久保存整備」。四年後、蔵は覆屋と展示室を備えて、一般に公開される。"}, {"t": "p", "v": "　直人は月の半分を日光で過ごしている。肩書きは「発見物修復総括」。国家プロジェクトの中で、いちばん手が油と糊で汚れる役職だ。"}, {"t": "p", "v": "　蔵の中の百五十年は、一点ずつ、目録に載っていく。<br>　南蛮渡来の望遠鏡は、光学系が完全に生きていた。四百年前のレンズ越しに月を見た夜、調査室の全員が子供みたいに列を作った。<br>　曜変天目は、国宝指定の答申が出た。「第四の曜変」の初公開日には、徹夜の行列ができるだろうと言われている。"}, {"t": "p", "v": "　正宗の太刀。運慶の小像。勅令の原本は京都の箱と合わせて、書陵部が正式に収蔵した。<br>　どの一点にも、値札は付かない。鷹峰が付けようとした値札の桁を、時々思い出しては、全員で笑い話にしている。当の鷹峰は、公判中だ。"}, {"t": "br"}, {"t": "p", "v": "「――で、六番目の話なんすけど」"}, {"t": "p", "v": "　調査室のプレハブで、早川が大判のモニターに図を映した。<br>　彼の名刺は今、「星霜蔵調査団・デジタルアーカイブ主任」だ。個人事業主として契約し、蔵の全点を三次元記録に落としている。「歴史はバックアップが基本っすから」が、契約時の一言だった。"}, {"t": "p", "v": "　モニターには、五枚分の図像が並んでいた。<br>　鎌倉の原物――鷹峰の押収品から戻った。京都の原物――書陵部の金庫にあり、画像は正規調査の三次元計測。厳島――先月の大潮に、今度は正規の調査として紋の奥から回収された原物。姫路――氷室の「未開封」の筒から出た原物。そして日光――宝塔の台座は動かせないから、型取りの精密複製。<br>　原物三枚、金庫保管品の計測データ一枚、複製一枚。台帳の上で、五枚が初めて揃った。"}, {"t": "p", "v": "「五枚の表を重ねると、日光の蔵の位置図。これは答え合わせ済み。……で、こっからが本題。<strong>裏面</strong>っす」"}, {"t": "p", "v": "　五枚の裏には、それぞれ、無意味に見える短い線が数本ずつ刻まれている。<br>　重ねると――線は繋がり、一つの図形になった。"}, {"t": "p", "v": "　富士を望む、入り江と、城。<br>　城の位置に、小さな印。星の形に、七つの点。"}, {"t": "p", "v": "「……駿府だ」黒田が眼鏡を上げた。「あの、五本の線が交わる地図。<strong>後から誰かが引いた線</strong>は、これを知ってた誰かが引いたんだ」"}, {"t": "p", "v": "「六番目の蔵、っすかね」"}, {"t": "p", "v": "「蔵かどうかは分からん」黒田は、しかし、もう笑っていた。「分からんが――<strong>目録がある気がするな</strong>。五つの蔵の、全体の目録。あるいは、組そのものの記録。連中は帳簿の民だ。帳簿を残さず消える連中じゃない」"}, {"t": "p", "v": "　直人は、モニターの星印を見た。<br>　急ぐ旅ではない。蔵は見つかり、宝は守られ、競りは潰れた。三つの砂時計は、全部、静かに横に倒してある。"}, {"t": "p", "v": "「――行くなら、届け出てからだ」と、直人は言った。「うちの調査団は、前科一歩手前なんでね」"}, {"t": "p", "v": "「善処するっす」"}, {"t": "br"}, {"t": "p", "v": "　六月の休みの日、直人は鎌倉にいた。"}, {"t": "p", "v": "　仕事ではない。隣に真琴がいて、二人とも私服で、拝観料を払って、観光客として大仏の前にいた。"}, {"t": "p", "v": "「胎内、入っていきますか」真琴が言った。"}, {"t": "p", "v": "「今日はいい。……外から見る大仏は、久しぶりだ」"}, {"t": "p", "v": "　露坐の大仏は、若葉の風の中で、七百五十年目の昼寝をしていた。<br>　あの背中の窓の金具のことも、十四弁の紋のことも、今は調査団と文化庁だけが知っている。公表は、保存措置が終わってからだ。それまで大仏は、何百万人の前で、素知らぬ顔で秘密を抱き続ける。"}, {"t": "p", "v": "「……不思議です」真琴が言った。「私、規則の中にいるのが仕事だと思っていました。今も規則の中にいます。なのに、見える景色が全然違う」"}, {"t": "p", "v": "「規則の中に、隙間の作り方を覚えたからだろう」"}, {"t": "p", "v": "「人聞きの悪い」真琴は笑って、それから、少しだけ声を落とした。「――お祖父様に、お会いしたかったです。一度でいいから、修復の話を伺ってみたかった」"}, {"t": "p", "v": "「会ってるよ」"}, {"t": "p", "v": "「え？」"}, {"t": "p", "v": "「祖父の三十年に、あんたはこの半年、毎日会ってる。ノートの中で、蔵の中で、書類の中で。……祖父はああいう男だから、たぶん、書類の綴じ方が丁寧な人間を一番信用する」"}, {"t": "p", "v": "　真琴は、目元を少し赤くして、大仏の方を向いた。"}, {"t": "p", "v": "「……綴じ方には、自信があります」"}, {"t": "p", "v": "「知ってる」"}, {"t": "p", "v": "　参道の店で鳩サブレーを買い、江ノ電に乗り、海を見た。<br>　事件の話は、もうしなかった。しなくても間が持つことを、二人とも、その日初めて知った。"}, {"t": "br"}, {"t": "p", "v": "　夏の初めに、直人は一度、練馬の墓に寄った。"}, {"t": "p", "v": "　墓前に、小さな包みを置く。中身は、鍵の形に切った和紙だ。調査団の若手に折り方を教えたら、いつの間にか団の縁起物になった、蔵の鍵の紙細工。"}, {"t": "p", "v": "「――じいちゃん。報告が三つ」"}, {"t": "p", "v": "　しゃがんで、指を折る。"}, {"t": "p", "v": "「一つ。蔵は、国の台帳に載った。守り手の仕事は、これからは大勢でやる。<br>　二つ。黒田さんは、元気だ。あんたの筆跡の癖について、俺と三時間喧嘩できる程度には。<br>　三つ。……六番目が、あるらしい。駿府だ。いつか、届け出てから、見に行く」"}, {"t": "p", "v": "　風が、杉の上を渡っていった。"}, {"t": "p", "v": "　帰り際、直人は墓石に彫られた家名の字を、指の腹でなぞった。<br>　長年の風雨で、彫りは浅くなっている。それでも、指にははっきりと分かる。"}, {"t": "p", "v": "　刻印は、薄れている。<br>　だが――消えていない。"}, {"t": "p", "v": "　継ぐ者がいる限り、たぶん、ずっと。"}, {"t": "p", "v": "（完）"}], "chars": 2234}]}, {"id": "hoshiso2", "title": "星霜の蔵II 海賊の遺言", "sub": "村上海賊 × しまなみ海道、五百年の因縁", "genre": "海洋冒険ミステリー", "accent": "#c08a5a", "eps": [{"title": "第一話　海賊の末裔", "paras": [{"t": "p", "v": "尾道の坂道は、足腰に容赦がない。"}, {"t": "p", "v": "　鷺宮直人は石段を登りながら、額の汗を拭った。十月の瀬戸内は、東京より日差しが濃い。駅から山手へ向かう路地は、猫と寺と古い家が入り混じる迷路だった。"}, {"t": "p", "v": "　依頼が来たのは一週間前だ。尾道の古美術商から、戦国期の巻物の修復を頼みたい、と。"}, {"t": "p", "v": "　星霜蔵の発見から、一年半。直人の名前は、修復の業界ではすっかり知られてしまった。テレビにも数回出た。出たくなかったが、国家プロジェクトの広報は断れなかった。おかげで、まともな依頼が増え――まともでない依頼も増えた。「うちの蔵にも埋蔵金が」の類いが月に三件。全部、丁重に断っている。"}, {"t": "p", "v": "　今回は、まともな方のはずだった。"}, {"t": "p", "v": "　坂の中腹に、その店はあった。<br>　「村上堂」。古い町家の格子戸の奥に、薄暗い店内。壺、掛け軸、仏像、茶器。雑多に見えて、直人の目には分かる。品の質が、揃って高い。目利きの店だ。"}, {"t": "p", "v": "「すみません。鷺宮です。修復のご依頼の――」"}, {"t": "p", "v": "　店の奥から、女が出てきた。"}, {"t": "p", "v": "　長い黒髪。切れ長の目。藍染めの作務衣。年は直人より少し下か。整った顔立ちだが、美しいという印象より先に、<strong>鋭い</strong>、と思った。研いだ刃物を鞘ごと歩かせているような人だった。"}, {"t": "p", "v": "「鷺宮直人さん。お待ちしていました。村上凛です」"}, {"t": "p", "v": "　低い、落ち着いた声。だがその奥に、張り詰めたものがある。<br>　紙の裏に隠し文字がある時と、同じ気配だった。表面の下に、もう一層ある。"}, {"t": "br"}, {"t": "p", "v": "　奥の小間で、桐箱から巻物が出てきた。凛は白手袋で扱った。古美術の人間の手つきだ。"}, {"t": "p", "v": "　直人も手袋を嵌め、受け取る。<br>　厚手の楮紙、手漉き。戦国後期から江戸初期。墨書きは航路の記述だった。潮の流れ、島の名、水深、風待ちの港。図ではなく、文章で書かれた海図。"}, {"t": "p", "v": "「修復をお願いしたいのは、巻末です」"}, {"t": "p", "v": "　末尾の数十センチに、虫損と古い水染み。繊維の弱りはあるが、直せる範囲だ。"}, {"t": "p", "v": "「修復は可能です。……それで」"}, {"t": "p", "v": "　直人は、巻物を窓の光に向けた。癖でやった。<br>　透かした瞬間、見えた。"}, {"t": "p", "v": "　裏面に、もう一層の文字。表とは別の筆で、裏から書かれた薄墨。"}, {"t": "p", "v": "「――裏に、文字がある」"}, {"t": "p", "v": "　凛の硬い表情が、一瞬だけ緩んだ。安堵に似ていた。"}, {"t": "p", "v": "「やはり、見えるんですね。……星霜蔵の方なら、と思っていました」"}, {"t": "p", "v": "「あなたは知っていた。修復は口実で、本当の依頼は、裏の解読だ」"}, {"t": "p", "v": "「はい」"}, {"t": "p", "v": "　凛は隠さなかった。手袋を外し、まっすぐに直人を見た。"}, {"t": "p", "v": "「私は、村上武吉の末裔です。<strong>能島村上家</strong>。戦国の瀬戸内を仕切った、三島村上の宗家筋です」"}, {"t": "p", "v": "「三島村上……能島、因島、来島の」"}, {"t": "p", "v": "「ご存じでしたか」"}, {"t": "p", "v": "「前の事件で、幕末の海運の記録を嫌というほど読んだ。……村上水軍は、海賊というより、海の関所だったそうだな」"}, {"t": "p", "v": "「ええ。通行料と、水先案内と、海の秩序。それが家業でした。終わらせたのは、秀吉の<strong>海賊停止令</strong>です。天正十六年。あの法度で、一族は海を奪われた」"}, {"t": "p", "v": "　凛は、巻物の巻末の水染みに、そっと指を浮かせた。"}, {"t": "p", "v": "「言い伝えでは、武吉公は海を奪われるその前に、一族の財貨と、<strong>海賊として最も大切なもの</strong>を、瀬戸内のどこかに納めたといいます。一族はそれを『<strong>海の蔵</strong>』と呼びました。……そして、『航路の裏に道がある』と」"}, {"t": "p", "v": "「航海図の裏に、蔵への道」"}, {"t": "p", "v": "「読めないんです、私には。透かしても、表の墨が邪魔をする。設備と、技術が要る。だから、あなたを呼びました。実績と……<strong>宝を独り占めしなかった実績</strong>のある人を」"}, {"t": "br"}, {"t": "p", "v": "「機材が要る。赤外線と、多バンドの撮影。東京へ持ち帰って――」"}, {"t": "p", "v": "「巻物は、店から出せません」"}, {"t": "p", "v": "　凛は即答した。刃物の速さだった。"}, {"t": "p", "v": "「村上家の家宝です。この家から出したことは、一度もありません。……出した瞬間に、奪われる予感もあります」"}, {"t": "p", "v": "「予感？」"}, {"t": "p", "v": "「去年から、店に不審な客が続いています。巻物を見たい、売ってほしい、と。全部断りました。先月からは――<strong>車が張り付くようになりました</strong>」"}, {"t": "p", "v": "「……分かった。なら、機材の方をここへ運ぶ。仲間を呼ぶ。二日ください」"}, {"t": "p", "v": "　凛が、初めて笑った。鋭い顔が、年相応に見える笑い方だった。"}, {"t": "p", "v": "「話が早い方で、助かります」"}, {"t": "br"}, {"t": "p", "v": "　村上堂を出たのは午後三時だった。<br>　石段を三段下りて、直人は足を止めた。"}, {"t": "p", "v": "　下の路地に、黒いワゴンが停まっている。エンジンは掛けっぱなし。愛媛ナンバー。中に人影が二つ。<br>　しまなみ海道で繋がった土地柄、愛媛ナンバーは珍しくない。だが、あの車内の視線の張り方は、観光ではない。"}, {"t": "p", "v": "　一年半前の記憶が、背筋を冷たく駆け上がった。"}, {"t": "p", "v": "「凛さん。あの車は」"}, {"t": "p", "v": "　見送りに出ていた凛の目が、細くなった。"}, {"t": "p", "v": "「……<strong>来島</strong>」"}, {"t": "p", "v": "「くるしま？」"}, {"t": "p", "v": "「来島暁。来島村上家の末裔。三島村上の、もう一つの家です。……うちとは、五百年前に道が分かれた。来島家は天正の内に秀吉方へ付いて、海賊停止令の後も家を残した。<strong>能島は海と共に沈み、来島は陸に上がって生き延びた</strong>。――今は海運会社の社長です。表向きは」"}, {"t": "p", "v": "「裏向きは」"}, {"t": "p", "v": "「文化財の、闇の仲買。……海の蔵を、嗅ぎつけたんだと思います」"}, {"t": "p", "v": "　ワゴンのドアが開いた。降りてきた男は体格が良く、歩き方が軍隊だった。"}, {"t": "p", "v": "「走るぞ」"}, {"t": "p", "v": "「え――」"}, {"t": "p", "v": "「走れ。考えるのは後だ」"}, {"t": "p", "v": "　直人は凛の手首を掴んで、路地へ逸れた。三歩目から、逆に引かれた。凛の方が、この迷路を知っている。"}, {"t": "p", "v": "　寺の山門、墓地、洗濯物の下、驚いて跳ぶ猫。導かれるまま石段を駆け下りると、商店街のアーケードの人混みに出た。"}, {"t": "p", "v": "「……撒きました」凛の息は、直人より整っていた。「今のは鬼頭。来島の部下です。元自衛官」"}, {"t": "p", "v": "「手慣れてるな、逃げ方が」"}, {"t": "p", "v": "「海賊の末裔なので」凛は真顔で言った。「逃げ足は、家伝です」"}, {"t": "br"}, {"t": "p", "v": "　その晩、尾道駅前の宿から、直人は早川に電話をした。"}, {"t": "p", "v": "「鷺宮さん！　久しぶりっす。どうしたんすか」"}, {"t": "p", "v": "「尾道だ。……早川、また面倒なことになった」"}, {"t": "p", "v": "「マジすか。――また埋蔵金すか」"}, {"t": "p", "v": "「あぁ。今度は、海賊のだ」"}, {"t": "p", "v": "　電話の向こうで息を呑む音がして、それから、笑い声がした。"}, {"t": "p", "v": "「……機材、何持ってけばいいすか。赤外線と、UVと、多バンドと――あ、防水ケースも要るっすよね、海だし」"}, {"t": "p", "v": "「話が早くて助かる」"}, {"t": "p", "v": "「基本っすから。――真琴さんには」"}, {"t": "p", "v": "「明日、俺から連絡する。書陵部に、村上水軍の文書があるかどうかも聞きたい」"}, {"t": "p", "v": "　電話を切って、直人は宿の窓から尾道水道を見下ろした。<br>　夜の海峡を、貨物船の灯りがゆっくり滑っていく。千年、船が行き交ってきた水の道だ。その水の下のどこかに、四百年前の海賊が残した「蔵」がある。"}, {"t": "p", "v": "　窓に近づいた時、直人は気づいた。"}, {"t": "p", "v": "　駅前の通りに、黒いワゴンが停まっている。夕方のと同じ車。<br>　そして、その二十メートル後ろに、もう一台。"}, {"t": "p", "v": "　黒のセダン。ナンバーは――<strong>品川</strong>。<br>　役所の公用車のように、艶やかに磨き込まれていた。"}, {"t": "p", "v": "　海賊の末裔と、闇の仲買と、正体の分からない黒塗り。<br>　巻物一本に、船が三隻、集まり始めていた。"}], "chars": 2954}, {"title": "第二話　因島の城", "paras": [{"t": "p", "v": "瀬戸内の朝は、光の質が違う。<br>　東京の朝が灰色がかった白なら、ここの朝は橙と青の混ざった透明で、海面は金の鱗を撒いたように光る。"}, {"t": "p", "v": "　凛の船は、十二メートルの漁船を改めたクルーザーだった。船名「潮風」。白い船体に青の一本線。操舵室には新しいGPSと魚探とレーダー。"}, {"t": "p", "v": "「古美術商が、なぜこんな船を」"}, {"t": "p", "v": "「瀬戸内の古美術商は、島を回って品を集めます。船は商売道具です」"}, {"t": "p", "v": "　嘘ではないのだろう。だが、それだけでもない。舵を握る手つきと、波頭を読む目の動きは、商売で船に乗る人間のものではなかった。海で育った人間の、体の動きだ。"}, {"t": "p", "v": "　デッキの手すりでは、昨夜、機材ケース三つと共に尾道入りした早川が、朝の海に向かって呻いていた。"}, {"t": "p", "v": "「うぅ……揺れる……」"}, {"t": "p", "v": "「日本で一番穏やかな海です。これで酔うのは、才能です」"}, {"t": "p", "v": "「才能をそっちで使いたくなかったっす……」"}, {"t": "p", "v": "「下を見るから酔う。前を見て、水を飲め」"}, {"t": "p", "v": "　真琴は東京だ。書陵部の蔵書から、村上水軍と海賊停止令前後の文書を洗ってくれている。今回の陸上支援は、最初から役割が決まっていた。"}, {"t": "br"}, {"t": "p", "v": "　因島が近づいた。しまなみ海道の中ほど、村上水軍の拠点の一つ。<br>　島の北の丘に、天守の形をした白い建物が見える。因島水軍城。昭和五十八年築の資料館だが、中身は本物だ。水軍の旗、火薬壺、そして――甲冑。"}, {"t": "p", "v": "「武吉公の甲冑の、江戸期の精巧な写しが展示されています。本物は散逸しました。……一族の口伝に、こうあります。『<strong>鎧ノ足元ニ潮ノ道アリ</strong>』」"}, {"t": "p", "v": "「潮の道。……巻物の裏には」"}, {"t": "p", "v": "　昨夜、村上堂の奥の間で、早川の機材が巻物の裏面を初めて全文可視化した。赤外線の画像の中に、薄墨の文字が並んでいた。"}, {"t": "p", "v": "『海ノ蔵ヘノ道、五ツノ<strong>潮印</strong>ニ託ス。一ノ印、島ノ城ノ鎧ノ下。<strong>潮ヲ注ゲバ道開ク</strong>』"}, {"t": "p", "v": "「潮印。五つの、印」"}, {"t": "p", "v": "「潮を注げば、道が開く。……<strong>海水で開く錠</strong>、ということでしょうか」凛が言った。「海賊らしい、と思いました。真水しか使わない人間には、開けられない」"}, {"t": "br"}, {"t": "p", "v": "　資料館は空いていた。受付の管理人は、日に焼けた顔の快活な老人だった。"}, {"t": "p", "v": "「ようこそなあ。今日はよう晴れとるけえ、天守からの眺めがええよ」"}, {"t": "p", "v": "　展示室の奥に、甲冑はあった。黒糸威の胴丸。江戸の写しとはいえ、仕事は丁寧だ。ガラスケースの中で、木の台座に据えられている。"}, {"t": "p", "v": "　直人は、修復士の名刺と、星霜蔵の調査団の身分証を出した。効き目は、一年半前とは比べものにならなかった。"}, {"t": "p", "v": "「ほう、あの星霜蔵の！　テレビで見たがな。甲冑の台座の傷み具合を？　ええよええよ、ちょうど点検の時期じゃけえ」"}, {"t": "p", "v": "　ケースが開いた。<br>　直人は台座に触れた。欅の厚板。四百年は経っていない。江戸後期。だが台座の縁に、細い溝が一周、彫られている。装飾にしては深く、水路にしては細い。"}, {"t": "p", "v": "　溝の一箇所に、小さな窪みがあった。盃を受けるような形。"}, {"t": "p", "v": "「潮ノ道――この溝だ。ここに、海水を注ぐ」"}, {"t": "p", "v": "　凛が、外の売店で買った空の水筒を掲げた。"}, {"t": "p", "v": "「汲んできます。<strong>下の浜の潮</strong>を」"}, {"t": "p", "v": "　十五分後。窪みに注がれた海水が、溝を伝って台座を一周した。<br>　最初は、何も起きなかった。一分。二分。"}, {"t": "p", "v": "　みし、と木の鳴る音がした。"}, {"t": "p", "v": "「――木が、水を吸って膨らんでる」直人は台座の縁に耳を寄せた。「乾いた状態では噛み合っていた継ぎ手が、膨張で押されて、外れていく。……<strong>塩分濃度に応じて継ぎ手が外れるよう設計してある</strong>。真水だと、膨らみ足りない」"}, {"t": "p", "v": "　底板の一枚が、指の半分だけ、浮いた。"}, {"t": "p", "v": "　浮いた板の下に、油紙の包み。<br>　中から出てきたのは、真鍮の円盤だった。直径五センチ。表に、細かい線刻――海岸線の断片。裏に、二行。"}, {"t": "p", "v": "『一ノ潮』<br>『次ハ、大山祇』"}, {"t": "p", "v": "「……あった」凛の声が、掠れた。「四百年、誰も確かめなかった口伝が――本当に、あった」"}, {"t": "p", "v": "「一ノ潮。次は大山祇神社。……五つの潮印を辿らせる作りだ」"}, {"t": "p", "v": "　管理人の老人が、ケースの外から首を伸ばした。"}, {"t": "p", "v": "「なんぞ、ええもん出たかな」"}, {"t": "p", "v": "「ええ、とても」直人は円盤を写真に収めながら、慎重に言葉を選んだ。「文化財級の発見です。届け出は正式にやります。それまで、他言無用で願えますか」"}, {"t": "p", "v": "「よう分からんが、あんたは星霜蔵の人じゃけえ、信用するわ。……ああ、そうじゃ。あんたらもかね」"}, {"t": "p", "v": "「も？」"}, {"t": "p", "v": "「昨日も来たんよ、東京の人。役所の名刺くれてなあ。<strong>甲冑の写真を、ようけ撮っていきよった</strong>」"}, {"t": "p", "v": "　管理人が見せてくれた名刺には、こうあった。"}, {"t": "p", "v": "『内閣官房　文化財特別対策室　室長　朝倉剛』"}, {"t": "br"}, {"t": "p", "v": "　桟橋に戻る坂の途中で、凛が足を止めた。"}, {"t": "p", "v": "「……港に、船が増えてます。あの黒いの。<strong>海鷹</strong>――来島の会社の船です」"}, {"t": "p", "v": "　黒い高速艇が、潮風の泊まる桟橋の沖に、錨も打たずに漂っていた。"}, {"t": "p", "v": "「回り込まれる前に出ます。走って」"}, {"t": "p", "v": "　潮風は、ロープを解くのと同時に桟橋を離れた。黒い船が、滑るように追ってくる。馬力は向こうが上だ。"}, {"t": "p", "v": "「凛さん、勝てるのか、あれに」"}, {"t": "p", "v": "「速さでは勝てません。<strong>海で勝ちます</strong>」"}, {"t": "p", "v": "　凛は舵を切り、島の東の瀬戸へ船を入れた。狭い水道。養殖筏と浮標の列。その間を、潮風は最小の舵で縫っていく。"}, {"t": "p", "v": "「この瀬戸、干潮の今は、右半分の水深が一メートルありません。海図には出ない砂州が動くので。……<strong>うちの一族が、五百年見てきた砂</strong>です」"}, {"t": "p", "v": "　黒い船は水道の入り口で速度を落とし、浮標の列の前で、止まった。喫水の深い高速艇は、入れない。<br>　みるみる離れていく黒い船影に向かって、早川が――船酔いも忘れて――手を振った。"}, {"t": "p", "v": "「ざまあみろっす！　……うぷ。調子乗ったら酔い戻った……」"}, {"t": "br"}, {"t": "p", "v": "　夕方、村上堂の奥の間で、凛は不思議な作業を始めた。"}, {"t": "p", "v": "　小箱に石膏を溶き、潮印を油で拭って押し当て、型を取る。乾いた型に、真鍮の粉と漆を練った物を詰めていく。"}, {"t": "p", "v": "「……複製？」"}, {"t": "p", "v": "「<strong>写し</strong>です。家伝の技で。うちは古美術商ですから、売り物の艶写しは商売のうち――というのは表向き。海賊の口伝には、こうあります」"}, {"t": "p", "v": "　凛は、型から抜いた写しを光にかざした。傷の一本まで、本物と見分けがつかない。"}, {"t": "p", "v": "「『<strong>取ラルル前提デ動ケ。本物ハ隠シ、写シヲ持テ</strong>』。……海の上では、奪い合いになった時点で半分負けです。だから最初から、奪われる用を作っておく」"}, {"t": "p", "v": "「本物は」"}, {"t": "p", "v": "「店の金庫……は、来島に一番先に探されます。<strong>船に</strong>。潮風の機関室の、船底の工具箱の下。海賊の家宝は、海の上が一番安全です」"}, {"t": "p", "v": "　直人は、写しと本物を並べて見比べ、正直に言った。"}, {"t": "p", "v": "「……あんたの一族、敵に回したくないな」"}, {"t": "p", "v": "「ええ」凛は初めて、悪戯っぽく笑った。「五百年、皆にそう言われてきました」"}], "chars": 2855}, {"title": "第三話　三つ巴", "paras": [{"t": "p", "v": "大三島は、神の島と呼ばれる。<br>　大山祇神社。全国の山祇社・三島社の総本社。武人たちが千年、武具を奉納し続けた社で、国宝の甲冑の四割がこの島にあるという。"}, {"t": "p", "v": "「二の潮印は、ここです」凛が桟橋でもやいを結びながら言った。「一族の口伝では、『<strong>神ノ島ノ宝ハ鎧</strong>』。武吉公も、ここへ鎧を奉納しています」"}, {"t": "p", "v": "「鎧、か……」"}, {"t": "p", "v": "　直人は、巻物の裏面の写しを開いた。早川が可視化した薄墨の第二指示。"}, {"t": "p", "v": "『二ノ印、神ノ島ノ<strong>石ノ塔</strong>ノ足元。潮ヲ捧ゲヨ』"}, {"t": "p", "v": "「口伝は『鎧』。巻物は『石の塔』。……食い違ってる」"}, {"t": "p", "v": "「どちらかが、囮ということですか」"}, {"t": "p", "v": "「囮というより――口伝は、わざと有名な方を指してる気がする。<strong>宝物館の国宝甲冑は、目立ちすぎる</strong>。監視の目も、参拝客の目もある。四百年の隠し場所には向かない。石塔は逆だ。誰も見ない」"}, {"t": "br"}, {"t": "p", "v": "　境内は、樹齢二千六百年と伝わる大楠の匂いがした。<br>　宝物館の前に、見覚えのある一団がいた。スーツが二人、作業服が三人。作業服の手には、甲冑の展示目録。"}, {"t": "p", "v": "　スーツの先頭の男が、直人たちに気づいて、まっすぐ歩いてきた。<br>　五十絡み。銀縁の眼鏡。折り目のついた物腰。"}, {"t": "p", "v": "「――鷺宮直人さんですね。星霜蔵の。お噂はかねがね」"}, {"t": "p", "v": "　差し出された名刺には、見覚えのある部署名があった。"}, {"t": "p", "v": "『内閣官房　文化財特別対策室　室長　朝倉剛』"}, {"t": "p", "v": "「因島の資料館にも、いらしたそうですね」直人は名刺を受け取って言った。"}, {"t": "p", "v": "「ええ。<strong>良い物</strong>をお持ちのようだ、あなた方は」朝倉は、値踏みでも威嚇でもない、行政の目でこちらを見た。「単刀直入に。村上水軍の埋蔵資産の調査でしたら、国の管理下で行うべきです。文化財は――<strong>国益です</strong>。適切に運用されるべき、外交上の資源でもある」"}, {"t": "p", "v": "「文化財は、資源ですか」"}, {"t": "p", "v": "「資源です」朝倉は言い切った。「守るためにも、力が要る。力には、原資が要る。……綺麗事だけでは、文化は守れませんよ、鷺宮さん」"}, {"t": "p", "v": "　嫌いになりきれない理路だった。鷹峰の「商品」よりは、ずっとましだ。<br>　ましだが――<strong>帳簿の言葉</strong>である点は、同じだった。"}, {"t": "p", "v": "「ご忠告、承ります。……ちなみに朝倉さん。甲冑を、お調べに？」"}, {"t": "p", "v": "「ええ。因島の記録から、こちらの奉納鎧に手掛かりがあると分析しましてね」"}, {"t": "p", "v": "「なるほど。……良い調査を」"}, {"t": "p", "v": "　直人は頭を下げて、すれ違った。<br>　口伝の囮は、四百年後の役人にも、きちんと効いていた。"}, {"t": "br"}, {"t": "p", "v": "　石の塔は、境内の外れにあった。"}, {"t": "p", "v": "　宝篋印塔。鎌倉様式の、苔むした石塔だ。観光客は誰も足を止めない。<br>　基壇の縁に、直人はしゃがんだ。"}, {"t": "p", "v": "　あった。基壇の一面に、浅い窪み。盃形。そして窪みの縁に、白い粉の輪が、幾重にも染みついている。"}, {"t": "p", "v": "「……塩だ。<strong>何百年分の、塩の輪</strong>。ここには繰り返し、海水が注がれてる」"}, {"t": "p", "v": "「潮ヲ捧ゲヨ、ですね」"}, {"t": "p", "v": "　凛が浜から汲んできた海水を、窪みに満たした。<br>　水は窪みから細い溝へ伝い、基壇を半周して、一枚の石の裏へ消えた。<br>　因島と同じだ。木ではなく石だが、待つ時間も同じ。潮が、乾いた継ぎ目の奥の何かを、ゆっくり目覚めさせていく。"}, {"t": "p", "v": "　こと、と小さく鳴って、基壇の石が一枚、指の幅だけ浮いた。"}, {"t": "p", "v": "　油紙。真鍮の円盤。二枚目。<br>　表に海図の断片。裏に――"}, {"t": "p", "v": "『二ノ潮』<br>『次ハ、能島ノ瀬戸』"}, {"t": "p", "v": "「能島……」凛の声が、少し変わった。「うちの、本城です。<strong>海の城</strong>。城跡は無人島で、周りは日本有数の急流」"}, {"t": "p", "v": "「急流の城か」"}, {"t": "p", "v": "「潮が、城壁でした。攻める船は潮に流され、守る船は潮に乗る。……次の印は、たぶん<strong>水の中</strong>です」"}, {"t": "br"}, {"t": "p", "v": "　その夜、今治の宿で、早川のノートPCが悲鳴を上げた。"}, {"t": "p", "v": "「――来た！　侵入検知！」"}, {"t": "p", "v": "　画面に文字列が走り、防壁のログが赤く染まっていく。早川の指がキーボードの上で加速した。"}, {"t": "p", "v": "「ルータ越しに刺してきてる……この手癖、知ってるぞ。この、ふざけた圧縮の掛け方――」"}, {"t": "p", "v": "　画面の中央に、ウィンドウが勝手に開いた。"}, {"t": "p", "v": "『やっほー、HayaP☆　ひさしぶり。まだ防壁それ？　(´・ω・`)』"}, {"t": "p", "v": "「<strong>Phantom</strong>……！」"}, {"t": "p", "v": "「知り合いか」"}, {"t": "p", "v": "「SECCONの決勝で負けた相手っす！　顔も本名も知らないけど、腕は――国内で唯一、俺が勝てなかった奴！」"}, {"t": "p", "v": "　早川は喋りながら、逆探知の三層目を剥がしにかかっている。画面の向こうとこちらで、十分間の斬り合いが続いた。"}, {"t": "p", "v": "『位置情報いただきまーす。今治の宿、302号室。窓から海きれいだね♪』"}, {"t": "p", "v": "「抜かれた――GPS！　引っ越しっす、今すぐ！」"}, {"t": "p", "v": "　荷物をまとめる三人の横で、早川だけが、最後まで画面に食らいついていた。"}, {"t": "p", "v": "「……逆探、一枚だけ通った。接続元――今治市内。<strong>来島海運の社屋のセグメント</strong>っす。Phantomは、来島の技術顧問だ」"}, {"t": "p", "v": "『おしいっ。あと二枚だったのにね。……ねえHayaP。<strong>そっちの雇い主は、いい人？</strong>』"}, {"t": "p", "v": "　最後のメッセージは、それだけ残して消えた。"}, {"t": "p", "v": "「……変なこと聞く奴っすね」"}, {"t": "p", "v": "「変なことじゃない、かもな」直人は画面の残像を見つめた。「<strong>自分の雇い主に、聞きたいことがある</strong>、って書き方だ」"}, {"t": "br"}, {"t": "p", "v": "　翌朝、潮風が今治の港を出ると、灰色の船が距離を置いて並走を始めた。"}, {"t": "p", "v": "　海上保安庁の巡視艇。<br>　無線が、公式の周波数で潮風を呼んだ。"}, {"t": "p", "v": "『――村上凛船長。貴船の航行に違法はありません。ですが、内閣官房より要請があり、お伝えします。<strong>今後、水中を含む文化財調査を行う場合は、文化財保護法に基づく事前の届出を求めます</strong>』"}, {"t": "p", "v": "　凛はマイクを取り、短く「承知しました」とだけ返した。<br>　無線を戻して、彼女は前を向いたまま言った。"}, {"t": "p", "v": "「……網が、三つになりましたね。来島の腕ずく。役所の法。それと」"}, {"t": "p", "v": "「Phantomの、電子の網」"}, {"t": "p", "v": "「ここからは、どの網が先に絞られるかの競争です」"}, {"t": "p", "v": "　潮風は、来島海峡の方角へ舳先を向けた。<br>　次の印は、急流の底の、海の城。"}], "chars": 2583}, {"title": "第四話　しまなみの罠", "paras": [{"t": "p", "v": "真琴が合流する日になった。"}, {"t": "p", "v": "「書陵部で、三点見つけました。現物は持ち出せないので、全頁の複写を運びます」"}, {"t": "p", "v": "　電話の声は、書陵部の声だった。一年半前と違うのは、その声の後ろに、こちらを案じる硬さが混ざるようになったことだ。"}, {"t": "p", "v": "「空路で広島、在来線で尾道。午後には着きます」"}, {"t": "p", "v": "「駅まで車で迎えに行く。……真琴さん。一つだけ。<strong>荷物は、あんた自身が一番の荷物だ</strong>。誰かに親切にされても、車には乗るな」"}, {"t": "p", "v": "「肝に銘じます。前回、荷物にされた者として」"}, {"t": "br"}, {"t": "p", "v": "　尾道駅前で、真琴はすぐに見つかった。紺のスーツにキャリーケース。観光の色の中で、一人だけ公文書の色をしている。"}, {"t": "p", "v": "　レンタカーに真琴を乗せ、今治側の漁港へ向かった。凛は潮風を回して、そこで落ち合う段取りだ。しまなみ海道を、島伝いに南へ渡る。"}, {"t": "p", "v": "　異変に気づいたのは、因島大橋を渡った直後だった。"}, {"t": "p", "v": "「鷺宮さん。後ろの白いバン、尾道からずっといるっす」"}, {"t": "p", "v": "　ルームミラーの中で、白いバンは車二台分の距離を保っていた。焦らず、離れず、職業的な間隔で。"}, {"t": "p", "v": "「……鬼頭か」"}, {"t": "p", "v": "「橋の上でUターン、とかは無理っすからね！？　高速扱いっすからね、ここ！」"}, {"t": "p", "v": "「しない。<strong>島で撒く</strong>」"}, {"t": "p", "v": "　直人は次の出口で高速を降りた。生口島。島内の生活道路は、軽トラと自転車の速度で流れている。白いバンも降りてきた。"}, {"t": "p", "v": "「早川。この島の道は」"}, {"t": "p", "v": "「ナビだと、海沿いの一周道路と、山越えの農道が二本――あ、あと<strong>サイクリングロード</strong>。自転車専用。車は入れないっす」"}, {"t": "p", "v": "「入れないのは、向こうも同じだな」"}, {"t": "p", "v": "　直人は、レモン畑の間の細い農道に車を入れた。対向不能の幅。地元の軽トラの後ろに付く。バンは道幅を測りかねて、入り口で一度止まった。"}, {"t": "p", "v": "　その隙に農道を抜け、島の反対側の漁港に滑り込む。約束の桟橋に、潮風の白い船体が待っていた。"}, {"t": "p", "v": "「車は！？」"}, {"t": "p", "v": "「レンタカー屋の営業所、この港の前っす！　調べといたっす！　<strong>乗り捨てプラン、追加三千円！</strong>」"}, {"t": "p", "v": "「有能」"}, {"t": "p", "v": "　鍵を営業所に預け、三人が飛び乗ると同時に、潮風は桟橋を離れた。<br>　防波堤の向こうに、白いバンが現れた時には、船はもう航路の真ん中だった。バンから降りた鬼頭が、こちらを長いこと見ていた。双眼鏡越しに、目が合った気がした。"}, {"t": "p", "v": "「……追いかけっこは、これで三回目ですね」真琴が息をついた。「向こうは、なぜ毎回こちらの位置が」"}, {"t": "p", "v": "「Phantomの網っす」早川が渋い顔をした。「携帯の位置は切ってるんで、たぶん<strong>Nシステムと防犯カメラ</strong>。レンタカーのナンバーで追ってる。……海の上だけっすよ、電子の網が薄いの」"}, {"t": "p", "v": "「だから、船なんです」凛が舵の前で言った。「海賊の理屈は四百年、変わりません。<strong>陸の網は、海には届かない</strong>」"}, {"t": "br"}, {"t": "p", "v": "　船室のテーブルに、真琴の複写が広げられた。"}, {"t": "p", "v": "「一点目。慶長年間の、大山祇神社の奉納記録の写し。武吉の名があります。――ただし、注記が変です。『鎧一領、<strong>空箱ニテ</strong>奉納』」"}, {"t": "p", "v": "「空箱？」"}, {"t": "p", "v": "「鎧櫃だけを奉納した、と読めます。中身のない鎧箱を、わざわざ神前に。……変でしょう」"}, {"t": "p", "v": "「変じゃない」直人は首を振った。「<strong>口伝の囮の、仕込みの記録だ</strong>。『神の島の宝は鎧』という噂の出所を、武吉自身が作ってる。四百年、探す者の目を空箱に向けさせるために」"}, {"t": "p", "v": "「二点目。海賊停止令の直後、天正十六年の毛利家家臣の書状。村上武吉の動静の報告です。『<strong>能島殿、船三艘ヲ以テ夜ノ海ニ出ズ。積荷不明。三夜続ケリ</strong>』」"}, {"t": "p", "v": "「三晩、夜の海に。……隠した記録そのものだな」"}, {"t": "p", "v": "「三点目が――一番、妙です」"}, {"t": "p", "v": "　真琴は、最後の複写を出した。"}, {"t": "p", "v": "「同じ頃の、村上家の家臣の覚書。断片ですが。『<strong>御印ノ一、来島ノ縁者ニ託サルベシト、殿ノ思シ召シ</strong>』――印の一つを、<strong>来島の縁者に託す</strong>つもりだった、と読めます」"}, {"t": "p", "v": "　船室が、静かになった。<br>　舵の前の凛が、振り返らずに言った。"}, {"t": "p", "v": "「……あり得ません。来島は、うちを裏切って秀吉に付いた家です。武吉公が、印を託すはずが」"}, {"t": "p", "v": "「『託サルベシト、思シ召シ』――<strong>つもりだった</strong>、までしか書いてない」真琴が慎重に言った。「実行されたかは、この断片からは分かりません」"}, {"t": "p", "v": "「実行されていたら、どうなる」と、直人。"}, {"t": "p", "v": "「潮印の一つが、<strong>来島家側の伝来品</strong>の中にある可能性が出ます。……つまり、来島暁が、最初から一枚持っているかもしれない」"}, {"t": "p", "v": "　凛の手が、舵の上で白くなった。<br>　五百年の因縁の家が、敵ではなく、<strong>同じ遺言の相続人</strong>かもしれない。その可能性が、凛の内側を静かに軋ませているのが、傍目にも分かった。"}, {"t": "p", "v": "「……先を急ぎます」凛は、それだけ言った。「能島の潮止まりは、明日の十時四十分からの、<strong>十分間</strong>。逃すと次の適した潮は六日後です」"}, {"t": "br"}, {"t": "p", "v": "　夕方、潮風は能島の見える入り江に錨を打った。"}, {"t": "p", "v": "　海の城は、思ったより小さく、思ったより荒々しかった。<br>　周囲を、目に見える速さで潮が走っている。島の縁で流れがぶつかり、渦がほどけては生まれる。城壁は石垣ではなく、<strong>水そのもの</strong>だという凛の言葉が、見れば分かった。"}, {"t": "p", "v": "「印は、どこに」"}, {"t": "p", "v": "「巻物の第三指示は『三ノ印、<strong>城ノ根ノ石垣、潮ノ底</strong>』。……能島の周りには、水中に石垣の遺構があります。桟橋の基礎か、船溜まりの護岸か。<strong>海の中です</strong>」"}, {"t": "p", "v": "「潜るのか。あの流れの中を」"}, {"t": "p", "v": "「潮止まりの十分間だけ、海が止まります」凛は、夕陽の中の急流を見つめた。「素潜りで行きます。<strong>私の家の庭ですから</strong>」"}, {"t": "p", "v": "　その横顔に、直人は既視感を覚えた。<br>　一年半前、玉垣を越える前に拝殿へ頭を下げた真琴と、同じ顔だった。境界を越える人間の顔だ。"}, {"t": "p", "v": "　明日、十時四十分。<br>　十分間の、海の城の開門だった。"}], "chars": 2574}, {"title": "第五話　能島の十分間", "paras": [{"t": "p", "v": "朝の九時、入り江に灰色の船が入ってきた。<br>　海上保安庁の巡視艇。その甲板に、銀縁の眼鏡が立っていた。"}, {"t": "p", "v": "「おはようございます、鷺宮さん」"}, {"t": "p", "v": "　朝倉は、拡声器を使わなかった。巡視艇を潮風に横付けさせ、届く声で、丁寧に話した。丁寧さが、いっそう網の目の細かさを感じさせた。"}, {"t": "p", "v": "「本日、能島周辺で水中調査をなさる予定と伺いました。<strong>届出は、出ていませんね</strong>」"}, {"t": "p", "v": "「……早耳ですね」"}, {"t": "p", "v": "「仕事ですので。――文化財保護の観点から、無届けの水中遺構調査は看過できません。国の史跡です。おやめいただきたい」"}, {"t": "p", "v": "　舵の前で、凛が口を開いた。声は静かで、刃は入っていた。"}, {"t": "p", "v": "「朝倉さん。この海の遺構を、国が調査したことは、一度でもありますか」"}, {"t": "p", "v": "「……予算と優先順位の問題です」"}, {"t": "p", "v": "「四百年、誰も潜らなかった。守ってきたのは、うちの家の口伝と、この海の潮です。<strong>今さら『国の史跡です』は、順番が逆でしょう</strong>」"}, {"t": "p", "v": "「順番の話をするなら」朝倉は動じなかった。「あなたの家の私的な相続の話と、国民全体の文化財の話と、どちらが先かという順番もあります」"}, {"t": "p", "v": "　正面からぶつかる二つの理路の間に、真琴が、書類の束を持って立った。"}, {"t": "p", "v": "「――整理します。朝倉室長。文化財保護法上、<strong>発見の届出は発見の後の義務</strong>です。潜水そのものを禁じる規定はありません。私たちは本日、<strong>現状変更を伴わない目視観察</strong>を行います。遺構には、指一本触れません。発見があれば、その場で正規の届出を起案します。起案者は私――宮内庁書陵部、九条です」"}, {"t": "p", "v": "　朝倉は、真琴の顔と、差し出された身分証を、長いこと見た。"}, {"t": "p", "v": "「……書陵部が、現場で発見届を。なるほど、星霜蔵の方式ですか」"}, {"t": "p", "v": "「前例が、ございますので」"}, {"t": "p", "v": "「結構です。<strong>目視のみ</strong>。それを一歩でも越えれば――」朝倉は初めて、行政の顔の奥の、交渉者の顔を見せた。「越えた瞬間に、この海域ごと保全指定します。誰も、二度と潜れなくなる」"}, {"t": "p", "v": "　巡視艇は、少し離れた沖――ちょうど、これから凛が潜る石垣の遺構の真上あたりに、錨を控えて留まった。<br>　網は、絞られないまま、張られ続けることになった。"}, {"t": "br"}, {"t": "p", "v": "　十時三十五分。<br>　走り続けていた潮が、目に見えて緩み始めた。"}, {"t": "p", "v": "　凛は素潜りの装束で、船縁に立った。ウェットスーツに、足ひれ、マスク。腰に、昔ながらの磯ナイフが一本。"}, {"t": "p", "v": "「十分です。往復と探索で、潜れて四本。……直人さんは船上から。早川くん、水中カメラの用意は」"}, {"t": "p", "v": "「準備完了っす。ドローンも上げます。<strong>目視観察の記録</strong>、って建前、ばっちり撮っときます」"}, {"t": "p", "v": "　その時、入り江の反対側から、水音がした。"}, {"t": "p", "v": "　黒いゴムボート。人影が二つ。一人は艪を握った鬼頭。もう一人は――ウェットスーツの、細身の男。背負っているのはタンクだ。"}, {"t": "p", "v": "「……瀬戸」凛が目を細めた。「来島の潜り屋。元海自の」"}, {"t": "p", "v": "『こちら海上保安庁――』巡視艇の無線が動く。だが黒いボートは応答せず、瀬戸は仰向けに海へ落ちた。タンクを背負った瀬戸は、潜っていられる時間が違う。"}, {"t": "p", "v": "「凛さん、向こうはボンベだ。時間勝負じゃ不利――」"}, {"t": "p", "v": "「潮止まりの海だけは、違います」"}, {"t": "p", "v": "　凛はマスクを下ろしながら、初めて、海賊の顔で笑った。"}, {"t": "p", "v": "「タンクは泡が出る。泡は流れに引かれる。装備は重くて、細い石垣の間に入れない。……<strong>この城は、身一つの者の味方をするように出来てるんです</strong>」"}, {"t": "p", "v": "　十時四十分。<br>　海が、止まった。"}, {"t": "p", "v": "　凛の体が、音もなく水に消えた。"}, {"t": "br"}, {"t": "p", "v": "　――水の中は、静かだった。"}, {"t": "p", "v": "　凛は三度、耳を抜き、青い層を割って沈んだ。<br>　潮止まりの能島の海は、一族の言い伝えの通りの色をしていた。走るのをやめた水は、光の柱を素直に通す。十メートル下の石垣の遺構が、城の根が、緑の影の中に横たわっている。"}, {"t": "p", "v": "　祖父に最初に潜らされたのは、六つの時だ。<br>　――怖がるな。潮は敵じゃない。<strong>時計だ</strong>。読める者には、道になる。"}, {"t": "p", "v": "　石垣の列を、指先でなぞるように泳ぐ。四百年、潮に洗われた石。牡蠣殻と海藻の帳の奥に、目が探しているのは、直線だ。自然の石の面には、直線は生まれない。"}, {"t": "p", "v": "　視界の端で、泡の柱が上がった。<br>　瀬戸だ。タンクの泡を引きながら、石垣の反対側の端を、ライトで薙ぐように探している。"}, {"t": "p", "v": "　（……乱暴な探し方。壁が泣く）"}, {"t": "p", "v": "　凛は息を継ぎに一度浮上し、二本目で、石垣の南の張り出しに回った。<br>　張り出しの根元。牡蠣殻の帳の切れ目に――<strong>四角い影</strong>。"}, {"t": "p", "v": "　三本目。<br>　近づく。石と石の間に、一つだけ、目地の通った切石が嵌まっている。表面に、掌で殻を払うと、刻みが現れた。"}, {"t": "p", "v": "　波の紋。三本線。<br>　村上の、家の印だった。"}, {"t": "p", "v": "　（見つけた――）"}, {"t": "p", "v": "　触れるな、と船の上の約束が言う。写せ、とカメラが言う。<br>　凛は腰のカメラを構え、切石の正面と、四方と、目地を撮った。切石の中央の窪みに、円盤の縁が見えている。潮印③は、四百年、この石の中で潮に守られてきた。"}, {"t": "p", "v": "　その視界に、横から、ライトが突き刺さった。"}, {"t": "p", "v": "　瀬戸だった。<br>　泡の柱を引きながら、まっすぐ切石へ。手には、バールが握られていた。"}, {"t": "p", "v": "　（――やめろ！）"}, {"t": "p", "v": "　声は、水の中では形にならない。<br>　瀬戸のバールが、切石の目地に突き立った。梃子の力で、四百年の目地が軋む。石の角が、欠けて舞った。"}, {"t": "p", "v": "　凛の体は、考えるより先に動いていた。<br>　身一つの速さで割り込み、バールの柄を両手で掴む。瀬戸のマスクの中の目が、驚きに見開かれる。取っ組み合いは、三秒で終わった。凛は勝とうとしなかった。<strong>瀬戸の腰のオモリのベルトのバックルを、指で弾いただけだ</strong>。"}, {"t": "p", "v": "　ウェイトを失ったタンク乗りの体は、風船と同じだ。そして凛は、身一つで海を知る者だ。浮力が瀬戸をどこへ運ぶか――石垣の真上に錨を控えた、あの白い船体の下へ――はじめから計算に入っていた。<br>　瀬戸は姿勢を崩し、泡の渦の中を、なすすべなく浮き上がっていった。"}, {"t": "p", "v": "　浮いた先は、巡視艇の真横だった。"}, {"t": "br"}, {"t": "p", "v": "　凛が船に上がったのは、潮止まりの終わる四十秒前だった。"}, {"t": "p", "v": "「――映像、全部撮れてるっす！」早川がモニターを掲げた。「瀬戸がバールで史跡を、がっつり！　現状変更の現行犯っす！」"}, {"t": "p", "v": "　巡視艇の甲板では、引き上げられた瀬戸が、保安官に囲まれていた。朝倉が、こちらを見ていた。<br>　直人は、無線のマイクを取った。"}, {"t": "p", "v": "「朝倉室長。<strong>発見届を起案します</strong>。所在は撮影記録の通り。遺物には、こちらは指一本触れていない。……触った者は、そちらの網の中です」"}, {"t": "p", "v": "　長い沈黙のあと、無線が返ってきた。"}, {"t": "p", "v": "『……受理します。回収は国の手で行う。<strong>見事な段取りだ</strong>、と記録には残さずにおきますよ』"}, {"t": "p", "v": "「それと、朝倉さん。回収したら、裏面の写真を発見者に開示願います。文化財保護法上、発見者には――」"}, {"t": "p", "v": "『<strong>知っています</strong>。法は、こちらの商売道具です』"}, {"t": "p", "v": "　無線の向こうで、ほんの少しだけ、笑った気配がした。"}, {"t": "br"}, {"t": "p", "v": "　夕方の船室で、戦果を数えた。"}, {"t": "p", "v": "「③の原物は、国の手に。裏面はまだ読めてない。……で、これが凛さんの撮った刻みの写真。凛さん、この精度なら――」"}, {"t": "p", "v": "「写せます」凛が頷いた。「家伝の型取りは、写真からでも起こせます。潮印は、潮で開く物理の錠。文字を読む鍵じゃなく、<strong>形の鍵</strong>です。だから――複製でも、潮は嵌まる」"}, {"t": "p", "v": "　切石の紋の脇に、小さな文字列が写っていた。彫りは浅いが、読める。"}, {"t": "p", "v": "『三ノ潮。次ハ、毒ノ島』"}, {"t": "p", "v": "「毒の、島……？」真琴が眉を寄せた。「大久野島のことなら、あの呼び名は昭和の毒ガス工場以後です。<strong>天正の彫りに、あるはずのない言葉</strong>」"}, {"t": "p", "v": "「あぁ。……この裏面の彫り、他より新しい。目地の中で潮に守られてたにしても、角が立ちすぎてる」"}, {"t": "p", "v": "「彫り直し、ですか」"}, {"t": "p", "v": "「たぶんな。<strong>誰かが後の時代に、道標を彫り直してる</strong>。星霜組と、同じことをした誰かが、この海にもいた」"}, {"t": "p", "v": "　誰が。いつ。なぜ。<br>　問いが増えるたび、四百年前の言葉が、いま生きて動いているように思えてくる。"}, {"t": "p", "v": "　凛は、濡れた髪のまま、写真の中の家紋を見つめていた。"}, {"t": "p", "v": "「……祖父の言った通りでした。潮は、時計だと」"}, {"t": "p", "v": "「時計？」"}, {"t": "p", "v": "「四百年、あの石を守ったのも潮。今日、瀬戸を吐き出したのも潮。……<strong>この海は、まだ村上の味方です</strong>」"}], "chars": 3474}, {"title": "第六話　裏切りの港", "paras": [{"t": "p", "v": "「鞆の浦に、寄りたいんです」"}, {"t": "p", "v": "　能島の翌日、凛が言った。"}, {"t": "p", "v": "「三枚目の裏は読めた。次は大久野島だろう」"}, {"t": "p", "v": "「はい。でも――鞆の浦に、来島暁がいます。<strong>直接、会って話します</strong>」"}, {"t": "p", "v": "　直人は凛の目を見た。決意と、迷いが、半々に混ざっていた。"}, {"t": "p", "v": "「面識があるのか」"}, {"t": "p", "v": "「古美術の業界で、何度か。来島は闇の仲買ですが、表では瀬戸内の経済人です。私の商売とは、市場が重なる。……このまま行けば、次は誰かが本当に怪我をします。瀬戸は捕まり、鬼頭は焦り始めている。<strong>話が通じるうちに、話します</strong>」"}, {"t": "p", "v": "「一人で、か」"}, {"t": "p", "v": "「一人でなければ、あの人は海賊の話をしません。……大丈夫。<strong>場所は昼の料亭、席は表</strong>。海賊の交渉の作法です。逃げ道のある席でしか、話さない」"}, {"t": "br"}, {"t": "p", "v": "　鞆の浦は、江戸の港がそのまま残ったような町だった。常夜燈、雁木、船番所跡。潮待ちの港。帆船の時代、船はここで潮が変わるのを待った。"}, {"t": "p", "v": "　直人と早川と真琴は、料亭の見える茶屋で待った。盗聴も、監視カメラも仕掛けなかった。凛が「作法に反する」と言ったからだ。丸腰の信義だけが、今日の装備だった。"}, {"t": "p", "v": "　――以下は、後で凛が語った、座敷でのやりとりだ。"}, {"t": "br"}, {"t": "p", "v": "　来島暁は、床の間を背にしていた。仕立ての良い和装。四十二歳。日焼けした顔に、読書家の目。"}, {"t": "p", "v": "「村上のご当主が、うちの敷居を跨ぐとは。……五百年ぶりの外交ですな」"}, {"t": "p", "v": "「外交に来ました」凛は座って、まっすぐ本題に入った。「瀬戸さんの件は、お気の毒でした。ですが、あれはあなたの指示の外でしょう。<strong>バールで史跡を毀すのは、あなたの流儀じゃない</strong>」"}, {"t": "p", "v": "　来島の目が、わずかに動いた。"}, {"t": "p", "v": "「……ほう」"}, {"t": "p", "v": "「あなたは文化財の闇仲買です。品物の値打ちで食べている人が、品物を壊すはずがない。壊したがるのは――」凛は、廊下に控える大柄な影を、見ずに示した。「<strong>現場の人</strong>です」"}, {"t": "p", "v": "　襖の向こうで、鬼頭の気配が固くなった。<br>　来島は、少しの間黙り、それから襖に向かって短く言った。"}, {"t": "p", "v": "「鬼頭。下がっていい。……ついでに覚えておけ。<strong>道具に史跡を壊させた者は、私の帳簿では、壊した者と同罪だ</strong>」"}, {"t": "p", "v": "　足音が、遠ざかった。去り際、畳が荒々しく軋んだ。それが、返事の代わりだった。"}, {"t": "p", "v": "「――で、村上さん。外交の中身は」"}, {"t": "p", "v": "「手を引いてください、とは言いません。言っても引かないでしょう。お願いは一つ。<strong>力ずくを、やめること</strong>。この探索は、壊したら終わりの仕掛けの連続です。あなたの部下のやり方では、宝は誰の手にも入らない」"}, {"t": "p", "v": "「なるほど。正論だ」来島は茶を含んだ。「では、こちらの条件も一つ。――<strong>潮印を、一枚</strong>」"}, {"t": "p", "v": "「……」"}, {"t": "p", "v": "「誠意の形というやつです。一枚お預けいただければ、当面、うちの現場は『観察』に留めましょう」"}, {"t": "p", "v": "「断れば」"}, {"t": "p", "v": "「断っても、手荒なことはしませんよ。私はね」来島は、懐から一葉の写真を出して、畳の上を滑らせた。"}, {"t": "p", "v": "　尾道の、坂の上の家。縁側で猫に餌をやる、凛の祖母の写真だった。"}, {"t": "p", "v": "「良い立地だ。あの一帯、再開発の話が出ましてね。うちの不動産部門も、一枚噛んでいる。……<strong>地上げというのは、合法の範囲でも、老人には辛いものです</strong>」"}, {"t": "p", "v": "　凛は、写真を見て、長く息を吸った。"}, {"t": "p", "v": "「……あなたは、それでいいんですか。来島の家は、そういう家でしたか」"}, {"t": "p", "v": "「そういう家に、<strong>された</strong>んですよ」"}, {"t": "p", "v": "　来島の声が、初めて商談の外に出た。"}, {"t": "p", "v": "「五百年前、あなたの家のご先祖は、海を割る時に、うちに何を残した？　……うちには、妙な言い伝えがありましてね。『<strong>御印ノ一、来島ニ託サルベシ</strong>』。託される、はずだった。だが、渡されなかった。村上の宝の相続から、うちは五百年、外されたままだ」"}, {"t": "p", "v": "　凛の背筋を、細い電流が走った。真琴の見つけた覚書と、同じ文言だった。"}, {"t": "p", "v": "「……その言い伝え、他には」"}, {"t": "p", "v": "「あとは、がらくたですよ。<strong>意味のない古い子守唄</strong>が一つ。『一の潮は城の潮、二の潮は神の潮』――潮の名前を数えるだけの、退屈な歌だ。うちの家系は、印の代わりに歌だけ渡されて、五百年、飼い殺しにされた」"}, {"t": "p", "v": "　来島は写真を指で叩いた。"}, {"t": "p", "v": "「一枚。三日、待ちます」"}, {"t": "br"}, {"t": "p", "v": "　三日目に、凛は一枚を渡した。"}, {"t": "p", "v": "　因島の①――<strong>の、写し</strong>を。<br>　船の金庫の本物ではなく、あの夜、家伝の技で写した方を。"}, {"t": "p", "v": "　帰りの船で、凛は誰とも目を合わせずに言った。"}, {"t": "p", "v": "「祖母は今朝、道後へ発たせました。湯治の名目で、母方の遠縁の宿に。<strong>海賊の家は、逃がすのも早いんです</strong>。……でも」"}, {"t": "p", "v": "「でも？」"}, {"t": "p", "v": "「写しを渡した瞬間、来島は蓋の傷を、指の腹で三度なぞりました。……あの人は、目利きです。私の家伝の写しは、写真では見抜けない。でも、<strong>指なら</strong>」"}, {"t": "p", "v": "　その夜、村上堂の電話が鳴った。<br>　来島だった。凛はスピーカーにして、皆に聞かせた。"}, {"t": "p", "v": "『――良い写しだ、村上さん』"}, {"t": "p", "v": "　座敷の空気が、凍った。"}, {"t": "p", "v": "『縁の減り方まで写してある。五百年経っても、お宅の家伝の技は錆びていない。<strong>敬意を表します</strong>』"}, {"t": "p", "v": "「……気づいていて、受け取ったんですか」"}, {"t": "p", "v": "『ええ。写しで結構。<strong>私が欲しかったのは、円盤の真鍮ではありませんので</strong>』"}, {"t": "p", "v": "「では、何を」"}, {"t": "p", "v": "『あなたが、<strong>うちの敷居を跨いだという事実</strong>です。五百年ぶりに、村上が来島に頭を下げに来た。……それだけで、うちの先祖の何人かは、成仏したでしょうよ』"}, {"t": "p", "v": "　電話の向こうで、薄く笑う気配がした。"}, {"t": "p", "v": "『ああ、それと。地上げの件は白紙にしました。ご祖母堂には、良い温泉を。――<strong>次は、海の上でお会いしましょう。互いの、家の流儀で</strong>』"}, {"t": "p", "v": "　電話は切れた。<br>　長い沈黙のあと、早川が呟いた。"}, {"t": "p", "v": "「……敵なんすか、あの人。味方なんすか」"}, {"t": "p", "v": "「どっちでもありません」凛は、写真の中の祖母の縁側を見つめたまま言った。「<strong>五百年、置き去りにされた人です</strong>。……そして多分、あの『意味のない子守唄』は――意味が、あります」"}], "chars": 2633}, {"title": "第七話　電子戦", "paras": [{"t": "p", "v": "鞆の浦から戻った夜、早川が村上堂の二階に「基地」を作った。"}, {"t": "p", "v": "　ノートPCが三台、ルータ、モバイル回線を二系統。海の上では強かった直人たちが、陸に上がると一番脆いのは通信だ。Phantomの網は、陸の電子回線を這って伸びてくる。"}, {"t": "p", "v": "「宣戦布告、しときます」早川が指を鳴らした。「向こうが刺してくる前に、こっちから接続する。フェアな殴り合いに持ち込むっす」"}, {"t": "p", "v": "「勝てるのか」"}, {"t": "p", "v": "「三年、負けたまんまなんすよ、俺。……ちょうどいい機会っす」"}, {"t": "p", "v": "　早川が能島戦の映像を暗号化してアップロードし始めた三分後、回線が跳ねた。<br>　Phantomが、応じた。"}, {"t": "br"}, {"t": "p", "v": "　攻防は、直人には見えなかった。<br>　早川の指がキーを叩く速度と、額の汗と、時々漏れる悪態だけが、戦況を伝えた。"}, {"t": "p", "v": "「三重の壁、二枚目まで持っていかれた……こいつ、三年前より速い」"}, {"t": "p", "v": "　画面の隅に、また顔文字が湧いた。"}, {"t": "p", "v": "『HayaP、防壁それだけ？　(´・ω・`)　三年、何してたの』"}, {"t": "p", "v": "「うるせえ！　……真琴さん、こいつの過去のリーク履歴、洗えますか。手癖から個人を絞りたい」"}, {"t": "p", "v": "「調べます」真琴が別のPCで公開情報を漁り始めた。「SECCON、CTFの記録、過去の摘発報道……少年事件で名前は伏せられていますが、<strong>手口の署名</strong>は残ります」"}, {"t": "p", "v": "　十分後、早川の壁の三枚目が破られかけた、その瞬間だった。"}, {"t": "p", "v": "　攻撃が、止まった。"}, {"t": "p", "v": "　画面に、長い一文が表示された。今度は顔文字がなかった。"}, {"t": "p", "v": "『――ねえHayaP。ひとつ取引しない？』"}, {"t": "p", "v": "「取引？」"}, {"t": "p", "v": "『そっちの雇い主、村上凛。うちの雇い主、来島暁。……で、<strong>うちの雇い主、今日、変な指示を出した</strong>。「潮印の写しでいいから受け取れ」って。仲買が、写しでいいわけないでしょ。あの人、何か企んでる』"}, {"t": "p", "v": "　早川と直人は、顔を見合わせた。"}, {"t": "p", "v": "『あたし、来島に雇われて三年。ずっと思ってた。この人、宝より、別のものが欲しいんじゃないかって。……HayaP。<strong>そっちの雇い主は、いい人？</strong>』"}, {"t": "p", "v": "　三度目の、同じ問いだった。"}, {"t": "p", "v": "「……あぁ」早川は、キーボードから手を離して、素直に打ち込んだ。「いい人だ。海賊のくせに、人を逃がすのも、頭を下げるのも、うちの婆ちゃんを守るのも、自分が先にやる。……そっちは？」"}, {"t": "p", "v": "　長い、間があった。"}, {"t": "p", "v": "『分からない。それを、確かめたいの』"}, {"t": "br"}, {"t": "p", "v": "　真琴が、顔を上げた。"}, {"t": "p", "v": "「早川さん。手口の署名から、一件、古い記事に当たりました。……十六年前、中学生が地方銀行のシステムに侵入した事件。<strong>目的が、金銭ではなかった</strong>。侵入して、ある口座の<strong>取引履歴を閲覧しただけ</strong>で、何も盗まず、自首している」"}, {"t": "p", "v": "「何を見たんすか、その子は」"}, {"t": "p", "v": "「記事では伏せられています。ただ、被害届を出した銀行の名前が――<strong>来島海運のメインバンク</strong>でした」"}, {"t": "p", "v": "　部屋が、静かになった。"}, {"t": "p", "v": "「……Phantomは」直人が言った。「十六年前、子供の頃に、来島海運の金の流れを調べて、捕まってる。そして今、その来島に雇われている」"}, {"t": "p", "v": "「復讐、でしょうか」"}, {"t": "p", "v": "「あるいは、確かめ続けてる」直人は画面の、消えかけた最後の一文を見た。「<strong>この人は、いい人か</strong>。……ずっと、同じことを聞いてる」"}, {"t": "p", "v": "　早川が、キーボードに向き直った。今度は攻撃ではなく、一通のメッセージを書いた。"}, {"t": "p", "v": "「Phantom。……いや、名前で呼ぶわ。三年前、決勝の後、握手しようとして無視されたの、根に持ってるんだよ、俺は。今度会ったら、握手からだ。<strong>顔出して会おうぜ</strong>」"}, {"t": "p", "v": "　返事は、すぐには来なかった。<br>　十秒後、画面に、短く。"}, {"t": "p", "v": "『……考えとく。HayaP』"}, {"t": "p", "v": "　接続が、静かに切れた。攻撃の痕は、一つも残っていなかった。"}, {"t": "br"}, {"t": "p", "v": "「あの子、寝返るっすかね」早川が伸びをした。"}, {"t": "p", "v": "「まだ分からん。だが――<strong>敵の網に、綻びが一つできた</strong>」直人はメモを取った。「来島は宝より別の何かを欲しがってる。Phantomはそれを疑ってる。……この二つは、いつか使える」"}, {"t": "p", "v": "　凛が、茶を運んできた。話は聞いていたらしい。"}, {"t": "p", "v": "「来島の欲しがっているもの……子守唄のことを、私、ずっと考えています」"}, {"t": "p", "v": "「潮の名を数える歌、か」"}, {"t": "p", "v": "「『一の潮は城の潮、二の潮は神の潮』。……私たちが集めた潮印の順と、同じなんです。城（因島）、神（大山祇）。<strong>歌が、順路を歌ってる</strong>。来島家は、印を渡されない代わりに、順路の歌だけを、五百年、子守唄として歌い継がされた」"}, {"t": "p", "v": "「歌だけあって、鍵がない」"}, {"t": "p", "v": "「ええ。<strong>開けられない地図を、五百年、抱かされてきた家</strong>です。……来島暁が宝より欲しいものは、もしかしたら」"}, {"t": "p", "v": "　凛は、湯呑みを置いた。"}, {"t": "p", "v": "「――<strong>自分の家が、五百年、何を待たされていたのかの、答え</strong>かもしれません」"}], "chars": 2057}, {"title": "第八話　凛の海", "paras": [{"t": "p", "v": "大久野島――「毒の島」へ渡る前に、直人はどうしても確かめたいことがあった。<br>　能島の裏面の彫りだ。「毒ノ島」という後世の呼称。誰が、いつ、彫り直したのか。"}, {"t": "p", "v": "「彫り直した誰かが、来島家の『子守唄』とも繋がってるかもしれない」直人は言った。「もう一度、能島に潜って、切石の<strong>周りの石</strong>も見たい。後世の手が入ってるなら、周りにも痕がある」"}, {"t": "p", "v": "「次の潮止まりは、明日の朝です」凛が海図を睨んだ。「ただし――明日は、大潮の翌日。潮止まりが短い。<strong>七分</strong>あるかどうか」"}, {"t": "p", "v": "「七分で、足りるか」"}, {"t": "p", "v": "「足ります。……ただし、一本で決めます。二度は潜れない」"}, {"t": "br"}, {"t": "p", "v": "　その夜、凛は珍しく、酒を出した。"}, {"t": "p", "v": "　村上堂の縁側。尾道水道の対岸の灯りが、水面に長く伸びている。凛は湯呑みに冷やを注いで、直人に一つ渡した。"}, {"t": "p", "v": "「一つ、聞いてもいいですか」凛が言った。「あなたは、なぜ続けるんです。星霜蔵で、もう名前も実績も得た。今回は、危ない目に遭うばかりで、儲けもない」"}, {"t": "p", "v": "「……修復士だからだ」直人は答えた。「見えないものが見えた時、無視できない。巻物の裏の文字を見た瞬間に、もう、続けることは決まってた。性分だ」"}, {"t": "p", "v": "「性分」"}, {"t": "p", "v": "「あんたは？　五百年の因縁を、背負う理由は」"}, {"t": "p", "v": "　凛は、しばらく水面を見ていた。"}, {"t": "p", "v": "「祖母に、育てられました。両親は、私が小さい頃に。……祖母は、村上の口伝を、子守唄みたいに聞かせてくれました。海の蔵の話。武吉公の話。潮の読み方。私にとって宝探しは、<strong>祖母の膝の続き</strong>なんです」"}, {"t": "p", "v": "「来島も、子守唄で育った」"}, {"t": "p", "v": "「……ええ。同じ歌を、別の家で。片方は鍵を持ち、片方は歌だけを」凛は、湯呑みを両手で包んだ。「敵だと思っていました。ずっと。でも――<strong>同じ子守唄で眠った子供が、五百年後に、海の上で殺し合う</strong>。それは、武吉公が望んだことでしょうか」"}, {"t": "p", "v": "　直人は、答えを持たなかった。<br>　持たないまま、二人は長いこと、対岸の灯りを見ていた。"}, {"t": "p", "v": "「明日、七分潜ります」凛が立ち上がった。「見ていてください、直人さん。<strong>村上の海を</strong>」"}, {"t": "br"}, {"t": "p", "v": "　――朝の海は、凪いでいた。"}, {"t": "p", "v": "　凛は、六つの時から数えきれず潜ったこの海に、また体を沈めた。"}, {"t": "p", "v": "　潮止まりの能島。走るのをやめた水は、朝の光を底まで通す。<br>　昨日回収された切石の跡には、国の調査用の目印テープが張られている。凛はそれには触れず、周りの石を、一つずつ、指で確かめていった。"}, {"t": "p", "v": "　石の面を読む。四百年、潮に磨かれた石には、直線はない。人の手が入った石だけが、直線を持つ。"}, {"t": "p", "v": "　切石の、二つ隣。<br>　牡蠣殻の帳の奥に、真新しくはないが、四百年よりは若い彫りがあった。細い線で、小さな文字。"}, {"t": "p", "v": "　凛は殻を払い、目を凝らした。"}, {"t": "p", "v": "　『<strong>昭和三十九年　補修　来島</strong>』"}, {"t": "p", "v": "　息が、止まりかけた。"}, {"t": "p", "v": "　来島。<br>　能島の――村上の本城の石垣を、昭和の半ばに補修したのは、来島家だった。<br>　鍵を持たない家が、順路の歌だけを頼りに、それでもこの海に通い、村上の城を守り続けてきた。少なくとも、昭和のこの時までは。<strong>一件の彫りが、五百年すべてを証すわけではない。だが――横取りに来た家が、わざわざ敵の石垣を直しはしない</strong>。"}, {"t": "p", "v": "　敵だと思っていた家が、村上の城を、直していた。"}, {"t": "p", "v": "　凛は、その彫りを写真に収め、指の腹で、そっと一度だけなぞった。<br>　殺し合う相手の、祖先の手の痕を。"}, {"t": "p", "v": "　浮上の合図の、体の中の時計が鳴った。七分。<br>　凛は、来た道を戻った。"}, {"t": "br"}, {"t": "p", "v": "「……来島が、能島を補修？」"}, {"t": "p", "v": "　船上で写真を見た直人が、絶句した。"}, {"t": "p", "v": "「昭和の半ばに。たぶん、彫り直しも」凛は濡れた髪を絞った。「来島家は、宝を横取りしようとしていたんじゃない。……<strong>片方は鍵を、片方は掃除を、五百年、別々に続けていた</strong>。武吉公は、二つの家に、二つの役目を分けて託していたのかもしれません」"}, {"t": "p", "v": "「鍵を持つ本家と、道を守る分家、か」"}, {"t": "p", "v": "「なのに、途中で、誰かがそれを『裏切り』の物語に書き換えた。……来島暁は、たぶん、本当の役目を知らない。<strong>恨みの物語だけを、相続している</strong>」"}, {"t": "p", "v": "　凛は、写真の中の「来島」の彫りを見つめた。"}, {"t": "p", "v": "「直人さん。私、決めました。この探索が終わったら――<strong>来島暁に、これを見せます</strong>。あなたの家は、裏切り者じゃなかった、と。五百年、うちの城を直してくれてありがとう、と」"}, {"t": "p", "v": "「危険だぞ。向こうはまだ、敵だ」"}, {"t": "p", "v": "「危険は家伝です」凛は、初めて心から、笑った。「それに――<strong>同じ子守唄で眠った相手を、いつまでも敵にしておくのは、寝覚めが悪い</strong>」"}, {"t": "p", "v": "　潮風は、大久野島へ舳先を向けた。<br>　海の上で、五百年の因縁が、少しだけ、形を変え始めていた。"}], "chars": 2023}, {"title": "第九話　毒の島", "paras": [{"t": "p", "v": "大久野島は、うさぎの島として知られている。<br>　だが「毒の島」の別名の方が古い。昭和のはじめから終戦まで、この島は地図から消され、毒ガスが作られていた。今も、コンクリートの毒ガス貯蔵庫跡や、火薬庫跡が、島のあちこちに残っている。"}, {"t": "p", "v": "「四ノ印は、この島の『地の下』」凛が巻物の写しを読んだ。「巻末の第四指示は――『四ノ印、島ノ胎、<strong>水ノ絶エヌ処</strong>』」"}, {"t": "p", "v": "「水の絶えぬ処……井戸か、湧水か」"}, {"t": "p", "v": "「島に古い井戸がいくつかあります。毒ガス工場の時代に使われた、貯水の遺構も」真琴が資料を繰った。「ただ、大規模な地下通路網は、ここにはありません。あるのは地上の遺構と、半地下の貯蔵庫。それと――<strong>天然の海食洞が一つ</strong>」"}, {"t": "p", "v": "「毒の島の呼び名が、天正の彫りに使われてた謎は」"}, {"t": "p", "v": "「たぶん、能島と同じです」直人が言った。「後世の――昭和の来島家あたりが、彫り直した。この島が『毒の島』と呼ばれた時代に、道標を更新した」"}, {"t": "br"}, {"t": "p", "v": "　島の南、人の来ない磯に、その海食洞はあった。"}, {"t": "p", "v": "　満潮では水没し、干潮でだけ口を開ける。中は奥へ十メートルほど。中ほどの左手の壁に、人一人がやっと通れる縦の割れ目が走り、外の潮の匂いが細く差し込んでいる。奥の壁の根に、真水の湧く小さな泉があった。海に囲まれた島で、そこだけ塩気のない水。「水ノ絶エヌ処」。"}, {"t": "p", "v": "　泉の縁の岩に、盃形の窪み。因島、大山祇と、同じ意匠だ。"}, {"t": "p", "v": "「今度は、逆かもしれません」凛が言った。「ここは真水が湧く。……<strong>海水を注いで開く</strong>錠を、真水の中に置いた。海賊の悪戯です。真水の島だと思って真水を注ぐ者には、開かない」"}, {"t": "p", "v": "　凛が汲んできた海水を、窪みに注いだ。<br>　岩の継ぎ目が、塩で膨らむ。奥の壁の一枚が、ゆっくりと横に滑った。"}, {"t": "p", "v": "　空洞。真鍮の円盤。四枚目。<br>　表に海図の断片。裏に――"}, {"t": "p", "v": "『四ノ潮』<br>『五ノ潮ハ、血ノ中ニ』"}, {"t": "p", "v": "「血の中……」"}, {"t": "p", "v": "「五枚目は、<strong>血筋の中</strong>」凛が、自分の首元に手をやった。そこには、古い銀のペンダントが下がっている。「これです。村上家の当主が、代々、身につけてきた。ただの家紋の飾りだと思っていました。でも――」"}, {"t": "p", "v": "　凛はペンダントを外し、裏を返した。<br>　裏の平らな面に、細い線刻。海図の、五枚目の断片。そして、小さな文字。"}, {"t": "p", "v": "『五ノ潮。五ツ、<strong>潮ノ順ニ嵌メヨ</strong>』"}, {"t": "p", "v": "「五枚、揃った」直人が言った。「潮の順に嵌めろ、と。……鍵の使い方まで、書いてある」"}, {"t": "br"}, {"t": "p", "v": "　その時、洞の入り口の光が、翳った。"}, {"t": "p", "v": "　人影。逆光で、顔は見えない。だが、体格で分かった。鬼頭だった。<br>　背後に、もう一人。細身の、ウェットスーツの――いや、違う。パーカーのフードを目深にかぶった、小柄な人影。"}, {"t": "p", "v": "「潮印を、四枚とも」鬼頭の声が、洞に反響した。「それと、ペンダントを。渡せば、乱暴はしない」"}, {"t": "p", "v": "「瀬戸は捕まったぞ。あんたも、来島の帳簿から外されかけてるんじゃないのか」直人は時間を稼いだ。潮汐表が頭にある。この洞は、あと二十分で満ち始める。"}, {"t": "p", "v": "「来島は甘い」鬼頭が一歩、踏み込んだ。「頭を下げたり、写しで満足したり。……あの人は、宝の値打ちが分かってない。五億の太刀が眠ってるんだぞ。<strong>俺が、俺のために、取る</strong>」"}, {"t": "p", "v": "　来島の指示ではない。鬼頭の、独断だった。<br>　直人の背筋が、ひやりとした。理屈の通じる敵より、理屈を捨てた敵の方が危ない。"}, {"t": "p", "v": "「四枚は渡せない。国の物になった分もある」"}, {"t": "p", "v": "「なら、ペンダントだけでも――」"}, {"t": "p", "v": "　鬼頭が動いた、その時。<br>　彼の後ろの、小柄な人影が、動いた。"}, {"t": "p", "v": "　洞の入り口の岩に、何かを投げつけた。小さな機械。閃光と、鋭い電子音。<br>　鬼頭が、反射的に振り返る。その一瞬で、人影は叫んだ。"}, {"t": "p", "v": "「今！　奥じゃなくて、<strong>横の割れ目！　満ちる前に外へ！</strong>」"}, {"t": "p", "v": "　女の声だった。若い。"}, {"t": "p", "v": "「――Phantom？」早川が息を呑んだ。"}, {"t": "p", "v": "「HayaP、案内はあたしがやる！　この島の遺構図、全部頭に入ってる！　こっち！」"}, {"t": "br"}, {"t": "p", "v": "　混乱の中を、五人は洞の横の割れ目から磯へ抜けた。<br>　鬼頭の怒声が、洞の中で反響していた。閃光の機械は、Phantomが「うるさいだけの花火」と言った通り、実害はなく、ただ鬼頭の足を止めただけだった。"}, {"t": "p", "v": "　磯の岩陰で、フードの人影が、初めて顔を見せた。"}, {"t": "p", "v": "　二十代半ばの、痩せた女だった。目の下に、徹夜のクマ。<br>　早川を見て、少しだけ、決まり悪そうに笑った。"}, {"t": "p", "v": "「……握手から、だっけ」"}, {"t": "p", "v": "「霧島……いや」早川は手を差し出した。「初めまして、でいいや。俺、早川」"}, {"t": "p", "v": "「霧島サラ」女は、その手を握った。「Phantomは、もう廃業。……あたし、来島を辞める。あんたの雇い主が『いい人』だって、三回聞いて、確かめたくなったから」"}, {"t": "p", "v": "「なんで、こっちに」"}, {"t": "p", "v": "「来島暁が、今朝、鬼頭を切ったの。『独断専行、うちの流儀に非ず』って。でも鬼頭は聞かなかった。……あたしは、切られた側じゃなくて、<strong>辞める側</strong>でいたかった」"}, {"t": "p", "v": "　サラは、濡れた磯に座り込んで、海を見た。"}, {"t": "p", "v": "「それと。十六年前、あたしが調べた来島海運の口座。……その金の流れ、まだ気になってるの。<strong>来島暁が、宝で何をしようとしてるか</strong>。それを見届けるには、来島の外にいた方がいい」"}, {"t": "p", "v": "　凛が、サラの隣に膝をついた。"}, {"t": "p", "v": "「来島暁の、家の子守唄を、知ってる？」"}, {"t": "p", "v": "「……『一の潮は城の潮』ってやつ？　社長がたまに、酔うと歌ってた。淋しい歌だなって、思ってた」"}, {"t": "p", "v": "「淋しい歌よ」凛は静かに言った。「鍵を持たない家が、五百年、歌だけを抱いてきた歌。……その鍵、そろそろ、揃うの」"}], "chars": 2328}, {"title": "第十話　凛の告白", "paras": [{"t": "p", "v": "五枚の潮印が、揃った。"}, {"t": "p", "v": "　村上堂の奥の間で、五枚を潮の順――城（因島）、神（大山祇）、瀬戸（能島）、毒（大久野島）、血（ペンダント）――に並べる。表の海図の断片を繋ぐと、来島海峡の一点が、浮かんだ。"}, {"t": "p", "v": "「来島海峡……」凛が指でなぞった。「よりによって、来島の名を冠した海峡が、竜宮の在処」"}, {"t": "p", "v": "「五百年前は、村上の海だった。今は来島海運のお膝元だ」直人は座標を確かめた。「皮肉な場所に隠したもんだな、武吉は」"}, {"t": "p", "v": "「皮肉じゃないと思います」凛が首を振った。「――<strong>来島の縁者に託すつもりだった</strong>、という覚書。もし本当に託されていたら。竜宮は、来島の海峡にある。……武吉公は、最初から、<strong>二つの家で開ける</strong>ことを想定していたのかもしれない」"}, {"t": "br"}, {"t": "p", "v": "　その夜、凛が、皆に打ち明けた。"}, {"t": "p", "v": "「一つ、黙っていたことがあります」"}, {"t": "p", "v": "　畳の上に、二枚の潮印①を並べた。本物と、写しだ。"}, {"t": "p", "v": "「因島で①を回収した夜、私は船の上で写しを作りました。……家伝の技だと言いましたね。あれは、半分嘘です」"}, {"t": "p", "v": "「半分？」"}, {"t": "p", "v": "「型取りの技は、本当です。でも――<strong>なぜ私が、回収した初日に、迷わず写しを作れたのか</strong>。それは」"}, {"t": "p", "v": "　凛は、目を伏せた。"}, {"t": "p", "v": "「私は、この探索を始める前から、<strong>来島に写しを渡すつもりだった</strong>からです」"}, {"t": "p", "v": "　部屋が、静かになった。"}, {"t": "p", "v": "「一年前――星霜蔵のニュースを見た時、私は決めました。うちの海の蔵も、探し出す、と。でも一人では無理だ。だから、あなたを呼んだ。……同時に、もう一つ、決めていました。<strong>来島暁を、この探索に巻き込む</strong>、と」"}, {"t": "p", "v": "「巻き込む？　敵をか」"}, {"t": "p", "v": "「五百年の因縁を、終わらせたかった」凛の声が、震えた。「祖母がずっと言っていました。『村上と来島が、また同じ海で笑える日が来れば』と。……祖母の、最後の願いなんです。私が写しを用意したのは、来島に渡す手土産のためでした。あなたたちを、その道具に――利用しかけていた」"}, {"t": "p", "v": "　直人は、凛を見た。刃物のような女が、初めて、刃を自分に向けていた。"}, {"t": "p", "v": "「利用された、とは思わない」直人は言った。「あんたは、写しを渡した。本物じゃなく。……敵に手土産を渡しながら、仲間の取り分は守った。それは利用じゃない。<strong>両方を助けようとした</strong>だけだ」"}, {"t": "p", "v": "「でも、黙っていました」"}, {"t": "p", "v": "「黙ってたのは、あんたの弱さじゃない。祖母さんの願いが、大きすぎて、口に出すのが怖かっただけだ」直人は少し笑った。「……修復と同じだ。大事な物ほど、触るのが怖い」"}, {"t": "p", "v": "　凛の目に、光るものがあった。彼女はそれを、袖で乱暴に拭った。"}, {"t": "p", "v": "「……海賊は、泣かないんです」"}, {"t": "p", "v": "「知ってる。逃げ足と、泣くのを我慢するのが、家伝だろう」"}, {"t": "p", "v": "　早川とサラが、気を利かせて縁側へ出ていった。真琴が、そっと茶を淹れ直した。"}, {"t": "br"}, {"t": "p", "v": "「サラさん」凛が、縁側に声を掛けた。「来島暁は、今、どこに」"}, {"t": "p", "v": "「今治の社屋。……たぶん、こっちが竜宮に着くのを待ってる」サラがPCを覗いた。「鬼頭は、行方不明。来島の管理下を完全に外れてる。あの人が一番、読めない」"}, {"t": "p", "v": "「朝倉は」と、真琴。"}, {"t": "p", "v": "「動いてます」サラが別の画面を出した。「内閣官房が、来島海峡の一部海域に、<strong>『文化財緊急保全指定』の閣議請議</strong>を上げてる。指定されたら、民間の潜水は全面禁止。……請議の予定日は」"}, {"t": "p", "v": "「いつだ」"}, {"t": "p", "v": "「四日後」"}, {"t": "p", "v": "　直人は指を折った。<br>　竜宮の潜水条件――大潮の潮止まりが揃うのは、三
