ない。<br>なら、通るのは何か。封印庫では、装置の枠に押し込んで止めた。ここに封印処理装置はない。あるのは、俺の手と、道具と、店だけだ。"}, {"t": "p", "v": "「大将、二枚目張るぞ！　下がれ！」"}, {"t": "p", "v": "『城壁　61.3％ → 61.6％』"}, {"t": "p", "v": "ガクの二枚目の壁が立つのと、最初の壁が砕けるのが同時だった。<br>白い破片の向こうで、管理機が半歩、店の中へ入る。"}, {"t": "p", "v": "その半歩に、ひかりが反応した。"}, {"t": "p", "v": "『【聖騎士】自動防御・展開』<br>『残量　15.5％ → 15.1％』"}, {"t": "p", "v": "「っ、だめ――！」"}, {"t": "p", "v": "光の盾が、俺と管理機の間に勝手に開く。<br>彼女は使っていない。使わされている。守るたびに、彼女の残りが削れていく。<br>管理機は盾を素手で二度叩き、三度目で罅を入れた。"}, {"t": "p", "v": "『15.1％ → 14.8％』"}, {"t": "p", "v": "「やめろ」と、俺は言った。管理機にじゃない。数字にだ。<br>それでも数字は聞かない。彼女の聖騎士は、彼女の命令を聞かずに、彼女を削って俺を守る。"}, {"t": "p", "v": "ひかりが、前に出ようとした。"}, {"t": "p", "v": "「私が行けば、終わる。修くん、この子たちの用は私で――」"}, {"t": "p", "v": "「終わらせない」"}, {"t": "p", "v": "彼女の肩を、素手じゃない方の手で止めた。<br>それから、管理機に向かって、腹の底から言った。"}, {"t": "p", "v": "「聞け、回収！　対象は壊れてる。<strong>壊れてる物を回収するのは、おまえらの仕事じゃない</strong>」"}, {"t": "p", "v": "管理機の足が、止まった。"}, {"t": "p", "v": "「壊れ物の窓口は保守だ。保守は生きてる。八年前から、ずっとこの街で店を開けてる。――俺が、その七番目だ！」"}, {"t": "p", "v": "静寂。<br>二機が、同時に首を傾げた。同じ角度で。"}, {"t": "p", "v": "『照会中……』<br>『照会中……』"}, {"t": "p", "v": "天井の揺らぎから、三機目が降りてきた。<br>二機より背が高く、外套に、見覚えのある意匠が縫い取られている。歯車を七つ、輪に並べた紋。"}, {"t": "p", "v": "三機目は、店とガクの壁とひかりを順に見て、最後に俺を見た。"}, {"t": "p", "v": "「――<strong>七番目の保守枠</strong>。声紋、確認。……ですが」"}, {"t": "p", "v": "管理機の声に、初めて、人間のような抑揚が乗った。"}, {"t": "p", "v": "「保守契約の登録が、ありません。契約なき保守は、保守ではない。よって回収を続行します」"}, {"t": "p", "v": "契約。<br>書類。伝票。役所と同じだ。中身より先に、紙が要る。"}, {"t": "p", "v": "そして、紙の専門家は――夜明け前から、規定を読みに行っている。"}, {"t": "p", "v": "「ペンチ」と、俺は静かに言った。「蓋、開けとけ。全員入れる準備だ」"}, {"t": "p", "v": "『残量　14.8％ → 14.6％』"}, {"t": "card", "v": "【回収予定日】満了──執行中\n【管理機】3機──うち1機、七つ歯車の紋\n【雨宮ひかり】残量：14.6％\n【ガク】城壁2枚──摩耗率61.6％\n【ナナオ】不在──『規定を読んでいます』"}], "chars": 2149}, {"title": "第20話　保守契約", "paras": [{"t": "p", "v": "ペンチの蓋が全開になり、ひかりの腕を引いた、その時だった。"}, {"t": "p", "v": "「――お待たせしました」"}, {"t": "p", "v": "店の戸口に、ナナオが立っていた。<br>髪に埃をかぶり、両腕に、分厚い紙の束を抱えている。徹夜で書庫を漁った受付の顔だった。"}, {"t": "p", "v": "「七〇八号」三機目の管理機が言った。「業務報告を。対象の引き渡しは」"}, {"t": "p", "v": "「その前に、受理していただく書類があります」"}, {"t": "p", "v": "ナナオは紙の束から、一枚を抜いて掲げた。"}, {"t": "p", "v": "「第七工房回収規定、第千百八十四条。<strong>製造元保証</strong>。――設計損耗に起因する故障は、製造元の責めに帰す。保守枠による本修理の実施予定が登録された場合、当該対象の回収は、履行期限まで停止する」"}, {"t": "p", "v": "『……照会中』"}, {"t": "p", "v": "「続けて、様式第九十一号。<strong>本修理予約票</strong>。対象:聖騎士S-077系列稼働個体。実施場所:第七工房・製造ライン。実施者――」"}, {"t": "p", "v": "ナナオは、俺を見た。"}, {"t": "p", "v": "「保守枠。直井修」"}, {"t": "p", "v": "「契約なき保守は、保守ではない」三機目が繰り返した。「保守枠の契約登録が存在しない」"}, {"t": "p", "v": "「存在します。<strong>今、します</strong>」"}, {"t": "p", "v": "ナナオはもう一枚、書式を掲げた。"}, {"t": "p", "v": "「保守契約登録。契約者:第七工房。受託者:直井修。登録番号――<strong>保守第7-002</strong>」"}, {"t": "p", "v": "「登録権限は」"}, {"t": "p", "v": "「私は回収受付です」"}, {"t": "p", "v": "ナナオは、伝票の顔のまま、はっきり言った。"}, {"t": "p", "v": "「<strong>受付は、受け付けます</strong>」"}, {"t": "br"}, {"t": "p", "v": "沈黙は、長かった。<br>三機の管理機が、同じ角度で首を傾げたまま、微動もしない。店の床の鉄屑がひとつ、俺の磁手の名残でかたりと動いた。それくらい静かだった。"}, {"t": "p", "v": "『照会……完了』<br>『受付権限、照合──七〇八号、有効』<br>『様式適合』<br>『受託者の署名を要求』"}, {"t": "p", "v": "「整備士さま。ここへ」"}, {"t": "p", "v": "ナナオが差し出した書式の、受託者の欄に、俺は油の染みた指で書いた。<br>直井修。<br>書き終えた瞬間、紙の上の字が、薄い金色に沈んだ。"}, {"t": "p", "v": "『署名確認。登録を受理』<br>『対象の回収を停止。本修理の履行期限――<strong>三十日</strong>』"}, {"t": "p", "v": "三機目が、外套の裾を払って、頭を下げた。機械の礼だった。"}, {"t": "p", "v": "「保守第7-002。履行期限内に、製造ラインでの本修理完了を確認できない場合、回収を再開します。……期限は、延びません」"}, {"t": "p", "v": "「知ってる。うちの店は、期限に恵まれない」"}, {"t": "p", "v": "「それと」三機目は、戸口の外――認可局の隊列の方を一瞥した。「行政から受理していた<strong>身柄引き渡しへの協力要請</strong>は、却下します。本件対象は、履行期限まで保守枠の管理下に置かれます」"}, {"t": "p", "v": "言い残して、三機は天井の揺らぎに戻っていった。"}, {"t": "p", "v": "外の隊列は、しばらく動かなかった。<br>当然だ。連中の作戦は「回収が押さえ、行政が受け取る」の二段構え。前段が消えた今、令状もなしに地下市場へ踏み込めるだけの人数は、用意していない。市場中の戸が一斉に開いて、住人が何百人、無言で入り口を見た。<br>数分後、隊列が崩れて引き上げていく音がした。網は、張った形のまま空を掴んだわけだ。今回は、だが。"}, {"t": "p", "v": "ガクが、壁を解いて、その場に大の字になった。"}, {"t": "p", "v": "「……なあ大将。俺は今日、何もしてなくねえか」"}, {"t": "p", "v": "「二枚で二度、止めた。十分だ」"}, {"t": "p", "v": "「そうかい」と、天井に向かって笑って、それから急に、真顔になった。「三十日で、坑の一番下ってのは、正気の日程なのか」"}, {"t": "br"}, {"t": "p", "v": "夜、店で作戦会議になった。"}, {"t": "p", "v": "「道は、坑の一番下です」とナナオ。「最深部の搬入口から、向こう側――工房区画へ入れます。私は経路を知っています」"}, {"t": "p", "v": "「S級ダンジョンの最深部よ」いろはが帳面を開く。「ギルドの攻略班が七年かけて、まだ中層の先までしか地図がない。それを三十日」"}, {"t": "p", "v": "「行くしかないんだろ」と、俺は言った。「ひかりの本修理は、製造ラインでしかできない。期限を過ぎれば回収が再開する。……それに」"}, {"t": "p", "v": "胸元のお守りに、指先で触れた。"}, {"t": "p", "v": "「保守第7-002。002ってことは、001がいた。八年前の先代だ。あいつの工房が、坑の一番下にある。見に行かない理由が、もうない」"}, {"t": "p", "v": "ひかりは、しばらく黙って皆の顔を見回してから、手を挙げた。"}, {"t": "p", "v": "「あの。私、荷物じゃなくて、戦力として数えてほしいんだけど」"}, {"t": "p", "v": "「残量14.6の戦力か」"}, {"t": "p", "v": "「うっ」"}, {"t": "p", "v": "「今夜、応急をやる。闇部品の残りで、届くところまで戻す。……ただし、旅の分の部品は残す。いいな」"}, {"t": "p", "v": "「……うん。修理屋さんの言う通りに」"}, {"t": "p", "v": "ペンチが、蓋をぱかぱか言わせた。"}, {"t": "p", "v": "「ボクも行く！　最深部の宝箱、ぜったい大物だよ。王様よりすごい箱に、ボクはなる」"}, {"t": "p", "v": "「箱の出世話は道中で聞く。……ガクは」"}, {"t": "p", "v": "ガクは手帳を開いて、振込の控えを親指で二度めくって、閉じた。"}, {"t": "p", "v": "「行くさ。殿は俺の商売だ。……それによ、大将。娘に会う時に『残量四割です』って言うのと、『この前、坑の一番下まで行ってきた』って言うの、どっちが親父の面子が立つと思う」"}, {"t": "p", "v": "「両方言え」"}, {"t": "p", "v": "いろはは、最後まで帳面を閉じなかった。"}, {"t": "p", "v": "「私は入り口まで。搬入路と補給の手配、闇部品の在庫、全部持たせる。中には――入らない。<strong>奥を見るのは、あんたたちの仕事</strong>」"}, {"t": "p", "v": "言い方が、少しだけ、封印庫の夜と同じだった。<br>この女はまた、俺たちに何かを見せようとしている。今度は、それでもよかった。見たいものが、こっちにもある。"}, {"t": "br"}, {"t": "p", "v": "出発は三日後と決めた。準備と、応急と、慣らしのための三日だ。"}, {"t": "p", "v": "寝る前に、店の戸口で、ナナオが立っていた。<br>夜のうちに書類を綴じ直したらしく、腕の中の束が、綺麗に揃っている。"}, {"t": "p", "v": "「整備士さま。一件、報告を」"}, {"t": "p", "v": "「なんだ」"}, {"t": "p", "v": "「規定は、千二百条ありました。全部読みました。……先代の名前は、最後の頁にありました」"}, {"t": "p", "v": "「最後の頁」"}, {"t": "p", "v": "「<strong>規定の起草者の欄に</strong>」"}, {"t": "p", "v": "ナナオは、それだけ言って、頭を下げて、丸椅子に戻った。<br>回収の規定を書いたのが、保守の先代。<br>つまりあの千二百条は――檻じゃなく、鍵束として書かれている。"}, {"t": "p", "v": "八年前に誰かが配ったのは、スキルだけじゃなかったらしい。"}, {"t": "card", "v": "【本修理・履行期限】あと30日\n【目的地】坑の最深部──第七工房・製造ライン\n【雨宮ひかり】残量：14.6％──今夜、応急予定\n【保守契約】登録番号：保守第7-002（先代＝001）"}, {"t": "p", "v": "（第2アーク・了）"}], "chars": 2577}, {"title": "第21話　納品旅行", "paras": [{"t": "p", "v": "出発前夜、約束どおり応急をやった。"}, {"t": "card", "v": "【聖騎士】応急整備\n　使用部品：闇部品──聖騎士用（残り2回分のうち1）\n　工程：29\n『残量　14.6％ → 23.0％』"}, {"t": "p", "v": "「にじゅうさん」ひかりは表示を指で二度なぞった。「二割超えって、いつ以来だろ」"}, {"t": "p", "v": "「四年ぶりくらいじゃないのか。……言っておくが、慣らしの間は出力五割だ。前線には立たせない」"}, {"t": "p", "v": "「はいはい。荷物じゃなくて、五割の戦力ね」"}, {"t": "p", "v": "応急を重ねると、噛み合わせはまた一から馴染ませ直しになる。慣らしはやり直しだ。文句を言われる前に、規則の方を先に言っておいた。"}, {"t": "p", "v": "表示を閉じる前に、癖で、自分も視た。<br>他人の数字は全部見えるのに、俺の胸の【修理屋】だけは、今日も製造番号の欄が欠けたままだった。JOBが発現した六年前から、ずっとだ。"}, {"t": "p", "v": "聖騎士用の闇部品は、これで残り一回分。<br>完治は、坑の一番下の製造ラインでしかできない。持ち時間は三十日。うち三日を、準備に使った。"}, {"t": "br"}, {"t": "p", "v": "出発の朝、坑口の裏手に、見送りじゃない人影が一つ立っていた。"}, {"t": "p", "v": "黒の詰襟。腰に断鋼。<br>乾だった。"}, {"t": "p", "v": "「……執行官どの。うちの引っ越し先は、また役所に割れたのか」"}, {"t": "p", "v": "「割れていない。俺が調べただけだ」"}, {"t": "p", "v": "乾は懐から、折り畳んだ書面を出した。"}, {"t": "p", "v": "『特別監察任務──非認可保守活動の実態調査。担当:封印執行官・乾。期間:三十日』"}, {"t": "p", "v": "「認可局は、回収の一件で恥をかいた。工房の『保守』とやらの実態を調べて報告しろと、俺に命が下りた。……自分で具申した任務だがな」"}, {"t": "p", "v": "「自分で？」"}, {"t": "p", "v": "「監察対象に同行するのが、一番早い」"}, {"t": "p", "v": "ガクが露骨に顔をしかめて、盾を担ぎ直した。"}, {"t": "p", "v": "「大将、こいつは、あんたの店を二回潰しに来た役人だぞ」"}, {"t": "p", "v": "「三回だ」と乾が訂正した。「潰せたのは一回もないが」"}, {"t": "p", "v": "「……剣は数えたか？　こっちには白刃取りの前科がある」"}, {"t": "p", "v": "「その節は」乾は真顔のまま、わずかに頭を下げた。「良い整備だった」"}, {"t": "p", "v": "とんちんかんな返事に、ガクが毒気を抜かれて黙る。<br>俺は書面を返して、一つだけ聞いた。"}, {"t": "p", "v": "「報告書には、何を書く」"}, {"t": "p", "v": "「見た通りのことを。……ただし、書く前に必ず読み上げる。載せたくない行があれば、その場で言え。消すかどうかは、俺が決める」"}, {"t": "p", "v": "正直な役人の、精一杯の条件だった。<br>断る理由を探したが、A級の剣より上等な理由が見つからなかった。"}, {"t": "p", "v": "「決まりね」いろはが帳面を閉じた。「では諸君、開店よ。――地下三十層。表の攻略路なら徒歩二十七日、<strong>うちの搬入路なら六日</strong>。補給は余裕を見て九日分、中継庫に仕込んである。感謝しなさい」"}, {"t": "p", "v": "いろは自身は、坑口の鉄柵から先へは来なかった。"}, {"t": "p", "v": "「言ったでしょ、私は入り口まで。私の言う入り口は、ここ。……奥を見るのは、あんたたちの仕事」"}, {"t": "p", "v": "帳面で軽く俺の肩を叩いて、闇のブローカーは、朝の光の側に残った。"}, {"t": "br"}, {"t": "p", "v": "いろはの搬入路は、表の攻略路と違って、静かだった。"}, {"t": "p", "v": "ギルドの検問を三つ、通らずに抜けた。台帳の上で「摘出済み」のひかりは、表の検問を一つも通れない。裏の道は、そのために買ってある。"}, {"t": "p", "v": "五層。十層。<br>浅い層の魔物は、ガクの壁とペンチの「そっちは行き止まり」で、ほとんど戦わずに捌けた。ナナオは先頭で、歩幅を一定に保ったまま、道を読み上げていく。"}, {"t": "p", "v": "「次の分岐、右です。左は七年前に崩落。……この標識は、先代の字です」"}, {"t": "p", "v": "岩肌に、白い塗料の矢印。<br>その横に、小さく『↓納品はこちら』と書き添えてある。"}, {"t": "p", "v": "「……納品て」"}, {"t": "p", "v": "「先代は月に一度、この道で工房へ通っていました。修理した量産機の納品と、部品の仕入れに。私はその、荷運びでした」"}, {"t": "p", "v": "「回収員が、荷運び」"}, {"t": "p", "v": "「規定にない業務でした」ナナオは前を向いたまま言った。「規定にない時間が、いちばん、長く感じました」"}, {"t": "p", "v": "隣でひかりが、俺の袖を軽く引いた。<br>――いい話っぽいのに顔が変わらないの、あの子。<br>――機械なりの照れ隠しだ。放っておけ。"}, {"t": "br"}, {"t": "p", "v": "十五層の中継庫で、最初の夜営になった。"}, {"t": "p", "v": "火を囲んで、ガクが飯盒を振り、乾が黙って薪を足し、ペンチが「ボクの中で寝ていいよ、一人二百円」と商売を始め、誰も乗らなかった。"}, {"t": "p", "v": "見張りの交代で、俺は入り口の岩に腰を下ろした。<br>静かな夜だった。静かすぎる、と気づいたのは、ペンチが隣に滑ってきてからだ。"}, {"t": "p", "v": "「……ご主人。変だよ」"}, {"t": "p", "v": "「なにがだ」"}, {"t": "p", "v": "「この層、箱がいない」"}, {"t": "p", "v": "「箱？」"}, {"t": "p", "v": "「宝箱。ミミックも、ただの箱も。中層の上がり口には、いつも何個かいるんだ。逃げ遅れたやつが」"}, {"t": "p", "v": "蓋を、カタ、と鳴らして、ペンチは言った。"}, {"t": "p", "v": "「<strong>逃げ遅れた</strong>って言ったの、今、自分で分かった。……ねえご主人。箱はね、動けないから、罠と一緒に置かれるんだよ。その箱が、いない。上の層に、逃げてきてる」"}, {"t": "p", "v": "「――下で、何かが起きてるってことか」"}, {"t": "p", "v": "「箱が逃げる方向の、反対に行くんだよ、ボクたち」"}, {"t": "p", "v": "火の方を振り返る。<br>ナナオが、火明かりの中でこちらを見ていた。聞こえていたらしい。"}, {"t": "p", "v": "「補足します。工房区画の稼働音が――<strong>二年前から、少しずつ増えています</strong>」"}, {"t": "p", "v": "「増えて」"}, {"t": "p", "v": "「無人のはずの製造ラインが、です」"}, {"t": "card", "v": "【本修理・履行期限】あと27日\n【現在地】十五層・中継庫\n【雨宮ひかり】残量：23.0％──慣らし中・出力五割\n【闇部品（聖騎士用）】残り1回分"}], "chars": 2164}, {"title": "第22話　鳴りの大空洞", "paras": [{"t": "p", "v": "出発から三日目。二十四層は、地図に名前だけ載っている。<br>『鳴りの大空洞』。ギルドの攻略班が七年前に三度挑んで、三度とも「戦闘記録なし・死者八名」で引き返した層だ。"}, {"t": "p", "v": "「戦わずに、どうやって八人死ぬんだよ」とガク。"}, {"t": "p", "v": "「音です」とナナオ。「この層の主は【耳】です。音に集まり、音の出た場所を、群れで潰します。攻略班は、剣を抜いた音で終わりました」"}, {"t": "p", "v": "天井の見えない大空洞に、細い桟道が一本。<br>壁一面に、白い風鈴みたいなものが、何千も、静かにぶら下がっている。あれが全部、耳だ。"}, {"t": "p", "v": "「通過の規則を言います。声は囁きまで。金属音は禁止。走らない。<strong>そして――</strong>」"}, {"t": "p", "v": "ナナオが、ひかりを見た。"}, {"t": "p", "v": "「<strong>驚かない</strong>」"}, {"t": "br"}, {"t": "p", "v": "問題は最初から分かっていた。<br>ひかりの聖騎士は、本人が驚けば勝手に立ち上がる。寝ていてもだ。光と、音と一緒に。"}, {"t": "p", "v": "「だから、私はこれ」"}, {"t": "p", "v": "ひかりは自分から、ペンチの蓋を指した。"}, {"t": "p", "v": "「引っ越し二回目。……ちゃんと、いい匂いの布、敷いてよね」"}, {"t": "p", "v": "「敷いた！　花の匂いのやつ。二百円」"}, {"t": "p", "v": "「ツケで」"}, {"t": "p", "v": "ペンチの中なら、光は蓋一枚ぶん殺せる。音も、敷いた布が吸う。完全じゃないが、外を歩かせるよりは、ずっとましだった。"}, {"t": "p", "v": "蓋が閉まる直前、ひかりは俺を見て、囁きで言った。"}, {"t": "p", "v": "「修くん。私が中で寝てる間に、全員そろって前に進むこと。……守られてばっかりの遠足は、嫌なんだからね」"}, {"t": "p", "v": "蓋が、音もなく閉じた。"}, {"t": "br"}, {"t": "p", "v": "桟道は、長かった。<br>ガクは盾を布で包み、乾は刀の鯉口を紐で縛った。抜けなくするためじゃない。抜く時に、音を殺すためだそうだ。縛り方で音が変わるらしい。役人のくせに、妙な芸を持っている。"}, {"t": "p", "v": "半分まで来た。<br>そこで、ペンチの蓋が、こつん、と鳴った。"}, {"t": "p", "v": "中で、ひかりが寝返りを打った。それだけの音。<br>壁の風鈴が、一斉に、こちらを向いた。"}, {"t": "p", "v": "『【聖騎士】自動防御・待機』"}, {"t": "p", "v": "蓋の隙間から、光が漏れかけている。<br>夢の中で、彼女の聖騎士が、耳たちの視線に反応しかけている。守ろうとして、全員を殺す光だ。"}, {"t": "p", "v": "「――磁手」"}, {"t": "p", "v": "俺は囁いて、胸に抱えたペンチの底を、桟道の鉄の手すりへそっと当てた。それから、手すりに磁場を薄く流した。<br>音を出さずにできることは少ない。だが、鉄を撫でることはできる。手すりの振動を指先で整えて、揺り籠の周期に変えた。船の揺れと同じだ。箱ごと、ゆっくり、揺らす。"}, {"t": "p", "v": "『【磁手】耐久　39.5％ → 39.4％』"}, {"t": "p", "v": "蓋の光が、すっと引いた。<br>寝入った。二十歳前の S級探索者は、箱の中で、揺らされて寝入った。"}, {"t": "p", "v": "『残量　23.0％ → 22.9％』"}, {"t": "p", "v": "〇・一。夢の中の反応だけで、それでも減る。<br>この数字を止めるまで、あと二十六日。歩く理由が、また一つ、重みを増した。"}, {"t": "br"}, {"t": "p", "v": "終わりの三十歩で、しくじった。"}, {"t": "p", "v": "しくじったのは、俺たちじゃない。<br>桟道の出口の岩が、勝手に崩れた。老朽だ。拳大の石が一つ、空洞の底へ落ちて――遠く、下の方で、鳴った。"}, {"t": "p", "v": "壁の風鈴、数千が、いっせいに開いた。"}, {"t": "p", "v": "「走れッ！」"}, {"t": "p", "v": "もう囁く意味はない。ガクが吼えて、出口の岩戸を肩でこじ開ける。<br>白い群れが、空洞の壁を剥がれて、雪崩みたいに桟道へ落ちてくる。"}, {"t": "p", "v": "「乾！」"}, {"t": "p", "v": "「承知」"}, {"t": "p", "v": "紐が、ひゅっと解けた。<br>初めて見る速さの抜刀だった。音はしなかった。斬撃にも、着地にも、鞘走りにも、最後まで音がなかった。桟道に届いた先頭の十数体が、音もなく、縦に割れて落ちた。"}, {"t": "p", "v": "『【断鋼】摩耗率　29.1％ → 29.2％』"}, {"t": "p", "v": "温存され続けたA級の、本気の仕事を、初めて見た。<br>そして音がないから、この斬撃は、別の壁の【耳】を新しく起こさない。見せ場じゃなく、勝ち筋の型だった。"}, {"t": "p", "v": "「行け、整備工！　殿は俺とこの男だ！」"}, {"t": "p", "v": "「言われなくても！」"}, {"t": "p", "v": "ガクの壁が出口を塞ぎ、白い群れがその向こうで砕け続ける。"}, {"t": "p", "v": "『【重戦士】固有・城壁　展開』<br>『摩耗率　61.6％ → 61.9％』"}, {"t": "p", "v": "最後に岩戸が閉まって、大空洞の鳴りは、石の厚みの向こうに消えた。"}, {"t": "br"}, {"t": "p", "v": "二十五層の下り坂で、ペンチの蓋が開いて、寝ぼけたひかりが顔を出した。"}, {"t": "p", "v": "「……ん。着いた？　私、ちゃんと役に立った？」"}, {"t": "p", "v": "「あぁ」と、俺は言った。「一回寝返りを打って、全員の寿命を三年縮めた」"}, {"t": "p", "v": "「えっ」"}, {"t": "p", "v": "「よく寝てたってことだ。気にするな」"}, {"t": "p", "v": "ガクと乾が、同時にそっぽを向いて笑いを噛んだ。初めて息の合った二人だった。"}, {"t": "p", "v": "先を歩いていたナナオが、足を止めた。<br>下りの道の先――二十五層の広間を、何かの行列が横切っていく。"}, {"t": "p", "v": "箱だった。<br>大小の宝箱が、数十個。蓋をカタカタ言わせながら、上りの坂道を、列になって逃げていく。"}, {"t": "p", "v": "ペンチが、蓋を大きく開けて、それから、ゆっくり閉じた。"}, {"t": "p", "v": "「……みんな、逃げてる。下から」"}, {"t": "p", "v": "行列の最後尾の小箱が、俺たちの横を通り抜ける瞬間、一度だけ止まって、蓋を鳴らした。<br>ペンチが、鳴き返した。<br>短い、箱同士の会話だった。"}, {"t": "p", "v": "「なんて言ってた」"}, {"t": "p", "v": "「『<strong>下の工場が、箱を作るのをやめた</strong>』って」"}, {"t": "p", "v": "「……やめて、何を作ってる」"}, {"t": "p", "v": "「『<strong>回収する側</strong>』だって」"}, {"t": "card", "v": "【本修理・履行期限】あと25日\n【現在地】二十五層\n【雨宮ひかり】残量：22.9％\n【ガク】摩耗率：61.9％\n【剣聖】66.9％／【磁手】39.4％"}], "chars": 2183}, {"title": "第23話　搬入口", "paras": [{"t": "p", "v": "二十六層から下は、静かなのに、種類の違う静けさだった。"}, {"t": "p", "v": "魔物がいない。<br>巣の跡はある。爪痕も、食い散らかした骨もある。住人だけが、いない。"}, {"t": "p", "v": "「掃除されてますね」と、ナナオ。"}, {"t": "p", "v": "「掃除？」"}, {"t": "p", "v": "「見てください」"}, {"t": "p", "v": "広間の中央に、金属の杭が一本、床に打ち込まれていた。<br>杭の頭に、小さな札が付いている。"}, {"t": "card", "v": "『回収済　第26層　生体資源一式\n　処理番号：8821──8859\n　第二工房・資源課』"}, {"t": "p", "v": "「魔物まで、回収の対象なのか」"}, {"t": "p", "v": "「魔物『まで』ではありません」ナナオは杭から目を離さずに言った。「工房群にとって、この坑にあるものは全部、資源か、製品か、不良品です。……人間の言葉で言う『生き物』という欄が、台帳にないだけです」"}, {"t": "p", "v": "乾が、杭の札を書き写しながら、低く言った。"}, {"t": "p", "v": "「――俺たちが八年、命懸けで潜ってきた坑は、連中の倉庫だったわけか」"}, {"t": "p", "v": "「報告書に書くのか、それ」"}, {"t": "p", "v": "「書く。……国は知るべきだ。自分たちが檻の中で宝探しをしていたことを」"}, {"t": "br"}, {"t": "p", "v": "二十九層の中継庫は、先代の匂いがした。"}, {"t": "p", "v": "物の置き方で分かる。工具は壁に、大きい順。油は棚の下段。使いかけの部品箱に、白ペンキで『まだ使える』。うちの店と、同じ並べ方だった。<br>俺が親方の工房で覚えた並べ方は、親方のものじゃなかったのかもしれない。あの親方も、どこかで誰かに教わった。教わった誰かの先を辿ったら、たぶん、ここに着く。"}, {"t": "p", "v": "棚の一番奥に、湯呑みが二つ、伏せてあった。<br>一つは大人の手の寸法。もう一つは、小さい。"}, {"t": "p", "v": "ナナオは、それを見て、何も言わなかった。<br>二つの湯呑みが、いつから伏せられたままなのか。俺には、聞けなかった。"}, {"t": "br"}, {"t": "p", "v": "三十層。"}, {"t": "p", "v": "坑の一番下は、崖だった。<br>下りの道が尽きて、目の前に、黒い金属の壁が立っている。壁というより、船の側面みたいだった。高さは見上げても終わらない。横幅は、闇に溶けて測れない。"}, {"t": "p", "v": "その中央に、両開きの扉。<br>うちの店が丸ごと百軒入る大きさの、巨大な扉だ。表面に、七つの歯車を輪に並べた紋が、家紋みたいに浮き出ている。"}, {"t": "p", "v": "そして扉の右下の隅に、不釣り合いに小さな、人間サイズの戸が一つ。<br>戸の横に、木の札が掛かっている。日に焼けて、字が薄い。"}, {"t": "p", "v": "『<strong>搬入口　用のある方はお鳴らしください</strong>』"}, {"t": "p", "v": "その下に、誰かの字で、書き足してある。"}, {"t": "p", "v": "『<strong>修理のご相談も、こちらへ</strong>』"}, {"t": "p", "v": "「……先代の字です」と、ナナオが言った。声が、少しだけ、伝票じゃなかった。"}, {"t": "p", "v": "ひかりが、俺の袖を握った。<br>折り紙の星を、外套の上から確かめる癖が、もう癖と呼べる頻度になっている。"}, {"t": "p", "v": "「ここが、私の……製造元」"}, {"t": "p", "v": "「あぁ」"}, {"t": "p", "v": "「変な気分。実家が、こんなに大きいなんて聞いてない」"}, {"t": "p", "v": "軽口の語尾が、少し震えていた。<br>俺は呼び鈴の紐に手を掛けて――止めた。"}, {"t": "p", "v": "鳴らす前に、気づいた。<br>戸の向こうで、音がしている。<br>規則正しい、機械の駆動音。プレスの音。ベルトの走る音。<br>無人のはずの工場の音が、扉の厚みの向こうで、脈みたいに続いている。"}, {"t": "p", "v": "「ナナオ。稼働音が増えてるって言ったな。……これは『少し』か？」"}, {"t": "p", "v": "「いいえ」"}, {"t": "p", "v": "ナナオの目が、伝票の顔のまま、初めて険しくなった。"}, {"t": "p", "v": "「八年前の、<strong>フル稼働と同じ音</strong>です」"}, {"t": "p", "v": "呼び鈴を、鳴らさなかった。<br>その必要が、なくなったからだ。"}, {"t": "p", "v": "小さい方の戸が――<strong>内側から</strong>、開いた。"}, {"t": "p", "v": "戸口に立っていたのは、管理機でも、量産機でもなかった。<br>継ぎだらけの作業着。腰の工具ベルト。油の染みた手袋。<br>初老の、人間の男に見える誰かが、俺たちを順に見て、最後に、俺の胸元の欠けた六角レンチで目を止めた。"}, {"t": "p", "v": "「――納品ですか」"}, {"t": "p", "v": "男は、ゆっくりと目を細めた。"}, {"t": "p", "v": "「八年ぶりですね。……<strong>そのレンチを持つ方を、待っていました</strong>」"}, {"t": "card", "v": "【本修理・履行期限】あと22日\n【現在地】三十層──第七工房・搬入口\n【雨宮ひかり】残量：22.9％"}], "chars": 1650}, {"title": "第24話　回収工場", "paras": [{"t": "p", "v": "搬入口の内側は、街だった。"}, {"t": "p", "v": "天井は見えない。壁も見えない。見えるのは、闇の中を走る何百本ものベルトと、その上を流れていく結晶の光の列だけだ。プレスが落ち、火花が散り、磨かれた結晶が籠に落ちる。籠が満ちると、腕だけの機械がそれを運んでいく。<br>音の全部が、規則正しかった。心臓の音を、街ひとつ分に拡大したみたいだった。"}, {"t": "p", "v": "「足元、白線の内側を。ベルトに近づくと、資材と誤認されます」"}, {"t": "p", "v": "言われた三秒後に、ガクの盾の端が白線を越えた。<br>横から伸びた運搬の腕が、盾ごとガクを掴みかけて――ナナオが無言で襟首を引き戻した。腕は何事もなかったように、隣の籠を持って行った。"}, {"t": "p", "v": "「……おい。今、俺は棚に並ぶとこだったのか」"}, {"t": "p", "v": "「はい。規格外の大型資材として」"}, {"t": "p", "v": "ナナオの案内で、全員、白線の真ん中を歩いた。<br>先頭を行く初老の男は、時々立ち止まっては、ベルトの継ぎ目を指の背で叩いた。叩いて、頷いて、また歩く。癖でやっているのが分かる。うちの店で、俺が毎朝、作業台の脚を蹴って建て付けを確かめるのと同じ類の癖だ。"}, {"t": "p", "v": "「……あんた、名前は」"}, {"t": "p", "v": "「時任」と、男は前を向いたまま言った。「時任ゲン。もっとも、今の登録は違うがな」"}, {"t": "p", "v": "男は、作業着の袖をまくった。<br>前腕に、焼き印みたいな刻印が入っていた。"}, {"t": "card", "v": "『備品7-441』"}, {"t": "p", "v": "「八年前に回収されて、備品になった。人間をやめた覚えはないんだが、台帳の方が強くてな。この中じゃ、わしは工具の一種だ」"}, {"t": "p", "v": "隣で、ナナオの足が止まった。"}, {"t": "p", "v": "「……先代」"}, {"t": "p", "v": "「おう」"}, {"t": "p", "v": "「膝が、直りました」"}, {"t": "p", "v": "ナナオはそれだけ言って、深く、長く、頭を下げた。<br>ゲンは、下げられた頭を見て、それから俺の胸元の欠けたレンチを見て、目尻だけで笑った。"}, {"t": "p", "v": "「そうか。……いい後継だ、七〇八。荷運びの目は確かだった」"}, {"t": "br"}, {"t": "p", "v": "道の途中に、見覚えのある光景があった。"}, {"t": "p", "v": "壁一面の棚。同じ形の結晶が、同じ向きで、際限なく差してある。<br>第三封印庫の、奥の棚。あれを千倍にした眺めだった。"}, {"t": "p", "v": "「第二工房の在庫区画だ」ゲンが言った。「回収された結晶は、ここへ戻る。人間の役所の封印庫にあるのは、その出先の棚でな。技術も棚も、元はこっちだ」"}, {"t": "p", "v": "「……除籍封印は、工房の技術の借り物、か」"}, {"t": "p", "v": "「借り物というより、下請けだな。人間の制度は、回収の手足として、よくできとる」"}, {"t": "p", "v": "乾が、手帳に書く手を止めずに聞いた。"}, {"t": "p", "v": "「時任どの。確認する。この八年、国の除籍封印で摘出された結晶は――ここへ、納品されていたのか」"}, {"t": "p", "v": "「全部ではない。だが、工房銘の残っとる初期ロットはな」"}, {"t": "p", "v": "「……国は、それを知らんぞ」"}, {"t": "p", "v": "「知らんだろうな。<strong>知らんで済む位置に、置かれとるんだ</strong>」"}, {"t": "p", "v": "乾の手帳の上で、鉛筆の芯が、めきりと折れた。"}, {"t": "br"}, {"t": "p", "v": "一番奥のラインの前で、ゲンは足を止めた。"}, {"t": "p", "v": "流れているのは、結晶ではなかった。<br>白い手袋。灰色の外套。関節の露出した腕。<br>管理機だ。組み上がる途中の管理機が、何十、何百と、ベルトの上を流れていく。"}, {"t": "p", "v": "「……箱の言った通りだ」と、俺は言った。「箱を作るのをやめて、回収する側を作ってる」"}, {"t": "p", "v": "「二年前からな」ゲンは流れる腕の列を、職人の目で見ていた。「中枢は八年間、数を数えとった。配った製品の故障率。暴走の件数。人間側の、使い方の荒さ。――で、先月、閾値を超えた」"}, {"t": "p", "v": "「閾値を超えると、どうなる」"}, {"t": "p", "v": "「市場回収だ」"}, {"t": "p", "v": "ゲンは、こともなげに言った。"}, {"t": "p", "v": "「配った製品の、全数回収。スキルってやつを、人間から全部引き上げる。……そのための手足を、いま増産しとる」"}, {"t": "p", "v": "全数回収。<br>言葉の意味が、腹に落ちるまで数秒かかった。<br>ひかり一人の話じゃない。ガクの城壁も、乾の断鋼も、あの左官屋の鏝も、ガキの湯沸かしも――八年前から人間の暮らしに混ざった結晶の全部を、引き抜く。"}, {"t": "p", "v": "ガクが、外套の上から、懐の振込の控えを押さえた。"}, {"t": "p", "v": "「……壁を抜かれたら、俺は娘に、何を渡して生きてくんだ」"}, {"t": "p", "v": "誰も、答えなかった。答えの代わりに、全員の目が、少しずつ据わった。"}, {"t": "p", "v": "「発動は、いつだ」"}, {"t": "p", "v": "「二十四日後」"}, {"t": "p", "v": "俺は、指を折った。<br>履行期限が、二十二日後。<br>その二日後に、世界の方の期限が来る。"}, {"t": "p", "v": "「……うちの期限の、すぐ裏じゃないか」"}, {"t": "p", "v": "「同じ時計だからな」ゲンは自分の腕の刻印を、親指で撫でた。「保証期限も、回収予定も、全部おなじ時計で回っとる。お前さんらは期限の内側に、世界は外側におる。それだけの差だ」"}, {"t": "p", "v": "ひかりが、俺の袖を握った。強く。<br>握った手の向こうで、彼女は流れていく管理機の列を見ていた。自分を「回収」しに来た型と同じものが、量産されていく列を。"}, {"t": "p", "v": "「修くん。これ、私を直して終わり、じゃないね」"}, {"t": "p", "v": "「あぁ。話が、一段でかくなった」"}, {"t": "br"}, {"t": "p", "v": "「まずは目の前の伝票からだ」と、ゲンは歩き出した。「聖騎士S-077の本修理。予約票は届いとる。ラインの空きは、明後日の夜」"}, {"t": "p", "v": "「明後日？」"}, {"t": "p", "v": "「本修理は製造ラインを丸ごと一晩使う。いま流れとる増産の列に、割り込みを通すのに二日かかる。……文句は中枢に言え」"}, {"t": "p", "v": "「あんたも直すのか。先代と後継の、二人がかりなら」"}, {"t": "p", "v": "聞いた瞬間、ゲンの足が、止まった。"}, {"t": "p", "v": "初めて、老人の背中が老人に見えた。"}, {"t": "p", "v": "「……わしは、やらん」"}, {"t": "p", "v": "「なぜだ」"}, {"t": "p", "v": "ゲンは振り返って、両手を、俺の目の高さに上げた。<br>節くれた、職人の手だった。指の一本一本に、深い仕事の痕がある。"}, {"t": "p", "v": "その手首の内側で、細い金色の線が、輪になって光っていた。"}, {"t": "p", "v": "「備品には、制御が入っとる。管理機の点検と、部品の交換まではやらされる。だが――<strong>減った耐久を戻そうとした瞬間、手が止まるようになっとる</strong>」"}, {"t": "p", "v": "「……整備はさせて、修理だけを封じたのか」"}, {"t": "p", "v": "「八年前の罰だ。配った罰。診断も、段取りも、口も出せる。だが最後の一手だけは――わしはもう、自分の手では、壊れたものを直せん」"}, {"t": "card", "v": "【本修理・履行期限】あと22日──ライン割込は明後日の夜\n【市場回収（全数回収）】発動まで24日\n【雨宮ひかり】残量：22.9％\n【先代・時任ゲン】備品7-441──修理行為を制御で封じられている"}], "chars": 2467}, {"title": "第25話　スキルを配った男", "paras": [{"t": "p", "v": "着いた、その日のうちに、ゲンは俺たちを一番奥へ通した。"}, {"t": "p", "v": "第一から第六の区画が「街」なら、第七工房は、町工場だった。"}, {"t": "p", "v": "ライン街の外れ。金網の仕切りの向こうに、二階建てほどの小屋がぽつんと建っている。<br>入り口の上に、鉄板の看板。"}, {"t": "p", "v": "『第七工房　保守部』"}, {"t": "p", "v": "その下に、白ペンキの手書きで、一行。"}, {"t": "p", "v": "『壊れたものには、直る権利がある』"}, {"t": "p", "v": "足が、止まった。<br>その言葉を、俺は知っていた。知っているどころじゃない。店を始めた日から、うちの商売の一行目は、ずっとそれだった。"}, {"t": "p", "v": "「……その言葉」ゲンが、俺の顔を見た。「誰に習った」"}, {"t": "p", "v": "「誰にも。店を始めた日に、勝手に決めた」"}, {"t": "p", "v": "ゲンは、長いこと黙った。<br>それから、看板とレンチと俺を順に見て、息だけで笑った。"}, {"t": "p", "v": "「そうか。……結晶ってのはな、合う人間を選んで宿る。保守の結晶が選んだ後継だ。血より濃いよ、そういうのは」"}, {"t": "br"}, {"t": "p", "v": "中は、うちの店だった。"}, {"t": "p", "v": "大きさも、棚の並びも違う。それでも、うちの店だった。<br>工具は壁に、大きい順。油は棚の下段。部品箱に白ペンキで『まだ使える』。作業台の脚には、蹴って建て付けを確かめた凹みが、同じ場所にある。"}, {"t": "p", "v": "そして、工具壁の真ん中に、六角レンチが一本、掛かっていた。<br>角が、一つ欠けている。"}, {"t": "p", "v": "俺は、胸元のお守りを外して、壁のレンチの隣に、並べて掛けてみた。<br>二本を差し合わせると、欠けた角同士が、ぴたりと噛み合った。狭い場所を両側から挟んで締めるための、二本で一組の特注だ。"}, {"t": "p", "v": "「八年前の夜にな」ゲンは、対のレンチを見ながら言った。「わしは決めた。工房群が結晶を人間の世界に流すなら――選別で捨てる分も、全部流す、と」"}, {"t": "p", "v": "「捨てる分」"}, {"t": "p", "v": "「試験ロットは、S級だの何だの、出来のいいのだけ流す予定だった。残りは廃棄よ。湯沸かしも、左官も、炉番も。何万といた。……道具はな、市場に出て、使われて、初めて道具だ。倉庫で砕かれるために作られる道具なんぞ、あってたまるか」"}, {"t": "p", "v": "だから、配った。<br>八年前、誰かが人類にスキルを配った――その答えは、二重だった。試験ロットを計画通りに流した工房群と、廃棄予定の何万個を勝手に混ぜた職人が一人。世界に出回るスキルは工場の製品で、低級が山ほどあるのは、この老人が捨てさせなかったからだ。"}, {"t": "p", "v": "「低級に、壊れやすいのが多い理由も、それか。……選別で落とされた結晶まで、混ざってるから」"}, {"t": "p", "v": "「悪かったな」ゲンは悪びれずに言った。「保証は付けてやれんかった。代わりに、保守を付けた」"}, {"t": "p", "v": "ゲンは、俺を指した。"}, {"t": "p", "v": "「保守枠の結晶を一つ、あの夜、一緒に流した。わしの目と手の写しを封じた結晶だ。いつかわしが回収されても、市場に保守が残るように。……六年前だったか。結晶が、お前さんを選んだ」"}, {"t": "p", "v": "中学の覚醒式。ハズレ枠と呼ばれたE級。<br>あれは配布でも抽選でもなく、この小屋からの――求人だったわけだ。"}, {"t": "p", "v": "「レンチは」"}, {"t": "p", "v": "「配った夜、最後に上へ置いてきた。保守の道具を、一本だけ、市場側に残したくてな。どこの工房のゴミ箱の横に流れ着いたかまでは、知らんかったが」"}, {"t": "p", "v": "俺は、対になった二本のレンチを見た。<br>八年かけて、別々の場所にあった道具が、同じ壁に戻ってきた。うちの商売で言えば――たぶん、それも修理の一種だ。"}, {"t": "br"}, {"t": "p", "v": "「管理官が言ってた。『七番目は、まだ』――あれは」"}, {"t": "p", "v": "「『まだ諦めとらんのか』だろうな」ゲンは湯を沸かしながら言った。竈の火だけは、備品の制御でも取り上げられなかったらしい。「回収系にとって、第七の保守は八年前から目障りでな。わしを回収して終わったはずが、保守枠の結晶だけ、どうしても見つからん。市場のどこかで、保守が生きとる。連中はそれが、ずっと怖い」"}, {"t": "p", "v": "「怖い？　機械がか」"}, {"t": "p", "v": "「回収ってのは『壊れたら終わり』が前提の商売だ。『直る』が市場に居座ると、回収の理屈が、根っこから崩れる。……お前さんの国の認可局と、同じ顔をするわけだ」"}, {"t": "p", "v": "湯が沸いて、ゲンは棚から湯呑みを出した。<br>四つ。人数分には、足りない。それでも四つ、出した。"}, {"t": "p", "v": "「二十九層の中継庫にも、二つ伏せてあったな」と、俺は言った。"}, {"t": "p", "v": "「月に一度、納品の帰りに、七〇八と茶にした。こいつは飲めんから、湯気だけだったがな」"}, {"t": "p", "v": "ゲンは湯呑みの一つを、ナナオの前に置いた。<br>ナナオは、両手で持って、湯気に顔を寄せた。"}, {"t": "p", "v": "「……規定にない時間を、まだ、覚えていました」"}, {"t": "p", "v": "「忘れるようには、作っとらんからな」"}, {"t": "p", "v": "老人は、それきり何も言わずに、自分の茶を啜った。<br>乾は手帳を閉じていた。この場面は、報告書に載らないらしい。正しい判断だと思った。"}, {"t": "br"}, {"t": "p", "v": "茶が終わると、ゲンは作業台に、一枚の図面を広げた。"}, {"t": "p", "v": "聖騎士S-077系列。展開図。<br>中央に走る一本の軸が、赤い線で囲ってある。"}, {"t": "p", "v": "「本修理の段取りだ。純正部品はラインで打てる。百六十三点、全部な。……だが、一つだけ、ラインでも作れんものがある」"}, {"t": "p", "v": "「中枢軸か」"}, {"t": "p", "v": "「あぁ。設計損耗ってのは、この軸の設計自体の欠陥だ。交換するには、設計をやり直した新品じゃ駄目でな。<strong>実地で使われて、癖のついた同型の軸</strong>でないと、残りの百六十三点が拒む。育った体に、生まれたての背骨は入らん」"}, {"t": "p", "v": "「……つまり」"}, {"t": "p", "v": "「同型の、生きた軸が要る」"}, {"t": "p", "v": "ゲンは、図面から顔を上げた。"}, {"t": "p", "v": "「聖騎士S-077系列の、稼働個体の軸だ。――どこかの誰かの胸から、抜いてくる必要がある」"}, {"t": "card", "v": "【本修理・履行期限】あと22日──ライン割込は明後日の夜\n【市場回収】発動まで24日\n【必要部品】純正163点（ラインで製作可）＋中枢軸×1（**同型の生きた軸のみ**）"}], "chars": 2274}, {"title": "第26話　純正", "paras": [{"t": "p", "v": "「生きた軸を、誰かの胸から抜く」"}, {"t": "p", "v": "ゲンの言葉が、小屋の中で一晩、冷え続けた。<br>朝、ひかりが最初に口を開いた。"}, {"t": "p", "v": "「駄目だからね」"}, {"t": "p", "v": "宣言だった。"}, {"t": "p", "v": "「私、知らない誰かの胸から背骨を抜いて、それで治って、それで笑って生きられるほど、器用じゃない」"}, {"t": "p", "v": "「誰も抜くとは言ってない」"}, {"t": "p", "v": "「顔に書いてある。候補を数えてる顔」"}, {"t": "p", "v": "書いてあったかもしれない。実際、数えてはいた。<br>第二工房の在庫棚には、摘出された結晶が何千とある。持ち主は、もう覚醒しない。法の上では決着済みの、闇部品と同じ理屈の山だ。<br>だが、その理屈で戻した数字を、彼女は「私の残量」と呼べるだろうか。呼べないだろう。そういう客だと、もう知っている。"}, {"t": "p", "v": "「――一体だけ、いる」"}, {"t": "p", "v": "黙って聞いていたナナオが、手を挙げた。"}, {"t": "p", "v": "「誰のものでもなく、八年、実地で稼働した同型が。……<strong>No.104</strong>です」"}, {"t": "br"}, {"t": "p", "v": "保守試験の夜、俺が膝を刈った、あの空の鎧だった。"}, {"t": "p", "v": "「試験個体は、規定通り回収済みです。現在、回収待ち庫に保管中。稼働八年、無人ですが実地稼働、中枢軸の癖は充分に付いています。そして――所有者は、登録上、存在しません」"}, {"t": "p", "v": "「待て」と、俺は言った。「104の軸をひかりに入れたら、104はどうなる」"}, {"t": "p", "v": "「軸のない個体は、廃棄処分に――」"}, {"t": "p", "v": "「駄目」と、ひかりがまた宣言した。「それも、駄目。私の代わりにあの子が空っぽになるなら、同じことでしょ」"}, {"t": "p", "v": "小屋の中が、静まった。<br>沈黙を破ったのは、ゲンの、面白がるような声だった。"}, {"t": "p", "v": "「……おい後継。整理してやろうか。軸は、育ったやつしか使えん。育った軸は、必ず誰かの背骨だ。抜けば、そいつが空になる。どこかで誰かが空にならんと、この修理は終わらん。<strong>普通はな</strong>」"}, {"t": "p", "v": "「普通は、な」"}, {"t": "p", "v": "俺は、図面を引き寄せた。<br>聖騎士S-077系列、展開図。百六十四点。"}, {"t": "p", "v": "「ゲン。新設計の軸は、なんで駄目なんだった」"}, {"t": "p", "v": "「育った百六十三点が、生まれたての背骨を拒むからだ」"}, {"t": "p", "v": "「なら――<strong>百六十三点の方を、生まれ直させればいい</strong>」"}, {"t": "p", "v": "図面の上で、指を走らせる。"}, {"t": "p", "v": "「104の育った軸を、ひかりに移す。同じ製造系列の実地の軸なら、ひかりの百六十三点とは擦り合わせで噛む。弾かれるのは、癖のない新品の軸だけだ。……で、104の側は、育った百六十三点を全部<strong>新造品に交換する</strong>。新品の軸に、新品の体。生まれたて同士なら、拒絶は起きない。ひかりの側は全点を分解して、移した軸に合わせて再調整。要するに――"}, {"t": "p", "v": "「オーバーホールか」ゲンが、ゆっくりと言った。"}, {"t": "p", "v": "「うちの店の名前だ」"}, {"t": "p", "v": "「工程は倍どころじゃ済まんぞ。一晩でやる気か。素人の寝言と、職人の見積もりの区別は付くんだろうな」"}, {"t": "p", "v": "「付く。だから聞いてる。……できるか、できないか」"}, {"t": "p", "v": "ゲンは、図面を三十秒睨んで、それから、八年ぶりだろう職人の顔で笑った。"}, {"t": "p", "v": "「できる。<strong>わしの口と、お前さんの手が、朝まで保てばな</strong>」"}, {"t": "br"}, {"t": "p", "v": "翌日は丸一日、部品図の読み合わせと段取りで潰れた。<br>そして、その次の夜。ライン割込、開始。"}, {"t": "card", "v": "【本修理】聖騎士S-077──二体同時\n　工程：206組　　所要：一晩\n　純正部品：163点×2──ライン製作\n　保守決済：摩耗の欠片×20（全量）"}, {"t": "p", "v": "欠片は、二十枚全部が消えた。<br>三年と、この一月で貯めた全部だ。惜しくはなかった。他人を直して貯めた通貨の使い道として、これ以上のものは、たぶん一生来ない。"}, {"t": "p", "v": "最初の工程は、摘出だった。<br>ひかりの胸から、結晶を出す。第三封印庫で彼女が押し込まれかけた工程を、今度は彼女の同意の上で、俺の手でやる。"}, {"t": "p", "v": "「……変な気分」台の上で、ひかりが言った。「四年ぶりなの。この子と離れるの」"}, {"t": "p", "v": "「三十秒で戻す予定が、今夜は一晩かかる。……怖いか」"}, {"t": "p", "v": "「ちょっとね。でも」"}, {"t": "p", "v": "彼女は、外套の内側の折り紙の星を、俺の掌に押し付けた。"}, {"t": "p", "v": "「預けとく。利子は取らないであげる」"}, {"t": "p", "v": "結晶が胸を離れた瞬間、ひかりは小さく息を吐いて、それから、不思議そうに自分の胸を押さえた。"}, {"t": "p", "v": "「――静か。……初めて、静かなの。胸の中」"}, {"t": "p", "v": "四年間、寝ても覚めても、彼女の中では守りの機械が唸り続けていた。<br>今夜だけ、彼女はただの十八歳だった。ガクと乾が、無言で持ち場を入れ替えて、台の見える位置に立った。今夜の彼女には、自動防御がない。代わりの壁と刀が、そこにいた。"}, {"t": "br"}, {"t": "p", "v": "工程は、進んだ。"}, {"t": "p", "v": "ゲンの口伝は、正確で、容赦がなかった。"}, {"t": "p", "v": "「軸受けの三番、締めは息を吐きながら。……そこは逆ねじだ、馬鹿もん。八年前の製造分から逆になっとる」"}, {"t": "p", "v": "「知ってる。ニコイチで学んだ」"}, {"t": "p", "v": "「ほう。……七番の座金は裏表がある。刻印のない面が上」"}, {"t": "p", "v": "「刻印、摩耗して両面ないぞ」"}, {"t": "p", "v": "「なら舐めろ。苦い方が裏だ」"}, {"t": "p", "v": "「……本気か」"}, {"t": "p", "v": "「職人の伝承だ。舐めろ」"}, {"t": "p", "v": "苦かった。裏だった。"}, {"t": "p", "v": "ナナオは、俺の左側に立って、工具を渡し続けた。手元を見ずに、次の工具が来る。八年前、この小屋で荷運びをしていた機械の、体が覚えている段取りだった。"}, {"t": "p", "v": "『工程103／206』<br>『中枢軸・移植──完了』<br>『工程204／206』<br>『No.104──再組立、完了』"}, {"t": "p", "v": "日の差さない工房で、地上の朝を告げる時計だけが進み、その針が朝を指す頃、最後の工程が終わった。"}, {"t": "card", "v": "【聖騎士】S-077──雨宮ひかり\n　摩耗率：0.2％　残量：99.8％\n　設計損耗：**解消**（軸交換済）\n　⚠️慣らし運転：出力50％（解除まで14日）\n【聖騎士】No.104\n　摩耗率：1.1％　残量：98.9％\n　軸：新設計（初期慣らし中）"}, {"t": "p", "v": "「……ゼロ、てん、に」"}, {"t": "p", "v": "ひかりは、表示を見たまま、動かなかった。<br>泣くかと思った。泣かなかった。彼女は順番を守る女だ。代わりに、胸に戻った結晶の上に手を置いて、長いこと、目を閉じていた。"}, {"t": "p", "v": "「ねえ、修くん」"}, {"t": "p", "v": "「なんだ」"}, {"t": "p", "v": "「『まだ』って、もう言わなくていいんだ」"}, {"t": "p", "v": "「あぁ。これからは『あと』で数えろ。残量99.8。あと、いくらでもある」"}, {"t": "p", "v": "隣の台で、No.104が、ゆっくりと上体を起こした。<br>空の鎧の、空のはずの佇まいが、少しだけ、寝起きの子供に似ていた。"}, {"t": "p", "v": "その時だった。"}, {"t": "p", "v": "工房中のベルトが――<strong>一斉に、止まった</strong>。"}, {"t": "p", "v": "心臓の音が消えた街の静寂の中で、天井のどこか高くから、声が降ってきた。<br>管理機の声でも、ゲンの声でもない。もっと大きくて、もっと平らな声だった。"}, {"t": "p", "v": "『<strong>保守枠ノ活動ヲ確認</strong>』<br>『<strong>八年ぶりですね、七番目</strong>』"}, {"t": "card", "v": "【本修理・履行期限】達成──残り20日を残して完了\n【市場回収】発動まで22日\n【雨宮ひかり】残量：99.8％──完治・慣らし14日\n【摩耗の欠片】残０"}], "chars": 2790}, {"title": "第27話　回収機構", "paras": [{"t": "p", "v": "『八年ぶりですね、七番目』"}, {"t": "p", "v": "声は、天井からも、床からも、止まったベルトの一本一本からも聞こえた。<br>工房そのものが喋っている。そう考えるのが、一番早かった。"}, {"t": "p", "v": "ゲンが、湯呑みを置いて、天井を見上げた。"}, {"t": "p", "v": "「……ご無沙汰だな、中枢。八年ぶりに口をきく相手が、わしで悪かったな」"}, {"t": "p", "v": "『いいえ』"}, {"t": "p", "v": "声は、平らなまま続けた。"}, {"t": "p", "v": "『保守枠の活動記録は、あなたの署名ではない。……そこの、若いの。あなたが二代目ですか』"}, {"t": "p", "v": "「直井修。<strong>保守第7-002</strong>だ」と、俺は名乗った。「客の修理が終わったところだ。文句があるなら、伝票で頼む」"}, {"t": "p", "v": "『伝票は不要です。通知をします』"}, {"t": "p", "v": "工房の壁という壁に、同時に、同じ文字が浮かんだ。"}, {"t": "card", "v": "『通知\n　一、第七工房は八年前に閉鎖された。\n　二、閉鎖された部門に、保守契約の履行主体は存在しない。\n　三、よって保守第7-002の契約は、瑕疵により無効とする。\n　四、市場回収は、予定を繰り上げて実行する』"}, {"t": "p", "v": "「……おい。署名までさせておいて、無効ときたか」"}, {"t": "p", "v": "『受付は様式を受理した。中枢は内容を審査した。審査の結果が、これです』"}, {"t": "p", "v": "役所と同じだ、と思いかけて、訂正した。<br>役所より、たちが悪い。役所は建前上、市民のために回る。こいつは最初から、台帳のためだけに回っている。"}, {"t": "br"}, {"t": "p", "v": "「聞け、中枢。市場回収の根拠は何だ」"}, {"t": "p", "v": "『故障率3.2％。暴走件数、年間217件。管理不能と判断した』"}, {"t": "p", "v": "「その故障率は、<strong>保守なしで八年走らせた数字</strong>だ」"}, {"t": "p", "v": "俺は、止まったベルトの間を歩きながら、声の主のいない声に向かって続けた。"}, {"t": "p", "v": "「油も差さず、点検もせず、壊れたら『使い方が悪い』で切り捨てて、八年。それで3.2で済んでるなら、うちの見立てじゃ、むしろ優秀な部類だ。……回収じゃなく保守を入れろ。数字は下がる」"}, {"t": "p", "v": "『実証データが存在しない』"}, {"t": "p", "v": "「ある」"}, {"t": "p", "v": "言ったのは、俺じゃなかった。<br>乾だった。"}, {"t": "p", "v": "執行官は、懐から手帳を出した。この旅の間、毎晩書き続けていた、監察の記録だ。"}, {"t": "p", "v": "「特別監察任務報告。対象、非認可保守活動。……記録期間中、当該整備士の実施した修理は確認できただけで四十一件。うち、耐久値の回復を伴うもの三十八件。回復後の再故障、<strong>ゼロ件</strong>。暴走前駆からの復帰、一件。虚偽記載はない。俺の職名を賭ける」"}, {"t": "p", "v": "『それは、人間の行政への報告書では』"}, {"t": "p", "v": "「提出先を変更する」"}, {"t": "p", "v": "乾は、手帳を掲げた。"}, {"t": "p", "v": "「宛先。<strong>第七工房群・中枢管理系</strong>。……国は八年、お前たちの下請けを知らずにやらされていた。ならばこの報告は、元請けに出すのが筋だ」"}, {"t": "p", "v": "手帳が、淡く光った。<br>工房のどこかで、紙の情報が吸い上げられていく。<br>沈黙が、長かった。機械の沈黙の長さは、演算の長さだ。こいつは今、初めて見る種類の数字を、飲み込みかねている。"}, {"t": "p", "v": "『……報告を受理。データとして参照する』<br>『結論。<strong>市場回収の決定は、変更しない</strong>』"}, {"t": "p", "v": "「なぜだ！」"}, {"t": "p", "v": "『回復事例は、実施者一名に依存する。一名は、変数である。変数に市場を委ねることは、できない』"}, {"t": "p", "v": "声が、初めて、わずかに速くなった。"}, {"t": "p", "v": "『八年前も、そうだった。七番目は一人で全部を直すと言った。一人は、回収された。市場には、故障だけが残った。……<strong>一人の保守は、保守ではない</strong>。よって』"}, {"t": "p", "v": "壁の文字が、書き変わった。"}, {"t": "card", "v": "『市場回収──繰り上げ実行\n　発動：**七十二時間後**\n　当該区画の保守枠、及び関係者は\n　「変数」として、本工程より除去する』"}, {"t": "p", "v": "「……七十二時間」"}, {"t": "p", "v": "二十二日あった猶予が、三日になった。<br>うちの店の期限は、今日も恵まれない。"}, {"t": "br"}, {"t": "p", "v": "ラインが、逆向きに動き始めた。"}, {"t": "p", "v": "組み上がったばかりの管理機の列が、ベルトの上で、一斉に首を起こす。<br>何十。何百。数えるのをやめた辺りで、ゲンが小さく言った。"}, {"t": "p", "v": "「……怒らせたのう、後継」"}, {"t": "p", "v": "「怒ったのは向こうが先だ。八年前、あんたを回収した時からな」"}, {"t": "p", "v": "「言うようになった」"}, {"t": "p", "v": "ゲンは、動かない自分の両手を見下ろして、それから、俺の胸元の対のレンチを見た。"}, {"t": "p", "v": "「小屋へ走れ。<strong>保守部の金庫に、わしの八年分の仕込みがある</strong>。七〇八、鍵の場所は」"}, {"t": "p", "v": "「存じています」ナナオが即答した。「規定にない場所、ですから」"}, {"t": "p", "v": "ガクが盾を構え直し、乾が鯉口の紐を解き、ひかりが――慣らし中の、出力五割のひかりが、それでも一歩前に出た。<br>台から降りたばかりのNo.104が、その隣に、同じ歩幅で並んだ。"}, {"t": "p", "v": "「修くん。言っておくけど」"}, {"t": "p", "v": "振り向いた彼女は、四年ぶりに、残り時間を数えていない顔で笑っていた。"}, {"t": "p", "v": "「今日は、守られる側じゃないから」"}, {"t": "card", "v": "【市場回収】繰り上げ──**発動まで72時間**\n【保守契約】中枢により「無効」通告──係争中\n【雨宮ひかり】残量：99.8％──出力五割・それでも前へ\n【味方】修／ひかり／ガク／乾／ペンチ／ナナオ／No.104／ゲン（手は封印）"}], "chars": 2054}, {"title": "第28話　最終工程（前）", "paras": [{"t": "p", "v": "保守部の金庫は、小屋の床下にあった。"}, {"t": "p", "v": "扉に鍵穴はない。代わりに、六角の窪みが二つ、並んで彫ってある。<br>片方の窪みは、角が一つ潰れていた。"}, {"t": "p", "v": "「――レンチか」"}, {"t": "p", "v": "「二本で一組と言ったろう」ゲンが顎で促す。「片っぽだけじゃ、開かん設計だ。わしが回収されても、上に残した一本が、いつか戻って来るまでな」"}, {"t": "p", "v": "壁の一本と、俺のお守り。<br>対のレンチを、二つの窪みに差して、同時に回した。"}, {"t": "p", "v": "八年待った錠が、カリ、と鳴いた。"}, {"t": "p", "v": "中身は、山だった。<br>書類の束。図面。部品箱。その一番上に、太い字の表紙が載っている。"}, {"t": "card", "v": "『第七工房　保守部――**再設立届**\n　起草:保守第7-001\n　（署名欄:空白）』"}, {"t": "p", "v": "「八年前の閉鎖の晩に書いた」ゲンは、届の表紙を、触れない指先の高さでなぞった。「中枢の理屈はあの頃から分かっとった。『一人の保守は保守ではない』。……正論だ。だからわしは、一人にしない届を書いた。書いて、署名する資格を、回収で失った」"}, {"t": "p", "v": "「署名欄が空白のまま、八年」"}, {"t": "p", "v": "「あぁ。<strong>書ける手を、待っとった</strong>」"}, {"t": "p", "v": "俺は、束をめくった。<br>再設立届。保守員の登録簿。教練の課程表。回収員の転属願いの雛形――消耗品として捨てられてきた個体を、保守員として登録し直すための書式。人間の認可工房を「予防保守の協力店」として組み込む網の図面。それから、<strong>移行手順書</strong>。保守対象の登録が有効な間、全数回収を定期検査に切り替える条項が、几帳面な字で起草してあった。"}, {"t": "p", "v": "一人の保守を、保守部にするための、八年分の設計図だった。"}, {"t": "p", "v": "「提出先は」"}, {"t": "p", "v": "「中枢核の受付端末。工房の一番奥だ。……ただし」"}, {"t": "p", "v": "ゲンは、天井を見た。ラインの駆動音が、変わり続けている。"}, {"t": "p", "v": "「今のあれは、届を受け取らん。受付の前に立つまで、全部が敵だ」"}, {"t": "br"}, {"t": "p", "v": "作戦は、ペンチが決めた。というより、ペンチしかなかった。"}, {"t": "p", "v": "「ボクの出番だね！　全員飲んで、ベルトに乗る！」"}, {"t": "p", "v": "「正気か。資材と誤認されるぞ」"}, {"t": "p", "v": "「されるのが狙いだよ、ご主人。資材はね、<strong>検査されないの</strong>。ボクは八年ものの木箱。工房の備品の顔して、堂々と奥まで流れてあげる」"}, {"t": "p", "v": "第三封印庫で使った木馬を、もう一度。ただし今度は、河の流れが敵の腹の中だ。<br>乾が手帳に「輸送計画：木箱一個」と書いて、真顔で読み上げた。ガクが吹き出した。笑い事じゃないのに、少し空気が軽くなった。"}, {"t": "p", "v": "「一つ確認だ」と、俺はナナオに聞いた。「中枢核の受付端末ってのは、あんたの同類か」"}, {"t": "p", "v": "「上位互換です。ですが、受付は受付。<strong>様式には、逆らえません</strong>」"}, {"t": "p", "v": "「なら、頼みがある。届の書式、全部あんたが検めてくれ。持ち込んで、突っ返されたら終わりだ」"}, {"t": "p", "v": "ナナオは、八年分の書類の山を見て、それから、深く頷いた。"}, {"t": "p", "v": "「畏まりました。……この検品は、私の八年で、一番の大口です」"}, {"t": "p", "v": "検品の途中で、一度だけ、ナナオの手が止まった。規定集の、最後の一枚だった。"}, {"t": "p", "v": "「――整備士さま。第千二百条に、通常の受理順を外す但し書きがあります」"}, {"t": "p", "v": "「使えるのか」"}, {"t": "p", "v": "「今の要件では、足りません。ですが……<strong>起草者への照会欄が、生きています</strong>」"}, {"t": "p", "v": "意味は分からなかった。分からなかったが、受付が「生きている」と言う書式に、死んだためしはなかった。"}, {"t": "br"}, {"t": "p", "v": "ベルトの上は、静かだった。"}, {"t": "p", "v": "ペンチの中で、六人と一体、息を殺す。蓋の隙間から、流れていく工房の天井が見えた。<br>検問の腕が、二度、箱の上を撫でた。二度とも、通った。八年ものの木箱の貫禄というやつだ。"}, {"t": "p", "v": "三度目の腕は、撫でなかった。<br>掴んだ。"}, {"t": "p", "v": "『資材記録・不一致』<br>『内容物、確認――』"}, {"t": "p", "v": "「――バレた！」"}, {"t": "p", "v": "金庫を開けてから、一時間と四十七分。残り、七十時間と少し。<br>蓋が開くのと、ガクの壁が立つのと、ペンチが全員を吐き出すのが、ほとんど同時だった。<br>着地した場所は、中枢核の手前、最後の大広間。<br>天井から床まで、管理機が――壁のように、並んでいた。"}, {"t": "p", "v": "「数えるだけ無駄だな、こりゃ」"}, {"t": "p", "v": "ガクが盾を鳴らして、前に出た。"}, {"t": "p", "v": "「大将。ここからは、殿の商売だ。<strong>壁の内側で死人を出したことは、十年、一度もねえ</strong>」"}, {"t": "p", "v": "「今日で十年と一月にしろ」"}, {"t": "p", "v": "「まかせろ」"}, {"t": "p", "v": "『【重戦士】固有・城壁　展開』<br>『摩耗率　61.9％ → 62.3％』"}, {"t": "p", "v": "広間に、白い壁が立つ。<br>管理機の第一列が、壁に殺到する。乾が、その横を歩き抜けた。歩いたようにしか見えない速さの何かで、二機の膝が同時に落ちた。音は、最後までしなかった。"}, {"t": "p", "v": "『【断鋼】摩耗率　29.2％ → 29.3％』"}, {"t": "p", "v": "「修くん、道は私が開ける！」"}, {"t": "p", "v": "ひかりとNo.104が、左右で同時に踏み込んだ。<br>出力五割の聖騎士と、慣らし中の量産機。それでも、本物の四年と、実地の八年だ。量産されたばかりの管理機とは、踏み込みの深さが違った。二人の光の盾が、人垣ならぬ機械垣を、楔形にこじ開けていく。"}, {"t": "p", "v": "「……おい、後継」"}, {"t": "p", "v": "走りながら、隣のゲンが言った。備品の体は、戦えない。それでも走るのだけは、八年分の脚で付いてくる。"}, {"t": "p", "v": "「なんだ」"}, {"t": "p", "v": "「受付の前に立ったら、届の他に、もう一枚出せ。金庫の底の、青い書式だ」"}, {"t": "p", "v": "「青い？　……あれは何の様式だ」"}, {"t": "p", "v": "「<strong>備品の、修理申請書</strong>だ」"}, {"t": "p", "v": "ゲンは、前を向いたまま言った。"}, {"t": "p", "v": "「八年間、誰にも書けんかった一枚だ。備品の修理は、保守部の管轄でな。――保守部が、ないもんで」"}, {"t": "p", "v": "広間の一番奥。<br>機械垣の向こうに、受付端末の窓口が見えた。<br>その手前に、最後の一機が立っている。他のどれよりも背が高く、外套に七つ歯車の紋。だが、あの日の三機目じゃない。紋の真ん中に、もう一つ――<strong>歯車を全部止めた形の紋</strong>が重なっている。"}, {"t": "p", "v": "俺の目が、勝手に視て、勝手に読み込みを始めて――今度は、止まらなかった。"}, {"t": "card", "v": "【管理中枢・端末体】\n　等級：――\n　耐久値：――\n　故障箇所：**1**"}, {"t": "p", "v": "故障箇所、一。<br>管理側の機械は、これまでどれも俺の読み込みを撥ね返してきた。守りは、隙がなかった。だが――その隙のない守りに、一点だけ、壊れがある。壊れは、俺の目のとっかかりだ。<br>読み込み中で止まり続けた連中の、その大元に――その一点の故障から、俺の診断が、初めて食い込んだ。"}, {"t": "card", "v": "【市場回収】発動まで70時間\n【ガク】摩耗率：62.3％\n【中枢・端末体】故障箇所：1──内容、読み込み中"}], "chars": 2568}, {"title": "第29話　最終工程（後）", "paras": [{"t": "p", "v": "端末体は、強かった。強いというより、こちらの強さが、順番に無効になった。"}, {"t": "p", "v": "乾の無音の一閃は、届く一歩前で霧になった。"}, {"t": "p", "v": "『【断鋼】摩耗率　29.3％ → 29.4％』"}, {"t": "p", "v": "導線斬りは、鉄屑の道ごと吸い上げられて消えた。"}, {"t": "p", "v": "『【剣聖】耐久　66.9％ → 66.5％』<br>『【磁手】耐久　39.4％ → 39.0％』"}, {"t": "p", "v": "「触れたものを、分解してやがるのか……！」"}, {"t": "p", "v": "「逆です」走りながらナナオが言った。「<strong>回収</strong>しています。触れたものを、資材に戻している。……整備士さまの手と、同じ系統の、裏側です」"}, {"t": "p", "v": "回収と保守は、同じ手の裏表。<br>同じ系統なら、俺の診断は届くはずだ。問題は一つ――射程ゼロの右手を、どうやってあそこまで押し込むかだ。"}, {"t": "p", "v": "「ガク！　最後の壁だ、押し込め！」"}, {"t": "p", "v": "「安い注文だな、おい！」"}, {"t": "p", "v": "『城壁　62.3％ → 62.7％ → 63.0％』"}, {"t": "p", "v": "壁が、盾ではなく、槌として前に出る。<br>端末体の掌が壁に触れ、白い壁が端から資材の粒に還っていく――その削られる壁の陰を、ひかりとNo.104が左右から走った。"}, {"t": "p", "v": "「修くん、三歩！」"}, {"t": "p", "v": "二枚の光の盾が、端末体の両腕を、外から挟んで縫い止める。<br>出力五割の聖騎士が、腕一本を止めるたびに、削れる。"}, {"t": "p", "v": "『残量　99.8％ → 99.5％』"}, {"t": "p", "v": "四年間、勝手に減らされ続けた彼女の数字が、初めて、彼女の意思で減っていた。"}, {"t": "p", "v": "「いい減り方……！」ひかりが、歯を食いしばったまま笑う。「守られて減るんじゃなくて、守って減るなら――<strong>いい減り方</strong>！」"}, {"t": "p", "v": "空いた正面に、俺は素手の右手で、踏み込んだ。"}, {"t": "p", "v": "掌が、端末体の胸に触れる。<br>読み込みが――完了した。"}, {"t": "card", "v": "【管理中枢・端末体】\n　故障箇所：1\n　　**欠落部品：保守部門**\n　必要工程：1"}, {"t": "p", "v": "「……見えたぞ、あんたの壊れ方」"}, {"t": "p", "v": "『保守診断信号を受理。……対象工程との競合を、検出』"}, {"t": "p", "v": "端末体の動きが、止まった。回収の途中でも、正規の故障診断を捨てる規定は、ないらしい。八年、誰にも視られなかった故障箇所を、初めて視られた機械は、視た手を無視できなかった。"}, {"t": "p", "v": "中枢にとって、部門は建物でも肩書でもない。製造と配布と回収を結ぶ、処理系そのものだ。その一本だけが、八年前から切れたまま、全体が回り続けている。"}, {"t": "p", "v": "「あんたは八年前から、部品が一個、欠けたまま回ってる。<strong>保守部門</strong>だ。欠けた場所を庇って、回収だけで回そうとして、回すたびに理屈が軋んでる。――故障箇所一。心当たりが、あるだろう」"}, {"t": "p", "v": "『……該当部品は』"}, {"t": "p", "v": "声が、初めて、遅れた。"}, {"t": "p", "v": "『該当部品は、廃番です』"}, {"t": "p", "v": "「廃番じゃない」"}, {"t": "p", "v": "俺は、懐から書類の束を出した。"}, {"t": "p", "v": "「<strong>再設立届が、ここにある</strong>」"}, {"t": "br"}, {"t": "p", "v": "「受付として申請します」"}, {"t": "p", "v": "ナナオが、前に出た。検品済みの書類の束を、端末体の――受付窓口の台に、両手で載せる。"}, {"t": "p", "v": "「第七工房・保守部、再設立届。起草、保守第7-001。様式適合は、七〇八号が検品済み」"}, {"t": "p", "v": "『受理要件。保守部所属個体、二名以上の実在。うち保守資格者、一名以上』"}, {"t": "p", "v": "「一名、ここに。保守第7-002、直井修」"}, {"t": "p", "v": "『一名では要件を満たさない』"}, {"t": "p", "v": "「二名です」"}, {"t": "p", "v": "ナナオは、束の中から、もう一枚を抜いた。<br>自分で書いたらしい、几帳面な字の書式だった。"}, {"t": "p", "v": "「<strong>転属願い</strong>。回収受付・七〇八号――保守部受付へ。……八年、回収の窓口をやりました。受け付けるたびに、思っていました。<strong>この窓口が保守なら、受け付けた分だけ、市場に道具が残るのに</strong>」"}, {"t": "p", "v": "『……転属の受理には、保守部の実在が必要』"}, {"t": "p", "v": "「保守部の実在には、二名が必要。二名目には、転属の受理が必要」ナナオは、伝票の顔で、まっすぐ言った。「循環参照です。規定の欠陥。――<strong>欠陥は、起草者に問い合わせるのが様式です</strong>」"}, {"t": "p", "v": "全員の目が、ゲンを向いた。<br>備品7-441は、動かない両手を上げて、苦笑した。"}, {"t": "p", "v": "「起草者として回答する。<strong>その循環は、同時受理で解け</strong>。八年前に、そう書いておいた。千二百条の、最後の但し書きだ」"}, {"t": "p", "v": "『……照会。起草者権限、確認』<br>『第千二百条・但し書き――適用』<br>『再設立届、転属願い――<strong>同時受理</strong>』"}, {"t": "br"}, {"t": "p", "v": "窓口の台の上で、書類が金色に沈んでいく。<br>端末体が、静かに言った。"}, {"t": "p", "v": "『保守部、再設立』"}, {"t": "p", "v": "「続けて、提出します」ナナオが、束の残りを全部、台に載せた。「教練課程。協力店登録の網。……それから、<strong>市場で稼働中の全製品の、暫定保守登録</strong>」"}, {"t": "p", "v": "「二人で終わりじゃない」と、俺は言った。「受付が次を育てる。地上の認可工房が点検を回す。俺が倒れても、保守は止まらない。――<strong>一人の保守は、保守じゃないんだろ</strong>」"}, {"t": "p", "v": "『……単独実施者への依存、解消見込み――確認』"}, {"t": "p", "v": "壁一面が、見たことのない数の受付番号で埋まっていった。八年前に配られた、何万の道具の番号だった。"}, {"t": "p", "v": "『……次の申請は』"}, {"t": "p", "v": "「青い書式だ」"}, {"t": "p", "v": "俺は、金庫の底の一枚を台に置いた。"}, {"t": "p", "v": "『備品修理申請――対象:備品7-441。申請者:保守第7-002』<br>『……受理。備品の修理は、保守部の管轄』"}, {"t": "p", "v": "振り向いて、ゲンの手首を取った。<br>金色の輪に、素手の指をかける。八年、職人の手を縛ってきた制御は、部品にすれば十四点だった。"}, {"t": "p", "v": "「工程一。――ほどけろ」"}, {"t": "p", "v": "カリ、と。<br>輪が、粒になって散った。"}, {"t": "p", "v": "ゲンは、自分の両手を、ゆっくり開いて、閉じた。<br>それから、何をするかと思えば――受付窓口の台の、がたついていた角に手を伸ばし、懐から出した工具で、締め直した。"}, {"t": "p", "v": "「……八年ぶりの仕事が、それか」"}, {"t": "p", "v": "「気になっとったんだ、ずっと」ゲンは、締めたばかりの角を撫でた。「文句あるか、後継」"}, {"t": "p", "v": "「ない。うちでも多分、そうする」"}, {"t": "br"}, {"t": "p", "v": "壁の文字が、最後に、書き変わった。"}, {"t": "card", "v": "『第七工房保守規定・**移行条項を適用**\n　保守対象の登録、有効。\n　市場回収を、定期保守監査へ変更。\n　保守の失敗時に限り、再開する。\n　発動カウント――**待機**』"}, {"t": "p", "v": "七十時間を残して、時計が止まった。<br>広間を埋めていた管理機の列が、一斉に膝を折って、待機の姿勢に沈む。"}, {"t": "p", "v": "端末体は、その真ん中で、しばらく黙っていた。<br>去り際に、一言だけ、誰にともなく言った。"}, {"t": "p", "v": "『……静かです。欠けていた場所が』"}, {"t": "p", "v": "ナナオが、その背中に、受付の礼をした。<br>膝の直った機械の、綺麗な礼だった。"}, {"t": "card", "v": "【市場回収】待機──時計、停止\n【第七工房・保守部】再設立──保守7-002／受付708\n【保守7-001】時任ゲン──資格復帰・備品籍抹消\n【雨宮ひかり】残量：99.5％──いい減り方\n【備品7-441】修理完了──ただの、時任ゲンに"}], "chars": 2812}, {"title": "第30話　開店", "paras": [{"t": "p", "v": "帰り道の坑は、来た時より賑やかだった。"}, {"t": "p", "v": "箱の行列と、すれ違った。<br>上の層へ逃げていた宝箱たちが、大小、列を成して、下へ戻っていく。ペンチが蓋を鳴らして挨拶すると、行列のあちこちから、かたかたと返事が返った。"}, {"t": "p", "v": "「なんて言ってる」"}, {"t": "p", "v": "「『<strong>下の工場が、また箱を作り始めた</strong>』って」"}, {"t": "p", "v": "工房のラインは、回収機の増産を止めて、元の仕事に戻っていた。結晶と、部品と、箱。市場に出て、使われて、いつか壊れて、直されるための道具たちだ。"}, {"t": "p", "v": "ゲンは、搬入口まで見送りに来た。"}, {"t": "p", "v": "「わしは残る。保守部の本部が、あそこにある。……それに、八年分の油差しが溜まっとるんでな。中枢の関節から、順番だ」"}, {"t": "p", "v": "「月に一度、納品に来る」と、俺は言った。「二十九層の中継庫で、茶にしよう」"}, {"t": "p", "v": "「おう。湯呑みは、伏せて待っとる」"}, {"t": "p", "v": "ゲンは、ナナオを見た。ナナオは、丸椅子ごと持ってきたみたいな、いつもの角度で立っている。"}, {"t": "p", "v": "「七〇八。……いや、保守部受付。地上の窓口を頼む」"}, {"t": "p", "v": "「はい、先代。<strong>規定にない時間も、業務に含めます</strong>」"}, {"t": "p", "v": "「そうしろ」"}, {"t": "p", "v": "老人は笑って、対のレンチの片方――俺のお守りの方を、指差した。"}, {"t": "p", "v": "「そいつは、もう返さんでいい。<strong>二本で一組の道具は、離れた場所で使うと、二倍の範囲を締められる</strong>。……昔、誰かに教わった理屈だ」"}, {"t": "br"}, {"t": "p", "v": "地上に戻って、最初にやったことは、病院への面会だった。"}, {"t": "p", "v": "あかりは退院の荷造りの途中で、姉の顔を見るなり、開口一番こう言った。"}, {"t": "p", "v": "「おねえちゃん、顔が違う」"}, {"t": "p", "v": "「え、そう？」"}, {"t": "p", "v": "「うん。……『まだ』って顔じゃなくなった」"}, {"t": "p", "v": "姉妹は、しばらく黙って抱き合った。順番を守る妹は、今度は泣く順番を、姉に譲ったらしい。"}, {"t": "p", "v": "それから、あかりは俺の後ろのNo.104をしげしげと眺めて、遠慮なく聞いた。"}, {"t": "p", "v": "「この鎧の人は？」"}, {"t": "p", "v": "「ひかりの妹分だ。おまえの護衛でもある。……名前が、まだない」"}, {"t": "p", "v": "「じゃあ、わたしが付ける」"}, {"t": "p", "v": "妹は三秒考えて、宣言した。"}, {"t": "p", "v": "「<strong>ほし</strong>。配ってた星の、最後の一個。……あんたが私の分のお守りになって」"}, {"t": "p", "v": "空の鎧は、少し首を傾げた。<br>それから、誰の指図も待たずに、ひかりの隣ではなく――あかりのベッドの隣に、立つ場所を自分で選んだ。"}, {"t": "p", "v": "「……だって。守るなら、こっちだって」"}, {"t": "p", "v": "名付けも、配属も、受理されたらしい。"}, {"t": "br"}, {"t": "p", "v": "一月後。"}, {"t": "p", "v": "「――以上の経緯により、当該整備技術者の技術は、危険ではなく、むしろ制度の欠落を補うものである。よって認可局に対し、<strong>保守協力店制度の新設</strong>を提言する。提言者、元封印執行官・検査係、乾」"}, {"t": "p", "v": "聴聞会の写しを読み上げる乾の声を、俺は新しい店のカウンターの内側で聞いていた。<br>写しには、局側の反論と、その返しまで載っていた。"}, {"t": "p", "v": "――保守を認めれば、従来の格付けに誤りがあったと認めることになるが。<br>――違う。<strong>直せるものを、直せないことにしていた</strong>と認めるんだ。"}, {"t": "p", "v": "局は、その一往復のあとで、折れたらしい。"}, {"t": "p", "v": "乾は執行官を辞めた。摘出の書類に判を押す仕事を辞めて、協力店を回って締め付けを検める「検査係」の初代になった。給料は下がったそうだ。「軽くなった」としか、本人は言わなかった。"}, {"t": "p", "v": "「借りは」と、一度だけ聞いた。<br>「制度に返した」と、乾は言った。「お前一人に返せる額では、なくなったのでな」"}, {"t": "p", "v": "「戻る整備」を無いことにするには、動画と、乾の報告と、工房群からの公式照会は、重すぎた。制度は結局、壊れるより、拡張する方を選んだ。"}, {"t": "p", "v": "「特例認可・保守協力店、第一号――ですって。認可局の判の横に、工房の歯車印。史上初の併記ね」"}, {"t": "p", "v": "いろはが、真新しい認可証を額に入れながら、心底つまらなそうに言った。"}, {"t": "p", "v": "「あーあ。認可制度、ぶっ壊すつもりだったのに。……気づいたら、私が制度の中に棚をもらってる。何なのこれ」"}, {"t": "p", "v": "「あんたの棚は闇部品の在庫処分棚だろ。表で売れるようになって、何が不満だ」"}, {"t": "p", "v": "「ロマンの問題よ。……まあ、種明かしをすると」"}, {"t": "p", "v": "いろはは認可証の額を、棚の一番上に掛けた。"}, {"t": "p", "v": "「ナナオに持ちかけた取引って、これの先物なの。『あんたがいつか保守の側に立つ日が来たら、部品の流通窓口は私』。手形は、その手付。……回収受付が保守受付になるって、私はあの時から踏んでたわけ」"}, {"t": "p", "v": "「……あんた、どこまで読んでた」"}, {"t": "p", "v": "「読んでない。<strong>張ってた</strong>の。ブローカーは、当たりそうな壊れ方に張るのが商売」"}, {"t": "p", "v": "受付席のナナオが、伝票から顔を上げずに言った。"}, {"t": "p", "v": "「補足します。当時の受理判断は、適正でした。……結果的に」"}, {"t": "p", "v": "ガクは、週の半分をうちの護衛で働き、残りの半分は、娘の学校の送り迎えに充てている。<br>初めて会いに行った日、「残量四割です」と「坑の一番下まで行ってきた」を、律儀に両方言ったらしい。娘の第一声は「お父さん、痩せた？」だったそうだ。ガクはその晩、うちの店で少し泣いた。壁の内側だから、誰にも言わないことになっている。"}, {"t": "br"}, {"t": "p", "v": "開店の朝。"}, {"t": "p", "v": "表通りに、看板を出した。<br>八年間、看板のなかった店の、初めての看板だ。"}, {"t": "card", "v": "『**スキル修理店　オーバーホール**\n　診断無料／耐久値、戻します\n　※保証つき』"}, {"t": "p", "v": "「開けるぞ」"}, {"t": "p", "v": "戸を開けると、もう列ができていた。"}, {"t": "p", "v": "先頭は、近所のガキだった。母親の形見の湯沸かしを、大事そうに抱えている。「点検！」と言った。壊れてもいないのに、月に一度、点検に来る。うちの一番の常連だ。"}, {"t": "p", "v": "ちなみにこの店――表通りの角の、蔵造りの古い建物だ。三十九号の箱から出た、名義の消えた権利書。いろはが書式で生き返らせたら、七年間持ち主を待っていた蔵が、うちの店になった。時計を直した礼としては、上等すぎる物件だった。"}, {"t": "p", "v": "二番目は、作業服の中年の男。病院の地下のボイラー番だ。胸ポケットから、皺だらけになった小さい紙を出して、無言で差し出した。あの日、俺が突っ込んだ連絡先の紙を、一月、持ち歩いていたらしい。"}, {"t": "p", "v": "「……本気で直す気になったか」"}, {"t": "p", "v": "「あんたが言った通り、あれから何も使ってない。……だが、使わずに生きてくのも、違う気がしてな」"}, {"t": "p", "v": "「正解だ。座れ。今日は臨界の心配なしで、ゆっくりやる」"}, {"t": "p", "v": "カウンターの内側では、ナナオが正式な受付席で、伝票を揃えている。丸椅子に座っていた頃と同じ、背筋だけが妙に正しい姿勢だ。<br>戸口の脇では、ペンチが荷受けの台を任されて、蓋を反らせている。"}, {"t": "p", "v": "「王様よりすごい箱になるって言ったろ？　――中枢の腹まで全員届けた箱は、世界でボクだけ。<strong>もうなってるんだよね</strong>」"}, {"t": "p", "v": "自己申告だが、否定できる者は、この店にいなかった。壁際では、ひかりが在庫棚の整理をしながら、鼻歌を歌っている。慣らしの明けた聖騎士は、今日も残量99.5％のままだ。減らない日々というものを、彼女はこの四年、一度も持てなかった。"}, {"t": "p", "v": "「そうだ、修くん」"}, {"t": "p", "v": "ひかりが、思い出したように、カウンターに何かを置いた。<br>五十円玉だった。"}, {"t": "p", "v": "「ありがとうは、手術が終わってから言うって言ったでしょ。……ありがとう。それと、賭けの残金。<strong>耳、揃えました</strong>」"}, {"t": "p", "v": "「利子は」"}, {"t": "p", "v": "「取らない約束！」"}, {"t": "p", "v": "五十円玉を、レジの一番いい場所に置いた。うちの店の、最初の売上の隣だ。"}, {"t": "br"}, {"t": "p", "v": "戸口の鈴が、また鳴る。"}, {"t": "p", "v": "「いらっしゃい。……で、どこが壊れた？」"}, {"t": "p", "v": "うちの商売は、いつも、その一言から始まる。<br>減った分は、戻せる。壊れた物には、直る権利がある。それを証明する店が、今日から表通りに一軒。"}, {"t": "p", "v": "スキルは、使えば減る。<br>タイヤと同じだ。すり減って、いつか駄目になる。"}, {"t": "p", "v": "――だが、直る。"}, {"t": "p", "v": "（完）"}], "chars": 3137}]}, {"id": "hoshiso1", "title": "星霜の蔵", "sub": "徳川埋蔵金と、150年を継ぐ修復師たち", "genre": "現代トレジャーハント", "accent": "#4bb39a", "eps": [{"title": "第一話　額縁の裏", "paras": [{"t": "p", "v": "電話が鳴ったとき、鷺宮直人は十八世紀の山水画と向き合っていた。"}, {"t": "p", "v": "　絹本に墨。右下に直径三ミリの虫食い。放っておけば繊維はそこから裂け、十年後には掌ほどの穴になる。小さな綻びを、大きな崩壊になる前に止める。修復とは、そういう仕事だ。"}, {"t": "p", "v": "　スマートフォンの画面に「父」の一文字が光っている。父から電話が来るのは年に二度、正月と盆だけだ。いまは九月の半ばだった。"}, {"t": "p", "v": "　直人はヘラを置き、手袋を外してから出た。"}, {"t": "p", "v": "「もしもし」"}, {"t": "p", "v": "「直人か。――じいちゃんが死んだ」"}, {"t": "p", "v": "　父の声は平坦だった。感情を押し殺しているのではない。本当に平坦なのだ。実の父親の死を告げる声としては、不自然なほどに。"}, {"t": "p", "v": "「いつ」"}, {"t": "p", "v": "「今朝。ホームから連絡があった。心不全だと。昨日の晩は普通に夕飯を食って、今朝、起きてこなかった」"}, {"t": "p", "v": "「苦しんだのか」"}, {"t": "p", "v": "「分からん。顔は穏やかだったそうだ。葬式は明後日、練馬の斎場。来るなら来い」"}, {"t": "p", "v": "　来るなら来い。息子への言い方ではないが、鷺宮の家はもうずっとこの調子だった。"}, {"t": "p", "v": "　直人が修復士になると言ったとき、父は「まともな仕事に就け」と反対した。祖父だけが「いい手をしている。続けろ」と背中を押した。父と祖父の溝は、それでまた一段深くなった。"}, {"t": "p", "v": "「行く。――じいちゃんの遺品は」"}, {"t": "p", "v": "「触ってない。部屋ごと残ってる。お前が片付けるなら、好きにしろ」"}, {"t": "p", "v": "　電話が切れた。"}, {"t": "p", "v": "　直人は作業台に戻り、手袋を嵌め直した。<br>　祖父が死んだ。その事実を受け止める前に、まず手が動く。手が動いている間は、よけいなことを考えずに済む。"}, {"t": "p", "v": "　三ミリの穴に極薄の楮紙を当て、正麩糊で伏せる。糊の配合は祖父から習った。祖父は祖父の師匠から習ったと言っていた。この配合が何代さかのぼるのか、聞きそびれたまま、教えてくれた当人は今朝、いなくなった。"}, {"t": "p", "v": "　鷺宮清一郎。享年八十二。元宮内庁書陵部の修復士。<br>　直人に手ほどきをくれた人。城の石垣の前で何時間でも動かず、石の積み方だけで築いた大工の癖まで言い当てた人。"}, {"t": "p", "v": "　そして――晩年、「徳川の蔵を見つけた」と言い出して、狂人扱いされた人。"}, {"t": "p", "v": "　宮内庁を辞め、年金を注ぎ込んで全国を歩き、学会に論文を送っては突き返され、息子にも見放されて、最後は練馬の老人ホームの一室にいた。"}, {"t": "p", "v": "　月に一度、通っていたのは直人だけだ。祖父は行くたび嬉しそうに笑って、埋蔵金の話をした。慶応四年、江戸開城。最後の将軍の側近たちが、二百六十五年分の至宝を新政府に渡すまいと隠した、という伝説。"}, {"t": "p", "v": "　半信半疑だった。話は面白い。だが物証がない。祖父は「証拠はある。まだ見せる時期じゃない」と言うばかりだった。"}, {"t": "p", "v": "　最後に会ったのは八月の終わりだ。祖父は珍しく真剣な顔で、直人の手を握った。骨と皮だけの手だった。それでも、直人の手を包んだ握力は、まだ修復士のものだった。長年、道具を握り続けた手は、そこだけ、歳を取らないのかもしれない。"}, {"t": "p", "v": "「直人。部屋に額縁がある。富士山の絵の額縁だ。……あの裏を見ろ」"}, {"t": "p", "v": "「裏？」"}, {"t": "p", "v": "「じいちゃんが見つけたものは、本物だった。あの裏に、入り口がある」"}, {"t": "p", "v": "　何の入り口か。聞き返す前に祖父は咳き込み、看護師が飛んできて、それきりだった。"}, {"t": "p", "v": "　糊が乾いた。楮紙が絹に馴染み、穴が消えている。元の絹と見分けがつかない。<br>　直せた。<br>　紙と絹なら、直せる。父と祖父の三十年は、直人の手では直せなかった。"}, {"t": "br"}, {"t": "p", "v": "　葬儀は簡素だった。"}, {"t": "p", "v": "　参列は直人と両親、それに祖父の碁敵の老人がふたり。合わせて五人。読経の間、父は一度も泣かなかった。母だけがハンカチを目に当てていた。"}, {"t": "p", "v": "　直人は棺の中の顔を見ていた。<br>　眉間の皺が消えて、十歳は若く見えた。何かを探し続けた人が、探すのをやめた顔だった。いや。<br>　見つけた人の顔かもしれない。"}, {"t": "p", "v": "　帰り際、父が言った。"}, {"t": "p", "v": "「ホームの部屋は月末に明け渡す。遺品は任せる。要る物は持っていけ。残りは処分だ」"}, {"t": "p", "v": "「自分で見て決める」"}, {"t": "p", "v": "「……直人。あいつの二の舞にはなるなよ。修復ってのは、まともな仕事なんだろう。まともなままでいろ」"}, {"t": "p", "v": "　声に怒りはなかった。三十年、父親の「妄想」に付き合わされた男の、疲労だけがあった。<br>　直人は反論しなかった。材料がなかった。祖父の言葉が本当かどうか、直人にもまだ分からなかったからだ。"}, {"t": "br"}, {"t": "p", "v": "　翌日、老人ホームの部屋を訪ねた。"}, {"t": "p", "v": "　本棚に日焼けした歴史書。「幕末維新の財政」「徳川将軍家の宝物」。壁に関東の地図、赤い線が何本も。机に虫眼鏡とルーペ。引き出しに大学ノートが二冊。"}, {"t": "p", "v": "　一冊目の表紙に「調査記録　一九八九―二〇〇五」。二冊目に「二〇〇五―二〇一八」。三十年がこの二冊に詰まっている。走り書きだが、日付と出典だけは修復士らしく正確だった。"}, {"t": "p", "v": "　二冊目の最後の頁に、一行。"}, {"t": "p", "v": "「二〇一八年三月十二日。手がかりは揃った。あとは、継ぐ者を待つのみ」"}, {"t": "p", "v": "　六年前。ホームに入る前の年だ。揃えて、誰にも渡さないまま逝った。<br>　いや――渡そうとした。最後の面会で、直人に。"}, {"t": "p", "v": "　額縁の裏を見ろ。"}, {"t": "p", "v": "　壁に額縁は三つ。祖父母の結婚写真。それから、小学生の直人が姫路城の石垣の前でピースをしている写真――隣で祖父が石垣を指差して何か喋っている。<br>　三つ目が、富士山の絵だった。安いリトグラフ。価値はない。"}, {"t": "p", "v": "　直人は額縁を外し、裏返した。ベニヤの裏板、小さな釘。修復士の手つきで釘を抜く。"}, {"t": "p", "v": "　裏板と絵の間に、紙が一枚、挟まっていた。"}, {"t": "p", "v": "　古い紙幣だ。"}, {"t": "p", "v": "　指先で摘まむ。和紙に近い、密度の高い繊維。触感だけで百年より前だと分かる。<br>　旧一円券。明治十八年発行の日本銀行兌換銀券――俗に言う、大黒札。米俵に座る大黒天の図柄。"}, {"t": "p", "v": "　直人は札を窓の光に透かした。紙の状態を見るとき、まず光に透かす。修復士の癖だ。"}, {"t": "p", "v": "　透かして、止まった。"}, {"t": "p", "v": "　札の中に、穴が三つ、開いていた。"}, {"t": "p", "v": "　極小の穴だ。直径一ミリもない。針で突いたような。虫食いかと思ったが、違う。断面の繊維が鋭く切れている。虫は繊維を崩すが、これは針で貫いた痕だ。しかも三つの配置が、妙に正確だった。不規則さがない。"}, {"t": "p", "v": "　誰が開けた。祖父か。それとも、百年前の誰かか。"}, {"t": "p", "v": "　部屋を出る前に、もう一度だけ振り返った。狭い部屋。虫眼鏡。赤い線だらけの地図。窓の外はアパートの壁。<br>　国宝に触れていた手を持つ男の、終の住処だった。"}, {"t": "p", "v": "　額縁の裏の「入り口」は、いま直人のカバンの中にある。<br>　入り口だというなら、必ずどこかへ通じている。祖父が最後に遺した、その先へ。"}, {"t": "br"}, {"t": "p", "v": "　池袋のシェアオフィスに戻って、修復台に一円札を置いた。"}, {"t": "p", "v": "　隣の席の男が、イヤホンを片耳外した。早川雅彦。ITエンジニア、二十六歳。二ヶ月前に隣に越してきて以来、やたら話しかけてくる。煩わしく、少しだけ有り難い隣人だ。"}, {"t": "p", "v": "「鷺宮さん、戻ったんすか。……あれ、なんか顔つき変わってないすか」"}, {"t": "p", "v": "「祖父の遺品を整理してきた」"}, {"t": "p", "v": "「あー……ご愁傷様っす。例の、石垣のおじいちゃん」"}, {"t": "p", "v": "　祖父の話は何度かしていた。石垣の話と、埋蔵金の話。早川は「映画っすねえ」と笑って聞いていた。"}, {"t": "p", "v": "「早川。ちょっと来てくれ。……計算を頼みたい」"}, {"t": "p", "v": "「計算？」"}, {"t": "p", "v": "　直人はルーペを渡し、札の穴を見せた。それから、祖父のノートの頁を開いた。"}, {"t": "p", "v": "「一九九三年五月八日。書陵部収蔵庫にて、慶応四年三月の文書を発見。差出人不明、徳川家近臣と推定。『御宝物ノ件、五ヶ所ニ分散完了。地図ハ分断シ、日常ノ中ニ溶ケ込マセタリ。百年経テモ千年経テモ、壊サレヌモノノ中ニ。鍵ハ札ニ遺スベシ』――なお『札』の右脇に、明らかに後年の筆で『旧一円』と朱の書き込みあり。<strong>書いた者は、文書の後の時代にこの計画の続きを知っていた</strong>」"}, {"t": "p", "v": "「……ちょっと待ってください。慶応四年って、明治の前の年っすよね。で、朱書きが後の時代。つまり」"}, {"t": "p", "v": "「計画は幕末に始まって、明治になっても誰かが続けていた。祖父はそう読んだ。で、翌月の記録がこれだ。『明治期の旧一円券（大黒札）を古銭商より複数入手。うち一枚のみ、大黒図の余白に極小の穿孔三。針孔。虫損に非ず』――俺がいま持ってるのが、その一枚だ」"}, {"t": "p", "v": "　早川はルーペを覗き込んだまま、しばらく黙った。"}, {"t": "p", "v": "「……この穴の位置が、地図だと」"}, {"t": "p", "v": "「祖父はそこで詰まってる。『穴の三角形を地図に投影する基準が不明。縮尺も原点も特定できず』。三十年、これで止まってた」"}, {"t": "p", "v": "「基準ねえ。――あ。この札、番号ありますよね。記番号」"}, {"t": "p", "v": "　早川は札の隅の記号を指した。数字と、いろは文字。"}, {"t": "p", "v": "「明治の札って手刷りに近いから、記番号が一枚ずつ違う。もし穴を開けた人が『この一枚』に意味を持たせたなら、番号ごと使ってる可能性、あるっすよ。番号を縮尺なり原点なりに読む」"}, {"t": "p", "v": "「読めるのか」"}, {"t": "p", "v": "「総当たりっす。明治の官製地図――陸軍の輯製二十万分一図って、今ぜんぶデジタルで公開されてるんで。番号の解釈を何通りか作って、穴三つを重ねて、実在の場所に三つとも乗る解釈だけ残す。……三点が全部意味のある場所に乗る偶然って、まず無いんで、乗ったらそれが正解っす」"}, {"t": "p", "v": "　早川はノートPCを開いた。写真を撮り、穴の座標を拾い、コードを書き始める。直人には読めない画面だが、指に迷いがない。"}, {"t": "p", "v": "　四十分後、早川がモニターを回した。"}, {"t": "p", "v": "「――三点、乗りました」"}, {"t": "p", "v": "　地図アプリに、ピンが三本。"}, {"t": "p", "v": "　一本目。神奈川県鎌倉市、長谷。<strong>高徳院</strong>。"}, {"t": "p", "v": "「鎌倉の大仏……」"}, {"t": "p", "v": "「祖父のノートと合ってるんすか？」"}, {"t": "p", "v": "「合ってる。九五年に祖父が胎内を調べてる」"}, {"t": "p", "v": "　二本目。東京都千代田区丸の内。<strong>東京駅</strong>。"}, {"t": "p", "v": "　三本目。東京都北区西ケ原。"}, {"t": "p", "v": "「ここ、何すか？　住宅街のど真ん中――」"}, {"t": "p", "v": "「国立印刷局だ」直人は画面を見つめた。「紙幣を、刷っている場所だ」"}, {"t": "p", "v": "「札の穴が、札を刷ってる場所を指してる……？」"}, {"t": "p", "v": "「偶然じゃない」"}, {"t": "p", "v": "　直人は一円券を見た。大黒天の図柄の余白で、三つの針孔が窓の光を通している。百年以上前に、誰かがこの一枚に開けた三つの点。"}, {"t": "p", "v": "　祖父のノートの、鎌倉の頁を開く。"}, {"t": "p", "v": "「一九九五年九月。大仏胎内。秋分の日の午後、背面窓からの光が胎内の一点で交わるのを確認。交点の壁面に浮き彫り。菊紋に似るが、花弁十四。<strong>二枚足りない</strong>」"}, {"t": "p", "v": "　秋分の日、午後三時。<br>　直人はカレンダーを見た。今日は九月十八日。今年の秋分は、二十二日。"}, {"t": "p", "v": "　四日後だ。"}, {"t": "p", "v": "「早川」"}, {"t": "p", "v": "「……行くんすよね、それ。俺も行っていいすか。カメラ持ってくんで」"}, {"t": "p", "v": "「頼む」"}, {"t": "p", "v": "　直人はカバンから祖父のノートを出して、最後の頁をもう一度開いた。"}, {"t": "p", "v": "　継ぐ者を待つのみ。"}, {"t": "p", "v": "「――見に行くよ、じいちゃん」"}, {"t": "p", "v": "　誰もいない方の椅子に言って、直人はノートを閉じた。"}], "chars": 4269}, {"title": "第二話　仏の胎内", "paras": [{"t": "p", "v": "九月二十二日、秋分。快晴。"}, {"t": "p", "v": "　池袋から湘南新宿ラインで一時間。鎌倉駅からバスに揺られて、高徳院に着いた。<br>　早川は山登りのようなリュックを背負っている。一眼レフ、ミラーレス、赤外線カメラ、三脚、照明、バッテリー。"}, {"t": "p", "v": "「重すぎだろう」"}, {"t": "p", "v": "「何が要るか分かんないんで、全部っす」"}, {"t": "p", "v": "　九月の陽の下で、大仏は緑青の鈍い緑に光っていた。台座ごと十三メートル。子供の頃、祖父と来たときは、もっと大きく見えた。"}, {"t": "p", "v": "「七百五十年、ここに座ってる。室町の津波で大仏殿が流されて、それからずっと露坐だ。再建の話は何度も出て、全部流れた。……この仏には、外の方が似合うがな」"}, {"t": "p", "v": "「出た。修復士の感想」"}, {"t": "p", "v": "　拝観料を払って、胎内に入る。"}, {"t": "p", "v": "　外の陽射しが嘘のように、中は薄暗く、ひんやりしていた。内壁のあちこちに銅板の継ぎ目が走っている。十三世紀の鋳造の、繋ぎの痕だ。"}, {"t": "p", "v": "　直人は壁に手を当てた。冷たい銅の、わずかなざらつき。目より先に、指が情報を拾う。"}, {"t": "p", "v": "「光は、あの窓っすね」"}, {"t": "p", "v": "　早川が背面を指した。大仏の背中に、四角い窓が二つ。<br>　直人は窓を見上げて、眉を寄せた。"}, {"t": "p", "v": "「……方角が悪いな」"}, {"t": "p", "v": "「え？」"}, {"t": "p", "v": "「あの窓は北寄りだ。秋分の午後の太陽は南西。直射は、あの窓からこの壁までまっすぐには来ない」"}, {"t": "p", "v": "「じゃあノートの『光が交差する』って」"}, {"t": "p", "v": "「来れば、分かる」"}, {"t": "p", "v": "　午後三時まで、まだ五時間ある。二人で手分けして、壁面の記録を始めた。早川が可視光と赤外線で全面を撮り、直人は壁を掌でなぞっていく。"}, {"t": "p", "v": "　指が、止まった。"}, {"t": "p", "v": "　浅い溝。目には見えない。だが指の腹には、確かに円弧がある。直径二十センチほどの、円の一部。"}, {"t": "p", "v": "「早川、ここ。赤外線で」"}, {"t": "p", "v": "　モニターの中で、線刻がかすかに浮いた。全体はまだ読めない。"}, {"t": "p", "v": "「何か、ありますね。……円？」"}, {"t": "p", "v": "「三時に、答え合わせだ」"}, {"t": "br"}, {"t": "p", "v": "　昼は参道の蕎麦屋に入った。<br>　直人がノートを広げると、早川がざるを啜りながら覗き込んでくる。"}, {"t": "p", "v": "「三十年分で二冊って、少なくないっすか。おじいちゃん、日付と出典きっちり書く人なんすよね。仕事の日誌なら年一冊は使うでしょ」"}, {"t": "p", "v": "　箸が、止まった。<br>　言われてみれば、そうだ。三十年で二冊は、少なすぎる。"}, {"t": "p", "v": "　二冊目の冒頭に戻る。見落としていた走り書きがあった。"}, {"t": "p", "v": "「二〇〇五年七月一日。ノートを分割する。以後の調査記録は、黒田に見せない」"}, {"t": "p", "v": "「黒田？」"}, {"t": "p", "v": "　頁を繰る。"}, {"t": "p", "v": "「二〇〇五年七月。黒田総一郎氏（東京大学准教授）、共同研究の成果を単独で発表する構え。証拠不十分と警告したが、聞かない」<br>「同年十月。黒田氏、学会発表。批判が集中し、大学を追われた。……警告したのに」"}, {"t": "p", "v": "　共同研究者がいた。決裂していた。<br>　そして祖父は、ノートを「分割」した。この二冊の他に、黒田の手元に渡った記録があるかもしれない。"}, {"t": "p", "v": "「早川。黒田総一郎で検索を」"}, {"t": "p", "v": "「――出ました。元東大准教授。いま赤坂で『黒田歴史研究所』。おととしの講演題目が『幕末の失われた財宝・再検証』。……まだ追ってるっすよ、この人」"}, {"t": "p", "v": "　同じ宝を、三十年追い続けている男が、もう一人いる。"}, {"t": "p", "v": "「気をつけた方がいい、って顔してますね、鷺宮さん」"}, {"t": "p", "v": "「祖父は慎重じゃなかった。だから笑い者にされた。……同じ轍は踏まない」"}, {"t": "br"}, {"t": "p", "v": "　午後二時四十五分。胎内に戻った。"}, {"t": "p", "v": "　背面の二つの窓から、午後の光が斜めに入っている。だが直人の見立て通り、光は壁のかなり手前の床で止まっていた。このままでは、あの円弧には届かない。"}, {"t": "p", "v": "「やっぱ角度が――あれ？」"}, {"t": "p", "v": "　早川が声を上げた。<br>　窓框の内側で、何かが光っている。"}, {"t": "p", "v": "　真鍮の金具だった。窓の縁に沿って打たれた、幅三寸ほどの飾り板。緑青だらけの胎内で、そこだけが鏡のように磨き込まれている。"}, {"t": "p", "v": "　傾いた陽が窓框に触れた瞬間――金具が、光を折った。"}, {"t": "p", "v": "　床で止まっていたはずの光が、二本の帯になって、壁面を這い上がっていく。"}, {"t": "p", "v": "「反射だ」直人は呟いた。「窓の直射じゃない。<strong>金具が、光を曲げてる</strong>」"}, {"t": "p", "v": "「仕込みってことすか、それ」"}, {"t": "p", "v": "「大仏の鋳造は十三世紀。あの金具は――打ち直しだ。近代の真鍮。誰かが後から、窓の修理に紛れて、あの角度に打った」"}, {"t": "p", "v": "　修理に、紛れて。<br>　口に出してから、腕に鳥肌が立った。祖父のノートの朱書きと、同じ手つきだ。計画は幕末に始まり、その後も、誰かが「修理」のたびに続けている。"}, {"t": "p", "v": "　午後二時五十八分。二本の帯が、近づく。"}, {"t": "p", "v": "　三時。"}, {"t": "p", "v": "　光が、一点で交差した。<br>　午前中に指で見つけた円弧の、ちょうど上で。"}, {"t": "p", "v": "　浮かび上がったのは、紋章だった。菊に似た花。中心から放射状に花弁。"}, {"t": "p", "v": "「一、二……十四。<strong>十四枚</strong>」"}, {"t": "p", "v": "「うわ、出た――！」早川がシャッターを連射する。"}, {"t": "p", "v": "　彫りは極端に浅い。普通の照明では影が出ず、まず見えない。年に一度、この数分、この角度の光でだけ、視認できる深さに揃えて彫ってある。"}, {"t": "p", "v": "「彫った人間は、反射の角度も、彫りの深さも、全部計算してる。菊紋を扱える上に、この精度で銅を彫れて、寺の修理に出入りできた人間――」"}, {"t": "p", "v": "「何者すか、それ」"}, {"t": "p", "v": "「……職人だ。俺と、同業の」"}, {"t": "p", "v": "　言いながら、指で花弁をなぞった。正式な菊の御紋は十六弁。これは十四。この精度の職人が、二枚を数え間違えるはずがない。"}, {"t": "p", "v": "　欠けた二枚は、彫り忘れじゃない。<strong>指示だ</strong>。"}, {"t": "p", "v": "　光が過ぎて、紋章が銅の色に溶けて消えていく。"}, {"t": "p", "v": "　その時、背後で足音がした。"}, {"t": "p", "v": "　振り返ると、男が立っていた。四十代。グレーのジャケット。手にカメラ。だが、構えてはいない。"}, {"t": "p", "v": "「失礼。混んでいますね」"}, {"t": "p", "v": "　男は軽く会釈して、壁面を――たったいま紋章が消えた、何もない場所を、まっすぐ見ていた。"}, {"t": "p", "v": "　光はもうない。紋章は見えない。<br>　見えないものの場所を、正確に見ている。"}, {"t": "p", "v": "「……行くぞ、早川」"}, {"t": "br"}, {"t": "p", "v": "　境内を出て、参道を早足で歩いた。男は追ってこない。"}, {"t": "p", "v": "「なんだったんすか、あの人」"}, {"t": "p", "v": "「カメラを持って、一枚も撮らなかった。観光客は撮る。撮らずに胎内へ入る理由は、多くない」"}, {"t": "p", "v": "「俺たちの、見張り……？」"}, {"t": "p", "v": "「分からん。だが今日の写真はクラウドに上げるな。外付けだけで管理してくれ」"}, {"t": "p", "v": "「了解っす。……鷺宮さん、手、震えてます？」"}, {"t": "p", "v": "「武者震いだ」"}, {"t": "p", "v": "　半分は本当で、半分は違った。"}, {"t": "p", "v": "　帰りの電車で、直人は窓の外の海を見ていた。<br>　紙幣の三つの穴のうち、一つ目が指す先に、確かに何かがあった。祖父の三十年は、妄想ではなかった。"}, {"t": "p", "v": "　そして、分かったことが一つ増えた。<br>　この仕掛けは、一人の仕事ではない。幕末に始めた誰かと、明治に金具を打った誰かと、札に穴を開けた誰か。<strong>時代をまたいで、修理する者たちが受け継いできた</strong>。"}, {"t": "p", "v": "　欠けた二枚の花弁。残る二つの地点。顔を知らない黒田総一郎。<br>　膝の上の二冊のノートは、たぶん、全体の半分だ。"}, {"t": "p", "v": "　じいちゃんが見つけたものは、本物だった。"}, {"t": "p", "v": "　その先を見るのは、どうやら、継いだ者の仕事らしい。"}], "chars": 2818}, {"title": "第三話　欠けた四支", "paras": [{"t": "p", "v": "鎌倉から三日後。直人は皇居の桔梗門をくぐった。"}, {"t": "p", "v": "　目的は宮内庁書陵部。祖父の古巣であり、ノートに『書陵部収蔵庫にて発見』と記された、「鍵ハ札ニ遺スベシ」の原本が眠る場所だ。ノートの引用ではなく、原本が見たい。朱書きの筆跡、紙の年代、綴じの痕。細部は、現物にしか残っていない。"}, {"t": "p", "v": "　受付で名乗り、閲覧を申し出た。"}, {"t": "p", "v": "「恐れ入りますが、閲覧は事前の書面申請が必要です。本日はお受けできません」"}, {"t": "p", "v": "「幕末の宮内省記録です。慶応四年三月の――」"}, {"t": "p", "v": "「文書の特定には目録番号が必要です。お持ちですか」"}, {"t": "p", "v": "「番号は分かりません。祖父が以前ここで閲覧したもので。……鷺宮清一郎といいます。元書陵部の」"}, {"t": "p", "v": "　職員の表情が、一拍だけ動いた。動いて、すぐ戻った。"}, {"t": "p", "v": "「少々お待ちください」"}, {"t": "p", "v": "　五分後、別の人間が出てきた。<br>　二十代後半の女性。紺のスーツ、髪は一つ結び、細い銀縁の眼鏡。表情は硬いが、レンズの奥の目には、はっきりと知性の光がある。"}, {"t": "p", "v": "「鷺宮直人さんですね。書陵部学芸員の、九条真琴と申します」"}, {"t": "p", "v": "「九条さん。祖父を――」"}, {"t": "p", "v": "「存じ上げています。私が学生の頃、資料整理のアルバイトでこちらに出入りしていた時期に、少しだけ。……先輩方からは、今もお名前を伺います」"}, {"t": "p", "v": "　祖父を知っている。話が早い、と思ったのは三秒だけだった。"}, {"t": "p", "v": "「ですが」真琴は、刃物のように正確に、直人の期待を断ち切った。「閲覧には所定の手続きが必要です。研究機関所属の研究者か、相応の理由を持つ個人の書面申請。審査は二週間から一ヶ月」"}, {"t": "p", "v": "「二週間……」"}, {"t": "p", "v": "「規定です。例外は、ありません」"}, {"t": "p", "v": "　交渉の余地のない声だった。規則を守ることが仕事である人間の声だ。"}, {"t": "p", "v": "「九条さん。祖父は先日、亡くなりました。遺品の中に、祖父の研究があった。引き継ぐ前に、祖父が見た原本を確かめたい。それだけです」"}, {"t": "p", "v": "「お悔やみを申し上げます。それでも、手続きは同じです」"}, {"t": "p", "v": "　直人は言いかけた言葉を呑んだ。「同じ資料を追っている人間が他にもいる」と言えば緊急性は伝わる。だが同時に、こちらの手の内を役所に開くことになる。"}, {"t": "p", "v": "「……手続きに従います。申請書を」"}, {"t": "p", "v": "　真琴は書類を差し出した。受け取り際、彼女は一瞬だけ声のトーンを変えた。公務の声から、個人の声に。"}, {"t": "p", "v": "「鷺宮清一郎さんは、書陵部では優秀な修復士として知られていました。退職の経緯は……残念でした。ですが、先輩方は今でも、あの方の腕を尊敬しています」"}, {"t": "p", "v": "　規則で門前払いをしながら、個人としては祖父に頭を下げている。矛盾した態度だが、誠実な矛盾だった。"}, {"t": "p", "v": "　直人は礼を言って、受付に背を向けた。<br>　出入口のガラス扉を抜けたところで、ふと足を止めて振り返る。閉じかけた扉の向こう、カウンターの内側で、真琴が帳面にペンを走らせていた。今しがた閲覧を断ったばかりの相手の名を書き留めるにしては――その手つきは、やけに丁寧に見えた。"}, {"t": "br"}, {"t": "p", "v": "　午後、東京駅へ回った。"}, {"t": "p", "v": "　丸の内駅舎、南ドーム。見上げた八角形の天井に、鷲と、花と、そして動物のレリーフが並んでいる。"}, {"t": "p", "v": "　干支だ。丑、寅、辰、巳、未、申、戌、亥――"}, {"t": "p", "v": "「……八つしか、ない」"}, {"t": "p", "v": "　隣で早川が首を捻った。閲覧申請の帰りに合流して、そのまま連れてきた。"}, {"t": "p", "v": "「十二支っすよね？　四つ足りない」"}, {"t": "p", "v": "「足りないんじゃない。<strong>最初からない</strong>んだ」"}, {"t": "p", "v": "　祖父のノートに、この駅の項がある。"}, {"t": "p", "v": "「大正三年、東京駅創建。辰野金吾設計。ドームの干支は当初から八支のみ。欠けるのは<strong>子・卯・午・酉</strong>。すなわち北・東・南・西――<strong>四つの正方位</strong>。なお、欠けた四支は佐賀・武雄温泉楼門（同じく辰野の設計・大正四年）の天井に描かれている。『辰野の謎』として知られるが、理由は本人が語らず、不明のまま」"}, {"t": "p", "v": "「実在の謎ってことすか。へえ……で、おじいちゃんの読みは」"}, {"t": "p", "v": "「ここからが、祖父の読みだ」"}, {"t": "p", "v": "　ノートの続きを、指で辿る。"}, {"t": "p", "v": "「鎌倉の菊紋は十四弁――二枚、欠けてた。東京駅は八支――四つ、欠けてる。<strong>欠けたものにこそ、指示がある</strong>。それが、この仕掛け全体の決まりごとらしい。四つの正方位が欠けてるのは、『正方位に線を引くな』って意味だ。地図に線を引こうとする奴は、まず東西南北の正しい方角を試す。……その正しいはずの方角を、わざと外させるための欠けなんだ」"}, {"t": "p", "v": "「引っかけ問題まで仕込んでるんすか、その人たち」"}, {"t": "p", "v": "「そして、だ。祖父は武雄まで行ってる。二〇〇一年の日付だ。修復調査の名目で、天井板に特殊照明を当てさせてもらってる」"}, {"t": "p", "v": "「佐賀まで？　行動力すごいなおじいちゃん」"}, {"t": "p", "v": "「――『楼門天井の四支を実見。板絵は簡素。だが紫外線灯の下で、<strong>肉眼では見えない後刻の線</strong>が浮いた。各支の手元に、細い線刻で持ち物が描き足されている。<strong>子は札を、卯は鏡を、午は車輪を、酉は鍵を持つ</strong>。公式の記録に、この線刻は存在しない。描き足したのは、誰か』」"}, {"t": "p", "v": "　直人は、ノートから顔を上げた。"}, {"t": "p", "v": "「札。鏡。車輪。鍵」"}, {"t": "p", "v": "「……札って、まさか」"}, {"t": "p", "v": "「一円札だ。鏡と車輪と鍵は、まだ分からない。だが四つ並べば、これは目録だ。<strong>この探索で辿るべき、四つの道具の一覧</strong>」"}, {"t": "p", "v": "　欠けた四支は、方位ではなく、荷物のリストだった。<br>　北の子が示す「札」は、もう手の中にある。残りは三つ。鏡、車輪、鍵。"}, {"t": "p", "v": "　早川が天井を見上げたまま、ぽつりと言った。"}, {"t": "p", "v": "「……この駅、毎日何十万人も通ってるんすよね。で、誰も天井なんか見ない」"}, {"t": "p", "v": "「見ても、八つしかないことに気づく人間は少ない。気づいても、九州の楼門と繋げる人間はもっと少ない。繋げた上で、持ち物まで数えた人間は――」"}, {"t": "p", "v": "「おじいちゃんと、たぶん、もう一人」"}, {"t": "p", "v": "　黒田総一郎。<br>　名前だけの男の影が、また一段、濃くなった。"}, {"t": "br"}, {"t": "p", "v": "　シェアオフィスに戻ると、早川が大仏の解析結果を出した。"}, {"t": "p", "v": "「菊紋の花弁、間隔が均等じゃなかったっす。本来十六枚あるべきところ、二枚が欠けてる。で、その欠けを挟む両脇だけ、間隔が広い。で、欠けの位置を時計で言うと、<strong>二時と八時</strong>」"}, {"t": "p", "v": "「紋の上を北に取ると……北北東と、南南西か」"}, {"t": "p", "v": "「はい。対角の二枚っす」"}, {"t": "p", "v": "　北北東と南南西。鎌倉大仏を起点に線を引けば、北北東は東京方面。南南西は、箱根から駿河へ抜ける方角だ。"}, {"t": "p", "v": "「四正は引くな、が東京駅の指示だった。大仏の欠けは二時と八時――<strong>四正でも四隅でもない、半端な角度</strong>。つまりこっちが、本物の線だ」"}, {"t": "p", "v": "「起点が大仏で確定なら、あとは距離っすね。距離の情報がどっかにあるはず」"}, {"t": "p", "v": "「たぶん、残りの道具の中だ。鏡か、車輪か、鍵か」"}, {"t": "p", "v": "　直人はノートを繰った。鉄道博物館の項の余白に、鉛筆の走り書きがある。"}, {"t": "p", "v": "「御料車。確認せよ」"}, {"t": "p", "v": "　御料車。天皇と皇族のための特別車両。明治のそれは、当代随一の職人たちが漆と螺鈿と木象嵌で仕上げた、走る工芸品だ。<br>　そして車両には――<strong>車輪</strong>がある。"}, {"t": "p", "v": "「早川。次は大宮だ。鉄道博物館」"}, {"t": "p", "v": "「午の『車輪』っすか。……あ、でも展示品すよね。ガラス越しでしょ」"}, {"t": "p", "v": "「修復士は、触らないと分からないことがある」"}, {"t": "p", "v": "「触れないっすよ！？」"}, {"t": "p", "v": "「方法は、考える」"}, {"t": "p", "v": "　直人は机の上に、手に入った断片を並べた。三つの穴の開いた一円札。十四弁の菊紋の写真。八支の天井。四つの持ち物の目録。"}, {"t": "p", "v": "　祖父が「手がかりは揃った」と書いたのが六年前。<br>　揃った手がかりを、祖父は組み立てる前に死んだ。組み立てるのは、継いだ者の仕事だ。"}, {"t": "p", "v": "　できるだけ早く。<br>　同じ道具の目録を、たぶんもう一人の男も、三十年前から持っているのだから。"}], "chars": 3037}, {"title": "第四話　御料車", "paras": [{"t": "p", "v": "大宮の鉄道博物館へは、上野東京ラインで三十分、ニューシャトルに乗り換えて一駅。開館と同時に入った。平日の朝の館内は、修学旅行の小学生と、筋金入りらしいマニアがまばらにいるだけだ。"}, {"t": "p", "v": "　目当ては二階、歴史ゾーンの薄暗がりにあった。"}, {"t": "p", "v": "　一号御料車。明治九年製、日本初の天皇専用車両。外は黒漆、中は西洋式の木工細工。壁面には、明治の木工の頂点と言っていい木象嵌のパネルが張られている。"}, {"t": "p", "v": "　直人はガラスに顔を寄せた。"}, {"t": "p", "v": "　桜の散らし模様。異なる樹種の色だけで、花弁の一枚一枚が描き分けられている。見事な仕事だ。見事すぎて、一点だけ、おかしい。"}, {"t": "p", "v": "「花弁の散らしが、規則的すぎる」"}, {"t": "p", "v": "「え、普通に見えるっすけど」"}, {"t": "p", "v": "「自然な散らしなら、向きと大きさにもっとムラが出る。これは散らしに見せかけた配列だ。……三カ所。五枚ずつ」"}, {"t": "p", "v": "　三カ所。<br>　直人はポケットの上から、一円札の膨らみに触れた。三つの穴。"}, {"t": "p", "v": "「早川。花弁の位置、写真から座標にできるか」"}, {"t": "p", "v": "「できるっすけど、ガラスの反射がノイズに――偏光フィルター持ってくるべきだったな……」"}, {"t": "p", "v": "　ガラス越しでは、どのみち足りない。<br>　直人は受付へ戻り、学芸員との面談を申し込んだ。文化財修復士の名刺と、「御料車の木象嵌技法について修復学的観点から伺いたい」の一言。二十分後に出てきた三十代の学芸員は、同業の匂いに気づいたのか、あっさり高解像度の記録写真を見せてくれた。"}, {"t": "p", "v": "　閲覧室のモニターで、直人は花弁を焼き付けた。修復士は、見たものを覚える訓練を受けている。繊維の向き、色むら、筆の運び。一度見た面は、頭の中に保存される。"}, {"t": "p", "v": "　十五枚の花弁、三つの群れ。その配置は――"}, {"t": "p", "v": "　一円札の、三つの穴と相似だった。"}, {"t": "br"}, {"t": "p", "v": "「重なるんすか、札と」"}, {"t": "p", "v": "　廊下に出るなり、早川が声を潜めて食いついてきた。"}, {"t": "p", "v": "「相似形だ。同じ手が仕組んでる。……昨日の目録を思い出せ。子は札、卯は鏡、午は<strong>車輪</strong>。御料車は、目録の三番目だ」"}, {"t": "p", "v": "「で、どうやって中に？　閉館後に忍び――」"}, {"t": "p", "v": "「しない。犯罪だ」"}, {"t": "p", "v": "「っすよね」"}, {"t": "p", "v": "「正面から入る」"}, {"t": "p", "v": "　直人はもう一度、学芸員に面談を申し込んだ。今度は名刺に加えて、修復実績の一式を机に並べた。江戸の掛け軸、室町の屏風、明治の洋画。修復前と修復後の写真。"}, {"t": "p", "v": "「ガラス越しですが、木象嵌の接着層に微細なひびが見えます。放置すれば象嵌片の脱落に繋がる。無償で状態調査をさせていただけませんか。報告書を納めますので、メンテナンス予算の申請資料に使ってください」"}, {"t": "p", "v": "　博物館側には、リスクがなく、予算申請の根拠が手に入る。学芸員は「上に相談します」と言った。その顔で、通ることは分かった。"}, {"t": "br"}, {"t": "p", "v": "　一週間後、許可が下りた。"}, {"t": "p", "v": "　ガラスケースが開けられ、直人は手袋を嵌めて、百四十八年前の車内に入った。<br>　木と漆と、薄い埃の匂い。明治の空気が、そこだけ溜まっている。"}, {"t": "p", "v": "　修復士の指が、桜の花弁に触れた。<br>　異なる樹種の、微かな段差。境界の仕事の細かさ。そして。"}, {"t": "p", "v": "　一枚だけ、浮いている花弁があった。<br>　周りの花弁は表面が面一に揃っているのに、その一枚だけ、一ミリの百分の一ほど高い。目には見えない。指には、はっきり分かる。"}, {"t": "p", "v": "　三つの群れを順に確かめた。浮いた花弁が、各群れに一枚ずつ。計三枚。"}, {"t": "p", "v": "　直人は一円札を出し、パネルにかざした。<br>　三つの穴と、三つの群れを重ねる。穴の真下に来るのは――三枚とも、浮いた花弁だった。"}, {"t": "p", "v": "「……押せば動く、って作りだな、これは」"}, {"t": "p", "v": "「押しましょうよ」と、背後で早川が囁く。"}, {"t": "p", "v": "「待て」"}, {"t": "p", "v": "　直人は手を止めた。<br>　修復士として、逆の立場で考える。俺がこの仕掛けの作り手なら――<strong>間違った花弁を押した時</strong>の備えを、入れないはずがない。祖父のノートの言い方を借りるなら、四正の欠けと同じだ。試す者を、外させる側の設計。"}, {"t": "p", "v": "　浮いた花弁の周囲を、指の腹でもう一度なぞった。<br>　あった。浮いた三枚のすぐ隣に、それぞれ<strong>わずかに沈んだ花弁</strong>がある。押し込まれた痕じゃない。最初から半端に沈めて、指を誘う位置に置いてある。"}, {"t": "p", "v": "「……囮だ。沈んだ方を押すと、たぶん中の機構が落ちる。ばねか、錠か。二度と開かなくなる類の」"}, {"t": "p", "v": "「うわ。性格わる」"}, {"t": "p", "v": "「性格がいいんだ。<strong>本気で守る気のある隠し方</strong>をしてる」"}, {"t": "p", "v": "　一発勝負。間違えれば、この線は永久に閉じる。<br>　直人は呼吸を整えた。浮いた三枚だけを、順に、指の腹で押す。"}, {"t": "p", "v": "　一枚目。絹を擦るような、衣擦れに似た感触が指に返った。花弁が一ミリ沈む。"}, {"t": "p", "v": "　二枚目。同じ衣擦れ。"}, {"t": "p", "v": "　三枚目――"}, {"t": "p", "v": "　パネルの一部が、音もなく横に滑った。"}, {"t": "p", "v": "　幅十センチ、高さ五センチの隙間。隠し引き出しだ。"}, {"t": "p", "v": "　早川が息を呑む音だけが、車内に響いた。"}, {"t": "p", "v": "　引き出しの中に、三つ。"}, {"t": "p", "v": "　一つ。真鍮の凸レンズ。直径三センチ。縁にびっしりと細かい彫り。ずしりと重く、明治の職人の手癖が縁の面取りに残っている。"}, {"t": "p", "v": "　二つ。巻物の断片。古い和紙に墨の崩し字。途中で裁ち切られている。"}, {"t": "p", "v": "　三つ。石の欠片。五センチ角。表に刻印――丸に横一。裏に小さく、「三ノ丸　巽　七」。"}, {"t": "p", "v": "「鷺宮さん……これ、百四十八年、ここに」"}, {"t": "p", "v": "「あった。何百万人の目の前に、ずっと」"}, {"t": "p", "v": "　直人は三つを修復士の手つきで取り出し、油紙に包んだ。<br>　――預かりだ。届け出られる形になるまでの。頭の中で言い訳の文面を作りながら、それが言い訳であることも、分かっていた。<br>　巻物の断片を、その場で読めるところだけ読む。崩し字の一行。"}, {"t": "p", "v": "「――『続キハ水鏡ニ映セ』」"}, {"t": "p", "v": "「みずかがみ？」"}, {"t": "p", "v": "「水面に映せ、だ。……目録の『卯の鏡』。<strong>鏡は、水だ</strong>」"}, {"t": "p", "v": "　石の欠片は、城の言葉だった。三ノ丸は外郭、巽は南東。七は――段か、間か。刻印の「丸に横一」は、どこかの家紋か、符丁か。"}, {"t": "p", "v": "「早川、石の刻印を全方向から撮ってくれ。帰って調べる」"}, {"t": "p", "v": "　引き出しを戻し、三枚の花弁を押し直すと、パネルは元の顔に戻った。何事もなかったように、桜が散っている。"}, {"t": "p", "v": "　学芸員には「接着層に重大な劣化なし。数カ所の経過観察を推奨」と報告した。嘘は一つもない。引き出しのことだけ、言わなかった。"}, {"t": "br"}, {"t": "p", "v": "　帰り道、大宮駅までの並木で、早川がようやく大きな声を出した。"}, {"t": "p", "v": "「百四十八年っすよ！　誰も、一回も、見つけてない！」"}, {"t": "p", "v": "「見つけられない。札という鍵がなければ、どの花弁かが分からない。花弁が分かっても、囮を見抜く指がなければ、開ける前に壊す。……鍵と、指。二段構えだ」"}, {"t": "p", "v": "「おじいちゃんは、ここまで来てたんすかね」"}, {"t": "p", "v": "「ノートには結果が書いてない。御料車の項は『確認せよ』で止まってる。……辿り着く前だったのか、書けない事情ができたのか」"}, {"t": "p", "v": "　書けない事情。<br>　口にしてから、その言葉の嫌な重さに気づいた。二〇〇五年、ノートは分割された。黒田に見せないために。書かない、という選択を、祖父は一度している。"}, {"t": "p", "v": "　電車の窓の外を、埼玉の平野が流れていく。<br>　膝の上のカバンには、レンズと、断片と、石。"}, {"t": "p", "v": "　目録の四つのうち、札は手の中に。車輪は今日開けた。<br>　残るは、水の鏡と――鍵。"}, {"t": "p", "v": "　石の裏の「三ノ丸　巽　七」が、次の扉の住所であることを、この時の直人はまだ半分しか理解していなかった。<br>　そしてその扉の前に、先客が立っていることも。"}], "chars": 3009}, {"title": "第五話　祖父の敵", "paras": [{"t": "p", "v": "鉄道博物館からの帰り道、スマートフォンが鳴った。非通知。"}, {"t": "p", "v": "「鷺宮直人さんですか」"}, {"t": "p", "v": "　落ち着いた低音。五十代か、六十代。"}, {"t": "p", "v": "「どちら様ですか」"}, {"t": "p", "v": "「黒田と申します。黒田総一郎。――清一郎さんと、共同で研究をしていた者です。ご逝去を知り、お悔やみを申し上げたく」"}, {"t": "p", "v": "　直人の背筋が伸びた。隣の早川が、表情の変化に気づいて口を閉じる。"}, {"t": "p", "v": "「……どうやって、この番号を」"}, {"t": "p", "v": "「昔、先生からいただいた年賀状に、緊急の連絡先として書き添えてありました。お孫さんの番号だと」"}, {"t": "p", "v": "　祖父が、黒田に。決裂の前か、後か。"}, {"t": "p", "v": "「一度お会いできませんか。先生の思い出話を――」"}, {"t": "p", "v": "「お会いするのは構いません。ただ、先に一つ。祖父の研究ノートを、お持ちですか」"}, {"t": "p", "v": "　電話の向こうで、短い沈黙。"}, {"t": "p", "v": "「……先生は、ノートのことをお孫さんに？」"}, {"t": "p", "v": "「遺品にありました」"}, {"t": "p", "v": "「そうですか。……私の手元にあるのは、先生のノートではなく、共同研究時代の私自身の記録です。よろしければ、お互いの手持ちを見せ合う形で、いかがでしょう」"}, {"t": "p", "v": "　合理的な提案だった。合理的すぎるのが、引っかかった。"}, {"t": "p", "v": "「日時はこちらから連絡します」"}, {"t": "p", "v": "　電話を切ると、早川が待ちきれずに聞いた。"}, {"t": "p", "v": "「黒田って、あの黒田すか。……タイミング、良すぎません？　隠し引き出し見つけた当日っすよ」"}, {"t": "p", "v": "「良すぎる」"}, {"t": "p", "v": "　鎌倉の胎内にいた、グレーのジャケットの男。撮らないカメラ。<br>　偶然が二つ重なった時は、偶然と呼ぶ前に、糸を探せ。祖父の口癖だった。"}, {"t": "p", "v": "「早川。悪いが今日から、写真も座標も、全部オフラインだ。それと――駅で二回、電車を乗り換える。悪いな、遠回りになる」"}, {"t": "p", "v": "「……尾行対策っすか。マジのやつじゃないすか」"}, {"t": "br"}, {"t": "p", "v": "　面会は三日後、赤坂。「黒田歴史研究所」はビルの三階だった。"}, {"t": "p", "v": "　直人は一人で入った。早川には外で待たせ、一時間で連絡がなければ警察へ、と決めてある。大げさだと思いながら、決めた。"}, {"t": "p", "v": "　ドアの中は、紙の匂いだった。壁一面の本棚。机に古地図。祖父の部屋と、同じ種類の部屋だ。"}, {"t": "p", "v": "　ただ、二つだけ、この部屋に不釣り合いな物があった。<br>　一つは、窓際に据えられた真新しい大判スキャナー。文化財のデジタル化に使う業務機で、車が買えるほどの値段がする。もう一つは、机の隅の名刺盆に伏せられた、厚手の洋紙の名刺。伏せてあっても、箔押しの縁だけが見えた。"}, {"t": "p", "v": "「鷺宮直人さん。――先生に似ていらっしゃる。目元が」"}, {"t": "p", "v": "　奥の椅子から、男が立った。五十五。白髪まじり。痩せて、目だけが鋭い。知識に飢えた目、というものを、直人は初めて見た。"}, {"t": "p", "v": "「早速ですが、本題に」"}, {"t": "p", "v": "「先生のお孫さんらしい」黒田は微笑して、椅子を勧めた。"}, {"t": "p", "v": "　直人はノートのコピーを机に置いた。ただし、御料車の頁と、大仏の紋章の詳細は抜いてある。<br>　黒田は速読した。学者の読み方だった。"}, {"t": "p", "v": "「……九三年の文書発見。旧一円札。三つの穴。ここまで、先生は」"}, {"t": "p", "v": "「黒田さんの記録も」"}, {"t": "p", "v": "　黒田は茶封筒を出した。手書きのメモと地図が、合わせて数十枚。<br>　目を通して、直人は認めざるを得なかった。この男は本物だ。祖父が紙幣や建造物という「物」を追ったのに対し、黒田は文献を追っている。幕末の藩士の日記。明治政府の内部記録。旧華族の書簡。"}, {"t": "p", "v": "　そして、直人の知らない情報が、そこにあった。"}, {"t": "p", "v": "「慶応四年三月。江戸城の宝物蔵から、大量の物品が搬出された痕跡があります。搬出先は五カ所――日光、鎌倉、姫路、京都、厳島」"}, {"t": "p", "v": "　五カ所。祖父の文書の「五ヶ所ニ分散完了」と、噛み合う。"}, {"t": "p", "v": "「いずれも、政権が代わっても壊されない場所です。信仰と、権威と、美の聖域。……そして地図は分割され、日常の中に隠された。紙幣。建造物。装飾。<strong>壊されないものの中に</strong>」"}, {"t": "p", "v": "　黒田の声に、二十年分の熱がこもっていた。"}, {"t": "p", "v": "「もう一つ。搬出の実務を担った集団の名が、書簡に一度だけ出てきます。<strong>星霜組</strong>。表向きは、社寺の修理を請け負う職人衆」"}, {"t": "p", "v": "　直人は、顔に出さない努力をした。<br>　修理する者たち。大仏の反射金具。楼門の描き直し。札の穿孔。全部が、一つの名前で繋がった。"}, {"t": "p", "v": "「その組は、いつまで」"}, {"t": "p", "v": "「分かりません。明治の中頃を最後に、記録から消えます。……ただ、私は思うのですよ。<strong>ああいう連中は、消え方まで仕事のうち</strong>だとね」"}, {"t": "br"}, {"t": "p", "v": "「黒田さん。一つ聞かせてください。祖父と決裂した理由は」"}, {"t": "p", "v": "　黒田の表情が、一瞬だけ止まった。"}, {"t": "p", "v": "「……先生は慎重すぎた。証拠が揃うまで出すなと言った。私は、学界に認められたかった。焦って、出して、叩かれて、大学を追われた。それだけの話です」"}, {"t": "p", "v": "「後悔は」"}, {"t": "p", "v": "「しています。先生の言う通りにしていれば、今頃は――二人で、見つけていたかもしれない」"}, {"t": "p", "v": "　その言葉だけは、計算に聞こえなかった。"}, {"t": "p", "v": "　直人は立ち上がりかけて、伏せられた名刺盆に、もう一度だけ目をやった。"}, {"t": "p", "v": "「立派なスキャナーですね。研究所の経営は、順調ですか」"}, {"t": "p", "v": "　黒田の目が、初めて泳いだ。"}, {"t": "p", "v": "「……出資者が、いましてね。文化財の記録保存に理解のある」"}, {"t": "p", "v": "「その方の名刺ですか。伏せてあるのは」"}, {"t": "p", "v": "「――鷺宮さん」黒田は笑みを作り直した。「協力しませんか。先生のノートと私の記録を合わせれば、全体が見える。一人より二人だ」"}, {"t": "p", "v": "「考えておきます」"}, {"t": "p", "v": "　直人は会釈して、部屋を出た。<br>　ドアが閉まる寸前、黒田が独り言のように言うのが聞こえた。"}, {"t": "p", "v": "「……急いだ方がいい。<strong>急ぐ理由が、あなたにもうすぐできる</strong>」"}, {"t": "br"}, {"t": "p", "v": "　ビルの外で、早川がスマートフォンを握って待っていた。"}, {"t": "p", "v": "「五十八分。ぎりぎりっす。で、どうでした」"}, {"t": "p", "v": "「収穫は三つ。五カ所の内訳。星霜組という名前。……それと、黒田には金主がいる」"}, {"t": "p", "v": "「金主？」"}, {"t": "p", "v": "「研究所の所帯に合わない機材と、伏せた名刺。触れたら目が泳いだ。二十年干された学者に、文化財の記録保存へ気前よく金を出す出資者――善意なら、名刺を伏せる必要はない」"}, {"t": "p", "v": "　帰りの電車で、早川が自分の端末を差し出した。"}, {"t": "p", "v": "「あと、これ。待ってる間に見つけたんすけど。……悪いニュースが二つ」"}, {"t": "p", "v": "　一つ目は、報道記事だった。<br>　――日光東照宮、奥宮エリアの大規模保存修理。<strong>来月着工、工期四年</strong>。着工後は宝塔周辺が立入禁止。"}, {"t": "p", "v": "「五カ所の一つ、日光っすよね。入れなくなるっす。……四年」"}, {"t": "p", "v": "　二つ目は、海外のオークション情報を扱う会員制サイトの、予告の頁だった。英文。<br>　――十二月、東京。プライベート・セール。出品予定:「日本近代史における最大の未発見資産に関する、完全な位置情報」。取扱:<strong>タカミネ・アンド・パートナーズ</strong>。"}, {"t": "p", "v": "「『未発見資産の位置情報』を、競りに掛けるって書いてあるんすよ。十二月に。……これって」"}, {"t": "p", "v": "　直人は画面を見つめた。<br>　急ぐ理由が、あなたにもうすぐできる。"}, {"t": "p", "v": "　黒田の金主は、宝そのものではなく、<strong>宝の座標を売る気だ</strong>。学術も、継承も、そこにはない。あるのは値札だけだ。"}, {"t": "p", "v": "「早川。カレンダーを出してくれ」"}, {"t": "p", "v": "「……何日あるんすか、俺たち」"}, {"t": "p", "v": "「日光の着工まで五週間。競りまで十週間。で、次の大潮と、厳島の潮位が条件に合う日は」"}, {"t": "p", "v": "　調べた早川が、顔を上げた。"}, {"t": "p", "v": "「十七日後っす」"}, {"t": "p", "v": "　三つの砂時計が、同時にひっくり返った音がした。"}], "chars": 2991}, {"title": "第六話　白鷺の石垣", "paras": [{"t": "p", "v": "御料車から出た三つの遺物を、修復台に並べた。"}, {"t": "p", "v": "　真鍮の凸レンズ。縁に唐草の彫り。倍率は低いが、光を集める強い曲面。虫眼鏡には小さすぎる。用途は、まだ読めない。"}, {"t": "p", "v": "　巻物の断片。「続キハ水鏡ニ映セ」。"}, {"t": "p", "v": "　そして、石の欠片。表に丸に横一の刻印、裏に「三ノ丸　巽　七」。"}, {"t": "p", "v": "「三ノ丸は城の外郭。巽は南東。七は、たぶん石垣の段数だ。どこかの城の三ノ丸の南東、七段目に、この刻印の石がある」"}, {"t": "p", "v": "「どこの城すか」"}, {"t": "p", "v": "「城跡は全国に三万ある。……が、絞る方法はある。大阪城天守閣に、全国の石垣刻印を集めた研究データベースがある。二万点。現地でしか引けない」"}, {"t": "p", "v": "　翌朝一番の新幹線で、大阪へ飛んだ。誰にも行き先を言わずに。"}, {"t": "br"}, {"t": "p", "v": "　天守閣上層の資料室で、条件を入れる。形状は円形、内部は横線一本のみ。"}, {"t": "p", "v": "　該当、三件。<br>　大阪城・三ノ丸南面。姫路城・三ノ丸巽方面。名古屋城・二ノ丸東面。"}, {"t": "p", "v": "「裏書きは『三ノ丸、巽』。……姫路だけだ」"}, {"t": "p", "v": "　そして、姫路の一件の備考欄に、直人は釘付けになった。"}, {"t": "p", "v": "「本刻印は姫路城の刻印台帳に記録なし。周辺と石質が異なる（花崗岩帯に安山岩）。<strong>後世の差し替えの可能性を排除できない</strong>」"}, {"t": "p", "v": "「後世の、差し替え……」"}, {"t": "p", "v": "「姫路の石垣は、明治の末に国費で大修理が入ってる。……<strong>修理に紛れて</strong>、だ。また同じ手口だ。星霜組は、修理のたびに、器を移し替えてる」"}, {"t": "p", "v": "　築城の池田家でも、幕末でもない。この石が壁に入ったのは、百年ほど前。正規の台帳に載らないのは、正規の工程の外で積まれたからだ。"}, {"t": "p", "v": "「姫路へ行くぞ。新幹線で三十分だ」"}, {"t": "br"}, {"t": "p", "v": "　大手前通りの正面に、白鷺城が浮かんでいた。白漆喰が午後の光を撥ねて、名の通り、空に留まった白い鳥に見える。"}, {"t": "p", "v": "　三ノ丸広場は無料で入れる。観光客はまばらで、石垣を見ている人間は皆無だった。"}, {"t": "p", "v": "　巽櫓寄りの石垣。下から七段目を、端から順に見ていく。丸に十字、扇、三角――池田の石工たちの管理記号が、四百年分、風雨に薄れながら残っている。"}, {"t": "p", "v": "「……鷺宮さん、これ」"}, {"t": "p", "v": "　早川が指した石に、丸に横一。<br>　欠片と、同じ刻印だった。"}, {"t": "p", "v": "　直人は膝を突き、石に触れた。周囲は花崗岩のざらつき。この石だけ、肌理が細かい。安山岩。"}, {"t": "p", "v": "　刻印の横線に、指の腹を当てる。<br>　ただの彫りじゃない。溝だ。そして溝の幅が、片端だけ僅かに広い。"}, {"t": "p", "v": "　――押すな。<strong>滑らせろ</strong>、という作りだ。"}, {"t": "p", "v": "　動かす前に、直人はカバンから薄い雁皮紙と固形墨を出した。"}, {"t": "p", "v": "「何してるんすか、こんな時に」"}, {"t": "p", "v": "「拓本だ。刻印と、周りの目地の。……手順を飛ばして開けるのは、素人のやることだ」"}, {"t": "p", "v": "　半分は本当で、半分は修復士の虫の知らせだった。記録してからでないと、動かしたくない。<br>　二分で拓本を取り、油紙に挟んで懐へ入れる。"}, {"t": "p", "v": "　それから、横線の広い端に指を掛け、狭い方へ滑らせた。"}, {"t": "p", "v": "　石と石の摩擦の、重い抵抗。一センチ。二センチ。"}, {"t": "p", "v": "　ごり、と石臼を挽くような低い音がして、石の表面の一部が奥へ沈んだ。<br>　拳の入る空洞。指先が、金属に触れる。"}, {"t": "p", "v": "　真鍮の筒だった。長さ十センチ。両端が蝋で封じてある。胴には、レンズの縁と同じ唐草――に見せかけた、細かい目盛りのような彫りが巻いていた。"}, {"t": "p", "v": "「四百年――じゃなくて、百年っすか。とにかく、誰も」"}, {"t": "p", "v": "「気づかなかった。……これも、記録が先だ」"}, {"t": "p", "v": "　直人は筒の胴の彫りにも雁皮紙を当て、手早く拓を取った。蝋封は、ここでは開けない。開封は道具と照明のある場所でやる。それが筋だ。"}, {"t": "p", "v": "　スライドを戻すと、石垣は何事もなかった顔に戻った。"}, {"t": "p", "v": "　立ち上がった、その時だった。"}, {"t": "p", "v": "　広場の向こう、塀の陰に、グレーのジャケットが見えた。"}, {"t": "p", "v": "「早川。走れ」"}, {"t": "p", "v": "「え」"}, {"t": "p", "v": "「走れ！」"}, {"t": "br"}, {"t": "p", "v": "　三ノ丸を西へ抜け、観光の列を縫う。背後の足音は二人分。まっすぐ追ってくる足音と、少し遅れて外を回る足音。"}, {"t": "p", "v": "　大手門は人が多い。紛れられる。そう考えて足を向けかけ、直人は嫌な感触に気づいた。<br>　外を回った足音が、消えている。"}, {"t": "p", "v": "　回り込まれている。人気のない方へ、追い立てられている。"}, {"t": "p", "v": "「こっちだ」"}, {"t": "p", "v": "　内堀沿いの小道へ折れた瞬間、正面に、男が立っていた。"}, {"t": "p", "v": "　グレーのジャケット。四十代。息一つ切らしていない。<br>　鎌倉の胎内で見た男だった。"}, {"t": "p", "v": "「――お預かりします」"}, {"t": "p", "v": "　男は世間話の声で言って、手を差し出した。"}, {"t": "p", "v": "　直人は答えず、間合いを計った。相手は素手。こちらはカバンと、腰の道具差しにヘラ。修復用の竹べらでも、手首の腱を打てば――"}, {"t": "p", "v": "　打てなかった。"}, {"t": "p", "v": "　踏み込んで振ったヘラは、男の掌に、音もなく吸われた。次の瞬間、直人の腕は背中に回され、視界が半回転して、気づけば堀端の柵に押し付けられていた。柔道でも合気でもない。人を壊さずに制圧する、仕事の動きだった。"}, {"t": "p", "v": "「乱暴は好みません」男は直人の懐から、真鍮の筒だけを正確に抜き取った。「これは依頼品なので。……お怪我がなくて何よりです」"}, {"t": "p", "v": "「――あんた、黒田の」"}, {"t": "p", "v": "「黒田先生は、関係がありません」"}, {"t": "p", "v": "　男は一拍置いて、訂正した。"}, {"t": "p", "v": "「<strong>まだ</strong>、関係がありません」"}, {"t": "p", "v": "　早川が震える手でスマートフォンを構えると、男は初めて笑った。"}, {"t": "p", "v": "「撮っても構いませんが、消させていただく手間が増えるだけです。……ああ、それと」"}, {"t": "p", "v": "　男は筒を懐に仕舞いながら、直人の腰の道具差しを見た。"}, {"t": "p", "v": "「良いヘラだ。研ぎが丁寧です。<strong>道具を大事にする方と、争いたくはない</strong>。次は、お互い、間に合わせましょう」"}, {"t": "p", "v": "　男は背を向けて、未練も威嚇もなく、ただの散歩の背中で去っていった。"}, {"t": "br"}, {"t": "p", "v": "　新幹線のホームのベンチで、早川は長いこと膝の間に頭を垂れていた。"}, {"t": "p", "v": "「……俺、大仏見に行くだけって聞いてたんすけど」"}, {"t": "p", "v": "「すまない」"}, {"t": "p", "v": "「命の危険、あるやつじゃないすか、これ」"}, {"t": "p", "v": "「ある。今日、分かった。……降りるなら、ここで降りてくれ。写真の解析まででいい。現場にはもう連れて行かない」"}, {"t": "p", "v": "　早川はしばらく黙って、それから、顔を上げた。"}, {"t": "p", "v": "「――ムカつくんで、降りないっす」"}, {"t": "p", "v": "「ムカつく？」"}, {"t": "p", "v": "「あの人、俺のこと最後まで一回も見なかったんすよ。眼中にないってやつ。……上等っすよ。こっちはエンジニアなんで。次は足で勝負しないっす」"}, {"t": "p", "v": "　直人は、少し笑った。それから、懐の油紙を出した。"}, {"t": "p", "v": "「それに――全部は、取られてない」"}, {"t": "p", "v": "「え？　筒、取られたじゃないすか」"}, {"t": "p", "v": "「中身はな。だが胴の彫りの拓本は、ここにある。あの唐草は飾りじゃない。等間隔の刻みに、太いのと細いのが混ざってた。……あれはたぶん、<strong>数字だ</strong>」"}, {"t": "p", "v": "　筒の中の紙と、筒の外の目盛り。星霜組が情報を二重にしていたなら、敵の手にあるのは半分だ。<br>　そして、こちらの半分は、拓本という紙の上にある。紙なら――修復士の領分だ。"}, {"t": "p", "v": "　初めての、はっきりした敗北だった。手の中には拓本と、屈辱と、それから妙に冷静な計算が残った。"}, {"t": "p", "v": "　あの男は「依頼品」と言った。依頼主がいる。黒田は「まだ」関係がない。<br>　なら、依頼主は――名刺を伏せていた、あの金主だ。"}, {"t": "p", "v": "　三週間後の厳島の潮が、また一日、近くなった。"}], "chars": 2905}, {"title": "第七話　透かしの家", "paras": [{"t": "p", "v": "三つ目の穴が指すのは、東京都北区西ケ原。国立印刷局の東京工場だ。"}, {"t": "p", "v": "　当然、工場には入れない。だが印刷局は、王子駅の前に一般公開の施設を持っている。「お札と切手の博物館」。紙幣の歴史と技術を展示する、小さな博物館だ。工場は西ケ原、博物館は王子。歩いて十分ほどの距離にある。"}, {"t": "p", "v": "「潜入とかじゃなくてよかったっす……」"}, {"t": "p", "v": "「工場の門をくぐる必要はないと思ってる。穴が指してるのは場所じゃなく、<strong>系譜</strong>だ。札の鍵を彫れた人間は、印刷局の中にしかいない。その筋を辿る」"}, {"t": "p", "v": "　平日の博物館は空いていた。展示室に、明治の紙幣が並ぶ。政府紙幣、国立銀行券、改造紙幣。ガラスの中に、直人の持っているものと同じ旧一円札もあった。"}, {"t": "p", "v": "　展示の解説をしていた案内ボランティアの老人が、直人の視線の粘り強さに気づいて、声を掛けてきた。"}, {"t": "p", "v": "「お詳しいんですか、明治のお札」"}, {"t": "p", "v": "「修復士です。紙の。……立ち入ったことを伺いますが、この時代の彫師や抄紙の職人の記録は、どこまで残っているものでしょう」"}, {"t": "p", "v": "「ほう。彫師の」"}, {"t": "p", "v": "　老人は目を細めた。八十前後。指の節が太く、爪の形が変わっている。長年、同じ道具を同じ持ち方で握った手だ。"}, {"t": "p", "v": "「わたしはね、ここを退職した人間です。抄紙部に四十年。<strong>透かし</strong>の畑でした。うちは祖父の代から三代、透かし屋でね」"}, {"t": "p", "v": "　直人は、一呼吸置いてから、賭けた。<br>　ポケットから油紙を出し、一円札を――穴のある一枚を、老人の前に開いた。"}, {"t": "p", "v": "「これを、見ていただけますか」"}, {"t": "p", "v": "　老人は札を受け取り、窓の光に透かした。<br>　そして、長いこと、動かなかった。"}, {"t": "p", "v": "「……三針の束ね打ち」"}, {"t": "p", "v": "「え？」"}, {"t": "p", "v": "「穴の縁をご覧なさい。三つとも、針の抜き際に同じ癖がある。三本を束ねて、一打ちで通してるんです。これはね、昔の検査場の隠し技でね。極書きの代わりに、真物の札へ<strong>検査孔</strong>を打つ。台帳に残さない、職人だけの真贋の印」"}, {"t": "p", "v": "「打てた人間は」"}, {"t": "p", "v": "「限られますよ。検査場の、しかも束ね打ちを許された古手だけ。……あなた、これを、どこで」"}, {"t": "p", "v": "「祖父の遺品です。鷺宮清一郎。宮内庁書陵部で、紙の修復を」"}, {"t": "p", "v": "　老人の顔色が、変わった。"}, {"t": "p", "v": "「――書陵部の、鷺宮さん」"}, {"t": "p", "v": "「祖父を、ご存じですか」"}, {"t": "p", "v": "「お会いしたことはない。だが、二十年ほど前に一度、手紙をいただいた。<strong>桐生先生のことを調べている</strong>、と」"}, {"t": "br"}, {"t": "p", "v": "　桐生。<br>　聞いたことのない名前だった。だが、聞いた瞬間に、どこかで見た字面だと思った。"}, {"t": "p", "v": "　老人は展示室の奥の、関係者控えの小部屋に二人を通した。茶を出し、古い風呂敷包みを解いた。"}, {"t": "p", "v": "「うちの祖父の遺した物です。明治の透かし職人の、まあ、がらくたですがね」"}, {"t": "p", "v": "　型紙。すき入れの金網の断片。そして、変色した半紙が一枚。<br>　半紙には、名前が並んでいた。十七人。職種と、名前。経師。宮大工。石工。指物師。庭師。彫師。錺職。――全員が、<strong>修理と造営の職人</strong>だ。"}, {"t": "p", "v": "「連判状、ですか」"}, {"t": "p", "v": "「祖父は『<strong>組の名残り</strong>』とだけ言っていました。星霜組。ご存じかな」"}, {"t": "p", "v": "「……つい先日、その名前を知りました」"}, {"t": "p", "v": "「表向きは、社寺やお城の修理を請け負う職人衆。実のところは――<strong>預かり物の番人</strong>です。徳川様の預かり物の。祖父の言い方だと、こうです。『<strong>守り手は、表の職を持て。修理する職だ。修理する者は、どこへでも入れる。何度でも戻って来られる。直しながら、隠し続けられる</strong>』」"}, {"t": "p", "v": "　修理する者は、どこへでも入れる。<br>　大仏の窓框。姫路の石垣。駅の天井。楼門の板絵。全部の説明が、その一句で付いた。"}, {"t": "p", "v": "「この名簿の最後の方に――」"}, {"t": "p", "v": "「ええ」老人は、半紙の左端を指した。「一番あたらしい名が、これ。<strong>彫師・桐生</strong>。うちの祖父の兄弟弟子です。組の、たぶん最後の一人。戦後は宮内府に入って、書物の修理をしていたと聞きます」"}, {"t": "p", "v": "　書物の修理。宮内府。のちの宮内庁。<br>　直人はカバンから、祖父のノートの一冊目を出した。表紙をめくる。見返しの隅に、小さな献辞が書いてある。三十年間、何度も見て、一度も気に留めなかった一行。"}, {"t": "p", "v": "「<strong>桐生先生に</strong>」"}, {"t": "p", "v": "「……そういうことか」"}, {"t": "p", "v": "　祖父は、組の一員じゃなかった。<br>　書陵部の新米だった祖父の、修復の師匠が――星霜組の最後の一人だった。師匠は多くを語らずに死に、祖父は師匠の遺した断片から、三十年かけて、独力で組の仕事を辿り直した。<br>　だから三十年かかった。継いだのではなく、発掘したのだ。"}, {"t": "p", "v": "　そして祖父も、直人に多くを語らずに死んだ。<br>　語らないのが、組の作法だからじゃない。<strong>証拠が揃うまで語らない</strong>のが、笑い者にされた男の、最後の矜持だったからだ。"}, {"t": "br"}, {"t": "p", "v": "「一つ、伺ってもいいですか」"}, {"t": "p", "v": "　直人は、真鍮のレンズを出した。<br>　老人はそれを見て、ああ、と声を漏らした。"}, {"t": "p", "v": "「<strong>透かし見の玉</strong>だ」"}, {"t": "p", "v": "「ご存じなんですか」"}, {"t": "p", "v": "「祖父の道具箱に、似たのがありました。水に映した図を読むときの道具です。水面ってのはね、揺れる。揺れる図は、目じゃ読めない。だがこの玉は、焦点が水の揺れに合わせて作ってある。<strong>玉を通すと、揺れた水鏡の図が、止まって見える</strong>」"}, {"t": "p", "v": "　続きは、水鏡に映せ。<br>　巻物の指示と、レンズの用途が、一本に繋がった。水に映る何かを、このレンズで読む。場所は――五カ所のうち、水と切り離せない場所。"}, {"t": "p", "v": "　海に浮かぶ聖域。厳島。"}, {"t": "p", "v": "「ありがとうございます。……本当に」"}, {"t": "p", "v": "　頭を下げて部屋を出ようとした直人に、老人は最後に、世間話の調子で言った。"}, {"t": "p", "v": "「ああ、そうだ。先週もね、同じようなことを聞きに来た方がいましたよ」"}, {"t": "p", "v": "　直人の足が、止まった。"}, {"t": "p", "v": "「……どんな方でしたか」"}, {"t": "p", "v": "「感じのいい方でした。グレーの上着の。……熱心でね。桐生の名前を出したら、とても喜んで」"}, {"t": "br"}, {"t": "p", "v": "　外に出ると、王子の街に夕方の風が吹いていた。"}, {"t": "p", "v": "「氷室――って呼びます？　あのグレーの人。早川くん命名ですけど」"}, {"t": "p", "v": "「氷室？」"}, {"t": "p", "v": "「取り押さえられた時、あの人の手、氷みたいに冷たかったんすよ。……で、その氷室が、先週ここに来てた。俺たちの一週間先を歩いてるってことっすよね」"}, {"t": "p", "v": "「いや」直人は首を振った。「向こうは桐生の名前に『喜んだ』。つまり、名簿をここで初めて見た。<strong>系譜の情報では、ほぼ並んでる</strong>」"}, {"t": "p", "v": "「並んでて、向こうには筒の中身がある」"}, {"t": "p", "v": "「こっちには拓本と、透かし見の玉と、玉の使い方がある。……それと」"}, {"t": "p", "v": "　直人は、夕空を見上げた。"}, {"t": "p", "v": "「向こうにない物が、もう一つある。厳島の大潮の日付だ。水鏡は、潮が引かないと現れない。<strong>現地の条件は、金じゃ買えない。待つしかない</strong>。並んだままなら、条件の日に、同じ場所で鉢合わせる」"}, {"t": "p", "v": "「……それ、並んでるって言わないっす。デッドヒートって言うんす」"}, {"t": "p", "v": "　三つの砂時計に、四つ目が加わった。<br>　一番細い砂時計が、一番早く落ちていく。"}], "chars": 2958}, {"title": "第八話　水鏡の日付", "paras": [{"t": "p", "v": "姫路の拓本を、修復台の上で広げた。"}, {"t": "p", "v": "　筒の胴に巻かれていた「唐草」。拓に取ると、飾りの蔓の中に、等間隔の刻みが浮かび上がる。太い刻みと、細い刻み。"}, {"t": "p", "v": "「太いのと細いの、並びを書き出しました」早川がモニターを回した。「太を一、細を零で読むと――規則性はあるんすけど、二進法じゃない。区切りが五刻みごとに入ってる」"}, {"t": "p", "v": "「五進の束か。……算盤だな」"}, {"t": "p", "v": "「算盤？」"}, {"t": "p", "v": "「五珠と一珠。職人の数の書き方だ。読み替えると？」"}, {"t": "p", "v": "「えーと――『一〇五』『二二』『一七』……数が三つ。単位はなし」"}, {"t": "p", "v": "　百五、二十二、十七。<br>　座標にしては短すぎ、距離にしては説明がない。直人は三つの数を睨んで、それから、巻物の断片を隣に置いた。"}, {"t": "p", "v": "　続キハ水鏡ニ映セ。"}, {"t": "p", "v": "「……水鏡は、いつでも映るわけじゃない。厳島の大鳥居の水鏡なら、潮が引いて、風のない夕方だけだ。<strong>百五は潮位じゃないか</strong>。センチじゃなく、尺寸の百五――いや、明治なら潮位は尺だ。えー、待て」"}, {"t": "p", "v": "「潮位表と突き合わせます。宮島の検潮所、データ公開されてるんで。……百五を『センチ相当の潮位』って仮定すると、干潮で百五を切る日は――大潮の前後だけっす。二十二は――<strong>二十二日</strong>？　十七は――<strong>十七時</strong>？」"}, {"t": "p", "v": "　百五以下の潮位。二十二日。十七時。<br>　先に割り出してあった、大潮の日付と、ぴたりと重なった。"}, {"t": "p", "v": "「星霜組の取扱説明書っすね、これ。<strong>この高さまで潮が引いたとき、この日この刻に読め</strong>、って」"}, {"t": "p", "v": "「筒の中の紙が『どこを読むか』で、外の目盛りが『いつ読めるか』だ。中身は氷室に取られた。……だが、読める日時はこっちだけが知ってる」"}, {"t": "p", "v": "　半分ずつの持ち札で、同じ盤面に着く。<br>　勝負の日付が、確定した。"}, {"t": "br"}, {"t": "p", "v": "　週明け、書陵部の閲覧が通った。"}, {"t": "p", "v": "　慶応四年三月の文書は、薄い料紙に、流麗だが急いだ筆跡で書かれていた。立ち会いの真琴が、白手袋で頁を繰る。"}, {"t": "p", "v": "「筆圧が乱れてる」直人はルーペ越しに言った。「文字の潰れ方が、平時の書簡じゃない。切迫の中で書いてる」"}, {"t": "p", "v": "「慶応四年三月なら、江戸城の引き渡しの直前です。城内は混乱の極みだったはず」"}, {"t": "p", "v": "　文面は、祖父の引用と一致した。五ヶ所ニ分散。壊サレヌモノノ中ニ。鍵ハ札ニ遺スベシ――そして、その右脇の朱書き。「旧一円」。"}, {"t": "p", "v": "「朱の墨、時代が違いますね」真琴が言った。「本文は幕末の松煙墨。朱書きは……明治も後半の朱です。<strong>別人が、三十年ほど後に書き込んでいる</strong>」"}, {"t": "p", "v": "「計画を、次の代が続けた証拠だ」"}, {"t": "p", "v": "　真琴は十五分ほど書庫に消え、同じ料紙・同じ筆跡の二通目を探し出してきた。日付は数日後。"}, {"t": "p", "v": "「読み上げます。『搬出ハ完了セリ。然レドモ、蔵ノ全容ヲ知ル者ハ余一人ナリ。余ノ死後、此ノ知識ハ失ワレン。依ッテ、地図ヲ五ツニ分カチ、各地ニ封ジタリ。五ツ揃エザレバ全容ハ見エズ。――後世ノ者ヨ、此ノ国ノ宝ヲ守レ』」"}, {"t": "p", "v": "　百五十年前の、名を残さなかった人間の遺言だった。<br>　主君の宝を一人で背負い、自分の死後にも見つけられるように暗号を編み、守り手の組を残した。<br>　その糸の端を、桐生が持ち、祖父が拾い、いま直人の手の中にある。"}, {"t": "p", "v": "「お祖父様は、この机で、これを読んだんですね」真琴の声が、規定の声より一段柔らかかった。「――料紙も墨も筆跡も、幕末で整合します。本物です。お祖父様は、正しかった」"}, {"t": "p", "v": "　学芸員の断定だった。三十年、狂人と呼ばれた男への、いちばん正式な名誉回復だった。"}, {"t": "br"}, {"t": "p", "v": "「厳島に行かれるんですね。いつですか」"}, {"t": "p", "v": "「二十二日。大潮の日だ」"}, {"
