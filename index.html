日後。<br>　閣議は、四日後。<br>　その先に、台風が来ていた。天気図の渦は、五日後には瀬戸内を覆う。"}, {"t": "p", "v": "「……三日後しか、ない」"}, {"t": "p", "v": "　三つの砂時計。朝倉の法。台風の空。そして鬼頭という、時計を持たない暴走。"}, {"t": "p", "v": "「凛さん」直人は言った。「三日後、竜宮へ行く。その前に――<strong>来島暁に、会いに行かないか</strong>」"}, {"t": "p", "v": "　凛が、顔を上げた。"}, {"t": "p", "v": "「あんたの祖母さんの願いを、俺は道具にしない。だが、<strong>手土産が写しじゃ、五百年は終わらない</strong>。本物の手土産を持っていこう」"}, {"t": "p", "v": "「本物の、手土産？」"}, {"t": "p", "v": "「能島の、来島の彫りの写真だ」直人は、凛が撮った「昭和三十九年　補修　来島」の写真を示した。「あんたの家は裏切り者じゃなかった、五百年うちの城を守ってくれてありがとう――<strong>それを、竜宮の前で、本人に言う</strong>。それが、武吉の遺言の、一番まっとうな読み方だろう」"}, {"t": "p", "v": "　凛は、写真を見て、それから、深く、頷いた。"}, {"t": "p", "v": "「……はい。祖母に、いい報告ができそうです」"}], "chars": 1912}, {"title": "第十一話　毒の島の夜", "paras": [{"t": "p", "v": "竜宮へ発つ前夜、直人たちは因島の、凛の知る空き家に泊まった。<br>　電子の網を避けるため、通信を全部落とした一夜。サラは「久しぶりに、追われる側じゃない夜」と言って、縁側で膝を抱えていた。"}, {"t": "p", "v": "　その静けさを破ったのは、鬼頭だった。"}, {"t": "p", "v": "　深夜、空き家の戸が、蹴破られた。"}, {"t": "p", "v": "「潮印を、五枚だ」"}, {"t": "p", "v": "　鬼頭は、一人だった。来島の部下ではなく、もう、ただの一人の男だった。手に、磯で使う長いバール。目が、据わっている。理屈を捨てた人間の目だ。"}, {"t": "p", "v": "「来島に切られた。四十過ぎて、行き場がねえ。……だが、五億の太刀があれば、全部やり直せる」"}, {"t": "p", "v": "「太刀は、まだ見つかってない」直人は、皆を背にかばった。「五枚を渡しても、あんたには開けられない。開け方は、辿った者の頭の中にしかない」"}, {"t": "p", "v": "「なら、頭ごと連れていく」"}, {"t": "p", "v": "　鬼頭がバールを構えた、その時。"}, {"t": "p", "v": "　サラが、縁側から叫んだ。"}, {"t": "p", "v": "「鬼頭さん！　あんたの銀行口座、今、見てる！」"}, {"t": "p", "v": "　鬼頭の動きが、止まった。"}, {"t": "p", "v": "「来島海運の裏帳簿、あたし全部持ってる。あんたが十六年、何に使われてきたかも。……あんた、退職金、一円ももらってないでしょ。<strong>危ない仕事だけやらされて、切られた</strong>」"}, {"t": "p", "v": "「……何が言いたい」"}, {"t": "p", "v": "「太刀を盗んでも、あんたに買い手はつかない。この業界、あんたの顔は割れてる。<strong>盗品の五億は、あんたには一円にもならない</strong>。それを一番よく知ってるのは、あんたを使ってた来島よ」"}, {"t": "p", "v": "　鬼頭のバールが、下がった。<br>　行き場のない男の、行き場のなさが、その肩に降りてきた。"}, {"t": "p", "v": "「サラさん」凛が、静かに前に出た。「鬼頭さんに、仕事を紹介できます」"}, {"t": "p", "v": "「……何？」"}, {"t": "p", "v": "「うちは古美術商です。瀬戸内の島を回って、品を集める。<strong>海に強くて、力があって、島の地理を知ってる人</strong>が要ります。日当は安い。でも――<strong>切られない</strong>」"}, {"t": "p", "v": "　鬼頭は、長いこと、動かなかった。<br>　やがて、バールを取り落とし、その場に座り込んだ。四十過ぎの男が、膝に顔を埋めて、声を殺した。"}, {"t": "p", "v": "「……俺は、あんたらを、殺しに来たんだぞ」"}, {"t": "p", "v": "「知っています」凛は言った。「でも、まだ、誰も殺していない。だから、間に合います。……海賊の家は、逃げ遅れた者も、拾うんです」"}, {"t": "br"}, {"t": "p", "v": "　鬼頭は、その夜のうちに全部を吐いた。<br>　来島暁の、本当の企み。"}, {"t": "p", "v": "「来島は……太刀も、金も、どうでもいいんだ。あの人が欲しがってたのは、一つだけだ」"}, {"t": "p", "v": "　鬼頭は、掠れた声で言った。"}, {"t": "p", "v": "「『<strong>来島の家が、裏切り者じゃなかった証拠</strong>』だ。……あの人、酔うといつも言ってた。『うちは五百年、裏切り者の家として生きてきた。だが、本当にそうか。証拠が、海の底にあるはずだ』って」"}, {"t": "p", "v": "　凛が、息を呑んだ。<br>　直人が撮った、能島の「昭和三十九年　補修　来島」の写真。凛が竜宮の前で見せるつもりの、あの手土産こそ、来島暁が五百年、探し続けていたものだった。"}, {"t": "p", "v": "「来島は、竜宮の中の遺言に賭けてる」鬼頭が続けた。「武吉の遺言に、来島のことが、どう書かれてるか。それを、自分の目で見たいんだ。……宝の競売も、闇の仲買も、全部、そこへ辿り着くための金稼ぎだった」"}, {"t": "p", "v": "「……なら」直人は言った。「俺たちと、来島の目的は、ぶつからない」"}, {"t": "p", "v": "「ぶつかる」鬼頭が首を振った。「朝倉だ。あの役人は、遺言を『外交カード』にする気だ。来島の名誉も、村上の宝も、あいつには関係ない。<strong>遺言が公開される前に、国が押さえる</strong>。それが一番、まずい」"}, {"t": "br"}, {"t": "p", "v": "　夜が明ける前、サラがPCを開いた。"}, {"t": "p", "v": "「朝倉の閣議請議、前倒しされてる。保全指定、<strong>明後日じゃなくて、明日の朝</strong>。……国の潜水チームが、竜宮に先に入る」"}, {"t": "p", "v": "「竜宮の潮止まりは」"}, {"t": "p", "v": "「明日の、昼」凛が海図を睨んだ。「国のチームより先に入るには――<strong>今夜、発つしかない</strong>」"}, {"t": "p", "v": "　台風の前の、うねりが出始めた海。<br>　国の保全指定の、締め切りの朝。<br>　来島暁の、五百年分の問い。"}, {"t": "p", "v": "　全部が、明日の来島海峡の、十二分間の潮止まりに、集まろうとしていた。"}, {"t": "p", "v": "「行きましょう」凛が立ち上がった。「潮風で。……鬼頭さん、あなたも来ますか。<strong>海に強い人手が、要ります</strong>」"}, {"t": "p", "v": "　鬼頭は、顔を上げた。殺しに来た家に、手を貸すかと問われて。"}, {"t": "p", "v": "「……舫いくらいは、取れる」"}, {"t": "p", "v": "「上等です。初仕事ですね」"}], "chars": 1852}, {"title": "第十二話　夜の海峡", "paras": [{"t": "p", "v": "潮風は、夜の来島海峡へ向かった。"}, {"t": "p", "v": "　台風のうねりが、南から入り始めている。凛は灯りを絞り、レーダーと、体に染みた勘だけで、暗い水道を進めた。鬼頭が舳先で、見張りに立った。殺しに来た男が、今は見張りに立っている。誰も、そのことに触れなかった。"}, {"t": "p", "v": "「来島海峡は、日本三大急潮の一つです」凛が舵の前で言った。「最大で十ノット。……そんな所に、なぜ竜宮を隠せたのか、ずっと疑問でした。でも――五枚の座標は、海峡のど真ん中じゃない。<strong>主水道の脇の、瀬の陰</strong>です。そこだけ、潮がぶつかって、渦の裏に、流れの緩む場所がある」"}, {"t": "p", "v": "「海賊にしか、分からない場所だな」"}, {"t": "p", "v": "「海賊にしか、隠せない場所です」"}, {"t": "br"}, {"t": "p", "v": "　夜半、無線が入った。公式の周波数。朝倉だった。"}, {"t": "p", "v": "『村上船長。夜間の危険航行です。引き返しなさい。……明朝、当該海域は文化財緊急保全指定となります。今、そこにいることは、指定後は不法侵入と同義です』"}, {"t": "p", "v": "　凛はマイクを取らなかった。代わりに、直人が取った。"}, {"t": "p", "v": "「朝倉さん。一つだけ、答えてくれ。あんたは、竜宮の遺言を、どうする気だ」"}, {"t": "p", "v": "『……国の資産として、適切に管理します』"}, {"t": "p", "v": "「公開は」"}, {"t": "p", "v": "『内容を精査した上で、判断します。国益に照らして』"}, {"t": "p", "v": "「国益に照らして、伏せることもある、と」"}, {"t": "p", "v": "　無線が、少し黙った。"}, {"t": "p", "v": "『鷺宮さん。あなたは理想主義だ。文化財は、綺麗事だけでは守れない。金が要る。力が要る。外交のカードにもなる。……それの、何が悪い』"}, {"t": "p", "v": "「悪くない」直人は言った。「だが、あんたの言う『国益』には、<strong>五百年、裏切り者と呼ばれ続けた一つの家の名誉</strong>は、入ってないだろう」"}, {"t": "p", "v": "　無線の向こうで、朝倉が、初めて言葉に詰まった。"}, {"t": "p", "v": "「竜宮の遺言は、宝の在処だけを書いた紙じゃない。<strong>誰が、何を、なぜ守ったか</strong>を書いた紙だ。それを『カード』にした瞬間、あんたは、五百年守られてきたものを、一枚のトランプに変える。……それは、守るじゃない。<strong>使う</strong>だ」"}, {"t": "p", "v": "『……問答は、これまでだ。明朝、指定する』"}, {"t": "p", "v": "　無線が切れた。"}, {"t": "br"}, {"t": "p", "v": "　その直後、レーダーに、二つの光点が現れた。"}, {"t": "p", "v": "　一つは、北から。海鷹――来島海運の高速艇。<br>　一つは、南から。海上保安庁の巡視艇。朝倉の船だ。"}, {"t": "p", "v": "　潮風は、その二つに挟まれる形で、竜宮の海域へ近づいていた。"}, {"t": "p", "v": "「……三つ巴、っすね」早川が呟いた。「ほんとに、三つの船が集まった」"}, {"t": "p", "v": "「来島は、遺言を見に来た。朝倉は、遺言を押さえに来た。うちは――」"}, {"t": "p", "v": "「遺言を、正しく読みに来た」凛が言い切った。"}, {"t": "p", "v": "　サラが、PCから顔を上げた。"}, {"t": "p", "v": "「あたし、できることがある。……来島海峡の航路管制、海保のシステム。触れる。<strong>巡視艇の航路を、一時間だけ、混乱させられる</strong>」"}, {"t": "p", "v": "　部屋が、静かになった。それは、一線を越える提案だった。"}, {"t": "p", "v": "「……やめとけ」早川が言った。"}, {"t": "p", "v": "「え」"}, {"t": "p", "v": "「それやったら、お前、Phantomに逆戻りだ」早川は、静かに言った。「海保のシステムいじったら、もう、辞めた側じゃなくなる。……別の手を考えよう。俺と、二人で」"}, {"t": "p", "v": "　サラは、早川を見た。三年前、握手を無視した相手。今、一線を越えるなと止めてくれる相手。"}, {"t": "p", "v": "「……HayaP。あんた、変わったね」"}, {"t": "p", "v": "「変わってねえよ。基本を、思い出しただけだ」"}, {"t": "p", "v": "　二人は、頭を突き合わせた。そして――合法の範囲で、できることを見つけた。"}, {"t": "p", "v": "「巡視艇と海鷹に、<strong>同じ緊急気象警報を、正規の経路で流す</strong>」サラが指を動かした。「台風のうねり、実データ。……両方の船が、安全確保のために、一時的に減速せざるを得ない、本物の警報。嘘は、一つもつかない」"}, {"t": "p", "v": "「事実だけで、両方の足を止める、か」直人は、一年半前の、あの執行官の証言を思い出した。事実だけで、結論を動かす。「……それが、一番強い」"}, {"t": "br"}, {"t": "p", "v": "　気象警報が流れ、二つの船が減速した、その隙に。<br>　潮風は、竜宮の海域の、渦の裏の緩みへ、滑り込んだ。"}, {"t": "p", "v": "　夜明け前の、来島海峡。<br>　うねりの底に、五枚の潮印が指す、海の蔵の入り口がある。"}, {"t": "p", "v": "「潮止まりは、昼の十一時五十二分から、十二分間」凛が装備を整えながら言った。「それまで、ここで、うねりに耐えて待ちます。……全員、体を休めて。<strong>開門は、一度きり</strong>です」"}, {"t": "p", "v": "　東の空が、台風の前の、不穏な茜に染まり始めた。<br>　三つの船が、一つの海に、集まっていた。"}], "chars": 1848}, {"title": "第十三話　来島海峡", "paras": [{"t": "p", "v": "午前十一時五十二分。<br>　日本三大急潮の一つが、息を止めた。"}, {"t": "p", "v": "　あれほど走っていた潮が、嘘のように凪ぐ。凛が「開門」と短く言った。"}, {"t": "p", "v": "　潜るのは、直人と凛の二人だ。<br>　直人は、この日のために潜る。泳げない男が、だ。<br>　この一月、島を巡る合間のたびに、凛が浅場へ引きずり込んで、体に叩き込んだ。タンク、オクトパス、残圧計、耳抜き、パニックの殺し方。「素人を十八メートルに連れていくのは、本当は罪です」と凛は言った。「でも、あなたは連れていかないと、後で勝手に潜って死ぬ人だ」。<br>　安全ダイバーとして、保釈中の瀬戸が加わっていた。罪滅ぼしだ、と本人は言った。凛が三度、直人の装備を確認した。"}, {"t": "p", "v": "「水深は十八メートル。あなたには深い。<strong>私が横を離れません</strong>」凛が言った。「合図は三つだけ。上がる、待て、駄目。それ以外は、私の手を見て」"}, {"t": "p", "v": "「頼む」"}, {"t": "p", "v": "「怖いですか」"}, {"t": "p", "v": "「怖い」直人は正直に言った。「だが、巻物の裏の文字を見た時から、ここまで来ると決まってた。……性分だ」"}, {"t": "p", "v": "　二人は、渦の裏の緩みから、青い層へ沈んだ。"}, {"t": "br"}, {"t": "p", "v": "　海の底に、それはあった。"}, {"t": "p", "v": "　瀬の陰の岩棚。その下に、人の手で積まれた石の口。四百年、急潮に守られて、誰の目にも触れなかった竜宮の入り口。<br>　口を塞ぐのは、丸い石の扉。表面に、五つの窪みが、円環に並んでいる。潮印の、五枚ぶんの。"}, {"t": "p", "v": "　直人は、腰の防水ケースから、五枚の潮印を取り出した。①②④の本物、国に渡した③の精密複製、そして⑤のペンダント。<br>　潮印は、文字を読ませる鍵ではない。海水で膨らむ継ぎ手と、潮流で回る円盤――形と物性で開く、物理の錠だ。だから、③が複製でも、潮は同じように嵌まる。前の事件で、直人が学んだことだった。<br>　窪みに、はめる。ただし――順番がある。"}, {"t": "p", "v": "　潮ノ順ニ嵌メヨ。"}, {"t": "p", "v": "　円盤には、一ノ潮から五ノ潮まで名が振ってある。だが⑤の裏には『潮ノ順ニ嵌メヨ』――名の順ではなく、その日の潮の順に回せ、と刻まれていた。潮印を集めてきた順路と、扉を開く順は、別物だ。だから二人は前夜、海図と潮汐表を突き合わせ、各島の、この日の転流の早い順を割り出していた。因島、大山祇、能島、大久野島――名の並びに近いが、同じではない。そして最後の窪みは、⑤のペンダント。血筋の印を、今いる海、来島海峡の潮に嵌める。<br>　一度、凛が能島と大久野島の順を取り違えかけた。転流時刻が、十分も違わない。海図の潮先を三度読み直して、確定した。この錠は一発勝負だ。間違えれば、水の中で、二度目はない。"}, {"t": "p", "v": "　一枚。二枚。三枚。四枚。<br>　五枚目のペンダントを、最後の窪みに、はめた。"}, {"t": "p", "v": "　石の扉の中で、水が動いた。潮止まりの、動かないはずの水が、扉の内側だけで、渦を巻いた。五枚の円盤が、水流を受けて、順に回る。四百年ぶりの、水の鍵が、回った。"}, {"t": "p", "v": "　石の扉が、内側へ開いた。"}, {"t": "p", "v": "　中は、海食洞だった。天然の洞を、人の手で整えた、乾いた空気の空間。潮止まりの間だけ、水位が下がって、入れる。<br>　二人は扉をくぐり、内側の岩肌を伝って浮上した。ライトの輪の中を、細かな泡が上へ逃げていく。やがて頭が水面を割った。潮が退いた分だけ空気の溜まった、闇の気室だ。レギュレーターを外すと、四百年ぶんの、埃と潮の匂いがした。"}, {"t": "br"}, {"t": "p", "v": "　洞の奥、乾いた岩棚の上に、それらは並んでいた。"}, {"t": "p", "v": "　漆の箱。錆びた甲冑櫃――今度は、空箱ではない。刀袋。そして、油紙に幾重にも包まれた、細長いもの。<br>　凛が、震える手で、油紙を解いた。"}, {"t": "p", "v": "　太刀だった。<br>　拵えは質素だが、刀身は、四百年を経て、なお青い光を放っていた。<br>　茎に、銘。凛が、水中ライトを当てる。"}, {"t": "p", "v": "　――「<strong>村上</strong>」。"}, {"t": "p", "v": "　利休の茶碗でも、運慶の像でもなかった。<br>　海賊が、海を奪われる前に、最も大切に隠したもの。それは、金目のものではなく、<strong>一族の刀</strong>だった。"}, {"t": "p", "v": "「これが……海の蔵の、正体」凛の声が、洞に反響した。「金銀財宝じゃ、なかった」"}, {"t": "p", "v": "「海賊の宝は、これだったんだ」直人は言った。「秀吉に海を奪われて、海賊ですらなくなる。その前に、<strong>一族が海賊だった証を、海に返した</strong>。……武吉は、金じゃなく、誇りを隠したんだ」"}, {"t": "p", "v": "　太刀袋の下に、桐の文箱。<br>　中に、巻物が一巻。武吉の、遺言だった。"}, {"t": "p", "v": "　直人は、蓋の隙間から中を検めただけで、開かなかった。四百年、この湿気の中にあった料紙だ。急に空気に晒せば、墨が泣く。開くのは、湿度を管理できる台の上でだけ――修復士の、鉄則だった。<br>　巻物の外題にだけ、辛うじて読める字があった。「遺言」。そして、能島村上家の花押。本物だ。"}, {"t": "p", "v": "　だが、それを確かめた直後――洞の入り口の水が、鳴った。"}, {"t": "p", "v": "　潮止まりの、終わりの合図ではなかった。<br>　誰かが、入ってくる音だった。"}, {"t": "br"}, {"t": "p", "v": "　水を割って、二つの人影が、洞に上がってきた。"}, {"t": "p", "v": "　一人は、和装をウェットスーツに変えた、来島暁。<br>　もう一人は――タンクを背負った、朝倉剛だった。"}, {"t": "p", "v": "　来島は、遺言の巻物を見て、動きを止めた。<br>　朝倉は、太刀と箱の山を見て、目を光らせた。"}, {"t": "p", "v": "「――国の管理下に置きます」朝倉が言った。「全て、動かさないように。これは、国家的発見だ」"}, {"t": "p", "v": "「待て」来島が、朝倉を制した。海の底で、闇の仲買と国の役人が、初めて対立した。「その遺言だけは。……その遺言に、うちの家のことが、書いてある」"}, {"t": "p", "v": "「来島さん。あんたに私的な事情があろうと、文化財は――」"}, {"t": "p", "v": "「私的な事情だと」来島の声が、洞に響いた。「五百年だ。五百年、うちは裏切り者と呼ばれてきた。その答えが、今、目の前にある。それを、あんたの『国益』のトランプにされてたまるか」"}, {"t": "p", "v": "　三つの目的が、狭い洞の中で、正面からぶつかった。<br>　直人は、遺言の巻物を胸に抱えたまま、三人の間に立った。"}, {"t": "p", "v": "「――全員、聞いてくれ」直人は言った。「この遺言は、俺が読む。修復士として。<strong>一字も足さず、一字も引かず、全員の前で読む</strong>。それで、いいな」"}, {"t": "p", "v": "　誰も、動かなかった。<br>　潮止まりの十二分の、残りは、もう、わずかだった。"}], "chars": 2362}, {"title": "第十四話　竜宮", "paras": [{"t": "p", "v": "直人は、遺言を開かなかった。開けば、四百年の料紙が死ぬ。<br>　代わりに、外題の花押と、来島暁の顔を、交互に見た。この巻物に、来島の家のことが書かれているかもしれない。それを、この男は五百年、待っていた。"}, {"t": "p", "v": "「――中身は、まだ読めない」直人は言った。「湿気を抜いてからだ。だが、約束する。<strong>読む時は、あんたも、朝倉さんも、全員の前で読む。一字も足さず、一字も引かず</strong>」"}, {"t": "p", "v": "　来島暁は、動かなかった。<br>　ウェットスーツの、日焼けした顔が、水中ライトの光の中で、ゆっくりと歪んだ。"}, {"t": "p", "v": "「……五百年」"}, {"t": "p", "v": "　絞り出すような、声だった。"}, {"t": "p", "v": "「五百年、うちは、この一行を、待っていた。子守唄の意味も分からず、印も渡されず、ただ『裏切り者』とだけ言われて。……祖父も、父も、俺も。この、たった一行を、知らずに死んでいった」"}, {"t": "p", "v": "　凛が、腰の防水ケースから、一枚の写真を出した。<br>　能島の石垣の、「昭和三十九年　補修　来島」の彫り。"}, {"t": "p", "v": "「あなたの家は、ずっと、うちの城を直してくれていました」凛は言った。「昭和になっても。誰にも知られずに。……見守れ、という武吉公の命を、五百年、守り続けてくれた。……ありがとう、来島さん。<strong>うちの城を、守ってくれて</strong>」"}, {"t": "p", "v": "　来島暁は、写真を受け取り、それを、両手で持った。<br>　海の底で、五百年ぶりに、村上と来島が、同じ物を、一緒に見ていた。"}, {"t": "br"}, {"t": "p", "v": "　その和解の時間を、破ったのは、海だった。"}, {"t": "p", "v": "　洞の入り口の水位が、ぐん、と上がった。<br>　潮止まりの、十二分が、終わる。同時に、台風のうねりが、予定より早く、海峡に届き始めていた。"}, {"t": "p", "v": "「潮が戻る！　それに、うねりが――洞が保たない！」凛が叫んだ。「全員、出ます！　今すぐ！」"}, {"t": "p", "v": "　乾いていた洞に、水が走り込んできた。天井から、古い岩の欠片が落ちる。四百年、静かだった洞が、台風の前ぶれに、軋み始めた。"}, {"t": "p", "v": "「太刀と遺言を、防水ケースに！　早く！」"}, {"t": "p", "v": "　直人が遺言を、凛が太刀を、それぞれ胸に。四人が、水の中へ。<br>　直人は、練習した通りに、レギュレーターを噛み、凛の手を見て、沈んだ。"}, {"t": "p", "v": "　その時――洞の天井の、大きな一枚が、崩れた。"}, {"t": "p", "v": "　朝倉の退路を、塞ぐ形で。"}, {"t": "br"}, {"t": "p", "v": "　水中ライトの光の中で、朝倉が、落ちた岩に、片足を挟まれていた。<br>　タンクの残圧計が、赤に近い。パニックで、呼吸が速くなっている。素人ではないが、玄人でもない。国のダイバー資格の、規定通りの潜り手だった。"}, {"t": "p", "v": "　来島が、朝倉に泳ぎ寄った。だが、岩は重い。一人では動かない。<br>　そして直人は――泳げない直人は、深い水の中では、力を出せない。"}, {"t": "p", "v": "　凛が、直人の手を、強く握った。合図の手を見せる。「待て」。<br>　彼女は、太刀を直人に押し付け、単身、岩へ潜った。"}, {"t": "p", "v": "　海賊の娘の、素潜りの体さばき。凛は岩の下に肩を入れ、来島と呼吸を合わせ、うねりが洞を揺らす、その揺れの力を借りて、岩を、わずかに浮かせた。<br>　朝倉の足が、抜けた。"}, {"t": "p", "v": "　四人と、遺言と、太刀は、崩れる洞の口を、間一髪で抜けた。"}, {"t": "br"}, {"t": "p", "v": "　浮上した海面は、もう、台風の海だった。"}, {"t": "p", "v": "　潮風が、うねりの中で待っていた。鬼頭が身を乗り出し、真琴とサラと早川が、次々に人を引き上げる。<br>　最後に上がった朝倉が、甲板で、水を吐きながら、動けずにいた。"}, {"t": "p", "v": "　助けたのは、来島だった。裏切り者と呼ばれ続けた家の男が、宝を国益のカードにしようとした役人を、海から引き上げた。"}, {"t": "p", "v": "「……なぜ、助けた」朝倉が、掠れた声で聞いた。"}, {"t": "p", "v": "「うちは、忠義の家だそうだ」来島は、濡れた写真を、まだ手に持っていた。「たった今、五百年ぶりに、そう分かった。……忠義の家は、目の前で人を溺れさせたりは、しない」"}, {"t": "p", "v": "　台風の海の上で、三つ巴は、一つの船に、乗っていた。"}], "chars": 1560}, {"title": "第十五話　台風の夜", "paras": [{"t": "p", "v": "潮風は、台風の外縁のうねりの中を、走った。"}, {"t": "p", "v": "　来島海峡から、一番近い避難港へ。だが、うねりは想定より速く育ち、途中の島影で、一夜、錨を打って耐えるしかなくなった。"}, {"t": "p", "v": "　狭い船室に、八人が身を寄せた。<br>　直人、凛、真琴、早川、サラ、鬼頭、そして――来島暁と、朝倉剛。宝を奪い合っていた三つの陣営が、一つの船室で、同じ毛布を分けていた。"}, {"t": "p", "v": "　うねりが船を揺らすたび、早川が呻いた。"}, {"t": "p", "v": "「……こんな時まで、船酔い……」"}, {"t": "p", "v": "「飲め」凛が水を渡した。「前を見ろ。下を見るから酔う」"}, {"t": "p", "v": "「その台詞、もう十回聞いたっす……」"}, {"t": "p", "v": "　サラが、早川の背中を、少しだけ、さすった。三年前、握手を無視した手で。"}, {"t": "br"}, {"t": "p", "v": "　朝倉は、船室の隅で、濡れた背広のまま、膝を抱えていた。<br>　助けられた側の、居心地の悪さがあった。"}, {"t": "p", "v": "「……鷺宮さん」朝倉が、口を開いた。「一つ、聞かせてほしい。あなたは、あの遺言を、どうする気だ」"}, {"t": "p", "v": "「公開する」直人は即答した。「一字も引かずに。……来島の家の名誉のくだりも、全部だ」"}, {"t": "p", "v": "「国益に照らせば――」"}, {"t": "p", "v": "「朝倉さん」直人は遮った。「あんたの言う国益に、今夜、あんたを助けた来島の家の五百年は、入るのか。入らないのか」"}, {"t": "p", "v": "　朝倉は、答えなかった。"}, {"t": "p", "v": "「文化財は綺麗事じゃ守れない、とあんたは言った。正しいよ。金も力も要る」直人は続けた。「だが――<strong>綺麗事を捨てたら、何のために守るのか、分からなくなる</strong>。あんたが今日、海に沈みかけた時、来島が引き上げたのは、国益の計算じゃない。綺麗事だ。忠義の家は、人を溺れさせない、っていう」"}, {"t": "p", "v": "　朝倉は、長いこと、船の揺れに身を任せていた。"}, {"t": "p", "v": "「……私はね、鷺宮さん」やがて、ぽつりと言った。「外務省で、二十年、国益の計算だけをしてきた。文化財対策室は、左遷だと思っていた。埋蔵金で、点数を稼いで、本省に戻るつもりだった」"}, {"t": "p", "v": "「今は」"}, {"t": "p", "v": "「今は……分からなくなった。五百年、汚名を被って役目を守った家の話を、点数に換算する自分が、少し、嫌になった」"}, {"t": "p", "v": "　うねりが、船を大きく揺らした。<br>　誰も、それ以上、喋らなかった。喋らないまま、八人は、台風の夜を越えた。"}, {"t": "br"}, {"t": "p", "v": "　夜明け前、うねりが、少し和らいだ。"}, {"t": "p", "v": "　直人は甲板に出た。凛が、舵の前にいた。一睡もしていない顔で、海を見張っていた。"}, {"t": "p", "v": "「……代わろうか」"}, {"t": "p", "v": "「操船は家伝です」凛は少し笑った。「あなたに任せたら、朝には九州です」"}, {"t": "p", "v": "　二人は、白み始めた海を、並んで見た。"}, {"t": "p", "v": "「直人さん」凛が言った。「探索が、終わりますね」"}, {"t": "p", "v": "「あぁ」"}, {"t": "p", "v": "「終わったら、あなたは、東京に帰る」"}, {"t": "p", "v": "「……そうだな」"}, {"t": "p", "v": "　凛は、しばらく黙って、それから、海賊の娘らしく、まっすぐに言った。"}, {"t": "p", "v": "「私、あなたのことが、好きになりました」"}, {"t": "p", "v": "　直人は、海を見たまま、答えを探した。<br>　誠実な答えを。凛にふさわしい、嘘のない答えを。"}, {"t": "p", "v": "「……凛さん。あんたは、いい人だ。強くて、まっすぐで、五百年を背負って、それでも笑える人だ」"}, {"t": "p", "v": "「振られる時の、前置きですね、それ」凛は、笑った。泣きそうな、笑い方だった。"}, {"t": "p", "v": "「東京に、待ってる人がいる」直人は、正直に言った。「まだ、何も始まってない。だが……俺の心は、もう、決まってる」"}, {"t": "p", "v": "「九条さん、ですね」"}, {"t": "p", "v": "「あぁ」"}, {"t": "p", "v": "　凛は、東の空を見た。台風の後の、澄んだ茜が、広がり始めていた。"}, {"t": "p", "v": "「……いいんです。聞いてみたかっただけ。海賊は、後悔しないので」凛は、舵を握り直した。「言わずに帰されたら、そっちの方が、寝覚めが悪い」"}, {"t": "p", "v": "「……すまない」"}, {"t": "p", "v": "「謝らないでください。<strong>振るなら、堂々と</strong>。それも、家伝の作法です」"}, {"t": "p", "v": "　東の海が、金色に光り始めた。<br>　凛の横顔は、もう、いつもの刃物のような、まっすぐな顔に戻っていた。"}], "chars": 1525}, {"title": "第十六話　北木島", "paras": [{"t": "p", "v": "台風が抜けた翌々日、直人たちは北木島にいた。"}, {"t": "p", "v": "　笠岡諸島の、石切りの島。花崗岩の産地として知られ、島のあちこちに、巨大な石切り場の跡が、水を湛えて残っている。<br>　なぜ北木島か――太刀と遺言を、一度、安全な場所で、正式な発見手続きに乗せるためだった。真琴の書陵部の伝手で、島の資料館の一室を、臨時の保全場所として借りた。"}, {"t": "p", "v": "　だが、島に上がってすぐ、サラが顔を曇らせた。"}, {"t": "p", "v": "「……妙な動きがある。来島でも、朝倉でもない、第三者のアクセス。うちの――潮風のGPSログを、外から取りに来てる」"}, {"t": "p", "v": "「誰だ」"}, {"t": "p", "v": "「たどると……<strong>海外のサーバー。オークションハウスの、日本代理人</strong>」サラがPCを睨んだ。「鷹峰・アンド・パートナーズ。……前の事件で、あんたたちが潰した会社の、系列よ」"}, {"t": "p", "v": "　直人の背筋が、冷えた。<br>　星霜蔵の時の、鷹峰。あの闇の競売の網は、一つ潰しても、系列で生き残っていた。海賊の宝の噂を、金の匂いとして、嗅ぎつけてきたのだ。"}, {"t": "br"}, {"t": "p", "v": "「狙いは、太刀と遺言の、座標情報だろう」直人は言った。「『日本最大の海賊の埋蔵財宝、発見』――座標だけでも、闇市場では売れる」"}, {"t": "p", "v": "「もう座標は、意味を持ちません」真琴が言った。「竜宮は台風で半分崩れ、太刀と遺言は、私たちの手にある。売る座標は、空っぽの穴です」"}, {"t": "p", "v": "「向こうは、それを知らない」サラが言った。「知らないから、<strong>まだ中身があると思って、取りに来る</strong>」"}, {"t": "p", "v": "　鬼頭が、低く言った。"}, {"t": "p", "v": "「……闇の連中のやり口は、知ってる。俺も、そっち側にいた男だ。奴らは、現物が取れないと分かると、次は――<strong>人を取る</strong>。座標を知ってる人間を」"}, {"t": "p", "v": "　部屋が、静かになった。<br>　一年半前、真琴が人質になった。同じことが、また起きようとしていた。"}, {"t": "p", "v": "「今度は、させません」真琴が、静かに、しかしはっきりと言った。「前回、私は荷物にされました。今回は――<strong>荷物の方が、罠になります</strong>」"}, {"t": "br"}, {"t": "p", "v": "　真琴の作戦は、書類の人間らしいものだった。"}, {"t": "p", "v": "「太刀と遺言は、もう、私たちの物ではありません。<strong>発見と同時に、国庫帰属の手続きに乗せます</strong>。文化財保護法上、所有者の判明しない埋蔵文化財は、原則として国庫に帰属する。……つまり」"}, {"t": "p", "v": "「盗んでも、闇市場で売れない」直人が続けた。「国庫帰属の登録が済んだ瞬間、それは『盗品』として、世界中の正規のオークションから締め出される。来歴に傷が付いた文化財は、闇でも値が付かない」"}, {"t": "p", "v": "「正確には」真琴が微笑んだ。「<strong>私たちが、いま持っている</strong>という事実を、公にすればいい。座標ではなく、結果を。『発見された。国に帰属した』と、大々的に発表する。座標情報の商品価値が、その瞬間、ゼロになります」"}, {"t": "p", "v": "「情報を、隠すんじゃなくて、<strong>全部出して、無価値にする</strong>のか」"}, {"t": "p", "v": "「ええ。闇の商売は、秘密で成り立っています。秘密を、太陽の下に出せば――」"}, {"t": "p", "v": "　サラが、初めて、心から笑った。"}, {"t": "p", "v": "「……それ、あたしの十六年の、逆だ」"}, {"t": "p", "v": "「逆？」"}, {"t": "p", "v": "「あたしは十六年、秘密を暴くのに、闇に潜ってきた。あんたのやり方は、<strong>秘密を、正面から、全部公開して殺す</strong>。……眩しいわ、その手」"}, {"t": "br"}, {"t": "p", "v": "　発表は、島の資料館から行われた。"}, {"t": "p", "v": "　真琴が起案し、文化庁が受理した、正式な発見の届出。そして、記者への公開。<br>　「村上水軍の埋蔵遺物、発見。太刀一振と、当主の遺言。国庫帰属手続き中」。"}, {"t": "p", "v": "　座標も、来歴も、全部、公にされた。<br>　鷹峰系列のアクセスは、その日の夕方、ぱたりと消えた。売る商品が、太陽の下で、無価値になったからだ。"}, {"t": "p", "v": "　早川が、ログを確認して、伸びをした。"}, {"t": "p", "v": "「……撤退したっす。座標、二束三文にもならなくなったんで。真琴さん、えげつないっす。褒めてます」"}, {"t": "p", "v": "「書類と手続きが、得意なだけです」真琴は、いつもの答えを返した。"}, {"t": "p", "v": "　その夜、資料館の窓から、直人は石切り場の跡の、水を湛えた深い蒼を見ていた。<br>　人が石を切り出した跡が、四百年後に、澄んだ湖になっている。壊したものが、時間をかけて、別の美しさになる。修復の、逆の営みだ。"}, {"t": "p", "v": "　――そういえば、と直人は思った。<br>　俺は結局、この事件で、一度も、物を壊さなかった。"}], "chars": 1792}, {"title": "第十七話　夜明けの海", "paras": [{"t": "p", "v": "太刀と遺言が国庫帰属の手続きに乗った、その一週間後。<br>　東京で、朝倉剛が、直人を訪ねてきた。"}, {"t": "p", "v": "　池袋のシェアオフィス。狭い机に、修復道具と、資格証。朝倉は、その質素な部屋を、少し眩しそうに見た。"}, {"t": "p", "v": "「文化財特別対策室は、来月、解散します」朝倉が言った。「私が、上申しました」"}, {"t": "p", "v": "「解散？」"}, {"t": "p", "v": "「あの部署は、文化財を外交カードにするために作られた。……その前提を、私が、上申書で否定しました。『文化財は、国益の道具ではなく、<strong>国民が共有する記憶である</strong>。カードとして切れば、記憶が減る』と」"}, {"t": "p", "v": "「通ったのか、そんな上申が」"}, {"t": "p", "v": "「通りませんよ、普通は」朝倉は、初めて、皮肉でなく笑った。「だから、辞表と一緒に出しました。……受理されるのは、たぶん、辞表の方だけです」"}, {"t": "p", "v": "　直人は、朝倉を見た。二十年、国益の計算だけをしてきた男が、計算の合わない選択を、初めてした顔だった。"}, {"t": "p", "v": "「後悔してるか」"}, {"t": "p", "v": "「していません」朝倉は言った。「海の底で、来島に引き上げられた時から、点数の計算が、できなくなった。……たぶん、あの時、私は、別の帳簿に、書き換えられたんです」"}, {"t": "br"}, {"t": "p", "v": "　遺言の公開は、大きな反響を呼んだ。"}, {"t": "p", "v": "　村上水軍の埋蔵遺物。金銀ではなく、一族の太刀と、当主の遺言。そして――五百年、裏切り者と呼ばれてきた来島家が、実は「海の蔵を見守る密命を負った忠義の家」だったという、歴史の書き換え。"}, {"t": "p", "v": "　地方紙が、全国紙が、テレビが、その物語を報じた。<br>　「裏切り者」の汚名を五百年背負った家の、名誉回復。それは、一年半前の、鷺宮清一郎の名誉回復と、同じ形をしていた。"}, {"t": "p", "v": "　来島暁は、記者会見を開いた。<br>　会見場で、彼は、能島の「昭和三十九年　補修　来島」の写真を、掲げた。"}, {"t": "p", "v": "「うちの家は、五百年、この海を、見守ってきました」来島は言った。「裏切り者と呼ばれながら。……その役目を、証明してくれたのは、村上のご当主と、修復士の鷺宮さんです。恨みの相手だと思っていた家に、名誉を、返してもらいました」"}, {"t": "p", "v": "　会見の最後に、記者が聞いた。<br>　――来島海運は、これまで、文化財の闇取引に関わっていた疑いがありますが。"}, {"t": "p", "v": "「関わっていました」来島は、隠さなかった。「宝の在処を知るために、汚い金も使った。……その罪は、償います。文化財の闇取引に関する情報を、全て、当局に提出します。<strong>私が知る、この業界の闇を、全部</strong>」"}, {"t": "p", "v": "　会見場が、どよめいた。<br>　闇の仲買が、闇の地図を、自分から差し出した。鷹峰系列を含む、日本の文化財闇市場の見取り図が、その日、太陽の下に引きずり出された。"}, {"t": "br"}, {"t": "p", "v": "　その夜、直人と真琴は、東京湾の見えるベンチにいた。"}, {"t": "p", "v": "　瀬戸内の海とは違う、灰色がかった東京の海。それでも、水は繋がっている。"}, {"t": "p", "v": "「凛さんは」真琴が、静かに聞いた。"}, {"t": "p", "v": "「尾道に帰った。村上堂を、続けるそうだ。鬼頭を、店員に雇って」直人は言った。「……真琴さん。一つ、話しておきたいことがある」"}, {"t": "p", "v": "「凛さんに、告白されたこと、ですか」"}, {"t": "p", "v": "　直人は、驚いて真琴を見た。"}, {"t": "p", "v": "「分かりますよ。それくらい」真琴は、少し笑った。「女性は、そういうことに、書類より敏感です」"}, {"t": "p", "v": "「……断った」"}, {"t": "p", "v": "「知っています。あなたが、ここにいるので」"}, {"t": "p", "v": "　真琴は、東京の海を見た。"}, {"t": "p", "v": "「私も、一つ、話しておきます。……一年半前、私はあなたたちを内偵していました。書類の上で、あなたを、裏切っていました」"}, {"t": "p", "v": "「あれは、あんたのせいじゃない」"}, {"t": "p", "v": "「せいじゃなくても、事実です」真琴は言った。「でも、あの時から、私、決めていたことがあります。……いつか、書類ではなく、<strong>自分の言葉で、あなたに、何かを伝えられる人間になろう</strong>、と」"}, {"t": "p", "v": "　真琴は、直人を見た。書陵部の、規則の顔ではなかった。"}, {"t": "p", "v": "「――今、伝えます。私は、あなたと、これからも、同じ物を見ていたい」"}, {"t": "p", "v": "　直人は、その言葉を、修復士の耳で聞いた。<br>　嘘の一つもない、まっすぐな料紙のような言葉だった。"}, {"t": "p", "v": "「……こちらこそ」直人は言った。「あんたの綴じ方は、世界一だ。俺の壊れかけを、綴じてくれ」"}, {"t": "p", "v": "「人聞きの悪い比喩ですね」真琴は笑った。「でも――承ります」"}, {"t": "p", "v": "　東京の海の上で、夜明けの気配が、灰色を、少しずつ、薄い金に変えていった。"}], "chars": 1751}, {"title": "第十八話　潮風のあと", "paras": [{"t": "p", "v": "半年が過ぎた。"}, {"t": "p", "v": "　村上水軍の太刀は、国庫に帰属し、しかるべき博物館で保存されることになった。ただし、常設展示の場所は、尾道に決まった。地元の要望と、来島海運の寄付が、それを後押しした。"}, {"t": "p", "v": "　武吉の遺言は、書陵部で正式に収蔵された。担当は、九条真琴。星霜蔵に続く、二例目の「発見者による保存」だった。"}, {"t": "p", "v": "　直人は、月に一度、尾道に通っている。<br>　太刀の、恒久保存のための修復監修。四百年、海の底にあった刀の、拵えの漆と、鞘の木を、少しずつ、生き返らせていく。地味で、祈りに似た仕事だ。"}, {"t": "br"}, {"t": "p", "v": "　村上堂は、繁盛していた。"}, {"t": "p", "v": "　「海賊の宝を見つけた古美術商」として、凛の店には、客が絶えなくなった。凛は、その肩書きを、少し持て余しながら、それでも、まっすぐに商売をしていた。"}, {"t": "p", "v": "　鬼頭は、店員として、島々を回って品を集めている。力仕事と、船の操縦と、島の地理。切られた男が、切られない仕事に、収まっていた。時々、子供に、海賊の逃げ足を教えているらしい。"}, {"t": "p", "v": "「直人さん」凛が、茶を淹れながら言った。「九条さんとは、どうですか」"}, {"t": "p", "v": "「……ぼちぼちだ」"}, {"t": "p", "v": "「ぼちぼち」凛は笑った。「修復士らしい速度ですね。四百年の刀を、少しずつ直すみたいに」"}, {"t": "p", "v": "「うるさい」"}, {"t": "p", "v": "「いいんです。私は、後悔していないので」凛は、窓の外の、尾道水道を見た。「あの日、海の上で、堂々と振られた。……あれは、私の、一番いい思い出の一つです。海賊は、負け方も、家伝ですから」"}, {"t": "p", "v": "　直人は、答えなかった。答えないのが、一番の礼儀だと思った。"}, {"t": "p", "v": "　凛は、茶を出して、それから、少しだけ、声を落とした。"}, {"t": "p", "v": "「祖母が、亡くなりました。先月」"}, {"t": "p", "v": "　直人は、顔を上げた。"}, {"t": "p", "v": "「道後の宿で、眠るように。……最後に、村上と来島が同じ海で笑う日のニュースを、見せられて。『これで、思い残すことはない』と」凛は、静かに言った。「私の宝探しは、祖母の膝の続きだ、と言いましたね。……膝は、終わりました。でも」"}, {"t": "p", "v": "「でも？」"}, {"t": "p", "v": "「終わってみて、分かりました。<strong>宝は、太刀でも、遺言でもなかった</strong>。祖母が、私に、五百年の物語を、子守唄として遺してくれたこと。それ自体が、宝でした」"}, {"t": "p", "v": "　凛の目に、光るものがあった。彼女は、それを、袖で拭わなかった。"}, {"t": "p", "v": "「……海賊も、たまには、泣くんです」凛は言った。「祖母の前でだけは」"}, {"t": "br"}, {"t": "p", "v": "　その日の夕方、来島暁が、村上堂を訪ねてきた。"}, {"t": "p", "v": "　闇の仲買の顔は、もうなかった。文化財の闇取引の情報提供で、来島海運は司直の取り調べを受けたが、来島自身の全面協力と、名誉回復の物語が、量刑を大きく軽くした。執行猶予付きの判決を受け、彼は今、海運会社の経営から退き、別の準備をしていた。"}, {"t": "p", "v": "「村上さん。ご提案があります」来島は、風呂敷包みを解いた。"}, {"t": "p", "v": "　中身は、古い、木の箱だった。中に、五百年、来島家に伝わった「意味のない子守唄」の、歌詞を記した巻物と――"}, {"t": "p", "v": "　もう一枚の、潮印。"}, {"t": "p", "v": "「……六枚目？」凛が、息を呑んだ。"}, {"t": "p", "v": "「うちの蔵の、一番奥にありました」来島は言った。「『御印ノ一、来島ニ託サルベシ』。……託されて、いたんです。うちの家に。ただ、その意味を、五百年、誰も知らなかった。子守唄と一緒に、ただの家宝として、しまい込まれていた」"}, {"t": "p", "v": "　武吉は、印の一つを、本当に、来島に託していた。<br>　鍵を持つ本家と、道を守る分家。二つの家に、二つの役目と、二つの印を。そして、片方の家が、五百年、その意味を忘れていた。"}, {"t": "p", "v": "「この印が指す先が、どこなのか」来島は言った。「私一人では、読めません。……村上さん。鷺宮さん。<strong>もう一度、一緒に、探しませんか</strong>。今度は、奪い合いではなく」"}, {"t": "p", "v": "　凛と直人は、顔を見合わせた。<br>　凛の口元に、あの、刃物のような、けれど今は柔らかい笑みが浮かんだ。"}, {"t": "p", "v": "「……いいですね。今度は、三つの家で」"}, {"t": "p", "v": "「三つ？」"}, {"t": "p", "v": "「村上と、来島と」凛は、真琴のいる東京の方を、ちらりと見た。「――書類の、得意な家と」"}], "chars": 1615}, {"title": "第十九話　海賊の遺言", "paras": [{"t": "p", "v": "武吉の遺言の、全文の解読が終わったのは、その年の暮れだった。"}, {"t": "p", "v": "　書陵部で、真琴が半年かけて、料紙の裏の、さらに薄い層まで読み解いた。竜宮で直人が読み上げたのは、遺言の、表の半分に過ぎなかった。裏には――五百年前の、一族の物語が、記されていた。"}, {"t": "p", "v": "　真琴が、直人と凛と来島を、書陵部の閲覧室に招いて、読み上げた。<br>　五百年ぶりに、村上と来島が、同じ机で、同じ祖先の言葉を聞いた。"}, {"t": "br"}, {"t": "p", "v": "「『<strong>天正十六年、夏</strong>』」真琴が読み始めた。「『<strong>秀吉の海賊停止令、下る。我ら、海を追わる。一族、離散を命ぜらる</strong>』」"}, {"t": "p", "v": "　遺言は、その夜の情景から始まっていた。<br>　海を奪われる、村上武吉の、最後の夜。"}, {"t": "p", "v": "「『<strong>我、二人の甥を、庭に呼ぶ。一人は嫡流、一人は分家。分家の甥に、我、告ぐ</strong>』」"}, {"t": "p", "v": "　分家の甥。来島家の、始祖だった。<br>　来島暁が、身を乗り出した。"}, {"t": "p", "v": "「『<strong>「汝、明日より、来島を名乗り、秀吉方に付け。一族を裏切ったと、世に思わせよ。憎まれよ。石を投げられよ。……されど、生きよ。海賊が一人残らず滅びれば、この海の記憶も滅ぶ。汝は、憎まれながら生き延び、我らの海を、末永く見守るのだ」</strong>』」"}, {"t": "p", "v": "「『<strong>分家の甥、泣きて問う。「なぜ、私が汚名を」と。我、答う。「最も信ずる者にしか、頼めぬ役目だからだ。裏切り者を演じ切るには、一族への愛が要る。汝の愛を、見込んでのことだ」</strong>』」"}, {"t": "p", "v": "　来島暁の、日焼けした顔を、涙が伝った。<br>　五百年前、始祖が流したのと、同じ涙のように。"}, {"t": "p", "v": "「『<strong>甥は、承知した。翌朝、来島を名乗り、我を罵り、秀吉方の船に乗った。……あれの背中を、我は、生涯忘れぬ。あれこそ、我が一族、最後の、そして最も勇敢な海賊なり</strong>』」"}, {"t": "br"}, {"t": "p", "v": "　閲覧室は、静かだった。<br>　真琴は、最後の一節を、読み上げた。"}, {"t": "p", "v": "「『<strong>後の世よ。もし、この遺言に辿り着く者あらば。それは、二つの家の血が、再び一つの海で出会うた証なり。その時こそ、来島の汚名を雪ぎ、二つの家を、元の一つの海に、還してやってほしい</strong>』」"}, {"t": "p", "v": "「『<strong>海は、誰のものでもない。海は、海に生きた、すべての者のものだ</strong>』」"}, {"t": "p", "v": "「『<strong>村上武吉。これを、我が最後の海図とする</strong>』」"}, {"t": "p", "v": "　真琴が、巻物を閉じた。"}, {"t": "p", "v": "　来島暁は、長いこと、動かなかった。<br>　やがて、彼は立ち上がり、凛に向かって、深く、頭を下げた。"}, {"t": "p", "v": "「……村上のご当主。五百年、遅くなりました。来島の家、ただいま、帰参いたします」"}, {"t": "p", "v": "　凛も、立ち上がった。海賊の娘の、まっすぐな背筋で。"}, {"t": "p", "v": "「お帰りなさい。来島の。……長い、留守番でした」"}, {"t": "br"}, {"t": "p", "v": "　その夜、四人は、書陵部の近くの店で、ささやかに祝った。"}, {"t": "p", "v": "　直人と、真琴と、凛と、来島。<br>　五百年ぶりに一つになった海の、記憶の相続人たちだった。"}, {"t": "p", "v": "「共同財団を、作ります」来島が言った。「村上と来島の、共同で。瀬戸内の、海の文化財を保存する財団を。……もう、闇の金は使いません。太陽の下の金だけで」"}, {"t": "p", "v": "「理事長は？」直人が聞いた。"}, {"t": "p", "v": "「村上凛さんに、お願いしたい」"}, {"t": "p", "v": "「私？」凛が驚いた。"}, {"t": "p", "v": "「本家のご当主です。……それに」来島は笑った。「五百年、待たされた側としては、少しくらい、本家にこき使われたい」"}, {"t": "p", "v": "　店の窓の外を、師走の風が吹いていた。<br>　瀬戸内の潮の音は、ここまでは届かない。だが、四人の間には、確かに、同じ海の匂いがあった。"}, {"t": "p", "v": "　海は、誰のものでもない。<br>　海に生きた、すべての者のものだ。"}, {"t": "p", "v": "　四百年前の海賊の、最後の海図は、その一行を、四人の胸に、正確に、渡し終えていた。"}], "chars": 1572}, {"title": "第二十話　潮風のエピローグ", "paras": [{"t": "p", "v": "春が来た。"}, {"t": "br"}, {"t": "p", "v": "　尾道。"}, {"t": "p", "v": "　村上堂の店先で、村上凛は、六枚目の潮印を、光にかざしていた。<br>　来島家に五百年眠っていた、託された印。その表の海図の断片は、これまでの五枚のどれとも繋がらない、新しい海を指している。"}, {"t": "p", "v": "　鬼頭が、店の奥から、梱包した掛け軸を運んできた。"}, {"t": "p", "v": "「凛さん。次の仕入れ、生口島の分、積みました」"}, {"t": "p", "v": "「ありがとう。……鬼頭さん」"}, {"t": "p", "v": "「なんです」"}, {"t": "p", "v": "「六枚目、読めたら、また潜りますよ。私」"}, {"t": "p", "v": "「……また、あの、心臓に悪いやつですか」鬼頭は、渋い顔をした。それから、少しだけ、笑った。「舫いは、取りますよ。今度は、最初から」"}, {"t": "p", "v": "　凛は、六枚目の印を、そっと、首のペンダントの隣に置いた。<br>　祖母の膝は、終わった。だが、海賊の物語は、まだ、続くらしい。"}, {"t": "br"}, {"t": "p", "v": "　秋葉原。"}, {"t": "p", "v": "　早川雅彦は、新しいオフィスの、真新しいサーバーラックの前で、腕を組んでいた。<br>　隣で、霧島サラが、キーボードを叩いている。"}, {"t": "p", "v": "「――で、この会社、何やるんすか、結局」直人が、様子を見に来て、聞いた。"}, {"t": "p", "v": "「文化財の、デジタルアーカイブっす」早川が胸を張った。「星霜蔵も、海の蔵も、全部、三次元で永久保存する。誰も盗めない、誰も壊せない、太陽の下のデータで。……サラと、二人で」"}, {"t": "p", "v": "「あたしは、セキュリティ担当」サラが、画面を見たまま言った。「秘密を暴くんじゃなくて、<strong>秘密を、正しく守る</strong>方に、転職したの。……十六年かかった、方向転換」"}, {"t": "p", "v": "「握手は、したのか」直人が聞いた。"}, {"t": "p", "v": "　早川とサラが、顔を見合わせた。それから、二人は、少し照れたように、キーボードの上で、指を絡めた。"}, {"t": "p", "v": "「……もう、握手より、先っす」早川が言った。"}, {"t": "p", "v": "「聞いてないっす」直人は、笑った。"}, {"t": "br"}, {"t": "p", "v": "　東京。"}, {"t": "p", "v": "　書陵部の、資料保存室。<br>　九条真琴は、武吉の遺言の、恒久保存の作業をしていた。四百年、海の底にあった料紙を、一枚ずつ、正しい湿度の中で、生き返らせていく。"}, {"t": "p", "v": "　その手つきは、修復士のものに、少しずつ、似てきていた。"}, {"t": "p", "v": "「様になってきたな」直人が、後ろから覗き込んだ。"}, {"t": "p", "v": "「先生が、いいので」真琴は、手を止めずに言った。「月謝は、高いですが」"}, {"t": "p", "v": "「月謝？」"}, {"t": "p", "v": "「一生分、まとめて、いただく予定です」"}, {"t": "p", "v": "　直人は、その言い方の意味を、修復士の耳で、正確に受け取った。<br>　二人は、それ以上、何も言わなかった。言わなくても、間が持つ関係に、もう、なっていた。"}, {"t": "p", "v": "　窓の外を、桜の花びらが、横切っていった。"}, {"t": "br"}, {"t": "p", "v": "　その週末、直人は一人で、尾道へ向かう新幹線に乗っていた。<br>　太刀の、修復監修の仕事だ。真琴は「一緒に行きたいけど、遺言が、まだ湿っているので」と言って、書陵部に残った。"}, {"t": "p", "v": "　福山で在来線に乗り換え、尾道へ。<br>　駅を出ると、瀬戸内の、春の光が、水面に金の鱗を撒いていた。"}, {"t": "p", "v": "　坂を登り、村上堂の前を通ると、凛が、店先で六枚目の印を、まだ光にかざしていた。"}, {"t": "p", "v": "「精が出るな」"}, {"t": "p", "v": "「家業です」凛は笑った。「……直人さん。祖母の墓に、報告に行くんです。太刀が、尾道に来た、と。一緒に、どうですか」"}, {"t": "p", "v": "　二人は、坂の上の墓地へ登った。<br>　凛の祖母の墓に、凛は、太刀の常設展示のパンフレットを、供えた。"}, {"t": "p", "v": "「――おばあちゃん。村上と来島が、同じ海で、笑ってるよ」凛は言った。「あなたの、子守唄のおかげで」"}, {"t": "p", "v": "　春の風が、供えたパンフレットの端を、めくるように揺らした。"}, {"t": "p", "v": "　直人は、墓石に彫られた「村上」の字を、指の腹で、そっとなぞった。<br>　長い年月で、彫りは、少し浅くなっている。それでも、指には、はっきりと分かる。"}, {"t": "p", "v": "　刻印は、薄れている。<br>　だが――消えていない。"}, {"t": "p", "v": "　海に生きた者たちの記憶が、続く者がいる限り、消えないのと、同じように。"}, {"t": "p", "v": "　瀬戸内の潮が、坂の下で、金色に光っていた。<br>　千年、船が行き交ってきた、誰のものでもない、すべての者の海が。"}, {"t": "p", "v": "（了）"}], "chars": 1580}]}];
const $=s=>document.querySelector(s);
let cur={w:-1,e:-1};

// theme
const tb=$("#themeBtn");
tb.onclick=()=>{const r=document.documentElement;
  const now=r.getAttribute("data-theme")|| (matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  r.setAttribute("data-theme", now==="dark"?"light":"dark");};

// font size
let fs=17.5; const setFs=v=>{fs=Math.max(14,Math.min(24,v));document.documentElement.style.setProperty("--fs",fs+"px");};
$("#fsUp").onclick=()=>setFs(fs+1.5); $("#fsDown").onclick=()=>setFs(fs-1.5);

// build shelf
const wl=$("#worklist");
DATA.forEach((w,wi)=>{
  const sec=document.createElement("div");sec.className="work";sec.style.setProperty("--wa",w.accent);
  sec.innerHTML=`<button onclick="toggleWork(${wi})" style="--wa:${w.accent}">
     <h2>${esc(w.title)}</h2><div class="sub">${esc(w.sub)}</div>
     <span class="genre" style="--wa:${w.accent}">${esc(w.genre)}</span></button>
     <div class="eps" id="eps${wi}"></div>`;
  wl.appendChild(sec);
  const ec=sec.querySelector(".eps");
  w.eps.forEach((e,ei)=>{
    const b=document.createElement("button");b.style.setProperty("--wa",w.accent);
    b.id=`e${wi}_${ei}`;
    b.innerHTML=`<span class="n">${ei+1}</span><span>${esc(e.title.replace(/^第.+?話　/,''))}</span>`;
    b.onclick=()=>openEp(wi,ei);
    ec.appendChild(b);
  });
});
function toggleWork(wi){document.querySelectorAll(".work")[wi].classList.toggle("open");}

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fmt(n){return n.toLocaleString("ja-JP");}

function landing(){
  cur={w:-1,e:-1};
  $("#crumb").textContent="本棚";
  let total=0,eps=0;DATA.forEach(w=>{w.eps.forEach(e=>total+=e.chars);eps+=w.eps.length;});
  const cards=DATA.map((w,wi)=>{
    const c=w.eps.reduce((a,e)=>a+e.chars,0);
    return `<button class="wcard" style="--wa:${w.accent}" onclick="openEp(${wi},0)">
      <div class="g" style="--wa:${w.accent}">${esc(w.genre)}</div>
      <h3>${esc(w.title)}</h3><div class="s">${esc(w.sub)}</div>
      <div class="m">全${w.eps.length}話 ・ 約${fmt(Math.round(c/1000))}千字 ・ 完結</div></button>`;
  }).join("");
  $("#view").innerHTML=`<div class="landing">
    <div class="lead">壊れたものには、<br>直る権利がある。</div>
    <p class="desc">Fable脚本・独立レビュー併走で書き上げた、三つの長編小説。
      全${eps}話・約${fmt(Math.round(total/1000))}千字。読みたい一冊から、どうぞ。</p>
    <div class="cards">${cards}</div>
    <div class="note"><b>この本棚について</b><br>
      各作品は完結済みの下書き原稿です。数字・設定・整合は制作用の設定資料で管理し、
      独立レビューを複数回かけて仕上げています。作中の演出（ステータス表示など）は本文の一部として表示しています。</div>
  </div>`;
  document.querySelectorAll(".eps button").forEach(b=>b.classList.remove("active"));
}

function openEp(wi,ei){
  const w=DATA[wi],e=w.eps[ei];cur={w:wi,e:ei};
  document.documentElement.style.setProperty("--accent",w.accent);
  // shelf state
  document.querySelectorAll(".work").forEach((s,i)=>s.classList.toggle("open",i===wi));
  document.querySelectorAll(".eps button").forEach(b=>b.classList.remove("active"));
  const ab=$(`#e${wi}_${ei}`); if(ab)ab.classList.add("active");
  $("#crumb").innerHTML=`<b>${esc(w.title)}</b> ／ ${esc(e.title)}`;
  document.body.classList.remove("nav-open");

  const body=e.paras.map(p=>{
    if(p.t==="br")return `<div class="brk"></div>`;
    if(p.t==="card")return `<div class="card">${p.v}</div>`;
    return `<p>${p.v}</p>`;
  }).join("");
  const prev=ei>0, next=ei<w.eps.length-1;
  const nav=`<div class="nav">
    <button ${prev?"":"disabled"} onclick="openEp(${wi},${ei-1})">
      <div class="lb">前の話</div><div class="tt">${prev?esc(w.eps[ei-1].title):"―"}</div></button>
    <button class="next" ${next?"":"disabled"} onclick="openEp(${wi},${ei+1})">
      <div class="lb">次の話</div><div class="tt">${next?esc(w.eps[ei+1].title):"（完結）"}</div></button>
  </div>`;
  $("#view").innerHTML=`<article class="reader">
    <div class="r-genre">${esc(w.genre)}</div>
    <div class="r-work">${esc(w.title)}</div>
    <h1 class="r-title">${esc(e.title)}</h1>
    <div class="r-meta">第${ei+1}話 / 全${w.eps.length}話 ・ 約${fmt(e.chars)}字</div>
    <div class="r-rule"></div>
    <div class="body">${body}</div>
    ${nav}
    <div class="nav" style="border:0;margin-top:20px;padding:0">
      <button onclick="landing()"><div class="lb">◂ 本棚へ戻る</div></button></div>
  </article>`;
  document.getElementById("main").scrollTo(0,0);
  window.scrollTo(0,0);
  $("#view").scrollTo&&$("#view").scrollTo(0,0);
};

landing();
</script>
