<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>けものと蔵 ― 三つの物語</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Serif+JP:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f3efe6; --bg2:#e9e3d5; --panel:#fbf9f3; --ink:#2b2823; --ink2:#6a6456;
  --line:#d9d2c2; --gold:#9c7c2a; --link:#3f6ea6; --accent:#c8892f;
  --shadow:0 1px 3px rgba(60,50,30,.10),0 8px 24px rgba(60,50,30,.06);
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
  :root{}
}}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#16181e; --bg2:#1b1e26; --panel:#1f232c; --ink:#e9e4d8; --ink2:#9a927f;
  --line:#333844; --gold:#c8a24a; --link:#7fa8d0; --accent:#e0a13a;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#16181e; --bg2:#1b1e26; --panel:#1f232c; --ink:#e9e4d8; --ink2:#9a927f;
  --line:#333844; --gold:#c8a24a; --link:#7fa8d0; --accent:#e0a13a;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);
  font-family:"Noto Serif JP",serif;line-height:1.9;
  -webkit-font-smoothing:antialiased;display:flex;min-height:100vh}
a{color:var(--link);text-decoration:none}
button{font-family:inherit;cursor:pointer;color:inherit;background:none;border:none}

/* ---- sidebar / shelf ---- */
#shelf{width:320px;flex:none;background:var(--bg2);border-right:1px solid var(--line);
  height:100vh;overflow-y:auto;position:sticky;top:0;padding:22px 0 60px}
.brand{padding:6px 22px 18px}
.brand h1{font-family:"Shippori Mincho",serif;font-weight:800;font-size:22px;letter-spacing:.06em;color:var(--gold)}
.brand p{font-size:12px;color:var(--ink2);margin-top:4px;letter-spacing:.04em}
.work{border-top:1px solid var(--line)}
.work>button{display:block;width:100%;text-align:left;padding:16px 22px 14px;
  border-left:4px solid var(--wa,transparent)}
.work>button:hover{background:var(--panel)}
.work h2{font-family:"Shippori Mincho",serif;font-weight:700;font-size:16px;letter-spacing:.03em}
.work .sub{font-size:11.5px;color:var(--ink2);margin-top:3px;line-height:1.6}
.work .genre{display:inline-block;margin-top:8px;font-size:10.5px;letter-spacing:.12em;
  color:var(--wa);border:1px solid var(--wa);border-radius:20px;padding:2px 10px;
  font-family:system-ui,sans-serif}
.eps{display:none;padding:0 0 10px}
.work.open .eps{display:block}
.eps button{display:flex;gap:10px;width:100%;text-align:left;padding:7px 22px 7px 30px;
  font-size:13px;color:var(--ink2);align-items:baseline}
.eps button:hover{background:var(--panel);color:var(--ink)}
.eps button.active{color:var(--wa);background:var(--panel);font-weight:700}
.eps .n{font-family:system-ui,sans-serif;font-variant-numeric:tabular-nums;
  font-size:11px;color:var(--ink2);flex:none;width:22px;text-align:right}
.eps button.active .n{color:var(--wa)}

/* ---- reader ---- */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;
  padding:12px 26px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#topbar .crumb{font-size:12.5px;color:var(--ink2);flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:system-ui,sans-serif}
#topbar .crumb b{color:var(--accent)}
.tb-btn{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;
  display:grid;place-items:center;font-size:15px;flex:none}
.tb-btn:hover{border-color:var(--accent);color:var(--accent)}
#menuBtn{display:none}

.reader{max-width:44rem;margin:0 auto;padding:54px 30px 120px;width:100%}
.r-genre{font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.2em;
  color:var(--accent);text-transform:uppercase}
.r-work{font-size:13.5px;color:var(--ink2);margin-top:6px}
.r-title{font-family:"Shippori Mincho",serif;font-weight:800;
  font-size:clamp(26px,4.2vw,38px);line-height:1.35;margin:10px 0 6px;
  text-wrap:balance;letter-spacing:.02em}
.r-meta{font-family:system-ui,sans-serif;font-size:11.5px;color:var(--ink2);
  font-variant-numeric:tabular-nums;letter-spacing:.05em}
.r-rule{height:1px;background:var(--line);margin:30px 0 40px;position:relative}
.r-rule::after{content:"❦";position:absolute;left:50%;top:-13px;transform:translateX(-50%);
  background:var(--bg);padding:0 14px;color:var(--gold);font-size:15px}

.body{font-size:var(--fs,17.5px)}
.body p{margin:0 0 1.5em;text-indent:0}
.body strong{font-weight:700;color:var(--accent);font-style:normal}
.brk{height:2.2em;display:flex;align-items:center;justify-content:center;color:var(--gold);opacity:.6}
.brk::before{content:"◇"}
.card{font-family:"DejaVu Sans Mono",ui-monospace,monospace;font-size:13.5px;line-height:1.75;
  white-space:pre-wrap;background:var(--bg2);border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:8px;padding:14px 18px;margin:0 0 1.6em;
  color:var(--ink2);letter-spacing:.02em}

.nav{display:flex;justify-content:space-between;gap:12px;margin-top:64px;
  border-top:1px solid var(--line);padding-top:24px}
.nav button{flex:1;border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  text-align:left;transition:.15s}
.nav button:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.nav button:disabled{opacity:.32;cursor:default}
.nav .lb{font-family:system-ui,sans-serif;font-size:10.5px;letter-spacing:.14em;color:var(--ink2);text-transform:uppercase}
.nav .tt{font-family:"Shippori Mincho",serif;font-size:14px;margin-top:5px;color:var(--ink)}
.nav .next{text-align:right}

/* landing */
.landing{max-width:52rem;margin:0 auto;padding:60px 30px 120px}
.landing .lead{font-family:"Shippori Mincho",serif;font-weight:800;
  font-size:clamp(28px,5vw,46px);line-height:1.4;letter-spacing:.03em;text-wrap:balance}
.landing .desc{color:var(--ink2);margin:18px 0 40px;font-size:15px;max-width:38rem}
.cards{display:grid;gap:18px}
.wcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:24px 26px;box-shadow:var(--shadow);border-top:4px solid var(--wa);
  transition:.18s;text-align:left;display:block;width:100%}
.wcard:hover{transform:translateY(-3px)}
.wcard .g{font-family:system-ui,sans-serif;font-size:10.5px;letter-spacing:.18em;
  color:var(--wa);text-transform:uppercase}
.wcard h3{font-family:"Shippori Mincho",serif;font-weight:800;font-size:23px;
  margin:8px 0 4px;letter-spacing:.03em}
.wcard .s{color:var(--ink2);font-size:13.5px}
.wcard .m{font-family:system-ui,sans-serif;font-size:11.5px;color:var(--ink2);
  margin-top:14px;font-variant-numeric:tabular-nums;letter-spacing:.05em}
.note{margin-top:44px;font-size:12.5px;color:var(--ink2);background:var(--bg2);
  border:1px solid var(--line);border-radius:12px;padding:16px 18px;line-height:1.75;
  font-family:system-ui,sans-serif}

@media(max-width:820px){
  #shelf{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);
    transition:transform .22s;box-shadow:var(--shadow)}
  body.nav-open #shelf{transform:none}
  #menuBtn{display:grid}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35;opacity:0;
    pointer-events:none;transition:.2s}
  body.nav-open .scrim{opacity:1;pointer-events:auto}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
</style>

<aside id="shelf">
  <div class="brand"><h1>けものと蔵</h1><p>Fable Works ／ 三つの長編小説</p></div>
  <nav id="worklist"></nav>
</aside>
<div class="scrim" onclick="document.body.classList.remove('nav-open')"></div>

  <div id="topbar">
    <button id="menuBtn" class="tb-btn" aria-label="目次" onclick="document.body.classList.toggle('nav-open')">☰</button>

    <button class="tb-btn" id="themeBtn" aria-label="テーマ切替" title="テーマ切替">◑</button>
  </div>
  <div id="view"></div>
</div>

<script>

 "……その話はいい。"}, {"t": "p", "v": "「さて。本日の目玉といくか」"}, {"t": "p", "v": "床の麻袋を作業台に上げる。<br>今朝の競りで落とした「ジャンク梱（こり）」――ギルドが廃棄した壊れスキル結晶の詰め合わせだ。<br>目方売り、六キロで四千円。<br>中身は直すまでわからない。当たりを決めるのは運じゃなく、腕だ。"}, {"t": "p", "v": "ざらざらと台にあける。<br>ヒビ割れの【松明】。芯の焼けた【草刈り】。値のつかないものばかりが積み上がる。"}, {"t": "p", "v": "その底に、一つ。"}, {"t": "p", "v": "拳より大きい結晶が、鈍い虹色に濁っていた。<br>持ち上げた瞬間、目の前にUIが開く。"}, {"t": "card", "v": "【銘：読取不能】\n　等級：測定不能（推定：伝説級）\n　耐久値：0.8％\n　故障箇所：74\n　必要部品：星鋼×1、原初の油×200ml　ほか31種\n　工程：127　　所要：算出不能"}, {"t": "p", "v": "「……おいおい」"}, {"t": "p", "v": "伝説級。<br>博物館のガラスの向こうにしかない代物が、目方四千円の袋の底から出てきた。<br>問題は、直すのに要る物だ。<br>星鋼は、S級ダンジョンの最深部にしか出ない。"}, {"t": "p", "v": "今はただの石ころ。<br>だが、直せば話が変わる。"}, {"t": "p", "v": "俺は百二十七行の工程表を眺めて、しばらくにやついていた。"}, {"t": "p", "v": "そのときだった。"}, {"t": "p", "v": "扉が、蝶番を鳴らして開いた。"}, {"t": "p", "v": "白い外套の女が転がり込んでくる。<br>息が上がって、足がもつれて、それでも目だけは真っ直ぐ俺を見ていた。"}, {"t": "p", "v": "「ここ……非認可の、修理屋さんで合ってる？」"}, {"t": "p", "v": "「看板は出してない。それでいいなら」"}, {"t": "p", "v": "「よかった」"}, {"t": "p", "v": "女が笑った。<br>きれいな笑い方だった。"}, {"t": "p", "v": "だが俺の目には、彼女の胸の上に浮かんだ数字が見えている。"}, {"t": "card", "v": "【聖騎士】　Ｓ級・戦闘型\n　摩耗率：96.0％\n　残量：4.0％\n　⚠警告：暴走域まで残りわずか"}, {"t": "p", "v": "摩耗率、九十六。<br>整備の教本には太字で書いてある。「九十を超えた者には近づくな」。"}, {"t": "p", "v": "「私を直して。非認可でもいい。お金は――」"}, {"t": "p", "v": "「あんた、残量4％だ」"}, {"t": "p", "v": "女の言葉を、数字で断ち切った。"}, {"t": "p", "v": "「あと十数回も発動すれば、化け物になる。周りごと喰う。……笑っても、その数字は一つも動かない」"}, {"t": "p", "v": "女の笑みが、初めて固まった。<br>傷ついた顔だった。"}, {"t": "p", "v": "わかっている。俺は昔から、人の気持ちより先に壊れ方を見る。<br>親方に三年使われても気づかなかったのも、たぶん同じ理由だ。"}, {"t": "p", "v": "「……すごい。触ってもいないのに」"}, {"t": "p", "v": "「見えるんだよ。全部」"}, {"t": "p", "v": "「そっか」"}, {"t": "p", "v": "女は、ゆっくり息を吐いた。"}, {"t": "p", "v": "「誤魔化せなかったの、あなたが初めて。――なら、話が早い」"}, {"t": "p", "v": "外套の襟を開く。<br>鎖骨の下、肌の上に淡く浮かぶ結晶。<br>白かったはずの輝きは煤け、細かいヒビで曇りきっていた。"}, {"t": "p", "v": "「雨宮ひかり。S級探索者。……もうすぐ、除籍封印される予定だった」"}, {"t": "p", "v": "除籍封印。<br>摩耗率九十を超えた探索者から、スキルを結晶ごと抜いて凍結する制度だ。<br>暴走は防げる。<br>代わりに、抜かれた人間は二度と覚醒しない。"}, {"t": "p", "v": "「護送は？」"}, {"t": "p", "v": "「逃げてきた。自分で決めて、窓から」"}, {"t": "p", "v": "こともなげに言う。"} r>昨日それで、数字が動いたばかりだ。"}, {"t": "p", "v": "「なあ。なんで、うちに来た。非認可のジャンク屋なんて他にもある」"}, {"t": "p", "v": "「ん。ダンジョン前の子たちが言ってたの。『裏路地のにいちゃんは、捨てるしかない物を直す』って」"}, {"t": "p", "v": "ひかりは、床に散らばった光の名残を眺めた。"}, {"t": "p", "v": "「封印される私と、おそろいだと思って」"}, {"t": "p", "v": "「……ずいぶんな縁だな」"}, {"t": "p", "v": "「でも、当たりだった」"}, {"t": "br"}, {"t": "p", "v": "「――で、だ」"}, {"t": "p", "v": "「はい」"}, {"t": "p", "v": "「なんであんたは、当然みたいに二階に布団を敷いてる」"}, {"t": "p", "v": "翌朝の話だ。<br>店の二階、物置きの隙間に、雨宮ひかりはきっちり寝床を作っていた。<br>装備一式は枕元に整列。<br>壁には手描きの見取り図。「非常口×2、迎撃点×3」。<br>うちは店だ。要塞じゃない。"}, {"t": "p", "v": "「七日間、私はあなたの預かり品でしょ？　品物は店で保管するものだよ」"}, {"t": "p", "v": "「品物は飯を要求しない」"}, {"t": "p", "v": "「するよ。あ、でも安心して。もう作ったから」"}, {"t": "p", "v": "台所に、黒い何かが積んであった。<br>炭じゃない。よく見ると、炭になった何かだ。"}, {"t": "p", "v": "「携帯食。潰して焼いて水分を飛ばすの。三年保つよ」"}, {"t": "p", "v": "「保たせる予定がねえんだよ。朝飯を三年寝かせるな」"}, {"t": "p", "v": "「えっ、贅沢……」"}, {"t": "p", "v": "S級探索者の暮らしぶりが、これでよくわかった。<br>ちなみに炊飯器は「起動詠唱が分からない」という理由で、まだ一度も使われていない。<br>ボタンだ。押すだけだ。"}, {"t": "p", "v": "「十四のときから坑の中だもん。今十八だから、もう四年。地上の道具、だいたい分かんない」"}, {"t": "p", "v": "「……飯の炊き方は、今夜教える。覚えろ」"}, {"t": "p", "v": "「師匠と呼んでいい？」"}, {"t": "p", "v": "「呼ぶな」"}, {"t": "br"}, {"t": "p", "v": "笑えたのは、そこまでだった。"}, {"t": "p", "v": "「ひかり。昨日の夜、何かあったか」"}, {"t": "p", "v": "「？　ううん。よく寝てた」"}, {"t": "p", "v": "「そうか。……夜中の二時十六分、あんたの摩耗率が動いてる」"}, {"t": "p", "v": "俺の視界のログは、嘘をつかない。"}, {"t": "p", "v": "『02:16　自動防御・展開（対象：落下物）』<br>『摩耗率　96.2％ → 96.4％』"}, {"t": "p", "v": "枕元の棚から、工具箱が一つ、彼女の頭に落ちかけていた。<br>それだけのことに、S級の聖騎士は勝手に盾を張った。"}, {"t": "p", "v": "「あんたのスキルは、あんたを守る型だ。本人が寝てても、勝手に発動して、勝手に減る」"}, {"t": "p", "v": "「……知ってる」"}, {"t": "p", "v": "ひかりは、笑ったままだった。"}, {"t": "p", "v": "「だから前線でも、私だけ減りが早かったんだ。みんなを守るたびに。寝てる間も、ずっと」"}, {"t": "p", "v": "残量、3.6％。<br>生きているだけで、この子は磨り減っていく。"}, {"t": "p", "v": "「診せろ。今夜、本格的にやる」"}, {"t": "p", "v": "「直る？」"}, {"t": "p", "v": "「診断してから言う。俺は数字しか信じない」"}, {"t": "p", "v": "「……ふふ。うん、知ってた」"}, {"t": "br"}, {"t": "p", "v": "日暮れまでは、仕込みに使った。"}, {"t": "p", "v": "視界の中で、俺だけの購買画面を開く。"}, {"t": "card", "v": "【純正部品カタログ】\n　所持：摩耗の欠片×26\n　・白晶軸受……欠片8\n　・聖銀糸（3束）……欠片9\n　・研磨油・上……欠片2"}, {"t": "p", "v": "摩耗の欠片。<br>壊れた物を直すたび、俺の手元に残る不思議な燃え殻だ。<br>金じゃ部品は買えない。欠片でしか買えない。<br>つまり――誰かを直した分しか、次の修理はできない。"}, {"t": "p", "v": "三年ぶん。<br>ガキどもの湯沸かしと、じいさんの老眼鏡と、屋台の火起こし。直して貯めた、なけなしの二十六だ。"}, {"t": "p", "v": "「聖騎士ってのは、高くつきそうだな……」"}, {"t": "br"}, {"t": "p", "v": "夜。<br>作業台に横になったひかりの、鎖骨の下。<br>煤けた結晶に、俺は両手で触れた。"}, {"t": "p", "v": "【故障診断】――起動。"}, {"t": "p", "v": "『解析中……工程１／９』"}, {"t": "p", "v": "ヒビの一本一本から、これまでの戦歴が流れ込んでくる。<br>何百回の突入。何千回の防御。<br>自分の何かをすり潰しながら、誰かの前に立ち続けた記録。"}, {"t": "p", "v": "「ねえ、修理屋さん」"}, {"t": "p", "v": "「修でいい」"}, {"t": "p", "v": "「修くん。……私、直るかな」"}, {"t": "p", "v": "『解析中……工程６／９』"}, {"t": "p", "v": "「朝には診断が出る」"}, {"t": "p", "v": "「そっか。じゃあ、賭けよっか。直るほうに百円」"}, {"t": "p", "v": "「趣味の悪い賭けだ」"}, {"t": "p", "v": "「勝つ気しかしないもん」"}, {"t": "p", "v": "「根拠は」"}, {"t": "p", "v": "「んー……。あなたの手、あったかいから」"}, {"t": "p", "v": "「非科学的だな」"}, {"t": "p", "v": "「私、それしか信じてこなかったから。数字はぜんぶ、私の敵だったし」"}, {"t": "p", "v": "そうか。<br>なら、ここからは俺の領分だ。<br>数字を、あんたの味方に付け替える。"}, {"t": "p", "v": "『解析中……工程８／９』"}, {"t": "p", "v": "数字を見つめる。<br>三年この仕事をやってきて、診断待ちの夜だけは、いまだに慣れない。"}, {"t": "p", "v": "『解析中……工程９／９』<br>『修復プランを算出しています――』"}, {"t": "p", "v": "視界の隅で、カードが一枚、静かにめくれた。"}, {"t": "card", "v": "【執行猶予】残り６日"}, {"t": "p", "v": "朝には、答えが出る。"}], "chars": 3171}, {"title": "第3話　プラス9パーセント", "paras": [{"t": "p", "v": "診断結果は、夜明けと同時に出た。"}, {"t": "card", "v": "【聖騎士】修復プラン\n　完治：不可\n　　理由：中枢軸の設計損耗。\n　　　　　交換用の純正部品が存在しない\n　　　　　（製造元：第七工房――カタログ該当なし）\n　応急整備：可\n　　回復見込み：＋9.0％（残量 3.6％ → 12.6％）\n　　必要部品：白晶軸受×1、聖銀糸×3　ほか6種\n　　費用：摩耗の欠片×24（所持：26）\n　工程：41　　所要：約6時間"}, {"t": "p", "v": "完治、不可。"}, {"t": "p", "v": "何度読み直しても、二文字は動かなかった。"}, {"t": "p", "v": "直せないんじゃない。<br>部品が、ないんだ。<br>この結晶の心臓部――中枢の軸は、市場のどこにも流通していない規格で削られている。<br>作った奴にしか、代えが作れない。"}, {"t": "p", "v": "「……第七工房」"}, {"t": "p", "v": "一昨日、初めて見てから二度目だ。その名前は。<br>スキルを配ったのが誰なのか、誰も知らない世界で。<br>こいつだけが、銘を名乗っている。"}, {"t": "p", "v": "階段の軋む音がした。"}, {"t": "p", "v": "「おはよ。……あ」"}, {"t": "p", "v": "ひかりは俺の顔を見て、それから宙を見た。<br>彼女にUIは視えない。<br>それでも、伝わるものはあるらしい。"}, {"t": "p", "v": "「賭け、私の負け？」"}, {"t": "p", "v": "「半分な」"}, {"t": "p", "v": "誤魔化しても、数字は変わらない。<br>だから、全部そのまま言った。<br>完治は不可。理由は部品。応急整備で、上限プラス9％。"}, {"t": "p", "v": "「9％……」"}, {"t": "p", "v": "ひかりは指を折って、何かを数えはじめた。"}, {"t": "p", "v": "「12％あれば、中層に十回は潜れるね」"}, {"t": "p", "v": "「おい」"}, {"t": "p", "v": "自分でも驚くくらい、低い声が出た。"}, {"t": "p", "v": "「直した端から、削る算段をするな」"}, {"t": "p", "v": "「するよ」"}, {"t": "p", "v": "即答だった。<br>笑顔のままで、目だけが笑っていなかった。"}, {"t": "p", "v": "「そのために逃げてきたんだもん。――見て」"}, {"t": "p", "v": "差し出されたのは、探索者ライセンス。<br>裏の透明ポケットに、写真が一枚。<br>病院のベッドの上で、ピースをしている小さな女の子。"}, {"t": "p", "v": "「妹。あかりって言うの。心臓が悪くて、手術にあと四百万。……私が潜るのをやめたら、あの子の時間のほうが先に切れる」"}, {"t": "p", "v": "「……」"}, {"t": "p", "v": "「摩耗率96％って宣告されたとき、最初に思ったこと、教えてあげようか」"}, {"t": "p", "v": "ひかりは、写真をそっと撫でた。"}, {"t": "p", "v": "「『よかった、まだ4％ある』」"}, {"t": "p", "v": "ああ、もう。<br>壊れてるのは結晶だけじゃない。<br>この使い手は、使い方が壊れてる。"}, {"t": "p", "v": "「……賭けの百円は今度でいい。始めるぞ。六時間、動くな」"}, {"t": "p", "v": "「え、今から？　朝ごはんまだ」"}, {"t": "p", "v": "「終わったら食わせてやる。炭じゃないやつを」"}, {"t": "br"}, {"t": "p", "v": "作業台に仰向けのひかり。<br>結晶を肌からそっと浮かせて、俺の掌の上へ。<br>触れた瞬間、四十一の工程が視界いっぱいに展開する。"}, {"t": "p", "v": "『工程１／41　外殻洗浄』"}, {"t": "p", "v": "煤を落とす。<br>四年分の戦場が、黒い膜になって剥がれていく。"}, {"t": "p", "v": "『工程７／41　ヒビ充填』<br>『残量　3.6％ → 5.2％』"}, {"t": "p", "v": "「ん……」"}, {"t": "p", "v": "「動くな」"}, {"t": "p", "v": "「くすぐったい」"}, {"t": "p", "v": "「スキルにくすぐったいがあるか」"}, {"t": "p", "v": "「あるよ。今、証明してる」"}, {"t": "p", "v": "『工程14／41　聖銀糸・巻き直し』<br>『残量　5.2％ → 7.8％』"}, {"t": "p", "v": "「ねえ、修くんはさ。なんで修理屋になったの」"}, {"t": "p", "v": "「JOBが勝手に来た。中学の覚醒式で」"}, {"t": "p", "v": "「聞き方変えるね。なんで、辞めなかったの」"}, {"t": "p", "v": "手は止めない。<br>糸を巻く。締める。確かめる。"}, {"t": "p", "v": "「……昔いた工房でな。俺が直した客のスキルを、工房長が『自分の腕だ』って売ってた。三年、無給でだ」"}, {"t": "p", "v": "「うわ」"}, {"t": "p", "v": "「で、暴走事故の夜に工房長は逃げた。俺は残って直した。翌朝、事故の責任だけ俺に来て、認可も飛んだ」"}, {"t": "p", "v": "「……うわあ」"}, {"t": "p", "v": "「それでも、客のスキルは直った。あのガキの湯沸かしも、まだ動いてる」"}, {"t": "p", "v": "だから辞める理由がない。<br>それだけの話だ。"}, {"t": "p", "v": "数字が上がる。<br>子どもの生活スキルも、S級の聖騎士も、直し方は同じだ。<br>壊れた場所を探して、部品を替えて、締め直す。<br>それだけのことを、誰もやらなかった。"}, {"t": "p", "v": "『工程23／41　軸受交換』"}, {"t": "p", "v": "――ここだ。<br>中枢のすぐ横。白晶の軸受を滑り込ませる。<br>指先に、嫌な抵抗。"}, {"t": "p", "v": "『⚠警告：軸ずれ』<br>『残量　7.8％ → 7.1％』"}, {"t": "p", "v": "下がった。"}, {"t": "p", "v": "「……っ」"}, {"t": "p", "v": "息を止める。<br>0.1ミリの世界。<br>磨り減った中枢に負担をかけず、新品の軸受だけを馴染ませる。<br>道具は使えない。<br>使えるのは、指と、視える数字だけ。"}, {"t": "p", "v": "7.1。<br>7.1。<br>7.2――。"}, {"t": "p", "v": "音ではなく、指先にカチリと手応えが返った。<br>掌の中で、何かが正しい場所に座った。"}, {"t": "p", "v": "『軸ずれ：解消』<br>『残量　7.2％ → 9.9％』"}, {"t": "p", "v": "「……ふぅ」"}, {"t": "p", "v": "「いま、危なかった？」"}, {"t": "p", "v": "「寝てろ」"}, {"t": "p", "v": "ちなみにひかりは、工程30のあたりで本当に寝た。<br>前線暮らしの長い奴は、安全だと思った場所で一瞬で寝るという。<br>この店をそう思われたのは、まあ、悪い気分じゃなかった。"}, {"t": "p", "v": "『工程41／41　完了』"}, {"t": "card", "v": "【聖騎士】応急整備・完了\n　摩耗率：96.4％ → 87.4％\n　残量　：3.6％ → 12.6％\n　摩耗の欠片：26 → 2"}, {"t": "p", "v": "三年かけて貯めた欠片が、ほとんど溶けた。<br>惜しくはない。<br>数字が上がるところを見られたなら、それで釣りが来る。"}, {"t": "p", "v": "「注意事項が二つある。起きたら聞け」"}, {"t": "p", "v": "「起きてる。半分」"}, {"t": "p", "v": "「一つ。直した直後のスキルは、出力が五割まで落ちる。機械と同じだ。慣らしが要る。二週間は全力を出すな」"}, {"t": "p", "v": "「はーい。二つ目は？」"}, {"t": "p", "v": "「防御を張る前に、一回だけ考えろ。工具箱程度なら、頭で受けても死なない」"}, {"t": "p", "v": "「それ、聖騎士に一番むずかしいやつだ……」"}, {"t": "p", "v": "――ただし。"}, {"t": "p", "v": "87.4は、まだ「近づくな」の領域だ。<br>そして中枢の軸は、これからも磨り減り続ける。<br>応急整備は、時間を買っただけ。<br>買った時間で部品を見つけない限り、この結晶の寿命は変わらない。"}, {"t": "br"}, {"t": "p", "v": "夕方、目を覚ましたひかりは、店の隅で電話をかけていた。"}, {"t": "p", "v": "「うん。うん、お姉ちゃんは元気。すっごく元気だよ」"}, {"t": "p", "v": "残量12.6％で、すっごく元気。<br>その嘘がいくらの嘘なのか、知っているのは俺だけだ。"}, {"t": "p", "v": "「あかりがね、『お姉ちゃん、声が明るい』って」"}, {"t": "p", "v": "電話を切ったひかりは、ほんとうに明るい顔で戻ってきた。"}, {"t": "p", "v": "「ね、修くん。お金の話なんだけど」"}, {"t": "p", "v": "「四百万か」"}, {"t": "p", "v": "「うん。手っ取り早いの、見つけてある」"}, {"t": "p", "v": "彼女が作業台に広げたのは、折り目の切れた古い坑内図だった。<br>中層の外れ。×印が、道みたいに連なっている。"}, {"t": "p", "v": "「『開かずの宝箱街道』。罠ごと壊れて、誰にも開けられない宝箱が五十個以上、放置されてるの。ギルドも回収を諦めた場所。――もし、鍵が壊れてるだけなら」"}, {"t": "p", "v": "「……直せば、開く」"}, {"t": "p", "v": "「でしょ？」"}, {"t": "p", "v": "「待て。護衛は。あんたのスキルは慣らし中で出力五割、しかも使えば減る」"}, {"t": "p", "v": "「大丈夫。中層の外れは魔物が薄いの。それに」"}, {"t": "p", "v": "ひかりは、力こぶを作ってみせた。"}, {"t": "p", "v": "「聖騎士はね、スキル抜きでも体は強いんだよ。十四から坑育ちなめないで」"}, {"t": "p", "v": "説得力があるのか、ないのか。"}, {"t": "p", "v": "なるほど。<br>世界中の誰にも開けられない宝箱の山は、つまり、俺専用の鉱脈だ。"}, {"t": "p", "v": "視界の隅で、カードが並ぶ。"}, {"t": "card", "v": "【執行猶予】残り５日\n【雨宮ひかり】残量：12.6％"}, {"t": "p", "v": "五日で、四百万と、部品の当てと。<br>……忙しくなってきた。"}, {"t": "p", "v": "「準備は明日。今日はもう寝ろ。あんたは寝てても減るんだ」"}, {"t": "p", "v": "「はーい。あ、朝ごはんまだ食べてない」"}, {"t": "p", "v": "「もう夜だ。夕飯にしろ」"}, {"t": "br"}, {"t": "p", "v": "日付が変わる頃。<br>飯を食わせて、ひかりを二階に上げて、俺は店の灯りを落としかけた。"}, {"t": "p", "v": "――そのとき、だった。"}, {"t": "p", "v": "作業台の隅で、鈍い虹色が明滅した。"}, {"t": "p", "v": "ジャンク梱の底から出た、あの伝説級の結晶。<br>耐久0.8％。<br>ただの石ころのはずのそれが、勝手にUIを開いている。"}, {"t": "card", "v": "【銘：読取不能】\n　……同型機ヲ検知シマシタ\n　製造元：第七工房\n　対象状態：摩耗限界\n　回収要請ヲ送信――"}, {"t": "p", "v": "「――おい」"}, {"t": "p", "v": "回収要請？<br>どこへだ。<br>誰にだ。"}, {"t": "p", "v": "掴み上げたときには、結晶はもう沈黙していた。<br>耐久0.8％の、ただの石ころの顔で。"}, {"t": "p", "v": "二階からは、ひかりの寝息が聞こえている。"}], "chars": 3228}, {"title": "第4話　開かずの宝箱街道", "paras": [{"t": "p", "v": "『02:41　自動防御・展開（対象：ネズミ）』<br>『残量　12.6％ → 12.5％』"}, {"t": "p", "v": "朝いちばんにログを確認して、俺は息を吐いた。"}, {"t": "p", "v": "「起きたか。あんたの盾は昨夜、店のネズミと戦ってた」"}, {"t": "p", "v": "「勝った？」"}, {"t": "p", "v": "「無傷だ。ネズミも」"}, {"t": "p", "v": "「よかった」"}, {"t": "p", "v": "よくない。<br>S級の盾がネズミに全力で張られて、寿命が0.1削れた。<br>この調子で寝かせておくくらいなら、街道とやらで動いてもらったほうがましだ。"}, {"t": "p", "v": "台所からは、焦げた匂いがしていた。"}, {"t": "p", "v": "「ごはん、炊いてみたの。……三回目の正直」"}, {"t": "p", "v": "差し出された茶碗の中で、黒い層と白い層が地層になっていた。"}, {"t": "p", "v": "「上半分は食える。進歩だ」"}, {"t": "p", "v": "「でしょ」"}, {"t": "p", "v": "炊飯器のボタンは覚えた。水の量で、まだ負けている。<br>S級探索者の弱点が飯だとは、ギルドも知らないだろう。"}, {"t": "p", "v": "「行く前に、ひとつ」"}, {"t": "p", "v": "俺は作業台の袋に、あの伝説級を放り込んだ。"}, {"t": "p", "v": "「連れていく。勝手に電波を飛ばす石に、留守番はさせない」"}, {"t": "p", "v": "「昨日の夜の、回収要請ってやつ？」"}, {"t": "p", "v": "「誰に送ったのか分からないのが、一番気に入らない」"}, {"t": "card", "v": "【執行猶予】残り４日"}, {"t": "p", "v": "四日で、四百万と部品の当てを揃える。<br>まずは、世界中が開けるのを諦めた宝の山からだ。"}, {"t": "br"}, {"t": "p", "v": "中層の外れまで、ひかりの案内で二時間。<br>岩の裂け目を抜けた先に、その道はあった。"}, {"t": "p", "v": "通路の両脇に、宝箱が並んでいる。<br>右に、左に、埃をかぶって、五十いくつ。<br>どの蓋も閉じたまま。錠は錆び、罠は死にかけのまま生きている。"}, {"t": "p", "v": "「開かずの宝箱街道。……ようこそ、私の貯金箱へ」"}, {"t": "p", "v": "「一円も入ってないうちから貯金箱を名乗るな。開けてからだ」"}, {"t": "p", "v": "「ギルドはここで回収班を二回出して、二回とも罠で担架が出たの。三回目はもうなかった。『費用対効果なし』だって」"}, {"t": "p", "v": "「らしい判断だ」"}, {"t": "p", "v": "手近な一つに、視線を落とす。"}, {"t": "card", "v": "【宝箱17号】\n　錠前：破損（噛み合い不良）\n　罠：毒針・半壊（暴発待ち）\n　工程：６　　所要：９分"}, {"t": "p", "v": "「なるほどな。こいつら、開かないんじゃない。壊れて、開けられなくなってるだけだ」"}, {"t": "p", "v": "「壊れてるほうが危ないの？」"}, {"t": "p", "v": "「中途半端に死んでる罠が、一番たちが悪い。いつ跳ねるか、本人も分かってない」"}, {"t": "p", "v": "錠の芯に指を沈める。<br>ずれた歯を、一枚ずつ座らせていく。"}, {"t": "p", "v": "『工程４／６』<br>『⚠警告：罠・暴発』"}, {"t": "p", "v": "半壊の毒針が、死にかけの虫みたいに跳ねた。"}, {"t": "p", "v": "『自動防御・展開』<br>『残量　12.5％ → 12.2％』"}, {"t": "p", "v": "白い盾が、俺と針の間に割り込んでいた。"}, {"t": "p", "v": "「今のは守るとこだったでしょ」"}, {"t": "p", "v": "「助かった。が、次は俺が避ける。あんたは減るな」"}, {"t": "p", "v": "「難しい注文ばっかりする店だなあ」"}, {"t": "p", "v": "『工程６／６　錠前修理・完了』"}, {"t": "p", "v": "蓋が開く。<br>何年も誰にも開けられなかった蓋が、あくびみたいにあっさり開いた。"}, {"t": "p", "v": "古銭の束と魔石が三つ、それに蝋で封をした小瓶が一本入っていた。"}, {"t": "p", "v": "『【原初の油】200ml──必要部品リストと照合……該当』"}, {"t": "p", "v": "「……おい。初日から当たりだ」"}, {"t": "p", "v": "伝説級の修理に要る三十三種のうちの一つが、中層の箱の底から出てきた。<br>この街道、思ったより深い。"}, {"t": "p", "v": "『摩耗の欠片×３ を回収しました』"}, {"t": "p", "v": "「ね、それ売ったらいくら？」"}, {"t": "p", "v": "「油は売らない。俺の部品だ。古銭と魔石で……買い取りで八万ってとこか」"}, {"t": "p", "v": "「八万！」"}, {"t": "p", "v": "ひかりが指を折り始めた。"}, {"t": "p", "v": "「五十箱で、四百万」"}, {"t": "p", "v": "「皮算用はいい。働け」"}, {"t": "br"}, {"t": "p", "v": "三つ目の箱は、罠のほうが本体だった。"}, {"t": "card", "v": "【宝箱31号】\n　錠前：健在\n　罠：火吹き・作動不能（燃料満タン）\n　工程：９　　所要：14分"}, {"t": "p", "v": "「錠は生きてる。死んでるのは罠だけだ。……で、燃料は満タンときてる」"}, {"t": "p", "v": "「開けたら爆発するやつだ」"}, {"t": "p", "v": "「開ける前に、罠ごと抜く」"}, {"t": "p", "v": "火吹きの機構を素手で分解して、燃料ごと部品の光に変えた。<br>七十二時間で霧散する、安全な光だ。"}, {"t": "p", "v": "「修くんのそれ、罠外し屋さんが見たら泣くよ」"}, {"t": "p", "v": "「泣かせておけ」"}, {"t": "p", "v": "昼までに、五つ開けた。"}, {"t": "p", "v": "『摩耗の欠片×２ を回収しました』<br>『摩耗の欠片×３ を回収しました』"}, {"t": "p", "v": "開けるたび、欠片が手元に貯まっていく。<br>三年かけて貯めた残高に、この街道は半日で追いつく勢いだ。"}, {"t": "card", "v": "【純正部品カタログ】\n　所持：摩耗の欠片×15"}, {"t": "p", "v": "六つ目の箱は、様子が違った。"}, {"t": "card", "v": "【宝箱・番外】ミミック型\n　耐久値：1.9％\n　故障箇所：顎・舌・ほか12\n　備考：内部に思考核──休眠中"}, {"t": "p", "v": "「生きてる箱だ」"}, {"t": "p", "v": "「ミミック！？　修くん、離れて」"}, {"t": "p", "v": "「耐久1.9の魔物の、何を怖がってる」"}, {"t": "p", "v": "魔物だろうが、壊れていれば俺の客だ。<br>外れかけた顎を締め、ちぎれた蝶番を継ぎ、思考核の配線を撚り直す。"}, {"t": "p", "v": "『耐久値：1.9％ → 23.5％』<br>『40.8％』<br>『修理完了　耐久値：74.0％』"}, {"t": "p", "v": "箱が、跳ねた。"}, {"t": "p", "v": "「――ボクの中身、どこ」"}, {"t": "p", "v": "しゃがれた、子どもみたいな声だった。"}, {"t": "p", "v": "「ないよ。ない。またない。ボク、また空っぽだ」"}, {"t": "p", "v": "「おい。喋る前に礼を言え。直したのは俺だ」"}, {"t": "p", "v": "「……直した？　ボクを？　なんで？　みんなボクを蹴って言ったのに。『空っぽの箱め』って」"}, {"t": "p", "v": "蓋の裏は、傷だらけだった。<br>罠が笑われ、中身を抜かれ、最後に壊されて捨てられた痕だ。"}, {"t": "p", "v": "「箱はね、中身が全部なんだ。空っぽの箱は、蹴られるためにある」"}, {"t": "p", "v": "「なら詰めろ。中身は詰めるものだ」"}, {"t": "p", "v": "箱は、しばらく黙った。"}, {"t": "p", "v": "「……詰めたら、ボク、えらい箱になれる？」"}, {"t": "p", "v": "「なれる。うちで働けばな。案内と収納係だ」"}, {"t": "p", "v": "「やる。この街道の箱は、みんなボクの兄弟だ。どこの罠がどう壊れてるか、全部言える」"}, {"t": "p", "v": "交渉成立――と思った次の瞬間、そいつは魔石の袋をひと口で飲んだ。"}, {"t": "p", "v": "「じゃ、これはボクの中身ね」"}, {"t": "p", "v": "「売り物だ。出せ」"}, {"t": "p", "v": "「中身は箱のものだよ」"}, {"t": "p", "v": "揉み合っているうちに、腰の工具差しのペンチまで飲まれた。"}, {"t": "p", "v": "「……お前、名前は」"}, {"t": "p", "v": "「ない。箱に名前はつかないよ」"}, {"t": "p", "v": "「ペンチだ。俺のペンチを返すまで、そう呼ぶ」"}, {"t": "p", "v": "「！　名前だ。ボク、名前もらった……」"}, {"t": "p", "v": "蓋を震わせて感動している。<br>返す気は、完全に消えたらしい。"}, {"t": "br"}, {"t": "p", "v": "「ねえ修。さっきから、その袋の石……すごい匂いがする。とびきりの『中身』の匂い」"}, {"t": "p", "v": "休憩中、ペンチが背負い袋に蓋を寄せてきた。"}, {"t": "p", "v": "「分かるのか」"}, {"t": "p", "v": "「箱はね、入れられた中身の値打ちが分かるんだ」"}, {"t": "p", "v": "袋から伝説級を出して、蓋の上に置いてやる。<br>触れた瞬間、俺のUIが勝手にめくれた。"}, {"t": "card", "v": "【銘：読取不能】──照合中……\n　推定分類：武器型・近接\n　銘：【剣■】\n　（破損ニヨリ一部読取不能）"}, {"t": "p", "v": "「……剣、ときたか」"}, {"t": "p", "v": "二文字の銘の、頭の一文字だけが読めた。<br>残りの一文字は、まだヒビの下だ。"}, {"t": "p", "v": "ペンチは蓋を閉じて、小さく震えていた。"}, {"t": "p", "v": "「ボク、生まれてからずっと箱だけど、こんな中身は知らない。値段のつけ方が分かんないよ、これ」"}, {"t": "p", "v": "「名前まで壊れてるとはな。……直せば、読める」"}, {"t": "p", "v": "「修くん、なんか楽しそう」"}, {"t": "p", "v": "「部品が三十三種のうち一つ埋まって、銘が半分読めた。悪くない日だからな」"}, {"t": "p", "v": "そのときだった。"}, {"t": "p", "v": "通路の奥から、金属を引きずる音がした。"}, {"t": "p", "v": "暗がりから先に出てきたのは、傷だらけの大盾だった。<br>縁が欠け、へこみ、それでも丁寧に磨いてある。<br>続いて、盾を引く丸太みたいな腕が見えた。<br>顔は、まだ闇の中にあった。"}, {"t": "p", "v": "「……ガキが二人と、箱がひとつ」"}, {"t": "p", "v": "低い声が、埃の積もった街道に落ちた。"}, {"t": "p", "v": "「こんな奥で、何してやがる」"}, {"t": "card", "v": "【執行猶予】残り４日\n【雨宮ひかり】残量：12.2％"}], "chars": 2950}, {"title": "第5話　四割の男", "paras": [{"t": "p", "v": "大盾の男が、明かりの下に出てきた。"}, {"t": "p", "v": "無精髭に、着古した胴当て。年は三十半ばというところだ。<br>そして俺のUIは、男の肩口に容赦のない数字を並べている。"}, {"t": "card", "v": "【重戦士】　Ｂ級・戦闘型\n　摩耗率：89.0％\n　残量：11.0％\n　整備状態：三年未整備"}, {"t": "p", "v": "八十九。<br>除籍封印のラインまで、あと一。<br>歩いている場所が、もう崖っぷちだ。"}, {"t": "p", "v": "「戸山ガク。この辺で拾い屋をやってる。……お前ら、まさか箱に触ったのか。あれは罠ごと壊れてて、ギルドの専門班でも――」"}, {"t": "p", "v": "言いかけて、男は道の先を見た。<br>蓋の開いた箱が、六つ並んでいる。"}, {"t": "p", "v": "「…………開いてる」"}, {"t": "p", "v": "「開けた。仕事なんでね」"}, {"t": "p", "v": "「開くわけがねえんだよ、あの箱は！　何年も、誰も……」"}, {"t": "p", "v": "男が絶句したところで、ペンチが蓋を鳴らした。"}, {"t": "p", "v": "「修、まずい。匂いだ。開けた中身の匂いに、寄ってきてる」"}, {"t": "p", "v": "通路の奥の暗がりで、目がいくつも灯った。<br>【鉄喰い】。金物を齧る、中層の掃除屋だ。<br>一匹なら犬ころ程度だが、数えるのが嫌になる群れだった。"}, {"t": "p", "v": "「チッ……下がってろ、ガキども。壁は俺の商売だ」"}, {"t": "p", "v": "男が大盾を構えて、群れの正面に立った。"}, {"t": "p", "v": "「残量は？」とひかり。"}, {"t": "p", "v": "「四割ある。余裕だ」"}, {"t": "p", "v": "嘘だ。<br>俺の視界では、11.0という数字が男の肩で光っている。"}, {"t": "p", "v": "『【重戦士】固有・城壁　展開』<br>『摩耗率　89.0％ → 89.2％』"}, {"t": "p", "v": "盾の面が岩みたいに膨らんで、通路の幅いっぱいを塞いだ。<br>先頭の鉄喰いが正面からぶつかって、弾かれる。"}, {"t": "p", "v": "「はっ、効かねえなあ！　次！」"}, {"t": "p", "v": "二匹目、三匹目。<br>壁は揺るがない。だが、揺るがないたびに――"}, {"t": "p", "v": "『89.2％ → 89.3％』"}, {"t": "p", "v": "群れの奥から、ひと回りでかいのが来た。<br>背中の板金が波打って、頭から壁に突っ込む。"}, {"t": "p", "v": "「主か。……上等だァ！」"}, {"t": "p", "v": "鈍い衝突音がして、盾が軋み、男の踵が半歩ぶん石の床を削った。<br>壁は、割れなかった。大きいのは鼻面を潰して転がり、群れがどよめいた。"}, {"t": "p", "v": "『89.3％ → 89.4％』"}, {"t": "p", "v": "笑うたびに、数字が減っていく。<br>残り10.6。<br>あの壁は、命の切り売りで張られている。<br>そして、それを知っているのはこの場で俺だけだ。"}, {"t": "p", "v": "「ペンチ！　開けた箱の蓋を全部閉めろ。匂いを絶つ」"}, {"t": "p", "v": "「まかせて。蓋なら専門だ」"}, {"t": "p", "v": "横から抜けた一匹は、ひかりが素手で蹴り飛ばした。<br>スキルは使っていない。十四から坑育ちの、ただの蹴りだ。"}, {"t": "p", "v": "もう一匹が、俺の死角から来た。"}, {"t": "p", "v": "『自動防御・展開』<br>『残量　12.2％ → 11.8％』"}, {"t": "p", "v": "「ごめん、今のは無意識！」"}, {"t": "p", "v": "「知ってる。あんたのは、いつも無意識だ」"}, {"t": "p", "v": "蓋が閉まり、匂いが絶えると、群れは潮が引くように暗がりへ戻っていった。"}, {"t": "br"}, {"t": "p", "v": "「……ふう。準備運動にもならん」"}, {"t": "p", "v": "戸山ガクは笑って盾を下ろした。<br>地面に置く手が、少しだけ震えていた。"}, {"t": "p", "v": "「すごーい。四割でこれなんだ」"}, {"t": "p", "v": "「おうよ。全盛期は一晩中でも張れたがな」"}, {"t": "p", "v": "「四割かあ……」"}, {"t": "p", "v": "ひかりは自分の胸の上を、外套ごしに撫でた。"}, {"t": "p", "v": "「いいなあ、四割」"}, {"t": "p", "v": "俺だけが、両方の数字を知っている。<br>11.8の子が、10.6の男を、いいなあと言って笑っている。<br>笑って聞ける話じゃなかった。"}, {"t": "p", "v": "数字は10.6まで落ちた。<br>準備運動とやらで、0.4減った計算だ。<br>俺は口の中で数字を転がして、飲み込んだ。"}, {"t": "p", "v": "「戸山さん。仕事の話がある」"}, {"t": "p", "v": "「あ？」"}, {"t": "p", "v": "「この街道の箱を、あと二日で全部開ける。壁が要る。日当と、換金の二割でどうだ」"}, {"t": "p", "v": "「……ガキの使いにしちゃ、豪気な話だ」"}, {"t": "p", "v": "男は懐から手帳を出した。<br>挟んであったのは、銀行の振込の控えの束だった。"}, {"t": "p", "v": "「別居の娘がいる。月々の振込だけが、俺が親父でいられる証明でな。――乗った。二割、耳を揃えてもらうぞ」"}, {"t": "br"}, {"t": "p", "v": "午後は、ペンチの案内が効いた。"}, {"t": "p", "v": "「その子はだめ。蓋じゃなくて、底が口だよ」"}, {"t": "p", "v": "「……底？」"}, {"t": "p", "v": "言われて視ると、確かに錠は囮で、開閉の機構は底板に隠れていた。<br>ひっくり返して底から入ると、工程が九つも縮んだ。"}, {"t": "p", "v": "「兄弟のことは、なんでも知ってるんだ。えらい？」"}, {"t": "p", "v": "「えらい。台帳に『案内料』をつけてやる」"}, {"t": "p", "v": "「中身が増えた！」"}, {"t": "p", "v": "午後だけで、九つ開けた。"}, {"t": "p", "v": "『摩耗の欠片×２ を回収しました』<br>『摩耗の欠片×３ を回収しました』"}, {"t": "card", "v": "【純正部品カタログ】\n　所持：摩耗の欠片×33"}, {"t": "p", "v": "古銭も魔石も銀食器も、ペンチが飲み込んで運び、台帳は俺がつけた。"}, {"t": "p", "v": "「初日の中身だけで、換金六十万ってとこだ」"}, {"t": "p", "v": "「六十……！　四百万、見えてきた」"}, {"t": "p", "v": "ひかりが袋を抱えて笑う。<br>その横で、ガクが低く言った。"}, {"t": "p", "v": "「換金は競りを通せ。裏で捌くと買い叩かれる。……次の競りは四日後だ」"}, {"t": "p", "v": "四日後。<br>猶予の明ける日の、次の日だ。<br>数字の並びの悪さには、気づかないふりをした。"}, {"t": "br"}, {"t": "p", "v": "夜。焚き火を囲んだ。"}, {"t": "p", "v": "「ねえ、みんな。王様の話、していい？」"}, {"t": "p", "v": "ペンチが蓋をぱたぱた鳴らした。"}, {"t": "p", "v": "「この街道のいちばん奥に、最初の箱がいるんだ。誰にも、一度も開けられたことのない王様。兄弟はみんな、王様の子分の子分なんだよ」"}, {"t": "p", "v": "「中身は」"}, {"t": "p", "v": "「知らない。誰も知らない。でもね、蓋の隙間から――星の匂いがする」"}, {"t": "p", "v": "星という言葉に、俺は伝説級の必要部品の一行目を思い出していた。<br>星鋼×一。S級ダンジョンの最深部にしか出ないはずの金属。"}, {"t": "p", "v": "「……明日の朝、王様を開けに行く」"}, {"t": "p", "v": "「大将、王様は俺も知ってる。あれはやめとけ。近づいた奴が、腕ごと『消えた』って話だ」"}, {"t": "p", "v": "「罠が空間系ってことだろ。壊れ方さえ視えれば、道はある」"}, {"t": "p", "v": "ひかりは焚き火の横で、袋を枕に丸くなっていた。"}, {"t": "p", "v": "「ろくじゅう……あと、さんびゃくよんじゅう……」"}, {"t": "p", "v": "寝言まで金の勘定をしている。<br>起きている間は、一度も焦った顔を見せないくせに。"}, {"t": "br"}, {"t": "p", "v": "夜番は、ガクと半分ずつにした。<br>交代のとき、俺は男の隣に座った。<br>ひかりとペンチは、荷物の山の向こうで寝ている。"}, {"t": "p", "v": "「あんた、どうやって89まで行った」"}, {"t": "p", "v": "「……ん？　殿（しんがり）だよ」"}, {"t": "p", "v": "男は火に枝を足した。"}, {"t": "p", "v": "「攻略班の帰り道ってのはな、一番消耗した奴から死ぬ。だから俺が最後尾で壁を張る。十年それをやって、気づいたらこの数字だ」"}, {"t": "p", "v": "「後悔してる顔じゃないな」"}, {"t": "p", "v": "「俺の壁の内側で死んだ奴は、一人もいねえ。……ま、パーティは解散して、女房には逃げられたがな。はは」"}, {"t": "p", "v": "笑い話の顔で、笑い話じゃないことを言う男だった。<br>だから、こっちも聞くことにした。"}, {"t": "p", "v": "「四割って数字、どこで測った」"}, {"t": "p", "v": "「あ？　三年前の検定だが」"}, {"t": "p", "v": "「今は11だ。今日の壁で、10.6になった」"}, {"t": "p", "v": "薪の爆ぜる音だけが、しばらく続いた。"}, {"t": "p", "v": "「……何もんだ、お前」"}, {"t": "p", "v": "「修理屋だ。数字が視える。全部」"}, {"t": "p", "v": "「…………バラす気か」"}, {"t": "p", "v": "男の声から、酒場の陽気が抜け落ちた。"}, {"t": "p", "v": "「一割って知れたら、壁の仕事は二度と来ねえ。振込が止まる。娘の学費が」"}, {"t": "p", "v": "「客の数字は売らない」"}, {"t": "p", "v": "「俺は客じゃねえだろ」"}, {"t": "p", "v": "「もう預かり品だ。うちは、壊れた物を預かる店なんでね」"}, {"t": "p", "v": "ガクは火を見たまま、長いこと黙った。"}, {"t": "p", "v": "「それとな、戸山さん。減った耐久値は、戻せる。俺なら」"}, {"t": "p", "v": "「……はっ」"}, {"t": "p", "v": "信じていない笑い方だった。"}, {"t": "p", "v": "「その手の詐欺は、89になってから百回聞いたよ」"}, {"t": "p", "v": "「だろうな。なら、そのうち目の前で見せる」"}, {"t": "p", "v": "俺は立ち上がって、寝床に戻った。<br>背中で、男が小さく呟くのが聞こえた。"}, {"t": "p", "v": "「……百一回目だけ、妙に腹が立たねえな」"}, {"t": "p", "v": "寝床に転がって、岩の天井を見た。<br>四割の男と、十二パーセントの聖騎士と、空っぽの箱。<br>うちの預かり品は、揃いも揃って壊れ方が深い。"}, {"t": "p", "v": "明日は、王様だ。"}, {"t": "card", "v": "【執行猶予】残り３日\n【雨宮ひかり】残量：11.8％\n【戸山ガク】残量：10.6％──本人申告：四割"}], "chars": 3098}, {"title": "第6話　壊れた剣聖", "paras": [{"t": "p", "v": "街道の行き止まりは、広間になっていた。"}, {"t": "p", "v": "真ん中に、荷馬車ほどの箱が座っている。<br>黒い木肌に、銀の帯金。<br>蓋には、こじ開けようとした傷が一つもなかった。<br>誰も、そこまで届かなかったということだ。"}, {"t": "p", "v": "ペンチが蓋を鳴らして、深々と傾いた。最敬礼らしい。"}, {"t": "p", "v": "「王様だ」"}, {"t": "card", "v": "【宝箱・零号】\n　錠前：空間式──破損\n　罠：空間断裂──破損・活性\n　耐久値：0.4％\n　工程：19　　所要：約２時間"}, {"t": "p", "v": "「罠が生きてる。空間断裂――触る場所を間違えると、指ごと『どこか』へ持っていかれる」"}, {"t": "p", "v": "「どこかって、どこ」"}, {"t": "p", "v": "「分からないから『どこか』なんだ。腕ごと消えた奴の話と、辻褄は合う」"}, {"t": "p", "v": "「右の帯金の三枚目は、王様の急所だから触っちゃだめ。あと、挨拶は左の角からね。箱の礼儀作法はボクが知ってる」"}, {"t": "p", "v": "案内係の言う通りに、左の角から指を入れた。"}, {"t": "p", "v": "『工程１／19　断裂面・測量』"}, {"t": "p", "v": "歪んだ空間の縁を、指先でなぞっていく。<br>また0.1ミリの世界だ。ただし今度は、ずれた瞬間に指が『どこか』へ行く。"}, {"t": "p", "v": "「ガク。誰も俺に触るな。くしゃみもするな」"}, {"t": "p", "v": "「しねえよ。つうか息していいのか、俺は」"}, {"t": "p", "v": "『工程11／19　断裂面・縫合』"}, {"t": "p", "v": "破れた空間を、聖銀糸で繕うように閉じていく。<br>半分を過ぎたところで、断裂面が一度だけ大きく波打った。"}, {"t": "p", "v": "『⚠警告：跳ね返り』"}, {"t": "p", "v": "天井の岩が、砕けて降ってきた。"}, {"t": "p", "v": "『自動防御・展開』<br>『残量　11.8％ → 11.6％』"}, {"t": "p", "v": "白い盾が、俺とペンチの上に張られる。"}, {"t": "p", "v": "「ごめん！　でも今のは守るとこ！」"}, {"t": "p", "v": "「……ああ。今のは、助かった」"}, {"t": "p", "v": "『工程19／19　完了』"}, {"t": "p", "v": "錠の回る音が、鐘みたいに広間に響いた。"}, {"t": "p", "v": "『摩耗の欠片×３ を回収しました』"}, {"t": "p", "v": "蓋が、初めて開いた。"}, {"t": "br"}, {"t": "p", "v": "箱の底にあったのは、二つだけだった。"}, {"t": "p", "v": "夜をそのまま固めたような、黒い金属の塊がひとつ。<br>ヒビだらけの結晶がひとつ。"}, {"t": "card", "v": "【星鋼】×１\n【格納庫】　空間魔法・JOB結晶\n　耐久値：8.2％　　故障箇所：９"}, {"t": "p", "v": "「星鋼……本物か」"}, {"t": "p", "v": "S級の最深部にしか出ないはずの金属が、中層の箱の底で眠っていた。<br>誰が、いつ、何のために納めたのか。<br>考えても答えは出ない。今は使わせてもらうだけだ。"}, {"t": "p", "v": "ペンチは、震えていた。"}, {"t": "p", "v": "「王様は……空っぽじゃなかった。ずっと、こんな中身を守ってたんだ」"}, {"t": "p", "v": "「ああ。立派な箱だ」"}, {"t": "p", "v": "「……ボクも、なる。こういう箱に」"}, {"t": "p", "v": "「おい大将、そっちのヒビ玉はなんだ」"}, {"t": "p", "v": "「JOB結晶。【格納庫】――空間魔法だ。壊れてるがな」"}, {"t": "p", "v": "「JOBってのは人に宿るもんだろうが。なんで石で転がってる」"}, {"t": "p", "v": "「宿ってた奴から抜かれたか、最初から石なのか。……直せば分かるかもな」"}, {"t": "card", "v": "【純正部品カタログ】\n　所持：摩耗の欠片×36\n　購入：空間繋糸ほか３種……欠片８"}, {"t": "p", "v": "修理は一時間で済んだ。"}, {"t": "p", "v": "『修理完了　耐久値：81.5％』"}, {"t": "p", "v": "そして直った結晶は、勝手に喋った。"}, {"t": "p", "v": "『適合者ヲ確認──換装シマスカ？』"}, {"t": "p", "v": "「……換装？」"}, {"t": "p", "v": "試しにガクが握っても、結晶は黙ったままだった。ひかりでも同じだ。"}, {"t": "p", "v": "「正規のJOB持ちには、反応しないらしい」"}, {"t": "p", "v": "「なんでお前だけ」"}, {"t": "p", "v": "「さあな」"}, {"t": "p", "v": "俺が握ると、結晶は掌に沈んだ。氷が溶けるみたいに、するりと。"}, {"t": "card", "v": "【換装】１／２\n　装着：【格納庫】"}, {"t": "p", "v": "念じると、何もない空中に扉が立った。<br>開けた中は、倉庫ほどの部屋だった。棚があり、作業台まである。"}, {"t": "p", "v": "持ち歩ける工房。<br>ただし、タダではなかった。"}, {"t": "card", "v": "【格納庫】展開中\n　維持費：装着者ノ摩耗\n　【修理屋】摩耗率：0.0％ → 0.2％"}, {"t": "p", "v": "「……へえ。俺も、減るのか」"}, {"t": "p", "v": "生まれて初めて、自分の摩耗率を見た。<br>三年間、人の数字ばかり見てきて、直す側は減らないものだと、どこかで思い込んでいた。"}, {"t": "p", "v": "「よくないよ、それ」"}, {"t": "p", "v": "覗き込んだひかりの声が、珍しく硬かった。"}, {"t": "p", "v": "「減るのがどういうことかは、私が一番知ってるの。長居、禁止。荷物を入れたら閉める。いいね？」"}, {"t": "p", "v": "「……ああ。約束する」"}, {"t": "p", "v": "宝の袋と星鋼を棚に移して、扉を閉じた。<br>競りは四日後。それまで、中身はここで寝かせる。"}, {"t": "p", "v": "移し替えの途中、ペンチが換金袋をひとつ飲み込んで、ガクに怒鳴られていた。"}, {"t": "p", "v": "「これはボクの中身！」"}, {"t": "p", "v": "「売上だっつってんだろ！」"}, {"t": "p", "v": "取り返すのは諦めた。あの蓋は、一度飲むと開かない。"}, {"t": "br"}, {"t": "p", "v": "店に戻ったのは昼過ぎ。<br>そこから夜まで、俺は作業台で伝説級と向き合った。"}, {"t": "p", "v": "星鋼がある。原初の油がある。残りの部品はカタログで買える。"}, {"t": "card", "v": "　所持：摩耗の欠片×28\n　購入：剣聖用部品28種……欠片24\n　残：４"}, {"t": "p", "v": "二日で稼いだ欠片が、ほとんど溶けた。<br>二度目だ。もう慣れた。"}, {"t": "p", "v": "百二十七の工程を、指で一つずつ潰していく。"}, {"t": "p", "v": "『工程64／127　中枢・星鋼鍛接』"}, {"t": "p", "v": "星鋼は、指の下で驚くほど素直に馴染んだ。"}, {"t": "p", "v": "『工程88／127　原初の油・注油』"}, {"t": "p", "v": "夜八時を回ったあたりで、一度だけ手が止まった。"}, {"t": "p", "v": "『⚠警告：柄糸・張力超過』<br>『耐久値　61.0％ → 60.2％』"}, {"t": "p", "v": "「…………」"}, {"t": "p", "v": "巻き直す。締めすぎた糸を、0.1ずつ緩めて、張り直す。<br>湯沸かしも、聖騎士も、伝説級も、やることは同じだ。<br>壊れた場所を探して、部品を替えて、締め直す。"}, {"t": "p", "v": "『工程119／127　刃筋・調律』"}, {"t": "p", "v": "時計が夜の十一時を回った。"}, {"t": "p", "v": "『工程127／127　銘板再生』"}, {"t": "card", "v": "【剣聖】　等級：伝説級\n　耐久値：68.4％\n　製造元：第七工房\n　⚠慣らし運転：出力50％制限\n　　（解除まで14日）"}, {"t": "p", "v": "剣聖。<br>名前まで直って――そして三たび、あの銘が出た。<br>第七工房。"}, {"t": "p", "v": "「ひかり。こいつ、あんたの聖騎士と同じ工場の生まれだ」"}, {"t": "p", "v": "「え、ほんと？　じゃあ、きょうだいだ」"}, {"t": "p", "v": "「その工場がどこの何なのかは、相変わらず分からんがな」"}, {"t": "p", "v": "裏の空き地で、換装を試した。"}, {"t": "card", "v": "【換装】２／２\n　装着：【格納庫】【剣聖】"}, {"t": "p", "v": "右手に、握った覚えのない重みが生まれた。<br>白い光の刀身が、夜の空き地を照らす。"}, {"t": "p", "v": "積んであった廃材に向けて、振る。<br>白い斬撃が飛んで――十五歩で、霧みたいにほどけて消えた。"}, {"t": "p", "v": "「……なるほどな」"}, {"t": "p", "v": "出力五割。慣らしが明けるまで、飛ぶ斬撃は十五歩で失速する。<br>俺の射程は、ゼロから十五歩になっただけだ。"}, {"t": "p", "v": "「二週間後が楽しみだねえ、大将」"}, {"t": "p", "v": "「二週間後、な」"}, {"t": "p", "v": "猶予は、あと二日しかない。"}, {"t": "br"}, {"t": "p", "v": "店に戻ると、閉めたはずの扉の前に、男が立っていた。<br>乾だった。"}, {"t": "p", "v": "「執行官どの。うちに修理の用でも？」"}, {"t": "p", "v": "「本部は部隊を組んだ。十二人。執行日の朝に来る」"}, {"t": "p", "v": "乾は俺を見ずに、それだけ言った。"}, {"t": "p", "v": "「観察指定は、俺の具申ごと却下された。……逃げるなら、今夜だ」"}, {"t": "p", "v": "「あんたが、それを言うのか」"}, {"t": "p", "v": "「断鋼の借りは返す主義だ。これで貸し借りなしだ」"}, {"t": "p", "v": "乾は路地の闇に消えた。"}, {"t": "p", "v": "「逃げないよ」"}, {"t": "p", "v": "ひかりが、先に言った。"}, {"t": "p", "v": "「あかりの病院、この街だもん。逃げたら手配が回って、坑にも潜れない。潜れなかったら、稼げない」"}, {"t": "p", "v": "「……だろうな」"}, {"t": "p", "v": "「おい待て。執行部隊？　大将、嬢ちゃんは何をやらかした」"}, {"t": "p", "v": "「何も。壊れてるだけだ」"}, {"t": "p", "v": "ガクは俺とひかりを順に見て、盾を店の壁に立てかけた。"}, {"t": "p", "v": "「……そうかよ。なら、精算が済むまで俺はここの警備だ。壁は商売だからな」"}, {"t": "p", "v": "「あんたの残りで言う台詞じゃない」"}, {"t": "p", "v": "「四割ありゃ上等なんだよ」"}, {"t": "p", "v": "嘘の数字を、男はまだ下ろす気がないらしい。"}, {"t": "p", "v": "俺は、自分の手札を数えた。<br>換装が二基。斬撃の射程、十五歩。慣らし明けまで十二日。相手は十二人。<br>足りるかは分からない。だが、他に並べられる札もなかった。"}, {"t": "p", "v": "「ね、修くん」"}, {"t": "p", "v": "店の灯りの下で、ひかりが振り返った。"}, {"t": "p", "v": "「明後日が終わったら、ごはんの炊き方、もう一回教えて。水の量で、まだ負けてるから」"}, {"t": "p", "v": "「……ああ。何回でも」"}, {"t": "card", "v": "【執行猶予】残り２日\n【雨宮ひかり】残量：11.6％"}], "chars": 3099}, {"title": "第7話　執行", "paras": [{"t": "p", "v": "最後の一日は、嘘みたいに静かに過ぎた。<br>そして、朝が来た。"}, {"t": "card", "v": "【執行猶予】──満了"}, {"t": "p", "v": "台所から、湯気の匂いがした。焦げていない匂いだ。"}, {"t": "p", "v": "「見て」"}, {"t": "p", "v": "ひかりが差し出した茶碗の中で、飯が白く立っていた。"}, {"t": "p", "v": "「炊けた。初めて、ちゃんと」"}, {"t": "p", "v": "「……炊けてるな」"}, {"t": "p", "v": "「水の量に勝った」"}, {"t": "p", "v": "三人と一箱で、黙って朝飯を食った。ガクは三杯 ": "隊員の一人が、路地の隅のペンチを蹴った。<br>ペンチは鳴かなかった。<br>ただの壊れた箱の顔で、ごろりと転がった。"}, {"t": "br"}, {"t": "p", "v": "連行の列が動き出す前に、ひかりは一度だけ振り返った。"}, {"t": "p", "v": "「修くん、手、出して」"}, {"t": "p", "v": "縫われていない方の手を出すと、掌に冷たい小銭が落ちた。"}, {"t": "p", "v": "五十円玉だった。"}, {"t": "p", "v": "「賭け、半分は私の勝ちだったから。半分だけ払っとく」"}, {"t": "p", "v": "「……おい」"}, {"t": "p", "v": "「残りの五十円は」"}, {"t": "p", "v": "ひかりは笑った。最初の日と同じ、きれいな笑い方だった。"}, {"t": "p", "v": "「取りに来て」"}, {"t": "p", "v": "白い外套が、制服の列に呑まれていく。"}, {"t": "p", "v": "「ごはん、もう炊けるから！　私、どこでも生きていけるよ！」"}, {"t": "p", "v": "それが、聞こえた最後だった。"}, {"t": "p", "v": "「非認可営業と執行妨害の処分は、追って通知する」"}, {"t": "p", "v": "部隊長は、道の石ころを見る目で俺を一瞥して、列の先頭に戻った。<br>乾は、最後まで俺を見なかった。"}, {"t": "br"}, {"t": "p", "v": "部隊の足音が消えて、路地は静かになった。"}, {"t": "p", "v": "入り口に、近所のガキが一人立っていた。湯沸かしのガキだ。<br>何か言いかけて、やめて、走って消えた。"}, {"t": "p", "v": "視界のカードが、ひとつ消えた。"}, {"t": "card", "v": "【執行猶予】──終了\n【雨宮ひかり】──表示対象なし"}, {"t": "p", "v": "光の杭は、昼前に勝手に消えた。<br>俺は路地に座り込んだまま、動けなかった。"}, {"t": "p", "v": "ガクの息はある。ペンチも無事だ。店も焼けていない。<br>真ん中だけが、空だった。"}, {"t": "p", "v": "負けた。"}, {"t": "p", "v": "慣らし不足と、射程ゼロ。<br>分かっていた弱点で、分かっていた通りに負けた。<br>言い訳に使える数字は、ひとつもない。"}, {"t": "p", "v": "表通りのほうから、大型ビジョンの音が流れてくる。<br>今日もどこかの坑で、誰かの残量が減っている。<br>八年前から、この世界はずっとそういう作りだ。<br>分かっていたはずだった。"}, {"t": "p", "v": "掌の中で、五十円玉だけが、まだ温かかった。"}], "chars": 3112}, {"title": "第8話　二個一", "paras": [{"t": "p", "v": "三日が過ぎた。"}, {"t": "p", "v": "処分は、紙で来た。<br>『非認可整備業の即時廃業を命ずる。業務用工具は十日後に接収する』<br>役所は、俺の商売道具の置き場所まで知っていた。"}, {"t": "p", "v": "店の奥では、ガクがまだ眠っている。摩耗率89.9のまま、三日。息はあるが、それだけだ。<br>ペンチは店の隅で、本当に壊れた箱みたいに黙っていた。<br>棚の上に、五十円玉が一枚。"}, {"t": "p", "v": "そして視界の隅には、空白のカードが開いたまま、消えない。"}, {"t": "card", "v": "【雨宮ひかり】──表示対象なし"}, {"t": "p", "v": "数字の視えない三日は、生まれて初めてだった。"}, {"t": "br"}, {"t": "p", "v": "昼前に、扉が勝手に開いた。"}, {"t": "p", "v": "「うわ、貧乏くさい店。看板もない」"}, {"t": "p", "v": "白衣を着崩した女だった。腰の帯に、薬瓶がずらりと並んでいる。"}, {"t": "card", "v": "【薬師】　Ｄ級・支援型\n　摩耗率：12.4％\n　整備状態：自己流"}, {"t": "p", "v": "「九条いろは。部品と、材料と、仕事の世話をしてる。世間じゃ闇のブローカーって呼び方ね。……で、あんたが『戻せる』って噂の修理屋くん？」"}, {"t": "p", "v": "「噂の出どころは」"}, {"t": "p", "v": "「執行部隊の中 : "p", "v": "「載った。ただし刃は道の終わりで死ぬ。消耗もこれだ。実戦で保って、五発」"}, {"t": "p", "v": "「五発ね。足りない分は、段取りの側で吸収して」"}, {"t": "br"}, {"t": "p", "v": "夜。ガクの枕元で、闇部品の箱を開けた。"}, {"t": "card", "v": "【重戦士】　Ｂ級\n　摩耗率：89.9％　残量：10.1％\n　故障箇所：41　　工程：86"}, {"t": "p", "v": "「戻すところ、見せてもらうよ。手形の担保だから」"}, {"t": "p", "v": "「見て盗めるなら、とっくに認可工房が盗んでる」"}, {"t": "p", "v": "眠っている男の胸に、指を置いた。"}, {"t": "p", "v": "『工程１／86　中枢・洗浄』"}, {"t": "p", "v": "先は長い。夜は、もっと長い。"}, {"t": "p", "v": "窓辺で、いろはが言った。"}, {"t": "p", "v": "「明日の夜。あんたは、箱の中身になる」"}, {"t": "card", "v": "【摘出予定】明後日・朝\n【摩耗の欠片】残３\n【雨宮ひかり】──表示対象なし"}], "chars": 3075}, {"title": "第9話　読み込み中", "paras": [{"t": "p", "v": "朝、店の奥で、椀の割れる音がした。"}, {"t": "p", "v": "ガクが、立っていた。<br>自分の両手を、開いたり、閉じたりしている。"}, {"t": "card", "v": "【重戦士】　Ｂ級\n　摩耗率：60.0％　残量：40.0％\n　整備状態：良好"}, {"t": "p", "v": "「あんたの嘘に、現実の方を合わせておいた。三年分の整備不足と、部品の欠けが41箇所。設計は無事だったから、そこまで戻った」"}, {"t": "p", "v": "「……詐欺じゃ、なかったのか」"}, {"t": "p", "v": "「百一回目だって言っただろ」"}, {"t": "p", "v": "男は割れた椀を拾いかけて、やめて、もう一度、掌を見た。"}, {"t": "p", "v": "「四割ある。……今度は、本当だ」"}, {"t": "p", "v": "それから、眠っていた間の話を全部聞いて、男は一度だけ、低い声になった。"}, {"t": "p", "v": "「嬢ちゃんは、俺の壁の内側から連れて行かれた。内側の人間をさらわれたのは、十年で初めてなんだ」"}, {"t": "p", "v": "「取り返しに行く。壁の商売、続きだ」"}, {"t": "p", "v": "「日当は」"}, {"t": "p", "v": "「出世払いで」"}, {"t": "p", "v": "「はっ。……乗った」"}, {"t": "br"}, {"t": "p", "v": "昼飯は、俺が炊いた。<br>三年間、毎日炊いてきた飯だ。失敗のしようがない。<br>炊けた飯は白く立って、どこにも文句のない出来で、なぜか、うまくなかった。"}, {"t": "p", "v": "ガクは三杯食って、茶碗を置いた。"}, {"t": "p", "v": "「……足りねえのは、米の味じゃねえな」"}, {"t": "p", "v": "「黙って食え」"}, {"t": "br"}, {"t": "p", "v": "夕方、店の土間に、いろはが図面を広げた。<br>封印庫の間取りだ。こんな物まで、金で買えるらしい。"}, {"t": "p", "v": "「荷馬車は、夜に裏門へ入る。管理官への納品。月に二度の、闇のお得意便。今夜は『未登録の危険物』をひとつ、余分に納める」"}, {"t": "p", "v": "それが、ペンチだ。中身は、工具袋を抱えた俺。<br>ガクは人足の格好で箱を担ぎ、いろはは帳簿と口を担当する。"}, {"t": "p", "v": "「摘出室は地下の二階。夜勤は守衛が四人と、管理官が一人。……あそこの夜勤は全員、横流しの分け前を受け取ってる。騒がれても困るのは向こうも同じ」"}, {"t": "p", "v": "「連れ出すだけじゃ駄目。槽には代わりの結晶を一本置く。台帳に『摘出済み』を残せなきゃ、朝には街中へ手配が回る」<br>「同じ型があるのか」<br>「そこまでは知らない。中で探して」"}, {"t": "p", "v": "「その管理官ってのは、何者だ」"}, {"t": "p", "v": "「知らない」"}, {"t": "p", "v": "即答だった。"}, {"t": "p", "v": "「五年商売して、等級も、JOBの名前も、聞けたことがない。……私が知らないってことはね、修理屋くん。売り物になってない、ってこと」"}, {"t": "p", "v": "何でも金に換える女が、値札を付けられない男。<br>それだけ聞ければ、警戒としては十分だった。"}, {"t": "p", "v": "「言っとくけど、中で捕まっても、私は今夜の記憶がないから」"}, {"t": "p", "v": "「知ってる。道具は使い潰すんだろ」"}, {"t": "p", "v": "「話が早くて助かる」"}, {"t": "br"}, {"t": "p", "v": "箱の中は、外から見るより広かった。それでも、膝を抱える広さだ。<br>車輪の音に混ざって、ペンチの声だけが近い。"}, {"t": "p", "v": "「修、心臓の音が速いよ」"}, {"t": "p", "v": "「箱の中は専門外なんだ」"}, {"t": "p", "v": "「ボクは箱の専門家だよ。だいじょうぶ。中身は、ボクが守るものなんだ」"}, {"t": "p", "v": "蓋の裏で、専門家は少し黙ってから、付け足した。"}, {"t": "p", "v": "「ボク、ずっと空っぽって笑われてた。今夜のボク、街道でいちばん中身のある箱だと思う」"}, {"t": "p", "v": "裏門で、車輪が止まった。<br>守衛の声。台帳をめくる音。"}, {"t": "p", "v": "「――未登録品？　聞いてないな」"}, {"t": "p", "v": "「管理官どのの直伝票。裏を見て」"}, {"t": "p", "v": "紙の音。それから、足音がこっちへ来た。<br>蓋を、こつこつと二度叩かれる。<br>ペンチは鳴かない。俺は息を止める。工具袋だけ、抱え直すこともできない。"}, {"t": "p", "v": "「開けてみるか？」"}, {"t": "p", "v": "「どうぞ。開けた人から順に、未登録の呪いがつくけど」"}, {"t": "p", "v": "いろはの声は、あくびの混ざった声だった。<br>足音が、離れた。<br>金の通る音というのは、静かだ。<br>車輪が、敷居を越えた。"}, {"t": "br"}, {"t": "p", "v": "蓋が開くと、天井の高い搬入庫だった。"}, {"t": "p", "v": "鉄の棚。鉄の梁。鉄の床。<br>どこを見ても、道だらけだ。"}, {"t": "p", "v": "ガクが箱を降ろして、首を回した。"}, {"t": "p", "v": "「で、嬢ちゃんはどこだ」"}, {"t": "p", "v": "そのとき、視界の隅で、三日間空白だったカードに灯が点いた。"}, {"t": "card", "v": "【雨宮ひかり】\n　残量：10.4％"}, {"t": "p", "v": "生きてる。<br>数字が視えるだけで、膝の力が抜けそうになった。"}, {"t": "p", "v": "そして、見ている間に数字が動いた。"}, {"t": "p", "v": "『10.4％ → 10.3％』"}, {"t": "p", "v": "静置槽とやらの中でも、あの自動防御は律儀に仕事をしている。検査の針の一本にまで反応して、減る。<br>本人はきっと、眠ったままだ。"}, {"t": "p", "v": "「急ぐ。奥だ」"}, {"t": "br"}, {"t": "p", "v": "通路の角で、守衛が二人、こちらに気づいた。"}, {"t": "p", "v": "警棒に光が灯るより先に、俺は棚の縁に剣聖の刃を這わせた。<br>白い斬撃が鉄の棚を道にして曲がり、二人の警棒だけを根元から刈る。"}, {"t": "p", "v": "『【剣聖】68.2％ → 68.0％』<br>『【磁手】40.6％ → 40.4％』"}, {"t": "p", "v": "残り、四発。"}, {"t": "p", "v": "得物を失くした二人はガクが盾で壁に押さえ、俺がいろはの眠り薬を嗅がせた。"}, {"t": "p", "v": "「殺さねえのか」"}, {"t": "p", "v": "「バラすのと直すのが商売でね。壊すのは専門外だ」"}, {"t": "p", "v": "地下二階へ降りる階段の前は、鉄の隔壁で塞がっていた。<br>錠は電気式。しかも、視るまでもなく傾いでいる。"}, {"t": "card", "v": "【隔壁錠・地下二階】\n　故障：かんぬき歪み\n　工程：２　　所要：３分"}, {"t": "p", "v": "「開かねえぞ。壊すか？」"}, {"t": "p", "v": "「壊した錠は開かない。直した錠は開く」"}, {"t": "p", "v": "歪んだかんぬきを撫でて、まっすぐに戻す。<br>錠は礼を言うみたいに軽い音を立てて、回った。"}, {"t": "p", "v": "『摩耗の欠片×１ を回収しました』"}, {"t": "p", "v": "「……役所の錠を直して、小遣いまで貰いやがった」"}, {"t": "br"}, {"t": "p", "v": "摘出室の扉は、開いていた。"}, {"t": "p", "v": "中心に、棺桶を立てたような硝子の槽。<br>白い外套が、その中で目を閉じていた。<br>髪が、少しだけ伸びていた。"}, {"t": "p", "v": "槽の脇の札には、名前がなかった。<br>『処理番号　1173』<br>それだけだ。四百万を稼ごうとした子の名前は、この部屋ではもう番号だった。"}, {"t": "p", "v": "硝子に手を伸ばしかけて、止めた。<br>腕の形の機械が三本、槽を囲んでいる。順番を間違えれば、検査の針が動いて、また彼女が減る。<br>触りたい物から触るな。壊れ物の周りでは、いつもの手順でやる。"}, {"t": "p", "v": "まず、あの三本腕――摘出の装置の方を、触るより先に視た。"}, {"t": "card", "v": "【封印処理装置・三号機】\n　用途：枠内対象のJOB強制停止\n　故障箇所：３\n　工程：23　　所要：40分"}, {"t": "p", "v": "役所の物まで、壊れかけだ。<br>この世界で摩耗しないのは、制度だけらしい。"}, {"t": "p", "v": "枠、というのは、槽の手前の床に白く縁取られた、一畳ほどの区画だった。三本腕は、その枠に立った体のJOBを止める。硝子の中で眠るひかりではなく、枠に立つ者を読む――そういう装置だ。枠までは、鉄の床が続いている。<br>壊れているなら、直せる。中へ押し込めるなら――使える。"}, {"t": "p", "v": "そこまでだった。"}, {"t": "p", "v": "廊下の照明が、順に落ちて、また点いた。<br>さっき取り逃がした守衛が一人、角の向こうから走ってきて――摘出室の手前で、縫い付けられたように止まった。<br>俺たちを見て、それから俺たちの後ろを見て、後ずさりのまま消えた。"}, {"t": "p", "v": "追っている側が、逃げた。"}, {"t": "p", "v": "ペンチの蓋が、音もなく閉じた。<br>執行部隊に蹴られても平気で転がっていた箱が、今は継ぎ目まで消して、ただの古箱になりきっている。"}, {"t": "p", "v": "「……修。あれは、開けちゃいけない何かだよ」"}, {"t": "p", "v": "蓋の隙間から、それだけ言って、ペンチは黙った。"}, {"t": "br"}, {"t": "p", "v": "足音は、静かだった。"}, {"t": "p", "v": "白い手袋。制服ではなく、白衣に近い上着。年齢の分からない顔。<br>男が敷居をまたいだ瞬間、俺のUIが、生まれて初めて詰まった。"}, {"t": "card", "v": "【読み込み中……】"}, {"t": "p", "v": "Ｓ級も、Ａ級も、視れば数字は出た。<br>伝説級ですら、測定不能なら測定不能と出た。<br>出ない、は初めてだ。"}, {"t": "p", "v": "枠だけが開いて、中身がいつまでも埋まらないカードを――見えているはずのないそれを、男はちらりと目で追った。"}, {"t": "p", "v": "「夜分の納品は、裏門まででお願いしているのですが」"}, {"t": "p", "v": "役所の窓口よりも丁寧で、柔らかい声だった。"}, {"t": "p", "v": "「それとも」"}, {"t": "p", "v": "男は、槽と俺を順に見た。"}, {"t": "p", "v": "「返却の窓口をお探しですか。――ここは、返さない場所ですよ」"}, {"t": "p", "v": "ガクが無言で前に出て、盾を構えた。<br>四割の男の首筋が、汗で光っていた。<br>鉄喰いの群れにも、執行部隊の杭にも、この男は軽口を叩きながら立った。<br>その口が、今は閉じている。"}, {"t": "p", "v": "「……おい大将。段取りとやらは、こいつも勘定に入ってんだろうな」"}, {"t": "p", "v": "「入ってない」"}, {"t": "p", "v": "「だろうな！」"}, {"t": "p", "v": "カードは、まだ回っている。"}, {"t": "card", "v": "【読み込み中……】\n【雨宮ひかり】残量：10.3％\n【摘出処理】明朝"}], "chars": 3180}, {"title": "第10話　取りに来た", "paras": [{"t": "p", "v": "先に動いたのは、こっちだ。"}, {"t": "p", "v": "「ペンチ、槽の前！」"}, {"t": "p", "v": "古箱が滑って、硝子の槽と男の間に割り込む。<br>同時に、棚の縁と天井の梁、二本の道に刃を載せて、左右から白い斬撃を曲げた。"}, {"t": "p", "v": "男は、避けなかった。<br>二本の斬撃は、男の一歩手前で霧になった。十五歩、まだ余っている間合いでだ。<br>斬った感触も、防がれた音もない。ただ、届く寸前で終わった。"}, {"t": "p", "v": "残り、二発。"}, {"t": "p", "v": "「整備不良ですか」"}, {"t": "p", "v": "男が半歩、踏み出す。それだけで部屋の空気が重くなった。<br>分かったことは一つ。あの男に、刃の話は通じない。<br>なら、話を変える。俺の商売の話にだ。"}, {"t": "p", "v": "「大将、段取りは！」"}, {"t": "p", "v": "「装置を直す。見積もり四十分！」"}, {"t": "p", "v": "「長えよ！」"}, {"t": "p", "v": "言いながら、ガクは笑って、扉の幅いっぱいに壁を張った。"}, {"t": "p", "v": "『【重戦士】固有・城壁　展開』<br>『摩耗率　60.0％ → 60.2％』"}, {"t": "p", "v": "「壁は俺の商売だ。今夜は、積んである分で張る」"}, {"t": "br"}, {"t": "p", "v": "四十分の工程を、手順を削らずに縮める方法は一つしかない。同時にやることだ。<br>分解は左手、洗浄は右手。検査の工程は、計測器の代わりに俺の目でやる。<br>見積もりは、十二分まで縮んだ。"}, {"t": "p", "v": "『工程１／23　制御弁・分解』"}, {"t": "p", "v": "背中で、鈍い音が続く。<br>男が素手で壁を叩いている音だと、考えないことにした。"}, {"t": "p", "v": "『60.2％ → 60.5％』<br>『【雨宮ひかり】10.3％ → 10.2％』"}, {"t": "p", "v": "槽の検査針は、この最中も彼女を減らしている。急ぐ理由が、また一つ増えた。"}, {"t": "p", "v": "工程九。折れた圧力弁は、部品ごと死んでいた。"}, {"t": "card", "v": "【純正部品カタログ】\n　購入：圧力弁……欠片４\n　所持：摩耗の欠片×０"}, {"t": "p", "v": "この五日で直した物から受け取った、最後の四枚だった。<br>金では買えない部品を、他人を直した分だけで買う。この瞬間のために貯めてきたのだと、思うことにした。"}, {"t": "p", "v": "『工程14／23　圧力弁・交換』"}, {"t": "p", "v": "壁の端が欠けて、白い破片が散った。"}, {"t": "p", "v": "「ガク！」"}, {"t": "p", "v": "「喋るな！　手が遅れる！」"}, {"t": "p", "v": "盾を握り直す音がして、男はそれでも軽口を続けた。"}, {"t": "p", "v": "「四割ってのはな、大将。……使い出があるんだよ。ケチケチしねえで済む」"}, {"t": "p", "v": "十年、殿を務めた男が、初めて残量を気にせずに張る壁だった。<br>壊してたまるかと思った。壁も、この夜も。"}, {"t": "p", "v": "『60.5％ → 60.9％』<br>『【雨宮ひかり】10.2％ → 10.1％』"}, {"t": "p", "v": "工程二十。二十一。二十二。<br>白手袋の指が、壁を突き破って、こちらへ伸びた。"}, {"t": "p", "v": "『工程23／23　完了』<br>『修理完了』<br>『摩耗の欠片×２ を回収しました』"}, {"t": "p", "v": "役所の装置を直して、欠片が湧いた。笑う場面じゃないのに、少し笑った。"}, {"t": "p", "v": "「ガク、退け！　磁手！」"}, {"t": "p", "v": "壁が解けると同時に、男の上着の釦、帯の金具、その全部を掴んで、摘出の枠の中心へ引いた。<br>磁力で半歩。ガクの盾の面が、もう半歩。<br>踏み出しかけていた男の体が、枠の内側に入った。"}, {"t": "p", "v": "『封印処理・三号機　起動』<br>『対象：読み込み中──強制停止』"}, {"t": "p", "v": "腕の形の機械が三本、白手袋の男を掴んで、止めた。"}, {"t": "p", "v": "スキルを強制で止めるための装置だ。この国で一番、行儀の悪い客に慣れている機械でもある。<br>直したばかりの三号機は、実に良い仕事をした。"}, {"t": "p", "v": "男は、暴れなかった。<br>枠の中から、俺だけを見た。"}, {"t": "p", "v": "「【修理屋】……そうですか。七番目は、まだ――」"}, {"t": "p", "v": "機械の腕が閉じて、続きは聞こえなかった。<br>七番目。<br>聞き返す相手は、もう止まっていた。"}, {"t": "p", "v": "部屋が静かになると、ガクが盾を下ろして、その場に尻餅をついた。"}, {"t": "p", "v": "「……なあ大将。俺は今、何と殴り合ってたんだ」"}, {"t": "p", "v": "「分からん。俺にも、最後まで数字が視えなかった」"}, {"t": "br"}, {"t": "p", "v": "槽の錠は、俺の指で十秒だった。"}, {"t": "p", "v": "硝子が開いて、白い外套が腕の中に落ちてくる。<br>薄く、目が開いた。"}, {"t": "p", "v": "「……夢にしては」"}, {"t": "p", "v": "「ん？」"}, {"t": "p", "v": "「手が、油くさい」"}, {"t": "p", "v": "「現実で悪かったな」"}, {"t": "p", "v": "ひかりは俺の肩越しに、枠に止められた男と、座り込んだガクと、蓋を鳴らすペンチを順に見て、最後に笑った。"}, {"t": "p", "v": "「お迎え、来ちゃった」"}, {"t": "p", "v": "「客を取りに来ただけだ」"}, {"t": "p", "v": "それから、彼女の前に掌を開いて差し出した。"}, {"t": "p", "v": "「それと――残りの五十円、取りに来た。賭けの残金だ。耳を揃えてもらう」"}, {"t": "p", "v": "ひかりは外套の上から自分の懐を二度叩いて、笑って両手を上げた。"}, {"t": "p", "v": "「ごめん。手持ちが、ない」"}, {"t": "p", "v": "「なら働いて返せ。うちの預かり品に戻って、だ。利子は取らない」"}, {"t": "p", "v": "「……うん。ただいま、修くん」"}, {"t": "p", "v": "その場で、応急をやった。摘出用の台は、皮肉なことに、うちの作業台より上等だった。"}, {"t": "card", "v": "【聖騎士】応急整備\n　使用部品：闇部品──聖騎士用\n　工程：31"}, {"t": "p", "v": "闇部品は、気味が悪いほど彼女の聖騎士に合った。削り合わせが、ほとんど要らない。<br>その意味を考えるのは、後回しにした。"}, {"t": "p", "v": "『残量　10.1％ → 16.0％』"}, {"t": "p", "v": "「……増えた」"}, {"t": "p", "v": "ひかりは表示を見上げて、しばらく黙った。"}, {"t": "p", "v": "「『まだ』って言わなくていいの、初めてかも」"}, {"t": "br"}, {"t": "p", "v": "搬入庫への戻り道、収蔵の棚に、見覚えのある結晶と袋があった。"}, {"t": "card", "v": "【格納庫】　耐久値：81.5％\n　収蔵札：未登録危険物"}, {"t": "p", "v": "換金前の百万と、星鋼の残りも、袋ごと無事だった。役所は仕事が丁寧で、助かる。"}, {"t": "p", "v": "「ぜんぶボクが飲む！　ボクは出せる箱だから、飲み放題なんだ」"}, {"t": "p", "v": "最後の仕事が残っていた。いろはの言伝だ。<br>――身代わりの結晶を一つ、槽に置いてくること。型が近いほどいい。台帳の上で、それが「雨宮ひかり」になる。"}, {"t": "p", "v": "聖騎士の型なんて、そう転がって――"}, {"t": "p", "v": "収蔵棚の、一番奥の扉を開けた。"}, {"t": "p", "v": "あった。<br>というより、並んでいた。"}, {"t": "p", "v": "壁一面の棚に、同じ形の結晶が、同じ向きで、ずらりと差してある。<br>一つ、視た。"}, {"t": "card", "v": "【聖騎士】　Ｓ級\n　製造元：第七工房\n　No.077"}, {"t": "p", "v": "隣は、No.078。その隣は、No.079。<br>段が変わっても、続いていた。百まで数えて、やめた。<br>全部、聖騎士だった。全部、第七工房だった。"}, {"t": "p", "v": "ひかりが、俺の袖を掴んだ。"}, {"t": "p", "v": "「……ねえ、修くん。これ」"}, {"t": "p", "v": "自分の胸の上を押さえて、それから、棚を見る。"}, {"t": "p", "v": "「ぜんぶ、私と、同じ？」"}, {"t": "p", "v": "答えられなかった。<br>彼女の中の結晶と、棚の一本の区別が、俺の診断でも付かなかった。"}, {"t": "p", "v": "一本抜いて、槽に置いた。<br>身代わりなら、いくらでも利く棚だった。そのことが、一番怖かった。"}, {"t": "br"}, {"t": "p", "v": "帰りの荷馬車の上で、夜が明けた。"}, {"t": "p", "v": "「管理官は喋らない。喋れば、自分の商売ごと沈むから。台帳の上では、今夜は何もなかった」と、御者台のいろは。"}, {"t": "p", "v": "「あんたも今朝から『摘出済み』。追手は来ない。代わりに、表の坑にはもう潜れないけど」"}, {"t": "p", "v": "「じゃあ、裏に潜る」"}, {"t": "p", "v": "ひかりは即答して、袋を枕に、もう半分眠っていた。<br>四百万は、まだ遠い。だが在庫の百万は戻り、換金の口は御者台で手綱を握っている。道は、細いが切れていない。"}, {"t": "p", "v": "ガクは荷台の隅で、手帳に挟んだ振込の控えを親指でめくって、閉じた。"}, {"t": "p", "v": "「四割ありゃ、まだ何年でも張れる。……振込は、止めねえで済みそうだ」"}, {"t": "p", "v": "店の工具は、あと八日で取り上げられる。廃業命令も、そのままだ。<br>構わなかった。うちの商売は、最初から認可の外にある。"}, {"t": "p", "v": "勝った、はずだった。<br>取り返す物は取り返した。届ける物は届けた。"}, {"t": "p", "v": "それでも頭の中には、あの棚が並んだままだ。"}, {"t": "p", "v": "八年前、誰かが人類にスキルを配った。<br>違う。<br>配ったんじゃない。あれは――作って、卸してる。<br>工場は今も、どこかで動いている。"}, {"t": "p", "v": "御者台のいろはが、振り向かずに言った。"}, {"t": "p", "v": "「で。奥の棚には、何が並んでた？」"}, {"t": "p", "v": "最初から、それを見せるための道だったような、聞き方だった。"}, {"t": "card", "v": "【雨宮ひかり】残量：16.0％\n【戸山ガク】残量：39.1％──本人申告：四割\n【摩耗の欠片】残２\n【剣聖】慣らし解除まで　あと８日"}], "chars": 3112}, {"title": "第11話　目減り", "paras": [{"t": "p", "v": "金は、換金するたびに減る。<br>直したものが元より良くなるのとは、正反対だ。"}, {"t": "p", "v": "帰還の昼。場所はうちの店、作業台の上。<br>いろはが荷馬車から運び込んだ在庫――競りに出すはずだった宝の山を、帳面と天秤で順に片付けていく。"}, {"t": "p", "v": "「ギルドの競りなら百万。うちのルートだと、八十五万」"}, {"t": "p", "v": "「一割五分も抜くのか」"}, {"t": "p", "v": "「抜かれるのよ、私も。裏の金は、通るたびに関所がある。表を出禁になるって、そういうこと」"}, {"t": "card", "v": "　換金：850,000円\n　所持金：870,000円\n　目標まで：残り3,130,000円"}, {"t": "p", "v": "四百万の山は、ようやく二合目を越えたところだ。<br>それでも振り出しよりはずっといい。五日前、この帳面の数字は二万円だった。"}, {"t": "p", "v": "「……ねえ、それ」"}, {"t": "p", "v": "奥の椅子で毛布にくるまっていたひかりが、俺の胸元を指した。<br>首から下げた、六角レンチ。角が一つ欠けている。"}, {"t": "p", "v": "「お守り？　修くんにしては、信心深い」"}, {"t": "p", "v": "「工具だ。認可工房にいた頃、ゴミ箱の横に落ちてた。拾って研いだら、まだ使えた」"}, {"t": "p", "v": "「使えるのに、下げてるだけなの」"}, {"t": "p", "v": "「六角のくせに角が五つしかない。使うと、締めが甘くなる」"}, {"t": "p", "v": "「じゃあやっぱり、お守りだ」"}, {"t": "p", "v": "ひかりは満足そうに笑って、毛布に戻った。<br>台帳の上で「摘出済み」になった人間は、よく寝る。寝ている間も、彼女の聖騎士は勝手に見張りを続けているのだが。"}, {"t": "br"}, {"t": "p", "v": "午後、病院へ行った。<br>表通りの、白くて大きい、うちの店とは正反対の建物だ。"}, {"t": "p", "v": "面会証の記入にはいろはの偽造手帳を使い、ひかりは帽子を目深にかぶった。台帳の上で消えた人間の外出は、それだけで綱渡りになる。"}, {"t": "p", "v": "「三十分だけよ」と、いろは。<br>「うん」と返事をして、病室の戸を開けた瞬間、ひかりの声が二段明るくなった。"}, {"t": "p", "v": "「あかり！」"}, {"t": "p", "v": "「おねえちゃん、声大きい」"}, {"t": "p", "v": "ベッドの上の妹は、姉より三つ年下で、姉より三つ落ち着いていた。<br>点滴の管を器用によけて起き上がり、俺を見て、遠慮なく眺め回す。"}, {"t": "p", "v": "「……この人が、修理屋さん？」"}, {"t": "p", "v": "「そう。修くん」"}, {"t": "p", "v": "「ふうん。おねえちゃんの手紙だと、もっと大きい人かと思った」"}, {"t": "p", "v": "「文句は書いた本人に言え」"}, {"t": "p", "v": "あかりは笑って、枕元の紙の箱から、折り紙の星をひとつ出した。<br>金色の、少し歪んだ星だ。"}, {"t": "p", "v": "「はい。おねえちゃんに、じゃなくて」"}, {"t": "p", "v": "「俺に？」"}, {"t": "p", "v": "「お守り。手術の日までに、いっぱい折ると助かるんだって。だから配って、減らしてるの」"}, {"t": "p", "v": "配って、減らす。<br>守りの数を減らして、助かる側に回る。妙な理屈だが、本人が真顔なので、受け取った。"}, {"t": "p", "v": "「……ありがとうよ」"}, {"t": "p", "v": "「そのかわり、おねえちゃんのこと、直してあげてね。うちのおねえちゃん、強いくせに、ぜんぜん保たないから」"}, {"t": "p", "v": "「あかり！？」"}, {"t": "p", "v": "「知ってる」と俺は言った。「燃費の悪さは、うちの店で一番だ」"}, {"t": "p", "v": "帰り際、ひかりは廊下で一度だけ立ち止まって、自分のコートの内側から同じ形の星を出して見せた。"}, {"t": "p", "v": "「私のは、いちばん最初のやつ。……妹の理屈だと、私たち、もうけっこう助かるはずなんだよね」"}, {"t": "p", "v": "手術費、四百万。<br>残り三百十三万。<br>数字にすると遠い。だが、足りない部品はもう見えている。手順が途切れたわけじゃない。"}, {"t": "br"}, {"t": "p", "v": "夜、裏の初仕事が来た。"}, {"t": "p", "v": "地下市場のなじみだといういろはの紹介で、初老の左官屋。持ち込みは【左官】Ｄ級・作業型、耐久12.1％。認可工房には「寿命です」と言われたそうだ。"}, {"t": "card", "v": "【左官】　Ｄ級・作業型\n　耐久値：12.1％\n　故障箇所：出力系統（3）\n　必要部品：銅芯線×2（在庫あり）\n　工程：11　　所要：40分"}, {"t": "p", "v": "四十分、きっちり掛けて直した。"}, {"t": "p", "v": "『修理完了　耐久値：78.8％』"}, {"t": "p", "v": "「……冗談だろ」左官屋は表示を三度見た。「戻ってる」"}, {"t": "p", "v": "「戻す店だ。うちは」"}, {"t": "p", "v": "帰りかけた左官屋は、思い出したように、割れた鏝台を風呂敷から出した。"}, {"t": "p", "v": "「こっちも商売道具なんだが。ついでに頼めるか」"}, {"t": "p", "v": "留め金を直すと、掌に欠片が一枚残った。<br>人を直しても、欠片は出ない。物を直した分だけ、次の部品が買える。うちの商売は、昔からそういう作りだ。"}, {"t": "p", "v": "代金は表の工房の半値。それでも所持金は八十七万と四千円になり、欠片は三枚になった。<br>帳面の数字がまともな方向に動く夜は、悪くない。"}, {"t": "p", "v": "左官屋が帰ると、雨が来た。<br>トタンの庇を叩く、細かい雨だ。"}, {"t": "p", "v": "「修くん、雨戸――」"}, {"t": "p", "v": "言いかけたひかりが、途中で止まった。"}, {"t": "p", "v": "『【聖騎士】自動防御・待機』<br>『残量　16.0％ → 15.9％』"}, {"t": "p", "v": "減った。<br>彼女は何もしていない。椅子から立ち上がりかけた、それだけだ。<br>自動防御は、持ち主より先に「何か」に気づく。"}, {"t": "p", "v": "ペンチが作業台の下で、蓋を小さく鳴らした。"}, {"t": "p", "v": "「……お客だよ。足音、かるい」"}, {"t": "p", "v": "戸を叩く音は、二回。<br>開けると、雨の中に子供が立っていた。"}, {"t": "p", "v": "十二、三の背丈。傘はない。なのに、濡れていない。<br>雨粒が、その一歩手前で終わっている。届く寸前で消えたあの夜の斬撃と、同じ終わり方だった。"}, {"t": "p", "v": "「こんばんは、整備士さま」"}, {"t": "p", "v": "子供の形をしたそれは、丁寧に頭を下げた。<br>俺の目が、勝手に仕事を始める。"}, {"t": "card", "v": "【回収員】\n　等級：――\n　摩耗率：――\n　製造元：第七工房"}, {"t": "p", "v": "読み込み中のまま止まった、あの男とは違う。<br>今度は最初から、名乗る気で来ている。"}, {"t": "p", "v": "「剣聖一号機の発した回収要請を、受理しました」"}, {"t": "p", "v": "子供は顔を上げて、店の奥――ひかりを、まっすぐに見た。"}, {"t": "p", "v": "「ならびに。聖騎士S-077系列、一件の所在を確認。……ようやく、お会いできました」"}, {"t": "card", "v": "【雨宮ひかり】残量：15.9％\n【所持金】874,000円──目標まで312.6万\n【摩耗の欠片】残３\n【剣聖】慣らし解除まで　あと８日"}], "chars": 2284}, {"title": "第12話　リコール", "paras": [{"t": "p", "v": "客は、椅子を勧める前に商談を始めた。"}, {"t": "p", "v": "「確認します。聖騎士S-077系列、稼働個体。装着者、雨宮ひかりさま」"}, {"t": "p", "v": "「……どうして名前」"}, {"t": "p", "v": "「登録情報です。八年前の出荷記録に、四年前、装着者の情報が紐づけられていますので」"}, {"t": "p", "v": "子供の形をしたそれは、雨の匂いだけ連れて店に入り、作業台の前で足を止めた。濡れていない靴は、土間に足跡ひとつ残さない。"}, {"t": "p", "v": "「名乗りが遅れました。第七工房・保守部門、回収受付、七〇八号。呼びにくければ、ナナオで結構です」"}, {"t": "p", "v": "「ナナオ」"}, {"t": "p", "v": "「はい、整備士さま」"}, {"t": "p", "v": "俺を呼ぶ声だけ、少し丁寧すぎた。"}, {"t": "br"}, {"t": "p", "v": "ナナオの話は、伝票のように整っていた。"}, {"t": "p", "v": "「聖騎士S-077系列には、中枢軸に設計損耗が確認されています。使用にともない必ず進行し、現行部品では修理できません。よって全数回収――人間の言葉では、リコールです」"}, {"t": "p", "v": "設計損耗。<br>第三封印庫の夜、俺がひかりの診断図の奥に見た言葉と、同じだった。<br>彼女の「完治不可」は、彼女のせいでも、使い方のせいでもない。<br>最初から、作りが悪かった。"}, {"t": "p", "v": "「回収に応じていただいた場合、代替機を無償で支給します。同型の新品です。性能は現行個体を上回ります」"}, {"t": "p", "v": "「……新品」"}, {"t": "p", "v": "ひかりが、毛布の上から自分の胸を押さえた。"}, {"t": "p", "v": "「この子を返して、新しいのをもらうってこと」"}, {"t": "p", "v": "「はい。装着者の健康被害も解消されます。良い条件だと思います」"}, {"t": "p", "v": "「その子は？　返したあと、どうなるの」"}, {"t": "p", "v": "「分解して、原因調査に使います。リコール品ですので」"}, {"t": "p", "v": "ひかりは、しばらく黙った。<br>それから、笑った。あの、目だけ笑っていない笑い方だ。"}, {"t": "p", "v": "「断る」"}, {"t": "p", "v": "「理由をうかがっても」"}, {"t": "p", "v": "「この子は、十四の時からずっと寝てる私を守って、妹を三回守って、五日前は修くんを守った。新品は、その回数を知らない」"}, {"t": "p", "v": "「記録は移せます」"}, {"t": "p", "v": "「回数は、記録じゃない」"}, {"t": "p", "v": "ナナオは小首をかしげた。理解できない、という顔ではなかった。<br>処理できない、という顔だった。"}, {"t": "br"}, {"t": "p", "v": "「なら、話を変えよう」"}, {"t": "p", "v": "俺は作業台に、帳面を開いた。商談は、こっちの土俵でやる。"}, {"t": "p", "v": "「リコールってのは、作った側の責任って意味だ。なら回収じゃなく、本修理を寄越せ。設計損耗を直して返す。それが筋だろう」"}, {"t": "p", "v": "「正しい筋です」ナナオは即答した。「ですが、不可能です。本修理には原型データと、製造ラインと、実地の稼働履歴を持つ同型が必要です。そして何より――直せる者が、もういません」"}, {"t": "p", "v": "「いる」"}, {"t": "p", "v": "俺は、自分の胸を親指で指した。"}, {"t": "p", "v": "「ここに。E級だがな」"}, {"t": "p", "v": "ナナオの目が、初めて伝票から外れた。<br>俺を、頭のてっぺんから素手の右手まで、ゆっくり二度見た。"}, {"t": "p", "v": "「……【修理屋】。保守枠。実在、したんですね」"}, {"t": "p", "v": "「有名なのか、俺のJOBは」"}, {"t": "p", "v": "「いいえ。……欠番だと、教わりました」"}, {"t": "p", "v": "欠番。<br>聞きたいことが一気に増えたが、ナナオはそこで伝票の顔に戻った。"}, {"t": "p", "v": "「訂正します。保守枠の稼働を確認しました。規定第七項により、是正判定まで回収の執行を保留します。判定期限は――規定の上限で、十四日」"}, {"t": "card", "v": "【回収予定日】\n　14日後\n　期限内に対象の是正が確認されない場合、\n　回収を執行します"}, {"t": "p", "v": "「十四日で、設計損耗をどうにかしろと？」"}, {"t": "p", "v": "「できなければ回収です。それが受付にできる、最大の融通です」"}, {"t": "p", "v": "猶予のカードは、前にも見た。七日だった。<br>今度は十四日。倍あるのに、課題は「不可能」ときた。うちの店は、期限に恵まれない。"}, {"t": "p", "v": "「それと」ナナオは付け足した。「期限まで、観察します」"}, {"t": "p", "v": "「観察」"}, {"t": "p", "v": "「対象の保全状態の監視は、回収受付の業務です。……そこの隅で結構です」"}, {"t": "p", "v": "そう言って、ナナオは店の隅の丸椅子に、荷物のように小さく収まった。<br>ペンチが作業台の下から蓋を半分開けて、俺の袖を引く。"}, {"t": "p", "v": "「……ボクのご主人。あの子、置いとくの？」"}, {"t": "p", "v": "「追い出す手段が思いつかん。雨も、あいつに触る前に消えるんだ」"}, {"t": "p", "v": "「じゃあせめて、ボクの上に座らせないでよね」"}, {"t": "br"}, {"t": "p", "v": "夜が更けて、ひかりが小さな声で言った。"}, {"t": "p", "v": "「修くん。十四日で、できるの」"}, {"t": "p", "v": "「分からん。原型データも製造ラインも、聞いたことがない」"}, {"t": "p", "v": "「そっか」"}, {"t": "p", "v": "「だが、管理官の腕を視た。ナナオの防御も視た。第七工房の仕事には、必ず継ぎ目がある。継ぎ目があるなら、開く」"}, {"t": "p", "v": "ひかりは折り紙の星を、外套の内側から出して、握った。"}, {"t": "p", "v": "「……うちの妹、いい仕事するでしょ」"}, {"t": "p", "v": "「あぁ。守りが一つ増えた」"}, {"t": "p", "v": "隅の丸椅子で、ナナオが目を閉じたまま言った。"}, {"t": "p", "v": "「私語は結構ですが、整備士さま。八年ぶりに聞きました、その言い分」"}, {"t": "p", "v": "「どの言い分だ」"}, {"t": "p", "v": "「『継ぎ目があるなら、開く』。――先代の、口癖です」"}, {"t": "p", "v": "先代。<br>欠番のJOBの、先の代。<br>聞き返す前に、ナナオは「本件は、回収受付の回答範囲外です」と言って、それきり口を閉じた。"}, {"t": "card", "v": "【回収予定日】あと14日\n【雨宮ひかり】残量：15.9％\n【剣聖】慣らし解除まで　あと８日"}], "chars": 1967}, {"title": "第13話　慣らし明け", "paras": [{"t": "p", "v": "観察者のいる生活には、七日もすれば慣れた。"}, {"t": "p", "v": "ナナオは店の隅の丸椅子から動かない。飯は食わない。寝ない。<br>ただ、時々口を出す。"}, {"t": "p", "v": "「整備士さま。その締め方は、三年で緩みます」"}, {"t": "p", "v": "「知ってる。三年後にまた締める。客が三年後もうちに来る理由になる」"}, {"t": "p", "v": "「……商売として記録します」"}, {"t": "p", "v": "裏の仕事は、回り始めていた。<br>地下市場からの持ち込み修理が日に三、四件。いろは経由で、裏坑の請負も二件受けた。表のギルドが放棄した回収仕事――崩れた層に置き去りの資材と、開かない扉だ。開かない扉は、うちの得意先みたいなものだった。"}, {"t": "p", "v": "JOB修理は一件数千から二万。裏坑の扉は二件、危険料込みで十五万ずつ。表に出せない仕事ほど、値は上がる。<br>欠片は扉の錠が二件と、持ち込まれた壊れ工具が三件。物の分だけ、五枚増えた。"}, {"t": "card", "v": "　所持金：1,680,000円\n　目標まで：残り2,320,000円\n　摩耗の欠片：残８"}, {"t": "p", "v": "百六十八万。半分まで、あと少し。<br>帳面は健康になっていく。代わりに、期限が減っていく。"}, {"t": "p", "v": "『【回収予定日】あと７日』<br>『残量　15.8％ → 15.7％』"}, {"t": "p", "v": "ひかりの数字は、夜のたびに小さく削れる。自動防御は、店の前を歩く酔漢にまで律儀に反応する。<br>設計損耗の直し方は、まだ影も見えない。<br>それでも今夜、一つだけ確実に変わるものがあった。"}, {"t": "p", "v": "『【剣聖】慣らし運転──残り　00:00:00』<br>『出力制限　解除』"}, {"t": "br"}, {"t": "p", "v": "「では、保守試験を行います」"}, {"t": "p", "v": "ナナオがそう言ったのは、解除の表示が出た三分後だった。"}, {"t": "p", "v": "「試験？」"}, {"t": "p", "v": "「是正の見込みを評価します。期限の運用に関わりますので。……場所は、こちらで用意しました」"}, {"t": "p", "v": "案内されたのは、裏坑の入り口に近い廃層だった。天井の高い、崩れた石の広間。いろはの搬入路の途中にある、誰も来ない場所だ。<br>ガクが盾を担いで欠伸をした。夜中に呼び出したら、文句を言いながら十分で来た。"}, {"t": "p", "v": "「大将、こりゃ何の集まりだ」"}, {"t": "p", "v": "「試験だとよ。何が出るのかは知らん」"}, {"t": "p", "v": "「知らんで壁を頼むな」"}, {"t": "p", "v": "広間の中央で、ナナオが手を挙げると――暗がりから、それが歩いてきた。"}, {"t": "p", "v": "白い、鎧だった。<br>中身はない。関節の隙間から向こうの闇が見える。なのに、歩き方だけ、嫌になるほど覚えがあった。"}, {"t": "card", "v": "【聖騎士】　Ｓ級・量産型\n　No.104\n　状態：無人稼働（試験モード）"}, {"t": "p", "v": "ひかりが、息を呑んだ。<br>自分と同じ歩幅で歩く空の鎧を前に、表情を決めかねたように見えた。"}, {"t": "p", "v": "「悪趣味だぞ、ナナオ」"}, {"t": "p", "v": "「回収待ちの試験個体です。規定で、是正評価への転用が認められています。……それに、同系統が最も公平ですので。開始します」"}, {"t": "br"}, {"t": "p", "v": "速かった。<br>S級は、量産型でもS級だった。初手の踏み込みで石畳が割れ、二歩目はもうガクの壁の前にいた。"}, {"t": "p", "v": "「――ぉお！？」"}, {"t": "p", "v": "『【重戦士】固有・城壁　展開』<br>『摩耗率　60.9％ → 61.1％』"}, {"t": "p", "v": "壁が鳴る。ひかりは動かない。動けば減る。それを本人が一番知っていて、拳だけ固めて立っている。<br>俺は下がりながら、視た。"}, {"t": "card", "v": "【聖騎士】No.104\n　耐久値：62.3％\n　故障箇所：0\n　弱点：──"}, {"t": "p", "v": "故障ゼロ。壊れていない道具は、うちの商売の範囲外だ。<br>なら、範囲内に持ち込むだけだ。"}, {"t": "p", "v": "「ガク、三秒くれ」"}, {"t": "p", "v": "「まいど！」"}, {"t": "p", "v": "壁の裏で、右手の指を開く。<br>慣らしの取れた剣聖は、掌の中で別物みたいに軽かった。"}, {"t": "p", "v": "『【剣聖】出力100％　射程──』"}, {"t": "p", "v": "表示の射程の欄に、数字がなかった。<br>代わりに、見えている場所すべてに、白い線が引けた。"}, {"t": "p", "v": "振った。<br>壁の上、鎧の肩越し、広間の一番奥の石柱――十五歩どころじゃない。五十歩先の柱ごと、鎧の右腕が落ちた。"}, {"t": "p", "v": "『【聖騎士】No.104　耐久値　62.3％ → 41.0％』"}, {"t": "p", "v": "「……おお」ガクが壁の縁から口笛を吹く。「大将、それもう整備の音じゃねえぞ」"}, {"t": "p", "v": "二振り目は、俺の手前で受けられた。空の籠手が、刃の腹を正確に払う。中身がないくせに、受け方はひかりより教科書通りだった。<br>三振り目を、俺は袈裟に見せて、足元の敷石に落とした。<br>石が割れ、砕けた敷石の下から、古い補強の鉄筋が覗いた。その剥き出しの鉄へ磁手を這わせ、屑鉄を手前へ寄せて一本の道に均す。鎧の沈んだ半歩は、その鉄屑の道の上だった。"}, {"t": "p", "v": "「導線――借りるぞ」"}, {"t": "p", "v": "刃を磁場に載せる。白い線が直角に曲がって、沈んだ鎧の膝を裏から刈った。"}, {"t": "p", "v": "『【聖騎士】No.104　耐久値　41.0％ → 8.9％』<br>『試験モード　停止』<br>『【剣聖】耐久　67.6％ → 67.1％』<br>『【磁手】耐久　39.9％ → 39.7％』"}, {"t": "p", "v": "膝から崩れた鎧は、それきり動かなかった。<br>静かになった広間に、ナナオの拍手が二つだけ鳴った。"}, {"t": "p", "v": "「評価：是正見込み・有り。……先代の目は、正しかったようです」"}, {"t": "br"}, {"t": "p", "v": "ひかりは戦いの間じゅう黙っていて、帰り支度の段になって、ようやく言った。"}, {"t": "p", "v": "「……あれを見てたら、私まで空っぽにされたみたいだった」"}, {"t": "p", "v": "返す言葉を持っていなかったので、代わりに、崩れた鎧を視た。商売柄というやつだ。壊れた物を見ると、直す見積もりを立ててしまう。"}, {"t": "card", "v": "【聖騎士】No.104\n　耐久値：8.9％\n　整備記録：\n　　最終整備──保守第7-001（八年前）"}, {"t": "p", "v": "保守第7-001。<br>八年前に、この量産型を整備した誰かの、登録番号。"}, {"t": "p", "v": "「ナナオ。この記録は」"}, {"t": "p", "v": "「先代です」と、回収受付は事務的に答えた。「八年前まで、保守は一人で全部を回していました。……この個体を試験に選んだのは、私の私情です」"}, {"t": "p", "v": "「私情」"}, {"t": "p", "v": "「先代の整備した個体が、あなたにどう壊されるか、見たかったので」"}, {"t": "p", "v": "それで、と俺は聞きかけて、やめた。<br>ナナオの顔が、伝票に戻っていたからだ。"}, {"t": "p", "v": "「明日、工具の接収が来ます」と、それだけ言った。"}, {"t": "p", "v": "そうだ。期限はもう一枚あった。うちの店は、明日で店でなくなる。"}, {"t": "card", "v": "【回収予定日】あと７日\n【工具接収】明日（D+13）\n【雨宮ひかり】残量：15.7％\n【剣聖】耐久：67.1％──慣らし解除・射程制限なし\n【磁手】耐久：39.7％\n【所持金】168万──目標まで残り232万"}], "chars": 2452}, {"title": "第14話　店じまい", "paras": [{"t": "p", "v": "接収の朝は、よく晴れていた。"}, {"t": "p", "v": "八時きっかりに、戸が三回叩かれる。<br>役所の仕事は時間に正確だ。破る時も、守る時も。"}, {"t": "p", "v": "「非認可整備業に対する処分執行に伴い、業務用工具一式を接収する」"}, {"t": "p", "v": "戸口に立ったのは、乾だった。<br>後ろに事務方が二人。執行部隊はいない。工具を運ぶだけなら、刀は要らないという判断らしい。"}, {"t": "p", "v": "「どうぞ、執行官どの」"}, {"t": "p", "v": "俺は戸を全部開けた。<br>店の中は、綺麗なものだった。作業台の上には何もない。壁のペグボードには、工具の形の日焼け跡だけが並んでいる。"}, {"t": "p", "v": "事務方が、リストと店内を三往復見比べた。"}, {"t": "p", "v": "「……直井修。業務用工具一式は、どこに」"}, {"t": "p", "v": "「さあ。うちにあるのは、その箱くらいだ」"}, {"t": "p", "v": "作業台の脇に、古い宝箱がひとつ、鎮座している。<br>昨夜のうちに、レンチ一本からボール盤まで、全部飲んだ箱だ。ついでに今朝は、もっと大事な預かり品も飲んでいる。"}, {"t": "p", "v": "事務方が蓋に手をかけた。開かない。錠を検めて、首をひねる。"}, {"t": "p", "v": "「開かないぞ、これは」"}, {"t": "p", "v": "「壊れた宝箱だ。開かないから、ジャンク屋にある」"}, {"t": "p", "v": "嘘は一つもない。開けないのは、ペンチの営業方針だ。"}, {"t": "p", "v": "乾が、箱の前にしゃがんだ。<br>蓋を、指の背で二度、叩く。<br>箱の中で、預かり品が息を潜めるのが、俺には分かった。"}, {"t": "p", "v": "「……重いのか、これは」"}, {"t": "p", "v": "「見た目よりはな」"}, {"t": "p", "v": "乾は箱を持ち上げなかった。立ち上がる。"}, {"t": "p", "v": "「箱も接収を」と、事務方。"}, {"t": "p", "v": "「やめておけ」乾は箱の錠の縁を、指先で示した。「収蔵痕がある。未登録の魔法容器なら、我々の管轄外だ。触って暴走させれば、始末書では済まんぞ」"}, {"t": "p", "v": "事務方は、箱から一歩下がった。役所の人間は、管轄の外と始末書に弱い。"}, {"t": "p", "v": "「工具は処分済みと記録しろ。廃業の実態は確認できた。それで書類は足りる」"}, {"t": "p", "v": "「よろしいので」"}, {"t": "p", "v": "「非認可の工具など、どこの中古市場にも流れる。追う予算の方が高くつく」"}, {"t": "p", "v": "事務方は納得した顔で、リストに判を押した。<br>役所の理屈は、役所の人間が使うと一番よく回る。"}, {"t": "br"}, {"t": "p", "v": "事務方が先に出て、乾だけが戸口に残った。"}, {"t": "p", "v": "「これで、この店は終わりだ」"}, {"t": "p", "v": "「あぁ。世話になったな、執行官どの」"}, {"t": "p", "v": "「……最後に一つ。整備の依頼を受けるか」"}, {"t": "p", "v": "「廃業したばかりだが」"}, {"t": "p", "v": "「客が来るのは、看板のない店だと聞いた」"}, {"t": "p", "v": "乾は腰の刀に、手を置いた。<br>分解して、組み直した、あの断鋼だ。"}, {"t": "p", "v": "「調子はどうだ」"}, {"t": "p", "v": "「軽い。……軽すぎて、たまに、自分の腕が知らない場所まで届く」"}, {"t": "p", "v": "「削り直したからな。前の柄は、あんたの握りより二分厚かった。あれは工房の手抜きだ」"}, {"t": "p", "v": "「そうか」乾は少しだけ黙って、続けた。「なら、この軽さが正しいのか」"}, {"t": "p", "v": "「正しい。三年経ったら締め直しに来い。無料でいい」"}, {"t": "p", "v": "「三年後に、この店はあるのか」"}, {"t": "p", "v": "「店はどうだか知らんが、俺はいる」"}, {"t": "p", "v": "乾は頷いて、戸口を出た。<br>それから、思い出したように、懐から封筒を一つ、作業台に置いた。"}, {"t": "p", "v": "「接収リストの控えだ。処分の証明に要る。……よく読んでおけ」"}, {"t": "br"}, {"t": "p", "v": "昼、荷車二台で引っ越した。"}, {"t": "p", "v": "新しい店は、地下市場の東の外れ。いろはが「敷金十八万、即入居、詮索なし」と手配した元倉庫だ。天井が高く、床が石で、何より隣がない。夜中に金槌を振るっても、誰も文句を言わない。"}, {"t": "card", "v": "　敷金・設備：−180,000円\n　所持金：1,500,000円\n　目標まで：残り2,500,000円"}, {"t": "p", "v": "ペンチが店の真ん中で蓋を開けて、飲んでいた工具を一列に吐き出していく。最後に、預かり品が箱から顔を出した。"}, {"t": "p", "v": "「……せまかった」"}, {"t": "p", "v": "「文句を言うな。台帳の上で消えてる奴は、役人の前に出ない。約束だろ」"}, {"t": "p", "v": "「レンチの箱の匂いがする」と、ひかりは自分の袖を嗅いで、笑った。「でも、隠れてる間に決めた。次に隠れる時は、もっといい匂いの箱にする」"}, {"t": "p", "v": "「善処するよ」と、箱が答えた。"}, {"t": "p", "v": "ナナオは新しい店の隅に、前と同じ角度で丸椅子を置いた。観察は継続らしい。"}, {"t": "br"}, {"t": "p", "v": "夜、封筒を開けた。"}, {"t": "p", "v": "接収リストの控え。工具の品目が並ぶ、ただの写しだ。<br>ただ、最後の一行に、細い墨で線が引いてあった。"}, {"t": "p", "v": "『未登録危険物（空間魔法・結晶一点）――第三封印庫収蔵。※当該品、収蔵棚より所在不明』"}, {"t": "p", "v": "所在不明。<br>第三封印庫から、俺たちが持ち帰った、格納庫のことだ。"}, {"t": "p", "v": "線の横に、小さな書き込みがあった。役所の字ではない、癖のある手だ。"}, {"t": "p", "v": "『台帳は直せても、俺の目は直せんぞ。――預かり品を、次は取りこぼすな』"}, {"t": "p", "v": "「……修くん？　顔、こわい」"}, {"t": "p", "v": "「いや」"}, {"t": "p", "v": "封筒を仕舞って、俺は少し笑った。<br>格納庫を持ち帰ったことも、あの箱の中身も、少なくともあの執行官は見抜いていた。それでも、書かないことに決めたらしい。<br>借りが、また一つ増えた。柄の締め直し程度では、返せそうにない。"}, {"t": "card", "v": "【回収予定日】あと６日\n【雨宮ひかり】残量：15.7％\n【所持金】150万──目標まで残り250万\n【摩耗の欠片】残８"}], "chars": 1952}, {"title": "第15話　四百万", "paras": [{"t": "p", "v": "いろはの商売のうまさには、時々、ぞっとする。"}, {"t": "p", "v": "「『開封ツアー』。うちの上客だけ集めて、開かずの箱を目の前で開けてもらうの。開いた中身は競りで即売。あんたの取り分は開封料と、売上の三割」"}, {"t": "p", "v": "「見世物か、俺は」"}, {"t": "p", "v": "「見世物よ。世界で一人しか出来ない芸ならね」"}, {"t": "p", "v": "場所は、宝箱街道。<br>ギルドが放棄した五十個の箱のうち、俺たちがまだ手を付けていない残りが、二十と少し。ペンチが一つずつ蓋を叩いて回り、罠の型と中身の当たり外れを耳打ちしてくる。"}, {"t": "p", "v": "「これは酸。こっちは空箱。……あ、これはいいよ。底が二重で、下の段に古い金貨の匂い」"}, {"t": "card", "v": "【宝箱・31号】\n　錠前：二重底連動式\n　罠：酸噴出（作動済・空撃ち）\n　故障箇所：3　　工程：7"}, {"t": "p", "v": "客は地下市場の顔役が六人。毛皮を着た金貸し、坑道具の卸元、それに顔を隠した好事家が三人。<br>一つ開くたび、後ろで値がつく。競りの声は、表のギルドより余程景気が良かった。"}, {"t": "p", "v": "昼までに九箱。夕方までに、さらに七箱。"}, {"t": "p", "v": "十六箱のうち、修理が要ったのは八箱。残りは罠を殺して、ペンチが正しい開け方を教えただけだ。"}, {"t": "p", "v": "『開封料・売上分配　計　1,120,000円』<br>『摩耗の欠片×8 を回収しました』"}, {"t": "p", "v": "「ほら、次。三十九号」"}, {"t": "p", "v": "ペンチの案内で、街道の一番奥の窪みにある箱の前に立った。<br>特別大きくはない。ただ、視た瞬間に、これまでの箱と桁が違うと分かった。"}, {"t": "card", "v": "【宝箱・39号】\n　錠前：時限式（残り──7年）\n　罠：なし\n　故障箇所：1（時限機構の狂い）\n　工程：2　　所要：4分"}, {"t": "p", "v": "「……壊れてすら、いないな。時計が狂ってるだけだ」"}, {"t": "p", "v": "「開けるの？　七年待てば、タダで開くよ」と、ペンチ。"}, {"t": "p", "v": "「七年後の持ち主に悪い。時計は正確にしてやるのが筋だ」"}, {"t": "p", "v": "狂いを直すと、時限の表示が残り0年に落ちて、蓋がひとりでに開いた。"}, {"t": "p", "v": "『摩耗の欠片×1 を回収しました』"}, {"t": "p", "v": "七年、誰かを待っていた箱の中身は、油紙に包まれた古い蔵の権利書と、当座の路銀らしい金塊が二つ。<br>権利書の名義は、消えていて読めない。金塊は、読めた。競りの声が、その日一番大きくなった。権利書の方は、いろはが「読めない名義は、私の商売の範囲」と言って、手数料代わりに引き取った。"}, {"t": "card", "v": "　本日計：+2,610,000円\n　所持金：4,110,000円\n　目標：4,000,000円──**達成**"}, {"t": "p", "v": "帳面の数字が、目標の線を越えた。<br>無給で腕だけ磨いた三年と、宝箱街道からの、この十九日。その全部が、ようやく数字になった。"}, {"t": "p", "v": "ひかりは帳面を二度見て、それから、しばらく何も言わなかった。<br>言葉の代わりに、外套の内側から折り紙の星を出して、ようやく一言。"}, {"t": "p", "v": "「……妹の理屈、ほんとに効いた」"}, {"t": "p", "v": "「効いたな」"}, {"t": "p", "v": "「修くん」"}, {"t": "p", "v": "「なんだ」"}, {"t": "p", "v": "「ありがとうは、手術が終わってから言う。取っておく」"}, {"t": "p", "v": "「あぁ。利子は取らない」"}, {"t": "br"}, {"t": "p", "v": "競りの札を締めた、その足で病院へ回った。<br>金を積む段は、呆気なく済んだ。四百万は、窓口ではただの数字だ。"}, {"t": "p", "v": "問題は、その次の紙だった。"}, {"t": "p", "v": "「保護者さまの摩耗証明を。ご家族の欄が、その、台帳と一致しないもので……」"}, {"t": "p", "v": "摩耗格付け社会は、手術の同意書にまで格付けを要求する。<br>そして台帳の上で、雨宮ひかりは「摘出済み」だ。摘出済みの人間は、保護者欄に立てない。"}, {"t": "p", "v": "窓口の向こうで係が端末を叩くたび、隣のひかりの体温が下がっていくのが分かった。<br>――ここで詰むのか。金じゃなく、紙で。"}, {"t": "p", "v": "「あら、それ、うちの管轄」"}, {"t": "p", "v": "割り込んできたのは、いろはだった。<br>白衣を着ている。どこで調達したのか、聞かないことにした。"}, {"t": "p", "v": "「非認可医療補助の特例申請。後見は施術先の医療機関、費用は第三者供託。書式は、こう」"}, {"t": "p", "v": "台帳を直すのではなく、台帳を参照しない道へ、書類ごと迂回させる手つきだった。効かない薬二つから効く一つを作る女は、効かない書式二つから効く一つを作った。"}, {"t": "p", "v": "「通るわよ。ただし――医療機関が後見を受けた記録は、認可局にも回る。早ければ数日で、照会が来る」"}, {"t": "p", "v": "「手術は明後日だ」"}, {"t": "p", "v": "「だから今、通すの。追いつかれる前に、切る」"}, {"t": "p", "v": "「……九条さん。あんた何者だ」"}, {"t": "p", "v": "「闇のブローカー」と、いろはは白衣の襟を正して言った。「今日は白いけど」"}, {"t": "p", "v": "手術は、明後日の朝と決まった。"}, {"t": "br"}, {"t": "p", "v": "帰り道、ナナオが初めて、店の外までついて来ていた。"}, {"t": "p", "v": "「整備士さま。確認します。妹君の件は、期限に関係がありません」"}, {"t": "p", "v": "「知ってる」"}, {"t": "p", "v": "「それでも、先に済ませるのですね。回収予定日まで、あと五日です」"}, {"t": "p", "v": "「あぁ。うちの店は昔から、期限に恵まれない。慣れてる」"}, {"t": "p", "v": "ナナオはしばらく黙って歩いて、それから、伝票ではない声で言った。"}, {"t": "p", "v": "「……先代も、そうでした。納期を守らない人でした。目の前の壊れ物から、直すので」"}, {"t": "p", "v": "「その先代は、どうなった」"}, {"t": "p", "v": "「回収されました」"}, {"t": "p", "v": "ナナオの歩幅は、変わらなかった。<br>俺は、聞いた言葉を胸の奥の棚に置いて、鍵をかけた。今聞くべきことと、まだ聞けないことの区別くらいは、つく。"}, {"t": "card", "v": "【回収予定日】あと５日\n【手術】明後日・朝\n【雨宮ひかり】残量：15.6％\n【口座】411万──うち400万は供託手続き中／自由に使えるのは11万\n【摩耗の欠片】残17"}], "chars": 2095}, {"title": "第16話　手術", "paras": [{"t": "p", "v": "手術の朝、待合室は静かだった。"}, {"t": "p", "v": "ひかりは帽子を目深にかぶって、長椅子の端で、折り紙の星を握っている。<br>付き添いは俺といろは。ガクは「ガラじゃねえ」と言いながら、病院の外の花屋の前を、さっきから三往復している。ナナオは店で留守番だ。病院に連れて来る言い訳が、さすがに思いつかなかった。"}, {"t": "p", "v": "八時半、あかりが手術室に入った。<br>入る前に、妹は姉に向かって、点滴の管ごと親指を立てた。"}, {"t": "p", "v": "「おねえちゃん。星、ぜんぶ配りきったから、もう大丈夫」"}, {"t": "p", "v": "「……うん」"}, {"t": "p", "v": "「泣くのは成功してからにしてね。順番だから」"}, {"t": "p", "v": "扉が閉まって、ひかりは言われた通り、泣くのを取っておいた。"}, {"t": "br"}, {"t": "p", "v": "三時間、と説明されていた。<br>二時間が過ぎた頃、待合室の扉が乱暴に開いた。"}, {"t": "p", "v": "作業服の中年の男が、同僚に肩を借りて入ってくる。地下のボイラー番だ、勤務中に倒れた、と支えている方が受付に叫んでいる。<br>長椅子に届く前に、男の膝が折れた。胸元で、シャツの下から、赤黒い光が漏れた。"}, {"t": "p", "v": "俺の目が、勝手に視る。"}, {"t": "card", "v": "【炉番】　Ｄ級・作業型\n　摩耗率：99.4％　残量：0.6％\n　状態：暴走前駆──臨界まで 推定90秒"}, {"t": "p", "v": "病院の地下で、炉を任されてきたJOBだ。<br>炉心弁だけが、交換されないまま限界まで削れている。認可工房の整備歴は、ない。金か、届けか、その両方を避けて使い続けた数字に、見えた。"}, {"t": "p", "v": "「離れて！」警備員が叫ぶ。「封印班を呼べ！　早く！」"}, {"t": "p", "v": "間に合わない。封印班の到着は、どう見積もっても十分以上先だ。<br>九十秒後、ここは待合室ごと炉になる。手術室の隣で、だ。"}, {"t": "p", "v": "選択肢を数えかけて、やめた。<br>一秒で数え終わる程度の数しか、なかった。"}, {"t": "p", "v": "「いろは、家族を下がらせろ」"}, {"t": "p", "v": "上着を脱ぎながら、男の前に膝をついた。<br>素手の右手を、赤黒く光る胸元に置く。"}, {"t": "p", "v": "『【炉番】臨界まで 71秒』<br>『診断開始──故障箇所：9　工程：12』"}, {"t": "p", "v": "十二工程。所要表示、六分。<br>持ち時間、七十一秒。"}, {"t": "p", "v": "六分の仕事を、七十秒でやる。工程は削れない。なら、同時に回すだけだ。"}, {"t": "p", "v": "分解は右手の指三本。組み直しは残りの二本。診断は目で回し続ける。<br>第三封印庫の夜、四十分を十二分に縮めた時と同じやり方だ。あの夜より対象は小さく、あの夜より観客が多い。"}, {"t": "p", "v": "『臨界まで 40秒』<br>『工程7／12』"}, {"t": "p", "v": "「あんた、何を――」警備員の声。<br>「静かに」いろはの声。「今この街で一番まともな治療中よ」"}, {"t": "p", "v": "『臨界まで 12秒』<br>『工程11／12』"}, {"t": "p", "v": "最後の工程は、摩耗した炉心弁の噛み合わせだった。<br>カリ、と。<br>指先に、いつもの店の音がした。"}, {"t": "p", "v": "『暴走前駆──一時停止』<br>『再臨界予測──当面なし・要継続監視』<br>『摩耗率　99.4％ → 91.0％』<br>『残量　0.6％ → 9.0％』"}, {"t": "p", "v": "赤黒い光が消えて、男の呼吸が戻った。<br>応急の上限、プラス九。暴走域は、抜けていない。それでも、今すぐ炉になる数字からは引き戻した。"}, {"t": "p", "v": "「……いいか。数字はまだ危険域だ。今日はもう、何も使うな。それから」"}, {"t": "p", "v": "男の作業服の胸ポケットに、俺は小さく折った紙を差し込んだ。"}, {"t": "p", "v": "「本気で直す気になったら、そこへ来い。今のは、その場しのぎだ」"}, {"t": "p", "v": "立ち上がると、待合室中の目がこっちを向いていた。<br>そのうちのいくつかは、スキル端末をこちらに向けていた。撮っていたのだ。最初から、最後まで。"}, {"t": "p", "v": "いろはが小さく舌打ちして、俺の襟を掴んだ。"}, {"t": "p", "v": "「顔は撮られた。行くわよ」"}, {"t": "p", "v": "「まだだ。手術が」"}, {"t": "p", "v": "「……そうだった」"}, {"t": "br"}, {"t": "p", "v": "手術は、成功した。"}, {"t": "p", "v": "執刀医が出てきて「定型通りです」と言った瞬間、ひかりは順番通りに泣いた。<br>面会は夕方。麻酔から覚めたあかりの第一声は「おなかすいた」で、二声目は「おねえちゃん、この病院、なんか騒がしくない？」だった。"}, {"t": "p", "v": "騒がしいのは、妹の階だけではなかった。"}, {"t": "p", "v": "帰り道、地下市場の入り口で、ガクが渋い顔で待っていた。<br>手にした端末の画面を、無言でこちらに向ける。"}, {"t": "p", "v": "映っていたのは、待合室の俺だった。<br>膝をついて、素手で男の胸に触れて、数字を戻している。<br>動画の題は、こうだ。"}, {"t": "p", "v": "『【衝撃】耐久値が“増える”整備を見た』"}, {"t": "p", "v": "再生の数字が、見ている間にも増えていく。ひかりの残量とは逆向きに、勢いよく。"}, {"t": "p", "v": "「大将よ」ガクが頭を掻いた。「あんた、表の世界に、いっぺんに開店しちまったぞ」"}, {"t": "card", "v": "【回収予定日】あと３日\n【手術】成功──あかり、経過良好\n【雨宮ひかり】残量：15.6％\n【所持金】11万──供託400万 執行済"}], "chars": 1849}, {"title": "第17話　認可局", "paras": [{"t": "p", "v": "夜のうちに、転載が転載を呼んだらしい。同じ場面を別の角度から撮った動画が六本、まとめ書きが三つ。朝には、数字を全部足すと百万を超えていた。"}, {"t": "p", "v": "翌日の地下市場は、うるさかった。"}, {"t": "p", "v": "「見たぞ大将、動画！　百万回だとよ！」<br>「うちの婆さんの【縫い針】も頼むよ、あんた増えるんだろ？」<br>「なあ、耐久値ってのは本当に戻るのか。戻るなら俺は――」"}, {"t": "p", "v": "朝から、店の前に列ができた。<br>列の半分は客で、残りは野次馬。その野次馬のさらに半分ほどは、たぶん、別の目的で並んでいた。"}, {"t": "p", "v": "「今日は臨時休業」"}, {"t": "p", "v": "いろはが戸口に紙を貼って、列を追い返した。<br>文句を言う客に、市場の卸元が横から言った。"}, {"t": "p", "v": "「聞き分けな。……この市場に、整備士なんて最初からいねえよ」"}, {"t": "p", "v": "場所は、もう割れている。列ができた時点で、隠しようがない。<br>それでも、誰が何を直し、どこへ運んだかは、市場の誰も答えない。"}, {"t": "p", "v": "市場の連中は、口が固い。<br>理由は分かっている。この十日で、俺はここの住人の道具を三十いくつ直した。地下市場の相場では、恩は現金より通りがいい。"}, {"t": "br"}, {"t": "p", "v": "昼、表の方が動いた。"}, {"t": "p", "v": "「認可局の調査員が二人、市場の入り口で聞き込み。『動画の整備士に心当たりは』って」と、いろは。「全員が全員、見事に首を横に振ったそうよ。壮観ね」"}, {"t": "p", "v": "「認可局。ギルドじゃなくてか」"}, {"t": "p", "v": "「ギルドは坑の管理。<strong>認可局は制度の番人</strong>。動画が刺さったのは、そっちなの」"}, {"t": "p", "v": "いろはは珍しく、笑っていなかった。"}, {"t": "p", "v": "「考えてみなさい。摩耗率は戻らない――この国の格付けは、全部その前提の上に建ってる。保険料も、婚姻調査も、除籍封印もよ。『戻る』が本当なら」"}, {"t": "p", "v": "「制度の土台が、狂う」"}, {"t": "p", "v": "「そ。あんたは歩く違法建築。……で、ここからが本題」"}, {"t": "p", "v": "いろはは、紙の束を作業台に置いた。<br>議事録の写し、と表紙にある。出どころは聞かないことにした。"}, {"t": "p", "v": "「今朝、認可局の聴聞会。呼ばれた証人は――封印執行官、乾」"}, {"t": "br"}, {"t": "p", "v": "写しの中の乾は、こう証言していた。"}, {"t": "p", "v": "――問。動画の人物に見覚えは。<br>――答。ある。処分執行で二度接触した。非認可の整備工だ。<br>――問。「耐久値が増える」表示について。<br>――答。<strong>測定器の誤作動と考える</strong>。当該人物の整備は受けたが、自分の断鋼の耐久値に増加は記録されていない。<br>――問。誤作動の可能性が高いと判断するか。<br>――答。する。執行官の測定器が正常である限り、私の確認した当該人物の行為は、分解と、元の通りの組み直しにすぎない。<strong>測定器が狂っていないなら、あの男はただの整備工だ</strong>。"}, {"t": "p", "v": "紙の上の活字なのに、声が聞こえる気がした。<br>読み返して、気づいた。この証言、一言も嘘がない。<br>あの夜、俺は断鋼を二百十四点に分解して、元の通りに組み直した。戻したのは形で、数字じゃない。だから「増加は記録されていない」は事実だ。事実だけを積んで、結論だけを間違えさせている。"}, {"t": "p", "v": "「……役所の言葉の使い方だわ、これ」いろはが感心した声を出した。「調査員が断鋼を再測定しても、この証言は崩れない。守り方を知ってる嘘つきね」"}, {"t": "p", "v": "「嘘は、ついてない」"}, {"t": "p", "v": "「そこが一番たちが悪いのよ」"}, {"t": "p", "v": "借りを数える指が、また一本増えた。三本目だ。返す当てだけが、増えない。"}, {"t": "br"}, {"t": "p", "v": "夜、ナナオが丸椅子から降りて、報告する姿勢を取った。"}, {"t": "p", "v": "「整備士さま。報告します。本日十五時、行政の方が私に面会を求めました」"}, {"t": "p", "v": "「……認可局が？　どうやってあんたに」"}, {"t": "p", "v": "「回収員は行政記録に『渉外窓口』として登録があります。八年前からです」"}, {"t": "p", "v": "初耳の情報が、さらりと出た。制度と工房は、最初から窓口で繋がっている。除籍封印の技術の出どころを考えれば、驚く話でもなかった。"}, {"t": "p", "v": "「用件は」"}, {"t": "p", "v": "「二件。一件目、回収予定日の照会。二件目――<strong>協力要請</strong>。『対象の身柄確保に際し、回収員の技術的助力を求める』」"}, {"t": "p", "v": "店の空気が、一段冷えた。<br>ひかりが毛布の中で、身動きを止めたのが分かった。"}, {"t": "p", "v": "「あんたは、何て答えた」"}, {"t": "p", "v": "「保留しました。私の業務は回収であって、確保ではないので」"}, {"t": "p", "v": "「保留、か」"}, {"t": "p", "v": "「はい。……ですが整備士さま。ご理解ください」"}, {"t": "p", "v": "ナナオは、伝票の顔のまま続けた。"}, {"t": "p", "v": "「行政は、期限を待ちません。そして私は、期限が来れば回収します。<strong>あなたの側に立ったわけでは、ありません</strong>」"}, {"t": "p", "v": "「知ってる」"}, {"t": "p", "v": "「それでも一つだけ、業務外の助言をします」"}, {"t": "p", "v": "丸椅子に戻りながら、回収受付は言った。"}, {"t": "p", "v": "「明日、九条いろはが持ち込む依頼を、受けてください。……あの方は今日、私に取引を持ちかけました。内容は言えません。ですが、あなたの期限に関わります」"}, {"t": "p", "v": "いろはの方を見た。<br>闇のブローカーは、もう帳面を閉じて、営業用の笑顔を作っていた。"}, {"t": "p", "v": "「白紙の手形、覚えてる？」"}, {"t": "card", "v": "【回収予定日】あと２日\n【雨宮ひかり】残量：15.5％\n【乾】聴聞会で「事実だけの防壁」証言──借り、三つ目\n【認可局】協力要請をナナオに打診──保留中"}], "chars": 2070}, {"title": "第18話　白紙の手形", "paras": [{"t": "p", "v": "いろはが持ち込んだ「一件」は、荷車にも袋にも入っていなかった。"}, {"t": "p", "v": "「持ち込み品はこちら。……ほら、台の上に」"}, {"t": "p", "v": "指の先で、ナナオが作業台の上に、ちょこんと正座していた。"}, {"t": "p", "v": "「……おい」"}, {"t": "p", "v": "「手形の条件、覚えてるわね。『私の持ち込む物を一件、何も聞かずに直す』。期限なし、拒否権なし」"}, {"t": "p", "v": "「物、って」"}, {"t": "p", "v": "「物よ」ナナオが自分で答えた。「行政の分類でも、工房の台帳でも、私は備品です。整備士さま」"}, {"t": "p", "v": "何も聞かずに、の一言が、こんなに重い日は初めてだった。<br>聞きたいことが、山ほどあった。なぜいろはがこの手形をここで切るのか。二人の間の取引は何なのか。全部、聞けない契約だ。"}, {"t": "p", "v": "「……横になれ。診る」"}, {"t": "br"}, {"t": "card", "v": "【回収員・七〇八号】\n　等級：――\n　稼働：8年\n　耐久値：31.4％\n　故障箇所：22\n　　主：左膝駆動系（磨滅）、脊柱の芯（歪み）\n　必要部品：12点（全点、在庫あり──追加購入なし）\n　工程：44　　所要：3時間"}, {"t": "p", "v": "診断図を開いて、最初に分かったのは、ナナオがずっと痛かったはずだ、ということだった。<br>左膝の駆動系は磨滅で芯が出ている。八年、雨の日も、丸椅子の上でも、この膝で立っていた。"}, {"t": "p", "v": "「痛みの信号は、三年前に切りました」と、ナナオは天井を見たまま言った。「業務に不要でしたので」"}, {"t": "p", "v": "「……工房は、あんたを直さないのか」"}, {"t": "p", "v": "「回収員は消耗品です。壊れたら、次の個体が出ます」"}, {"t": "p", "v": "手が、止まりそうになった。<br>リコールだ、保守だ、と伝票の言葉を並べる連中が、自分の受付を使い捨てる。<br>第七工房の仕事には継ぎ目がある。だが継ぎ目より質が悪いのは、性根の方に開いた穴だ。"}, {"t": "p", "v": "「工程一。始めるぞ」"}, {"t": "p", "v": "「はい。……あの、整備士さま。一点だけ」"}, {"t": "p", "v": "「なんだ」"}, {"t": "p", "v": "「痛みの信号は、切ったままで結構です。直すと、その、うるさいので」"}, {"t": "p", "v": "「却下だ。痛覚は故障検知器だ。切ったままの機械から、順に壊れていく」"}, {"t": "p", "v": "「……先代と、同じことを言います」"}, {"t": "br"}, {"t": "p", "v": "三時間の工程の、真ん中あたりだった。<br>脊柱の芯を抜いて歪みを取っていたら、芯の根元に、古い補修痕を見つけた。"}, {"t": "p", "v": "上手い仕事だった。<br>正規の部品じゃない。ありあわせの材で、けれど噛み合わせは髪の毛一本分も狂っていない。締めの痕が、少し変わっている。六角の、角が一つ潰れた工具の痕だ。"}, {"t": "p", "v": "俺は、自分の胸元のお守りを見た。<br>角が五つしかない、欠けた六角レンチを。"}, {"t": "p", "v": "「……ナナオ。この補修、いつのだ」"}, {"t": "p", "v": "「八年前です」少し間があって、続いた。「先代が、無断で直しました。三回」"}, {"t": "p", "v": "「無断で」"}, {"t": "p", "v": "「回収員の修理は、規定にありません。先代は規定の外の整備を三回して、三回とも記録に残しませんでした。……私が記録しなかったので」"}, {"t": "p", "v": "備品が、自分の修理記録を隠す。<br>それが何を意味するか、考えると手元が狂いそうになったので、考えるのをやめて、手を動かした。"}, {"t": "p", "v": "『工程44／44　完了』<br>『修理完了　耐久値：89.2％』<br>『摩耗の欠片×3 を回収しました』"}, {"t": "p", "v": "表示を見て、俺は少しの間、動けなかった。"}, {"t": "p", "v": "欠片が、出た。<br>人を直しても、欠片は出ない。物を直した時だけだ。<br>つまりこの世界の帳簿の上で、ナナオは――最後まで、物だった。"}, {"t": "p", "v": "「……どうか、しましたか」"}, {"t": "p", "v": "「いや」"}, {"t": "p", "v": "欠片三枚を、掌の上で転がした。いつもより、ずっと重かった。<br>受け取っていい金なのか、分からなかった。それでも受け取ることにした。うちの商売のルールじゃない。世界の帳簿の側の問題だ。帳簿の方を、いつか直す。"}, {"t": "br"}, {"t": "p", "v": "ナナオは台から降りて、左膝を二度、三度、曲げ伸ばした。"}, {"t": "p", "v": "「……静かです。膝が」"}, {"t": "p", "v": "「八年ぶりだろう。慣らしに三日みろ」"}, {"t": "p", "v": "「はい」それから、回収受付は、俺といろはを順に見た。「本件は、業務記録に残せない整備でした。よって、対価も規定外となります」"}, {"t": "p", "v": "「手形の分だ。対価はもう受け取ってる」と、いろは。"}, {"t": "p", "v": "「いいえ。九条さまとの取引は、取引。これは、別です」"}, {"t": "p", "v": "ナナオは丸椅子ではなく、作業台の正面に立った。初めて、客の立ち位置だった。"}, {"t": "p", "v": "「明日、回収予定日が満了します。私は規定どおりに参ります。――規定を、全部読んでから」"}, {"t": "p", "v": "「……全部？」"}, {"t": "p", "v": "「第七工房の回収規定は、千二百条あります。八年間、受付をやって、最初から最後まで読んだ個体は、私の知る限りいません」"}, {"t": "p", "v": "「……受付には、どこまでできる」"}, {"t": "p", "v": "「規定にある書式の受領、登録、上位機への送付まで。内容を作る権限は、ありません」"}, {"t": "p", "v": "「なら――規定の中に書式さえあれば、通せるのか」"}, {"t": "p", "v": "「様式に適合するなら、受け付けます。可否を決めるのは、管理機です」"}, {"t": "p", "v": "伝票の顔の、目の奥だけが、笑った気がした。"}, {"t": "p", "v": "「読み終えたら、伺います。整備士さま――<strong>期限の日は、店を開けておいてください</strong>」"}, {"t": "card", "v": "【回収予定日】あと１日──明日・満了\n【回収員・七〇八号】耐久：89.2％──膝、静か\n【雨宮ひかり】残量：15.5％\n【摩耗の欠片】残20"}], "chars": 1992}, {"title": "第19話　回収予定日", "paras": [{"t": "p", "v": "満了の朝、ナナオは夜明け前から消えていた。<br>丸椅子の上に、几帳面な字の置き手紙が一枚。"}, {"t": "p", "v": "『規定を読んでいます。七〇八』"}, {"t": "p", "v": "「……律儀なんだか、不吉なんだか」"}, {"t": "p", "v": "店は、言われた通り開けておいた。<br>開店休業の店内で、ガクは盾の縁を布で磨き、いろはは帳面を三冊広げ、ひかりは折り紙の星を、外套の上から何度も確かめていた。"}, {"t": "p", "v": "昼を過ぎても、何も来なかった。<br>夕方、来た。"}, {"t": "br"}, {"t": "p", "v": "最初に気づいたのはペンチだった。蓋がカタカタと鳴り、それから、ぴたりと止まった。"}, {"t": "p", "v": "「……ご主人。上から来る。<strong>二つ</strong>」"}, {"t": "p", "v": "地下市場の天井――岩盤のはずの黒が、水面みたいに揺れて、二人分の人影が降りてきた。<br>着地の音はない。埃ひとつ立たない。白手袋、灰色の外套。あの夜、封印庫で見た管理官と、同じ型が二機。"}, {"t": "p", "v": "俺の目が、勝手に仕事を始めて、勝手に詰まった。"}, {"t": "card", "v": "【読み込み中……】\n【読み込み中……】"}, {"t": "p", "v": "「雨宮ひかり様、及び、聖騎士S-077系列稼働個体」"}, {"t": "p", "v": "二機が、同時に同じ声で言った。"}, {"t": "p", "v": "「回収予定日が満了しました。対象の引き渡しを求めます」"}, {"t": "p", "v": "市場の連中は、とっくに店々の奥へ引っ込んでいる。<br>代わりに、市場の入り口の方から、制服の一団が整列する音がした。認可局の確保部隊だ。中へは入って来ない。網だけ張って、回収の後の「身柄」を待っている。<br>行政と工房の利害の一致というやつを、これほど絵に描いたように見せつける構図もなかった。"}, {"t": "p", "v": "「ガク」"}, {"t": "p", "v": "「おう。……なあ大将、あれ、殴っていいやつか？」"}, {"t": "p", "v": "「殴れるかどうかは、これから調べる」"}, {"t": "br"}, {"t": "p", "v": "先に動いたのは、管理機の方だった。"}, {"t": "p", "v": "一機が、歩いて、壁を抜けるみたいに間合いを詰めてきた。<br>ガクの城壁が正面で受ける。"}, {"t": "p", "v": "『【重戦士】固有・城壁　展開』<br>『摩耗率　61.1％ → 61.3％』"}, {"t": "p", "v": "「――重っ、てえな！」"}, {"t": "p", "v": "壁越しに、鈍い音が続く。封印庫の夜と同じ、素手で壁を叩く音だ。<br>二機目は動かない。入り口側に立って、退路だけ塞いでいる。仕事の分担が、嫌になるほど綺麗だった。"}, {"t": "p", "v": "導線は張ってある。店の床には、この日のために鉄屑の道を三本、走らせてあった。"}, {"t": "p", "v": "「磁手――導線！」"}, {"t": "p", "v": "刃を磁場に載せる。白い斬撃が直角に曲がって、壁を叩く一機の膝裏へ走った。"}, {"t": "p", "v": "届く一歩手前で、霧になった。"}, {"t": "p", "v": "『【剣聖】耐久　67.1％ → 66.9％』<br>『【磁手】耐久　39.7％ → 39.5％』"}, {"t": "p", "v": "「知ってたよ……！」"}, {"t": "p", "v": "封印庫の夜と同じ終わり方だ。それでも、型が同じでも個体差まで同じとは限らない。一発は、確かめずに捨てられる手じゃなかった。<br>これで確定した。あの防御は健在。斬撃は通ら
